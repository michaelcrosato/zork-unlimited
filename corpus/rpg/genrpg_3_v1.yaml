meta:
  id: genrpg_3_v1
  title: "Mine: A Hero's Descent"
  start_room: entry
  vars_init:
    hp: 20
    attack: 4
    defense: 2
    might: 3
  flags_init: []
  max_score: 50
  combat_guaranteed: true
rooms:
  - id: entry
    name: The Mine Adit
    description: "Goal: find the vein-heart. The stairs lead down into an abandoned
      deep mine. A raw-silver vein-heart glows in the lowest chamber."
    objects: []
    exits:
      - direction: down
        to: hall
        conditions: []
    on_enter: []
  - id: hall
    name: The Pump-House
    description: "Exits: up, west, and north. The wall inscription marks where the
      miner's gad-bar was stored; TAKE miner's gad-bar if it is here. A
      damp-light waits here and can answer questions."
    variants:
      - when:
          - has_item: bar
        text: "Exits: up, west, and north. You carry the miner's gad-bar that lay beside
          the wall inscription. A damp-light waits here and can answer
          questions."
    objects:
      - inscription
      - bar
    exits:
      - direction: up
        to: entry
        conditions: []
      - direction: west
        to: cell
        conditions: []
      - direction: north
        to: gallery
        conditions: []
    on_enter: []
  - id: cell
    name: The Timberman's Stall
    description: "Exit: east. This is where an intact rivet-plate jack was found
      beside a dead explorer. Its first DON teaches a lasting braced stance and
      grants +2 defense against either guardian still standing. The bonus
      persists even if the ward is later dropped."
    objects:
      - ward
    exits:
      - direction: east
        to: hall
        conditions: []
    on_enter: []
  - id: gallery
    name: The Old Stope
    description: Exit south returns to the hall. The rock-golem blocks the east
      exit. A rock creature blocks the passage. It is slow and protected by hard
      ore. Prepare before fighting it.
    variants:
      - when:
          - has_flag: foe_down
        text: "Exits: south and east. The defeated rock-golem lies on the floor."
    objects: []
    exits:
      - direction: south
        to: hall
        conditions: []
      - direction: east
        to: span
        conditions:
          - has_flag: foe_down
        locked_msg: The rock-golem bars the way east while it still stands.
    on_enter: []
  - id: span
    name: The Flooded Drift
    description: Exit west returns to the gallery. The deep-haunt blocks the east
      exit. A larger creature of ore and mine timber guards the silver. It is
      stronger than the first golem. Prepare before fighting it.
    variants:
      - when:
          - has_flag: warden_down
        text: "Exits: west and east. The defeated deep-haunt lies on the floor."
    objects: []
    exits:
      - direction: west
        to: gallery
        conditions: []
      - direction: east
        to: hearth
        conditions:
          - has_flag: warden_down
        locked_msg: The deep-haunt bars the way east while it still stands.
    on_enter: []
  - id: hearth
    name: The Choked Drift
    description: Exit west returns to the last hall. A rubble-choked grille blocks
      the way down. HEAVE rubble-choked grille WITH miner's gad-bar to open it.
    variants:
      - when:
          - quest_stage:
              quest: way
              stage: open
        text: "Exits: west and down. The opened rubble-choked grille no longer blocks
          the stairs."
    objects:
      - seal
    exits:
      - direction: west
        to: span
        conditions: []
      - direction: down
        to: vault
        conditions:
          - quest_stage:
              quest: way
              stage: open
        locked_msg: The rubble-choked grille is sealed fast. HEAVE rubble-choked grille
          WITH miner's gad-bar.
    on_enter: []
  - id: vault
    name: The Lowest Stope
    description: The vein-heart rests on the stone platform. Reaching it completes
      the quest.
    objects:
      - relic
    exits:
      - direction: up
        to: hearth
        conditions: []
    on_enter:
      - add_journal: You have reached the vein-heart.
      - inc_var:
          name: score
          by: 10
objects:
  - id: inscription
    name: worn inscription
    aliases:
      - inscription
      - wall
      - words
      - letters
    description: Letters cut deep into the cold stone.
    takeable: false
    quest_critical: false
    read_text: THE ROUTE HELD TWO GUARDIANS. BOTH ARE SLOW; THE SECOND IS STRONGER.
      IF THE FIRST GUARDIAN STILL STANDS, ATTACK ROCK-GOLEM. IF THE SECOND
      GUARDIAN STILL STANDS, ATTACK DEEP-HAUNT. THE VEIN-HEART IS BELOW THE
      SEAL. IF THE SEAL IS STILL CLOSED, HEAVE RUBBLE-CHOKED GRILLE WITH MINER'S
      GAD-BAR. COMPLETED FIGHTS AND AN OPENED SEAL STAY COMPLETE.
    container: false
    openable: false
    locked: false
    contents: []
    interactions: []
  - id: bar
    name: miner's gad-bar
    aliases:
      - bar
      - lever
      - pry-bar
      - prybar
    description: The miner's gad-bar is strong enough. If you are not holding the
      miner's gad-bar, TAKE miner's gad-bar. If the rubble-choked grille is
      still closed, HEAVE rubble-choked grille WITH miner's gad-bar.
    takeable: true
    quest_critical: false
    container: false
    openable: false
    locked: false
    contents: []
    interactions: []
  - id: ward
    name: rivet-plate jack
    aliases:
      - ward
      - armour
      - armor
      - mail
      - plate
      - suit
    description: An intact rivet-plate jack. If you are not holding the rivet-plate
      jack, TAKE rivet-plate jack. The first command, DON rivet-plate jack,
      teaches a lasting braced stance and grants +2 defense against either
      guardian still standing. Before that DON, carrying the ward gives no
      bonus; afterward, the bonus persists even if the ward is dropped.
    variants:
      - when:
          - has_flag: ward_donned
        text: You completed the rivet-plate jack's first DON. Its learned +2 defense
          remains even if the ward is later dropped.
    takeable: true
    quest_critical: false
    container: false
    openable: false
    locked: false
    contents: []
    interactions:
      - verb: USE
        item: ward
        target: ward
        conditions:
          - none_of:
              - has_flag: ward_donned
        effects:
          - set_flag: ward_donned
          - inc_var:
              name: defense
              by: 2
          - add_journal: The rivet-plate jack's first DON teaches a lasting braced stance
              and grants +2 defense against either guardian still standing. The
              bonus persists even if the ward is later dropped.
          - narrate: You put on the rivet-plate jack, learn its braced weight, and gain
              lasting +2 defense. The bonus persists even if you later drop it.
        command_verb: don
  - id: seal
    name: rubble-choked grille
    aliases:
      - seal
      - grate
      - slab
      - door
      - grille
      - hatch
    description: A closed rubble-choked grille with a worn edge. HEAVE rubble-choked
      grille WITH miner's gad-bar.
    variants:
      - when:
          - quest_stage:
              quest: way
              stage: open
        text: The rubble-choked grille is open. The way down is clear.
    takeable: false
    quest_critical: false
    container: false
    openable: false
    locked: false
    contents: []
    interactions:
      - verb: USE
        item: bar
        target: seal
        conditions:
          - none_of:
              - quest_stage:
                  quest: way
                  stage: open
        effects: []
        skill_check:
          skill: might
          difficulty: 12
          on_success:
            - set_quest_stage:
                quest: way
                stage: open
            - add_journal: You open the rubble-choked grille with the miner's gad-bar. The way
                down is clear.
            - inc_var:
                name: score
                by: 10
            - narrate: You HEAVE the rubble-choked grille open with the miner's gad-bar. The
                way down is clear.
          on_failure:
            - narrate: "The rubble-choked grille does not move. Try again: HEAVE rubble-choked
                grille WITH miner's gad-bar."
        command_verb: heave
        command_template: heave {target} with {item}
  - id: relic
    name: vein-heart
    aliases:
      - relic
      - prize
      - treasure
      - heart
      - crown
      - orb
    description: The vein-heart. Reaching it completes the quest.
    takeable: false
    quest_critical: false
    container: false
    openable: false
    locked: false
    contents: []
    interactions: []
npcs:
  - id: spirit
    name: damp-light
    description: A pale will-o'-the-wisp of mine-gas glow, hanging in the bad air
      with a patient flicker.
    room: hall
    dialogue:
      root: spirit_root
      nodes:
        - id: spirit_root
          npc_text: I have watched this place for a long time. Ask about the guardians or
            the last explorer.
          variants:
            - when:
                - any_of:
                    - has_flag: heard_foe
                    - has_flag: heard_ward
              text: The damp-light waits. Ask any remaining question or leave.
          effects: []
          topics:
            - id: ask_foe
              prompt: Ask about the keepers below.
              conditions:
                - not_flag: heard_foe
              goto: spirit_foe
              end: false
            - id: ask_ward
              prompt: Ask who else ever came down here.
              conditions:
                - not_flag: heard_ward
              goto: spirit_ward
              end: false
            - id: leave_spirit
              prompt: Step away.
              end: true
        - id: spirit_foe
          npc_text: "The route held two guardians: first the rock-golem, then the stronger
            deep-haunt. Both are slow. My warmth gives you +2 attack against
            either one still standing."
          effects:
            - set_flag: heard_foe
            - inc_var:
                name: attack
                by: 2
            - add_journal: The damp-light gives you +2 attack; it applies to either guardian
                still standing.
          topics:
            - id: foe_back
              prompt: Nod, and ask something else.
              goto: spirit_root
              end: false
        - id: spirit_ward
          npc_text: The intact rivet-plate jack found beside the dead explorer in the west
            cell teaches a lasting +2 defense stance on its first DON. The bonus
            applies to guardians still standing and persists even if the ward is
            later dropped.
          effects:
            - set_flag: heard_ward
            - add_journal: The spirit said the rivet-plate jack in the west cell teaches a
                lasting +2 defense stance on its first DON. The bonus persists
                even if the ward is later dropped.
          topics:
            - id: ward_back
              prompt: Nod, and ask something else.
              goto: spirit_root
              end: false
win_conditions:
  - id: claim_relic
    conditions:
      - visited: vault
    ending: ending_victory
endings:
  - id: ending_victory
    title: Bearer of the vein-heart
    text: You recover the vein-heart and begin the climb back to the surface.
    death: false
  - id: ending_fallen_sentinel
    title: Cold on the Stones
    text: The rock-golem kills you in the gallery. The vein-heart remains below.
    death: true
  - id: ending_fallen_guardian
    title: Fallen at the Deep Door
    text: The deep-haunt kills you near the final chamber. The vein-heart remains
      below.
    death: true
enemies:
  - id: foe
    name: rock-golem
    description: A rock creature blocks the passage. It is slow and protected by hard ore.
    room: gallery
    hp: 6
    attack: 1
    defense: 4
    defeat_flag: foe_down
    death_ending: ending_fallen_sentinel
    on_defeat:
      - add_journal: The rock-golem comes apart; the way east lies open.
      - inc_var:
          name: score
          by: 20
  - id: warden
    name: deep-haunt
    description: A larger creature of ore and mine timber guards the silver. It is
      stronger than the first golem.
    room: span
    hp: 9
    attack: 2
    defense: 4
    defeat_flag: warden_down
    death_ending: ending_fallen_guardian
    on_defeat:
      - add_journal: The deep-haunt comes apart; the last way east lies open.
      - inc_var:
          name: score
          by: 10
