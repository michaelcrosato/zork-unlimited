meta:
  id: genrpg_0_v1
  title: "Forge: A Hero's Descent"
  start_room: entry
  vars_init:
    hp: 20
    attack: 4
    defense: 2
    might: 3
  flags_init: []
  max_score: 65
  combat_guaranteed: true
rooms:
  - id: entry
    name: The Forge Steps
    description: "Goal: find the Ember-Heart. The stairs lead down into an abandoned
      mountain forge. Its last live ember is in the deepest chamber."
    objects: []
    exits:
      - direction: down
        to: hall
        conditions: []
    on_enter: []
  - id: hall
    name: The Outer Forge
    description: "Exits: up, west, and north. The wall inscription marks where the
      iron pry-bar was stored; TAKE iron pry-bar if it is here. A lantern-spirit
      waits here and can answer questions."
    variants:
      - when:
          - has_item: bar
        text: "Exits: up, west, and north. You carry the iron pry-bar that lay beside
          the wall inscription. A lantern-spirit waits here and can answer
          questions."
    objects:
      - inscription
      - bar
    exits:
      - direction: up
        to: entry
        conditions: []
      - direction: west
        to: cell
        conditions: []
      - direction: north
        to: gallery
        conditions: []
    on_enter: []
  - id: cell
    name: The Founder's Cell
    description: "Exit: east. This is where an intact cold-iron plate was found
      beside a dead explorer. Its first DON teaches a lasting braced stance and
      grants +2 defense against either guardian still standing. The bonus
      persists even if the ward is later dropped."
    objects:
      - ward
    exits:
      - direction: east
        to: hall
        conditions: []
    on_enter: []
  - id: gallery
    name: The Bellows Walk
    description: Exit south returns to the hall. The slag sentinel blocks the east
      exit. A human-sized slag creature blocks the way. It is slow, cold, and
      heavily armored. Prepare before fighting it.
    variants:
      - when:
          - has_flag: foe_down
        text: "Exits: south and east. The defeated slag sentinel lies on the floor."
    objects: []
    exits:
      - direction: south
        to: hall
        conditions: []
      - direction: east
        to: span
        conditions:
          - has_flag: foe_down
        locked_msg: The slag sentinel bars the way east while it still stands.
    on_enter: []
  - id: span
    name: The Anvil Floor
    description: Exit west returns to the gallery. The cinder-wraith blocks the east
      exit. A larger iron creature guards the inner heat. It is stronger and
      tougher than the slag sentinel. Prepare before fighting it.
    variants:
      - when:
          - has_flag: warden_down
        text: "Exits: west and east. The defeated cinder-wraith lies on the floor."
    objects: []
    exits:
      - direction: west
        to: gallery
        conditions: []
      - direction: east
        to: hearth
        conditions:
          - has_flag: warden_down
        locked_msg: The cinder-wraith bars the way east while it still stands.
    on_enter: []
  - id: hearth
    name: The Forge Heart
    description: Exit west returns to the last hall. A slag grate blocks the way
      down. LEVER slag grate WITH iron pry-bar to open it.
    variants:
      - when:
          - quest_stage:
              quest: way
              stage: open
        text: "Exits: west and down. The opened slag grate no longer blocks the stairs."
    objects:
      - seal
    exits:
      - direction: west
        to: span
        conditions: []
      - direction: down
        to: vault
        conditions:
          - quest_stage:
              quest: way
              stage: open
        locked_msg: The slag grate is sealed fast. LEVER slag grate WITH iron pry-bar.
    on_enter: []
  - id: vault
    name: The Ember Chamber
    description: The Ember-Heart rests on the stone platform. Reaching it completes
      the quest.
    objects:
      - relic
    exits:
      - direction: up
        to: hearth
        conditions: []
    on_enter:
      - add_journal: You have reached the Ember-Heart.
      - inc_var:
          name: score
          by: 20
objects:
  - id: inscription
    name: worn inscription
    aliases:
      - inscription
      - wall
      - words
      - letters
    description: Letters cut deep into the cold stone.
    takeable: false
    quest_critical: false
    read_text: THE ROUTE HELD TWO GUARDIANS. BOTH ARE SLOW; THE SECOND IS STRONGER.
      IF THE FIRST GUARDIAN STILL STANDS, ATTACK SLAG SENTINEL. IF THE SECOND
      GUARDIAN STILL STANDS, ATTACK CINDER-WRAITH. THE EMBER-HEART IS BELOW THE
      SEAL. IF THE SEAL IS STILL CLOSED, LEVER SLAG GRATE WITH IRON PRY-BAR.
      COMPLETED FIGHTS AND AN OPENED SEAL STAY COMPLETE.
    container: false
    openable: false
    locked: false
    contents: []
    interactions: []
  - id: bar
    name: iron pry-bar
    aliases:
      - bar
      - lever
      - pry-bar
      - prybar
    description: The iron pry-bar is strong enough. If you are not holding the iron
      pry-bar, TAKE iron pry-bar. If the slag grate is still closed, LEVER slag
      grate WITH iron pry-bar.
    takeable: true
    quest_critical: false
    container: false
    openable: false
    locked: false
    contents: []
    interactions: []
  - id: ward
    name: cold-iron plate
    aliases:
      - ward
      - armour
      - armor
      - mail
      - plate
      - suit
    description: An intact cold-iron plate. If you are not holding the cold-iron
      plate, TAKE cold-iron plate. The first command, DON cold-iron plate,
      teaches a lasting braced stance and grants +2 defense against either
      guardian still standing. Before that DON, carrying the ward gives no
      bonus; afterward, the bonus persists even if the ward is dropped.
    variants:
      - when:
          - has_flag: ward_donned
        text: You completed the cold-iron plate's first DON. Its learned +2 defense
          remains even if the ward is later dropped.
    takeable: true
    quest_critical: false
    container: false
    openable: false
    locked: false
    contents: []
    interactions:
      - verb: USE
        item: ward
        target: ward
        conditions:
          - none_of:
              - has_flag: ward_donned
        effects:
          - set_flag: ward_donned
          - inc_var:
              name: defense
              by: 2
          - add_journal: The cold-iron plate's first DON teaches a lasting braced stance and
              grants +2 defense against either guardian still standing. The
              bonus persists even if the ward is later dropped.
          - narrate: You put on the cold-iron plate, learn its braced weight, and gain
              lasting +2 defense. The bonus persists even if you later drop it.
        command_verb: don
  - id: seal
    name: slag grate
    aliases:
      - seal
      - grate
      - slab
      - door
      - grille
      - hatch
    description: A closed slag grate with a worn edge. LEVER slag grate WITH iron pry-bar.
    variants:
      - when:
          - quest_stage:
              quest: way
              stage: open
        text: The slag grate is open. The way down is clear.
    takeable: false
    quest_critical: false
    container: false
    openable: false
    locked: false
    contents: []
    interactions:
      - verb: USE
        item: bar
        target: seal
        conditions:
          - none_of:
              - quest_stage:
                  quest: way
                  stage: open
        effects: []
        skill_check:
          skill: might
          difficulty: 10
          on_success:
            - set_quest_stage:
                quest: way
                stage: open
            - add_journal: You open the slag grate with the iron pry-bar. The way down is
                clear.
            - inc_var:
                name: score
                by: 20
            - narrate: You LEVER the slag grate open with the iron pry-bar. The way down is
                clear.
          on_failure:
            - narrate: "The slag grate does not move. Try again: LEVER slag grate WITH iron
                pry-bar."
        command_verb: lever
        command_template: lever {target} with {item}
  - id: relic
    name: Ember-Heart
    aliases:
      - relic
      - prize
      - treasure
      - heart
      - crown
      - orb
    description: The Ember-Heart. Reaching it completes the quest.
    takeable: false
    quest_critical: false
    container: false
    openable: false
    locked: false
    contents: []
    interactions: []
npcs:
  - id: spirit
    name: lantern-spirit
    description: A thin blue flame in an old lantern, watchful and very tired.
    room: hall
    dialogue:
      root: spirit_root
      nodes:
        - id: spirit_root
          npc_text: I have watched this place for a long time. Ask about the guardians or
            the last explorer.
          variants:
            - when:
                - any_of:
                    - has_flag: heard_foe
                    - has_flag: heard_ward
              text: The lantern-spirit waits. Ask any remaining question or leave.
          effects: []
          topics:
            - id: ask_foe
              prompt: Ask about the keepers below.
              conditions:
                - not_flag: heard_foe
              goto: spirit_foe
              end: false
            - id: ask_ward
              prompt: Ask who else ever came down here.
              conditions:
                - not_flag: heard_ward
              goto: spirit_ward
              end: false
            - id: leave_spirit
              prompt: Step away.
              end: true
        - id: spirit_foe
          npc_text: "The route held two guardians: first the slag sentinel, then the
            stronger cinder-wraith. Both are slow. My warmth gives you +2 attack
            against either one still standing."
          effects:
            - set_flag: heard_foe
            - inc_var:
                name: attack
                by: 2
            - add_journal: The lantern-spirit gives you +2 attack; it applies to either
                guardian still standing.
          topics:
            - id: foe_back
              prompt: Nod, and ask something else.
              goto: spirit_root
              end: false
        - id: spirit_ward
          npc_text: The intact cold-iron plate found beside the dead explorer in the west
            cell teaches a lasting +2 defense stance on its first DON. The bonus
            applies to guardians still standing and persists even if the ward is
            later dropped.
          effects:
            - set_flag: heard_ward
            - add_journal: The spirit said the cold-iron plate in the west cell teaches a
                lasting +2 defense stance on its first DON. The bonus persists
                even if the ward is later dropped.
          topics:
            - id: ward_back
              prompt: Nod, and ask something else.
              goto: spirit_root
              end: false
win_conditions:
  - id: claim_relic
    conditions:
      - visited: vault
    ending: ending_victory
endings:
  - id: ending_victory
    title: Bearer of the Ember-Heart
    text: You recover the Ember-Heart and begin the climb back to the surface.
    death: false
  - id: ending_fallen_sentinel
    title: Cold on the Stones
    text: The slag sentinel kills you in the gallery. The Ember-Heart remains below.
    death: true
  - id: ending_fallen_guardian
    title: Fallen at the Deep Door
    text: The cinder-wraith kills you near the final chamber. The Ember-Heart
      remains below.
    death: true
enemies:
  - id: foe
    name: slag sentinel
    description: A human-sized slag creature blocks the way. It is slow, cold, and
      heavily armored.
    room: gallery
    hp: 6
    attack: 1
    defense: 4
    defeat_flag: foe_down
    death_ending: ending_fallen_sentinel
    on_defeat:
      - add_journal: The slag sentinel comes apart; the way east lies open.
      - inc_var:
          name: score
          by: 15
  - id: warden
    name: cinder-wraith
    description: A larger iron creature guards the inner heat. It is stronger and
      tougher than the slag sentinel.
    room: span
    hp: 9
    attack: 2
    defense: 4
    defeat_flag: warden_down
    death_ending: ending_fallen_guardian
    on_defeat:
      - add_journal: The cinder-wraith comes apart; the last way east lies open.
      - inc_var:
          name: score
          by: 10
