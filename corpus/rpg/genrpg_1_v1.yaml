meta:
  id: genrpg_1_v1
  title: "Barrow: A Hero's Descent"
  start_room: entry
  vars_init:
    hp: 20
    attack: 4
    defense: 2
    might: 3
  flags_init: []
  max_score: 55
  combat_guaranteed: true
rooms:
  - id: entry
    name: The Barrow Mouth
    description: "Goal: find the drowned crown. The stairs lead down into a flooded
      sea-king's tomb. The drowned crown is in the deepest chamber."
    objects: []
    exits:
      - direction: down
        to: hall
        conditions: []
    on_enter: []
  - id: hall
    name: The Antechamber
    description: "Exits: up, west, and north. The wall inscription marks where the
      bronze prise-bar was stored; TAKE bronze prise-bar if it is here. A
      drowned shade waits here and can answer questions."
    variants:
      - when:
          - has_item: bar
        text: "Exits: up, west, and north. You carry the bronze prise-bar that lay
          beside the wall inscription. A drowned shade waits here and can answer
          questions."
    objects:
      - inscription
      - bar
    exits:
      - direction: up
        to: entry
        conditions: []
      - direction: west
        to: cell
        conditions: []
      - direction: north
        to: gallery
        conditions: []
    on_enter: []
  - id: cell
    name: The Oarsman's Niche
    description: "Exit: east. This is where an intact kelp-green hauberk was found
      beside a dead explorer. Its first DON teaches a lasting braced stance and
      grants +2 defense against either guardian still standing. The bonus
      persists even if the ward is later dropped."
    objects:
      - ward
    exits:
      - direction: east
        to: hall
        conditions: []
    on_enter: []
  - id: gallery
    name: The Shield-Hall
    description: Exit south returns to the hall. The barrow-draugr blocks the east
      exit. A corpse in rusted mail blocks the way to the crown. It is slow and
      heavily armored. Prepare before fighting it.
    variants:
      - when:
          - has_flag: foe_down
        text: "Exits: south and east. The defeated barrow-draugr lies on the floor."
    objects: []
    exits:
      - direction: south
        to: hall
        conditions: []
      - direction: east
        to: span
        conditions:
          - has_flag: foe_down
        locked_msg: The barrow-draugr bars the way east while it still stands.
    on_enter: []
  - id: span
    name: The Drowned Gallery
    description: Exit west returns to the gallery. The tide-wight blocks the east
      exit. The king's drowned guard protects the crown. It is stronger and
      tougher than the first corpse. Prepare before fighting it.
    variants:
      - when:
          - has_flag: warden_down
        text: "Exits: west and east. The defeated tide-wight lies on the floor."
    objects: []
    exits:
      - direction: west
        to: gallery
        conditions: []
      - direction: east
        to: hearth
        conditions:
          - has_flag: warden_down
        locked_msg: The tide-wight bars the way east while it still stands.
    on_enter: []
  - id: hearth
    name: The Sunken Stair
    description: Exit west returns to the last hall. A barnacled slab blocks the way
      down. PRISE barnacled slab WITH bronze prise-bar to open it.
    variants:
      - when:
          - quest_stage:
              quest: way
              stage: open
        text: "Exits: west and down. The opened barnacled slab no longer blocks the
          stairs."
    objects:
      - seal
    exits:
      - direction: west
        to: span
        conditions: []
      - direction: down
        to: vault
        conditions:
          - quest_stage:
              quest: way
              stage: open
        locked_msg: The barnacled slab is sealed fast. PRISE barnacled slab WITH bronze
          prise-bar.
    on_enter: []
  - id: vault
    name: The Tide Cell
    description: The drowned crown rests on the stone platform. Reaching it
      completes the quest.
    objects:
      - relic
    exits:
      - direction: up
        to: hearth
        conditions: []
    on_enter:
      - add_journal: You have reached the drowned crown.
      - inc_var:
          name: score
          by: 15
objects:
  - id: inscription
    name: worn inscription
    aliases:
      - inscription
      - wall
      - words
      - letters
    description: Letters cut deep into the cold stone.
    takeable: false
    quest_critical: false
    read_text: THE ROUTE HELD TWO GUARDIANS. BOTH ARE SLOW; THE SECOND IS STRONGER.
      IF THE FIRST GUARDIAN STILL STANDS, ATTACK BARROW-DRAUGR. IF THE SECOND
      GUARDIAN STILL STANDS, ATTACK TIDE-WIGHT. THE DROWNED CROWN IS BELOW THE
      SEAL. IF THE SEAL IS STILL CLOSED, PRISE BARNACLED SLAB WITH BRONZE
      PRISE-BAR. COMPLETED FIGHTS AND AN OPENED SEAL STAY COMPLETE.
    container: false
    openable: false
    locked: false
    contents: []
    interactions: []
  - id: bar
    name: bronze prise-bar
    aliases:
      - bar
      - lever
      - pry-bar
      - prybar
    description: The bronze prise-bar is strong enough. If you are not holding the
      bronze prise-bar, TAKE bronze prise-bar. If the barnacled slab is still
      closed, PRISE barnacled slab WITH bronze prise-bar.
    takeable: true
    quest_critical: false
    container: false
    openable: false
    locked: false
    contents: []
    interactions: []
  - id: ward
    name: kelp-green hauberk
    aliases:
      - ward
      - armour
      - armor
      - mail
      - plate
      - suit
    description: An intact kelp-green hauberk. If you are not holding the kelp-green
      hauberk, TAKE kelp-green hauberk. The first command, DON kelp-green
      hauberk, teaches a lasting braced stance and grants +2 defense against
      either guardian still standing. Before that DON, carrying the ward gives
      no bonus; afterward, the bonus persists even if the ward is dropped.
    variants:
      - when:
          - has_flag: ward_donned
        text: You completed the kelp-green hauberk's first DON. Its learned +2 defense
          remains even if the ward is later dropped.
    takeable: true
    quest_critical: false
    container: false
    openable: false
    locked: false
    contents: []
    interactions:
      - verb: USE
        item: ward
        target: ward
        conditions:
          - none_of:
              - has_flag: ward_donned
        effects:
          - set_flag: ward_donned
          - inc_var:
              name: defense
              by: 2
          - add_journal: The kelp-green hauberk's first DON teaches a lasting braced stance
              and grants +2 defense against either guardian still standing. The
              bonus persists even if the ward is later dropped.
          - narrate: You put on the kelp-green hauberk, learn its braced weight, and gain
              lasting +2 defense. The bonus persists even if you later drop it.
        command_verb: don
  - id: seal
    name: barnacled slab
    aliases:
      - seal
      - grate
      - slab
      - door
      - grille
      - hatch
    description: A closed barnacled slab with a worn edge. PRISE barnacled slab WITH
      bronze prise-bar.
    variants:
      - when:
          - quest_stage:
              quest: way
              stage: open
        text: The barnacled slab is open. The way down is clear.
    takeable: false
    quest_critical: false
    container: false
    openable: false
    locked: false
    contents: []
    interactions:
      - verb: USE
        item: bar
        target: seal
        conditions:
          - none_of:
              - quest_stage:
                  quest: way
                  stage: open
        effects: []
        skill_check:
          skill: might
          difficulty: 13
          on_success:
            - set_quest_stage:
                quest: way
                stage: open
            - add_journal: You open the barnacled slab with the bronze prise-bar. The way down
                is clear.
            - inc_var:
                name: score
                by: 20
            - narrate: You PRISE the barnacled slab open with the bronze prise-bar. The way
                down is clear.
          on_failure:
            - narrate: "The barnacled slab does not move. Try again: PRISE barnacled slab WITH
                bronze prise-bar."
        command_verb: prise
        command_template: prise {target} with {item}
  - id: relic
    name: drowned crown
    aliases:
      - relic
      - prize
      - treasure
      - heart
      - crown
      - orb
    description: The drowned crown. Reaching it completes the quest.
    takeable: false
    quest_critical: false
    container: false
    openable: false
    locked: false
    contents: []
    interactions: []
npcs:
  - id: spirit
    name: drowned shade
    description: A grey shape half-seen in the standing water, mouthing words the
      tide swallows.
    room: hall
    dialogue:
      root: spirit_root
      nodes:
        - id: spirit_root
          npc_text: I have watched this place for a long time. Ask about the guardians or
            the last explorer.
          variants:
            - when:
                - any_of:
                    - has_flag: heard_foe
                    - has_flag: heard_ward
              text: The drowned shade waits. Ask any remaining question or leave.
          effects: []
          topics:
            - id: ask_foe
              prompt: Ask about the keepers below.
              conditions:
                - not_flag: heard_foe
              goto: spirit_foe
              end: false
            - id: ask_ward
              prompt: Ask who else ever came down here.
              conditions:
                - not_flag: heard_ward
              goto: spirit_ward
              end: false
            - id: leave_spirit
              prompt: Step away.
              end: true
        - id: spirit_foe
          npc_text: "The route held two guardians: first the barrow-draugr, then the
            stronger tide-wight. Both are slow. My warmth gives you +2 attack
            against either one still standing."
          effects:
            - set_flag: heard_foe
            - inc_var:
                name: attack
                by: 2
            - add_journal: The drowned shade gives you +2 attack; it applies to either
                guardian still standing.
          topics:
            - id: foe_back
              prompt: Nod, and ask something else.
              goto: spirit_root
              end: false
        - id: spirit_ward
          npc_text: The intact kelp-green hauberk found beside the dead explorer in the
            west cell teaches a lasting +2 defense stance on its first DON. The
            bonus applies to guardians still standing and persists even if the
            ward is later dropped.
          effects:
            - set_flag: heard_ward
            - add_journal: The spirit said the kelp-green hauberk in the west cell teaches a
                lasting +2 defense stance on its first DON. The bonus persists
                even if the ward is later dropped.
          topics:
            - id: ward_back
              prompt: Nod, and ask something else.
              goto: spirit_root
              end: false
win_conditions:
  - id: claim_relic
    conditions:
      - visited: vault
    ending: ending_victory
endings:
  - id: ending_victory
    title: Bearer of the drowned crown
    text: You recover the drowned crown and begin the climb back to the surface.
    death: false
  - id: ending_fallen_sentinel
    title: Cold on the Stones
    text: The barrow-draugr kills you in the gallery. The drowned crown remains
      below.
    death: true
  - id: ending_fallen_guardian
    title: Fallen at the Deep Door
    text: The tide-wight kills you near the final chamber. The drowned crown remains
      below.
    death: true
enemies:
  - id: foe
    name: barrow-draugr
    description: A corpse in rusted mail blocks the way to the crown. It is slow and
      heavily armored.
    room: gallery
    hp: 6
    attack: 1
    defense: 4
    defeat_flag: foe_down
    death_ending: ending_fallen_sentinel
    on_defeat:
      - add_journal: The barrow-draugr comes apart; the way east lies open.
      - inc_var:
          name: score
          by: 10
  - id: warden
    name: tide-wight
    description: The king's drowned guard protects the crown. It is stronger and
      tougher than the first corpse.
    room: span
    hp: 9
    attack: 2
    defense: 4
    defeat_flag: warden_down
    death_ending: ending_fallen_guardian
    on_defeat:
      - add_journal: The tide-wight comes apart; the last way east lies open.
      - inc_var:
          name: score
          by: 10
