meta:
  id: genrpg_2_v1
  title: "Crypt: A Hero's Descent"
  start_room: entry
  vars_init:
    hp: 20
    attack: 4
    defense: 2
    might: 3
  flags_init: []
  max_score: 70
  combat_guaranteed: true
rooms:
  - id: entry
    name: The Crypt Stair
    description: "Goal: find the abbey reliquary. The stairs lead down into the
      crypt below a fallen abbey. A gold reliquary waits behind the last sealed
      door."
    objects: []
    exits:
      - direction: down
        to: hall
        conditions: []
    on_enter: []
  - id: hall
    name: The Ossuary
    description: "Exits: up, west, and north. The wall inscription marks where the
      iron crow-bar was stored; TAKE iron crow-bar if it is here. A candle-wisp
      waits here and can answer questions."
    variants:
      - when:
          - has_item: bar
        text: "Exits: up, west, and north. You carry the iron crow-bar that lay beside
          the wall inscription. A candle-wisp waits here and can answer
          questions."
    objects:
      - inscription
      - bar
    exits:
      - direction: up
        to: entry
        conditions: []
      - direction: west
        to: cell
        conditions: []
      - direction: north
        to: gallery
        conditions: []
    on_enter: []
  - id: cell
    name: The Hermit's Recess
    description: "Exit: east. This is where an intact saint's mail-shirt was found
      beside a dead explorer. Its first DON teaches a lasting braced stance and
      grants +2 defense against either guardian still standing. The bonus
      persists even if the ward is later dropped."
    objects:
      - ward
    exits:
      - direction: east
        to: hall
        conditions: []
    on_enter: []
  - id: gallery
    name: The Nave Below
    description: Exit south returns to the hall. The bound revenant blocks the east
      exit. A corpse wrapped in burial cloth blocks the way to the gold. It is
      slow and armored. Prepare before fighting it.
    variants:
      - when:
          - has_flag: foe_down
        text: "Exits: south and east. The defeated bound revenant lies on the floor."
    objects: []
    exits:
      - direction: south
        to: hall
        conditions: []
      - direction: east
        to: span
        conditions:
          - has_flag: foe_down
        locked_msg: The bound revenant bars the way east while it still stands.
    on_enter: []
  - id: span
    name: The Lower Choir
    description: Exit west returns to the gallery. The choir-shade blocks the east
      exit. A tall, iron-armored corpse guards the reliquary. It is stronger
      than the first revenant. Prepare before fighting it.
    variants:
      - when:
          - has_flag: warden_down
        text: "Exits: west and east. The defeated choir-shade lies on the floor."
    objects: []
    exits:
      - direction: west
        to: gallery
        conditions: []
      - direction: east
        to: hearth
        conditions:
          - has_flag: warden_down
        locked_msg: The choir-shade bars the way east while it still stands.
    on_enter: []
  - id: hearth
    name: The Sealed Sanctuary
    description: Exit west returns to the last hall. A lead-sealed door blocks the
      way down. FORCE lead-sealed door WITH iron crow-bar to open it.
    variants:
      - when:
          - quest_stage:
              quest: way
              stage: open
        text: "Exits: west and down. The opened lead-sealed door no longer blocks the
          stairs."
    objects:
      - seal
    exits:
      - direction: west
        to: span
        conditions: []
      - direction: down
        to: vault
        conditions:
          - quest_stage:
              quest: way
              stage: open
        locked_msg: The lead-sealed door is sealed fast. FORCE lead-sealed door WITH
          iron crow-bar.
    on_enter: []
  - id: vault
    name: The Reliquary Vault
    description: The abbey reliquary rests on the stone platform. Reaching it
      completes the quest.
    objects:
      - relic
    exits:
      - direction: up
        to: hearth
        conditions: []
    on_enter:
      - add_journal: You have reached the abbey reliquary.
      - inc_var:
          name: score
          by: 20
objects:
  - id: inscription
    name: worn inscription
    aliases:
      - inscription
      - wall
      - words
      - letters
    description: Letters cut deep into the cold stone.
    takeable: false
    quest_critical: false
    read_text: THE ROUTE HELD TWO GUARDIANS. BOTH ARE SLOW; THE SECOND IS STRONGER.
      IF THE FIRST GUARDIAN STILL STANDS, ATTACK BOUND REVENANT. IF THE SECOND
      GUARDIAN STILL STANDS, ATTACK CHOIR-SHADE. THE ABBEY RELIQUARY IS BELOW
      THE SEAL. IF THE SEAL IS STILL CLOSED, FORCE LEAD-SEALED DOOR WITH IRON
      CROW-BAR. COMPLETED FIGHTS AND AN OPENED SEAL STAY COMPLETE.
    container: false
    openable: false
    locked: false
    contents: []
    interactions: []
  - id: bar
    name: iron crow-bar
    aliases:
      - bar
      - lever
      - pry-bar
      - prybar
    description: The iron crow-bar is strong enough. If you are not holding the iron
      crow-bar, TAKE iron crow-bar. If the lead-sealed door is still closed,
      FORCE lead-sealed door WITH iron crow-bar.
    takeable: true
    quest_critical: false
    container: false
    openable: false
    locked: false
    contents: []
    interactions: []
  - id: ward
    name: saint's mail-shirt
    aliases:
      - ward
      - armour
      - armor
      - mail
      - plate
      - suit
    description: An intact saint's mail-shirt. If you are not holding the saint's
      mail-shirt, TAKE saint's mail-shirt. The first command, DON saint's
      mail-shirt, teaches a lasting braced stance and grants +2 defense against
      either guardian still standing. Before that DON, carrying the ward gives
      no bonus; afterward, the bonus persists even if the ward is dropped.
    variants:
      - when:
          - has_flag: ward_donned
        text: You completed the saint's mail-shirt's first DON. Its learned +2 defense
          remains even if the ward is later dropped.
    takeable: true
    quest_critical: false
    container: false
    openable: false
    locked: false
    contents: []
    interactions:
      - verb: USE
        item: ward
        target: ward
        conditions:
          - none_of:
              - has_flag: ward_donned
        effects:
          - set_flag: ward_donned
          - inc_var:
              name: defense
              by: 2
          - add_journal: The saint's mail-shirt's first DON teaches a lasting braced stance
              and grants +2 defense against either guardian still standing. The
              bonus persists even if the ward is later dropped.
          - narrate: You put on the saint's mail-shirt, learn its braced weight, and gain
              lasting +2 defense. The bonus persists even if you later drop it.
        command_verb: don
  - id: seal
    name: lead-sealed door
    aliases:
      - seal
      - grate
      - slab
      - door
      - grille
      - hatch
    description: A closed lead-sealed door with a worn edge. FORCE lead-sealed door
      WITH iron crow-bar.
    variants:
      - when:
          - quest_stage:
              quest: way
              stage: open
        text: The lead-sealed door is open. The way down is clear.
    takeable: false
    quest_critical: false
    container: false
    openable: false
    locked: false
    contents: []
    interactions:
      - verb: USE
        item: bar
        target: seal
        conditions:
          - none_of:
              - quest_stage:
                  quest: way
                  stage: open
        effects: []
        skill_check:
          skill: might
          difficulty: 13
          on_success:
            - set_quest_stage:
                quest: way
                stage: open
            - add_journal: You open the lead-sealed door with the iron crow-bar. The way down
                is clear.
            - inc_var:
                name: score
                by: 20
            - narrate: You FORCE the lead-sealed door open with the iron crow-bar. The way
                down is clear.
          on_failure:
            - narrate: "The lead-sealed door does not move. Try again: FORCE lead-sealed door
                WITH iron crow-bar."
        command_verb: force
        command_template: force {target} with {item}
  - id: relic
    name: abbey reliquary
    aliases:
      - relic
      - prize
      - treasure
      - heart
      - crown
      - orb
    description: The abbey reliquary. Reaching it completes the quest.
    takeable: false
    quest_critical: false
    container: false
    openable: false
    locked: false
    contents: []
    interactions: []
npcs:
  - id: spirit
    name: candle-wisp
    description: A guttering flame with no candle under it, leaning toward you as if
      to whisper.
    room: hall
    dialogue:
      root: spirit_root
      nodes:
        - id: spirit_root
          npc_text: I have watched this place for a long time. Ask about the guardians or
            the last explorer.
          variants:
            - when:
                - any_of:
                    - has_flag: heard_foe
                    - has_flag: heard_ward
              text: The candle-wisp waits. Ask any remaining question or leave.
          effects: []
          topics:
            - id: ask_foe
              prompt: Ask about the keepers below.
              conditions:
                - not_flag: heard_foe
              goto: spirit_foe
              end: false
            - id: ask_ward
              prompt: Ask who else ever came down here.
              conditions:
                - not_flag: heard_ward
              goto: spirit_ward
              end: false
            - id: leave_spirit
              prompt: Step away.
              end: true
        - id: spirit_foe
          npc_text: "The route held two guardians: first the bound revenant, then the
            stronger choir-shade. Both are slow. My warmth gives you +2 attack
            against either one still standing."
          effects:
            - set_flag: heard_foe
            - inc_var:
                name: attack
                by: 2
            - add_journal: The candle-wisp gives you +2 attack; it applies to either guardian
                still standing.
          topics:
            - id: foe_back
              prompt: Nod, and ask something else.
              goto: spirit_root
              end: false
        - id: spirit_ward
          npc_text: The intact saint's mail-shirt found beside the dead explorer in the
            west cell teaches a lasting +2 defense stance on its first DON. The
            bonus applies to guardians still standing and persists even if the
            ward is later dropped.
          effects:
            - set_flag: heard_ward
            - add_journal: The spirit said the saint's mail-shirt in the west cell teaches a
                lasting +2 defense stance on its first DON. The bonus persists
                even if the ward is later dropped.
          topics:
            - id: ward_back
              prompt: Nod, and ask something else.
              goto: spirit_root
              end: false
win_conditions:
  - id: claim_relic
    conditions:
      - visited: vault
    ending: ending_victory
endings:
  - id: ending_victory
    title: Bearer of the abbey reliquary
    text: You recover the abbey reliquary and begin the climb back to the surface.
    death: false
  - id: ending_fallen_sentinel
    title: Cold on the Stones
    text: The bound revenant kills you in the gallery. The abbey reliquary remains
      below.
    death: true
  - id: ending_fallen_guardian
    title: Fallen at the Deep Door
    text: The choir-shade kills you near the final chamber. The abbey reliquary
      remains below.
    death: true
enemies:
  - id: foe
    name: bound revenant
    description: A corpse wrapped in burial cloth blocks the way to the gold. It is
      slow and armored.
    room: gallery
    hp: 6
    attack: 1
    defense: 4
    defeat_flag: foe_down
    death_ending: ending_fallen_sentinel
    on_defeat:
      - add_journal: The bound revenant comes apart; the way east lies open.
      - inc_var:
          name: score
          by: 15
  - id: warden
    name: choir-shade
    description: A tall, iron-armored corpse guards the reliquary. It is stronger
      than the first revenant.
    room: span
    hp: 9
    attack: 2
    defense: 4
    defeat_flag: warden_down
    death_ending: ending_fallen_guardian
    on_defeat:
      - add_journal: The choir-shade comes apart; the last way east lies open.
      - inc_var:
          name: score
          by: 15
