severity: S2
symptom: >
  All ten verified fresh players completed Wolf-Winter through lure-and-divert.
  Their exact transcripts repeated ask_lure, ask_quick_lesson, ask_lure, and
  ask_commit_lure without inspecting drive, fortify, or hunt as a strategy.
  Upstream duty, source, preparation, allocation, route, and check results varied,
  so this was not a forced route or one bad seed.
root_cause: >
  Cade named four plans, but only described HUNT as fighting and invited the player
  to ask about the other three. The first emotionally complete living option promised
  a saved pack and herd, while DRIVE and FORTIFY exposed their irreversible costs only
  after separate inspection. The legal branches were mechanically available but not
  comparable at the decision surface.
fix: >
  Make Cade's first spoken line explicitly ask for a goal/protection/cost comparison,
  then make every root plan prompt use that same scan-first structure. HUNT names its
  cattle-and-reserve protection and wolf cost; LURE names feed, paling, and cattle risk;
  DRIVE names people-and-wolf protection plus outer-line and crisis costs; FORTIFY names
  its byre-and-lives protection plus the property-versus-public-support trade. Preserve
  every action id, commitment boundary, resolver, outcome, and detailed opt-in lesson.
deterministic_witnesses:
  - invariant: "the first Cade surface names a goal, protected interest, and irreversible cost for HUNT, LURE, DRIVE, and FORTIFY before commitment"
  - invariant: "the comparison contains no exact DC, maneuver sequence, or outcome guarantee"
  - invariant: "human and MCP surfaces retain the same authored action ids and order"
  - invariant: "crossing north uncommitted still chooses hunt-and-hold and permanently closes all living plans"
tests:
  - tests/regression/wolf_winter_complementary_clues.test.ts
  - tests/regression/wolf_winter_uncommitted_living_boundary.test.ts
  - tests/regression/wolf_winter_dialogue_surface.test.ts
  - tests/regression/wolf_winter_compact_surface.test.ts
verification:
  - npm run validate -- wolf_winter
  - npx vitest run tests/regression/wolf_winter_complementary_clues.test.ts tests/regression/wolf_winter_uncommitted_living_boundary.test.ts tests/regression/wolf_winter_dialogue_surface.test.ts tests/regression/wolf_winter_compact_surface.test.ts
  - npm run crawl:smoke
  - npm run health
