symptom: >
  Compact opening prompts repeated the same technical-staging sentence once on every
  visible card, adding five to thirteen copies during each run. The progressive reveal's
  description already contained the complete HUNT/LURE/DRIVE/FORTIFY matrix, so compact
  MCP, terminal, and UI surfaces could show the long comparison before the player opened
  it. After an accepted ordinary setup choice, the action result immediately reprinted
  exact engine prose such as Field trigger, imported DEF, or Benefit/Cost/Boundary instead
  of leading with the player-language card outcome. A revealed compact context also lost
  its presentation state on refresh and could collapse back to one card.

root_cause: >
  Compact projection staged exact terms independently on every structured option while
  the authored progressive-disclosure description doubled as both the short affordance
  copy and the hidden comparison body. The first reveal response knew the requested id,
  but rolling MCP context did not project the session's durable reveal receipt. Ordinary
  accepted results had an optional player-first summary field available, but only the
  ready-made dispatch populated it.

fix: >
  Keep each required structured-option consequence key but project it as an empty string,
  and append one read-only exact-inspection instruction to the existing compact prompt
  message. Give the initial customize affordance one short honest label and description.
  After the session records the exact reveal receipt, remove that affordance from the
  presentation, expose all four authored options, and append the unchanged four-plan
  compass exactly once; refresh and export/restore derive the same view from that receipt.
  Add player-first displaySummary to ordinary shipped Albany opening results from the
  accepted card's human label, plain outcome where needed, and cost while preserving
  the exact consequence, returned entry, persistent journal, and snapshot bytes.

deterministic_witnesses:
  - "initial full, compact MCP, terminal, and UI oath surfaces contain the short customize affordance and no four-plan compass text"
  - "structured compact opening prompts carry one review instruction in message and retain consequence as a required empty-string key on every card"
  - "legacy unstructured story cards retain their existing per-option staged consequence fallback"
  - "the exact reveal records one inspectedStoryReveals receipt, changes the receipt-bound snapshot hash, accepts no gameplay decision, and does not advance the goal"
  - "reveal response, immediate compact refresh, and export/restore refresh expose the same four option ids in authored order, no revealOption, and one compass"
  - "re-opening the recorded exact reveal is hash-idempotent while forged reveal ids still fail"
  - "ordinary background, promise, report, field-kit, relief-wagon, and riding results lead with displaySummary before their byte-exact consequence"
  - "UI and CLI prefer displaySummary and do not immediately print the exact technical consequence when that summary exists"
  - "full and compact action results preserve exact consequence ordering, and displaySummary is absent from persistent snapshots and journals"
  - "Station compact context remains v47 and its six-row V4 tuple, actions, legend, departure-first guidance, and size budgets are unchanged"

mechanics_unchanged:
  - "story ids, kinds, reveal id, option ids, authored order, legal choices, action arguments, and comparison v10 shape"
  - "costs, tradeoffs, checks, dispatch minutes, consequences, field plans, quest outcomes, and journey decision classifications"
  - "accepted-choice journal entries, returned entry bytes, post-choice snapshots, content hashes, RNG, providers, and seeds"
  - "Station V4 rows, tuple slots, actions, legend, v47 context signature, and departure behavior"

nonclaims:
  - "The failed pilot supports this correction target; it is not evidence that the uncommitted replacement improves clarity, enjoyment, or retention."
  - "The reveal remains stateful: it durably records disclosure and therefore changes the snapshot hash, although it commits no option or field plan and accepts no journey decision."
  - "Blank compact consequence values do not delete terms; exact read-only option inspection and the authoritative accepted consequence retain them."
  - "No journey or comparison version is advanced because required keys and the v10 reviewOption shape remain intact."
  - "No Station, Gallowmere gameplay/content, new-town, mechanics, content-pack, provider, seed, or feedback-selection change is included; the Gallowmere regression file is only a cross-surface compact-projection witness."

