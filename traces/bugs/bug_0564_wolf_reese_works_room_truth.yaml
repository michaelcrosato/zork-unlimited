revision_liveness: >
  The exact false room survives on the merged Cycle 23 build that already contains
  bug_0563's neutral yearling journal. It is not a stale report excerpt: item 18
  exposes the current e8e29d0e Wolf source with the absent preparation flag and
  live DC 14 check, and item 19 executes that same current action boundary.
symptom: >
  Both pre-attempt FORTIFY room leaves unconditionally said that Reese's Works
  marks lowered the Repair difficulty. Those leaves are selected by Cade-versus-
  Albany authority, not by preparation, so the claim also appeared after Drover
  preparation when the ordinary DC remained live. The room therefore contradicted
  its own shown check before a consequential, no-retry roll. This is S1 state-to-
  copy truth friction, not a broken check or route.
root_cause: >
  The mechanics already distinguish Works from non-Works and Full from Aid-Only
  across the two authority stances, but the two room variants flattened that
  eight-cell boundary into one unconditional Works attribution per stance. The
  room copy needed to state the existing launch-preparation condition without
  duplicating or changing any predicate.
fix: >
  Change only the Cade and Albany pre-attempt room leaves so each says Reese's
  Works marks lower the shown Repair difficulty only if prepared at launch.
  Preserve the stance-specific item, no-retry rule, and recovery disclosure;
  preserve every variant condition, action, check, import, flag, effect, and
  outcome.
settled_copy:
  cade: >
    All three wolves test the open paling from outside. Seat Cade's first
    household shutter here once. Reese's Works marks lower the shown Repair
    difficulty only if prepared at launch; a miss cannot retry, but Cade's
    accepted terms make his bracing hand the recovery.
  authority: >
    All three wolves test the open paling from outside. Seat Albany's first
    relief seal here once. Reese's Works marks lower the shown Repair difficulty
    only if prepared at launch; a miss cannot retry, and Cade's refusal leaves
    one emergency public binding strip as recovery.
