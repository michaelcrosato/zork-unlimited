  boundary: >
    Four compiler-verified actionable fleet reports observed clean
    a145220e4875400fe5a4dfa5a6f69849fe97e94f;
    the sealed pure report observed clean 198a88d24f7aea5201b8a391fb83c221f6e99580.
    Those commits differ only in AI_LOOP_STATE.md, so the tested game content is the
    same, but they are not one exact revision. All five narratives mention Albany's
    opening role/duty/evidence vocabulary or terminology density; only reports 1801,
    1802, and 1803 contribute structured compiled hotspot rows that explicitly
    classify this terminology cluster. Report 1800 also reports a separate Gallowmere
    checkpoint defect, and the sealed pure report also describes broader
    dual-state-layer friction. The bundle is ordinary feedback, not pilot metrics,
    and gives no authority for provider or seed work.

symptom: >
  The opening projected role, duty, evidence, preparation, relief allocation, and
  field team as six peer administrative categories. Full, compact MCP, terminal, and
  UI surfaces repeated those labels even though the player's first decision only needs
  a background, a Wolf-Winter promise and report, then three optional forms of support.

root_cause: >
  bug_0577 removed repeated facts and bug_0578 made Station support directly actionable,
  but both retained the engine's durable slot names as first-level player language.
  The Station guidance also described support generically instead of grouping what was
  already set apart from what remained optional.

fix: >
  Translate only first-level presentation: role to background, duty to Wolf-Winter
  promise, evidence to report, preparation to field kit, relief allocation to relief
  wagon, and field team to second rider. Give quick setup one short ready-made-dispatch
  sentence and make Station guidance and render groups derive from currently open rows.
  Add a display-only ready-made-dispatch summary before the exact MCP consequence, and
  teach the blind prompt the durable-slot/player-label mapping. Keep Station tuple
  slots/version, story kinds, ids, actions, authored consequences, journal bytes, and
  exact inspected terms unchanged.

deterministic_witnesses:
  - "full opening messages use the six player labels and keep every option id in authored order"
  - "ready-made setup remains one canonical oath plus source pair and all four plans stay open"
  - "compact tuples retain role, duty, evidence, preparation, relief_allocation, and field_team while prompt and Station guidance supply the player labels"
  - "Station V4 guidance names background/promise/report as already set and field kit/relief wagon/second rider as optional"
  - "after one support choice, only the other two rows remain optional; after all three, no optional support group remains"
  - "terminal and UI headings, recaps, grouping labels, and action logs use the same first-level vocabulary"
  - "full UI and terminal choice guidance/card labels name the live background, promise, report, field kit, relief wagon, or second-rider category"
  - "custom and ready-made recap titles project Duty as Promise, and the solo riding choice projects Ride alone, while exact receipts and active terms remain authored"
  - "MCP inspection returns the same exact consequence and selecting after inspection yields the same snapshot hash"
  - "the solo option keeps its id and zero-time mechanics while its first-level label becomes Ride alone"
  - "ready-made full and compact action results place optional displaySummary before the byte-exact consequence; ordinary results omit it"
  - "the emitted compact Station legend maps every durable tuple slot to its player label without changing tuple keys or V4"

mechanics_unchanged:
  - "story ids, kinds, reveal id, tuple slots, option order, and action tuples"
  - "costs, dispatch minutes, checks, consequences, field terms, and strategy access"
  - "quest outcomes, checkpoints, content hashes, snapshots, RNG, providers, and seeds"

nonclaims:
  - "Five narratives support the broader clarity cluster, while three structured hotspot rows explicitly classify it. None quantify churn, retention, or causal lift."
  - "The pass does not rewrite authored consequence or deep inspection prose, so durable terms such as duty inside an exact receipt remain exact."
  - "The optional displaySummary is an additive story-choice action-result field; Station compact tuples and their V4 version remain unchanged."
  - "The emitted legend contract advances the overall compact view from v46 to v47; the Station board itself remains V4 with identical tuple slots and actions."
  - "This does not change Wolf-Winter tactics, recommend a plan, or close any player choice."
  - "Gallowmere and checkpoint presentation are outside this cycle and remain untouched."
  - "The out-of-scope recommendation e2544079 is not implemented by this trace."

