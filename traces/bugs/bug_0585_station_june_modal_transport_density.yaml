symptom: >
  The exact pure talk action on the revealed Station V6 field-team row opened
  one mandatory June ally modal but repeated the entire compact overworld
  context. Eight authenticated responses totaled 71,191 bytes even though each
  player's next mutation was the modal's visible ally choice.

root_cause: >
  Pure mode forwarded the canonical contact response unchanged. Unlike the
  Station board reveal, the June story-modal transition had no typed response
  member bound to the player's retained snapshot. Narrowing on character id or
  reveal receipt alone would be unsafe: the receipt can coexist with a different
  active support modal, and later June talks must retain canonical behavior.
  Dropping the canonical departure_recap legend patch would also orphan the
  tuple definition after the manager marked it disclosed.

fix: >
  Only pure talk_overworld_session_contact calls normalized to the exact June
  character are candidates. Before requiring a hash, the server exports the
  session and verifies the exact persisted Wolf-Winter Station reveal receipt,
  then makes a non-consuming full read. That read must show Station board V6,
  exactly one open field_team row whose action is the exact June talk tool and
  handle, and journey.storyChoice null. Only this eligible state requires the
  latest expected_snapshot_hash; missing or stale bases reject before mutation.
  After the canonical talk and evidence hook succeed, the exact ally story id,
  unique three-option id set, substantive-dialogue decision, compact result,
  canonical context presence, same raw parent, and distinct new hash authorize
  V1. The response carries outer overworld_session_id/new snapshot_hash, full
  compact journey/storyChoice, journeyDecision, complete canonical legend_delta
  when present,
  compact result, and station_dispatch_modal:{version,base_snapshot_hash}; it
  omits raw session_id and repeated context. Any unexpected post-shape preserves
  the already-successful complete canonical response.

deterministic_witnesses:
  - "the exact contact_id alias normalizes into the same eligible June V1 member"
  - "missing and stale expected_snapshot_hash reject before mutation; an unchanged read proves the exact base hash remains current"
  - "the ready-board guard requires V6, wolf_winter, exactly one open field_team row, null selected title, exact talk tool/June handle, and no active storyChoice"
  - "the current V1 response has exactly outer parent/new hash, full compact journey and mandatory ally storyChoice, substantive journeyDecision, compact result, complete departure_recap legend patch, and the version/base marker"
  - "the three June option ids are exact and unique; duplicate, missing, extra, or unknown ids preserve canonical success"
  - "the current deterministic V1 envelope is exactly 3,908 UTF-8 bytes under a 4,000-byte regression budget"
  - "read-only inspection uses the V1 new hash, returns the ally story plus retained departure_recap, and leaves the snapshot unchanged"
  - "repeating the stale June board action while the ally modal is active rejects without mutation"
  - "the following exact ally choice uses the V1 new hash and returns full canonical context, raw session_id, and no station_dispatch_modal"
  - "a post-choice June talk without expected_snapshot_hash remains canonical full success with raw session/context and a new hash"
  - "a full-mode June talk remains an exact 8,930-byte canonical compact response with session_id, context, and departure_recap legend but no pure marker or outer handle"
  - "known non-June literal talk wire types exclude V1; exact June, contact_id alias, and broad callers conservatively include V1 plus canonical fallback"
  - "pure prompt is 15,720 bytes; unchanged catalogue 16,773 plus fresh context 2,042 yields 34,535, below the sealed 34,868 budget"
  - "first-Station aggregate is 38,162, below sealed V6's 38,495; tool catalogue bytes and every entry digest remain unchanged"

mechanics_unchanged:
  - "compact context v49, Station board V6, reveal V1, receipt id/schema/persistence, and board purposes/actions"
  - "quest, story, option, character, support, action, road, and approach ids"
  - "June dialogue, three ally terms, minutes, costs, promises, companion state, checks, effects, RNG, outcomes, and later interventions"
  - "preparation and relief-wagon support choices, full support commit responses, support order, and selected terms"
  - "four Wolf-Winter strategies, legal launches, journey checkpoints, Continue/End, saves, UI, terminal, and CLI"
  - "canonical full/non-pure tools, manager responses, export/restore, generic contacts, and full following ally choice"

nonclaims:
  - "The valid pilot failed only clarity and enjoyment gates; it diagnoses repeated transport but does not prove the correction improves either rating, continuation, completion speed, strategy mix, or certification."
  - "The response-size relationship is structural amplification correlated with density reports, not causal proof of the failed ratings."
  - "The 3,908-byte envelopes replay exact pilot fields but were not returned by the tested build; 4,000 bytes is a regression budget, not a global runtime cap."
  - "The four-state/profile/time size audit is a bounded counterfactual serialization, not an exhaustive proof of every future legal journey or content shape."
  - "The complete departure_recap legend is intentionally retained because the following full response uses that tuple after disclosure; it is not unnecessary context."
  - "The broader support mutations remain full because this cycle establishes no safe partial merge for their multi-field state changes."
  - "V6's relevance overview and reveal V1 remain unchanged; their retained use is not a causal quality-lift claim."
  - "No Gallowmere content, behavior, checkpoint, conclusion, or expansion is in scope or claimed."
  - "No Continue/End wording, availability, counting, or other retention-metric mechanism changes."
  - "authority_certified is false; official launcher and exact hashes authenticate this cohort without turning ten AI players into certification or human validation."
  - "This is a pure compact-MCP transport correction, not a browser, terminal, CLI, or human UI redesign."

