symptom: >
  The shared open-support briefing led with committed minutes and an optional
  final range, then described starting as declining or sealing support. It did
  not name which opening facts were already fixed, distinguish comparison from
  the later named choice that commits, or say plainly that
  starting Wolf-Winter declines everything still open. Those facts existed in
  the V6 tuple, legend, reveal rows, and launch seal, but were split across the
  compact workflow that all ten pilot players described as dense.

root_cause: >
  The derived `support_choices_open` line was authored as a timing forecast. It
  assumed that first-time players would combine the board's selected/open slot
  ids, reveal actions, legend, and route-start consequence into one state model.
  The bug_0587 row copy made each individual action safe to use, but did not
  translate that shared state transition where the board and both routes already
  repeat the same authenticated status.

fix: >
  Rewrite only the shared `support_choices_open` briefing. Name background,
  promise, and report as set; show the committed and possible-final dispatch
  minutes; say Compare before `named choice commits`; and say Start Wolf-Winter
  to decline the rest. Preserve the existing threshold classification with the
  exact plain clauses `all on time`, `support can delay dispatch`, and `already
  late`. Keep every sealed, delayed, on-time, and neutral status byte-identical.

