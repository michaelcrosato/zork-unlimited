    finding_boundary: >
      All ten reports describe a broad Albany setup or compact-density concern.
      Nine explicitly name Station, dispatch, or support density; seed 2026082300
      names the broader compact state/choice density and is not counted as
      Station-specific. Seed 2026082302 reports the narrow trigger boundary of
      Jamie's Relief Protocol as an S1, and seed 2026082309 separately reports
      June Pike's situational payoff as an S1. Neither report says the underlying
      mechanics failed.

symptom: >
  Compact MCP placed three optional Station support rows, their purposes, and
  their authenticated actions beside both legal Wolf-Winter roads before the
  player asked to compare support. The same authenticated dispatch range and
  threshold prefix repeated on both route summaries. Exact inspection preserved
  authored consequences but did not plainly state that Jamie's narrow
  split-rail recovery or June's conditional help might never trigger, or which
  clean/recovered states receive no benefit.

root_cause: >
  Board V4 treated every open optional support row as first-level compact
  guidance. Compact route projection had no contract for lifting an exact shared
  dispatch prefix once without risking loss of its final range and threshold
  facts. The option-detail projection authenticated canonical consequence bytes
  but had no narrowly keyed field for situational trigger and no-effect boundaries.

fix: >
  Compact v48 emits Station board V5 as
  [5, quest_id, dispatch_status, dispatch, rows, reveal|null]. Before review it
  keeps the two legal roads, one complete shared dispatch briefing, selected core
  and support rows, and one exact reveal affordance while omitting open optional
  support rows. The exact reveal records a separate durable, idempotent read-only
  receipt; after review the unchanged five-field support rows and actions return
  in their established order. Forged ids fail, refresh and export/restore retain
  the receipt, and sealing support, launch, or journey End clears it. Compact
  routes shed the common prefix only when that exact prefix is emitted by the
  same board; missing or mismatched source detail fails closed. Exact Jamie and
  June option inspection adds a bounded situationalBoundary keyed by prompt id,
  kind, option id, and label while canonical consequence bytes remain unchanged.

deterministic_witnesses:
  - "pre-review V5 keeps role/duty/evidence and selected support, omits every open optional row/id/purpose/action, and exposes one exact reveal with the truthful remaining count"
  - "post-review rows are byte-equal to the established five-field V4 row/action projection and retain authored order"
  - "exact reveal changes only the separate receipt-bound snapshot field and accepts no gameplay or journey decision"
  - "refresh, exact repeat, and export/restore preserve the revealed board; exact repeat is hash-idempotent and forged ids reject without mutation"
  - "awaiting-choice snapshots with a valid historical receipt restore, while End clears it and injected ended or post-start receipts fail authentication"
  - "support selection changes only its established support row/state, and full seal or quest launch clears the disclosure receipt"
  - "all-on-time, threshold-crossing, already-delayed, and sealed dispatch briefings retain the full final range/threshold truth exactly once"
  - "no-board, missing-summary, mismatched-prefix, and unknown-source controls retain every full compact route summary"
  - "canonical full, terminal, and browser route/support presentation remains unchanged"
  - "initial compact preparation and ally summaries contain no situationalBoundary text; exact Jamie and June option inspection alone returns it"
  - "Jamie and June boundaries say the benefit may never trigger, name the exact trigger, and name clean or recovered no-effect cases within 320 characters and 50 words"
  - "exact option detail preserves canonical consequence bytes, returns authenticated selected terms without a duplicate weaker recap, and the worst of all 324 legal Station setup combinations is 2,034 characters, within the 2,048-character compact response budget"
  - "UTF-8 density accounting includes the pure catalogue: fresh prompt + catalogue + context is 35,207 bytes versus 35,208 at V47/V4; first-Station prompt + catalogue + context + new legend is 38,619 versus 39,261 (-642)"

mechanics_unchanged:
  - "existing gameplay, quest, approach, story, option, character, and action ids; one new read-only Station presentation reveal id is additive"
  - "legal choices, support order, costs, minutes, money, checks, DCs, gameplay state/effects except the persisted disclosure receipt, RNG, outcomes, and accepted-decision counts"
  - "canonical consequences, selected terms, route-specific time/supply/fatigue/alarm/weather facts, quest starts, and continuation copy"
  - "full Station data plus terminal and browser interaction behavior"

nonclaims:
  - "The failed pilot identifies a correction target; it is not evidence that this replacement improves any quality, retention, or certification metric."
  - "No metric result or threshold change is claimed by this correction."
  - "No Gallowmere content, behavior, checkpoint, or conclusion is in scope or claimed."
  - "The broad density cluster is 10/10, but only 9/10 explicitly names Station or dispatch; it is not a 10/10 Station-specific finding."
  - "The two in-scope S1 reports are distinct situational-legibility findings, not a repeated blocking cluster and not evidence of broken mechanics."
  - "Report hashes authenticate report bytes only; they do not independently prove transport tuple counts or repeated prefixes."
  - "This AI pilot is not human market validation and is not authority certification."
  - "The durable read-only disclosure receipt may change snapshot hash, but it accepts no gameplay choice, journey decision, plan, or outcome."
  - "The correction is compact-MCP-only; it makes no existing human UI parity claim and does not change terminal or browser presentation."

