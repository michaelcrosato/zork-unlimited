symptom: >
  The successful LURE player saw the same north block before picking up feed and
  after returning from the first cast. Its phrase "the applicable step" compressed
  HUNT, LURE, DRIVE, and FORTIFY prerequisites into one mechanical list instead of
  pointing back to the immediate cue and legal action already shown in the current
  room. The player followed both routes correctly and finished at 4/4, but described
  the resulting state-and-movement reading as a small cognitive load. Five earlier
  successful LURE/FORTIFY exposures are counterevidence to hidden actions, a dead
  end, or a mechanics defect; this is bounded S1 copy density.
root_cause: >
  The byre-yard north exit has one static locked_msg shared by every state in which
  its existing conditions keep north closed. The old union named abstract
  prerequisites without route labels and did not connect "applicable" to the room's
  visible June conversation, relief docket, westward pickup, loft path, or named
  DRIVE/FORTIFY gear. The surrounding room copy and legal-action projection already
  exposed the correct next step, so no condition or affordance was missing.
fix: >
  Change only that static locked message to: "North waits. Follow this room's cue:
  talk to June before HUNT; LURE: call any shown docket, fetch feed west, or go
  west/up for the second cast; DRIVE/FORTIFY: take named gear." The route labels
  turn the shared union into a compact index back to the current room surface while
  "any shown docket" avoids promising a recovery action outside its authored state.
  Preserve every exit condition, action, route, resource, and consequence.
deterministic_witnesses:
  - "the June-held HUNT boundary exposes the exact 175-character hint and talk_june_pike in both full and compact surfaces; north remains closed until the existing warning acknowledgment"
  - "June's HUNT commitment dialogue still discloses the wolf-death consequence explicitly; the copy-only blocked-route change does not restore the retired 'ordinary combat line' wording"
  - "committed LURE before feed pickup exposes go_west and the exact full/compact block; carrying winter_feed_sack still opens north without another state change"
  - "post-first-cast LURE exposes go_west and the same block, then the unchanged west/up path makes the loft second cast legal"
  - "the failed-cast split-guard recovery exposes use_relief_protocol_docket only in its authored yard state; after that one-shot call, go_west remains the visible route and the block remains truthful"
  - "committed DRIVE, Cade FORTIFY, and Albany-authority FORTIFY each expose their named gear action with the exact full/compact block; taking that gear still opens north"
  - "full and compact projections contain exactly one blocked north entry, no north exit/action while pending, and no truncation marker in the 175-character message"
  - "the exact Wolf-Winter compiled source hash advances from 1bdbd697d7a3c287b1a3bb2e22dd5aa8f793442a7eba39d4af11fffa1e157610 to 189b14d70a68c0c795167baa9dae695f56c9f3b99bd33151d6a4ece87d083b3b"
nonclaims:
  - "This does not claim the source player attempted blocked north, chose a wrong movement, reached a dead end, found a hidden action, got stuck, or reported a bug. Raw items 12-23 show immediate successful use of the room's legal cues."
  - "The report's hypothetical language about a wrong movement dead-ending the plan is not a reproduced state-machine failure; prior successful LURE and FORTIFY runs independently counterexample that stronger interpretation."
  - "This does not make the static message state-specific or promise that June, a relief docket, every LURE phase, and every gear item are simultaneously present. It directs the player to whichever cue the current room actually shows."
  - "This does not add, remove, rename, reorder, or reveal an action; change an exit condition, flag, item, dialogue, check, score, decision, checkpoint, ending, combat beat, or route; or alter save schema or serialization."
  - "This does not preserve the prior content hash. Existing 1bdb content-hash-bound Wolf saves intentionally reject against the new 189b source under the unchanged integrity policy."
  - "This on-list maintenance fix selects exact candidate playtest-wolf_winter; it does not select or consume accepted recommendation hotspot-07988b93."
