symptom: >
  Cade's first root explained four peer COMPARE cards, PREPARE SUPPORT, and FINAL
  COMMITMENT, while each first-level action repeated those terms around compressed
  outcome and cost clauses. All ten pilot players had to cross this seven-action
  menu, and several independently described its labels and conditional plan terms
  as dense before choosing a strategy.

root_cause: >
  The first menu mixed player instructions with author-facing state-machine
  vocabulary. Its four opt-in detail bodies already contain the exact ground,
  oath, preparation, June, recovery, and commitment truth, so copying condensed
  versions of that terminology into every peer label made the required first
  comparison harder to scan without adding mechanical information.

fix: >
  Rewrite only Cade's first-root explanation and the four peer plan labels. Say
  that asking and preparation choose nothing, identify HUNT's north-crossing or
  offered-June-release boundary, and say choosing one plan closes the rest. Lead
  each peer label with its stable plan name, ordinary-language goal, material
  cost, and `Ask only`. Keep HUNT at the root once; mirror byte-identical LURE,
  DRIVE, and FORTIFY labels at cade_root, cade_wolves, and cade_byre.

