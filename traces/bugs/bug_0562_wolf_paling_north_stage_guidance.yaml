symptom: >
  The Broken Paling's one primary north block is shared by ordinary/HUNT,
  LURE, DRIVE, and both FORTIFY authorities. Its first sentence named the live
  yearling-or-outer-seal gate, but its LURE sentence immediately gave the later
  south/west/up loft route even while the first cast, rail recovery, or bounded
  hybrid fight was still the legal task. The retry therefore saw identical prose
  across seven LURE observations spanning five materially distinct stages,
  including both before and after the yearling was settled. This is S1 ordering
  and density friction, not a
  broken exit or dead end.
root_cause: >
  The locked_msg flattened two sequential LURE stages into one undifferentiated
  instruction: settle the yearling at the paling, and only afterward leave by the
  authored return route for the loft cast. Because the same exit also gates DRIVE
  and FORTIFY, the copy must preserve their yearling/outer-seal truth without
  suggesting that an optional action or any single shown step necessarily opens
  north.
fix: >
  Replace only the Broken Paling north locked message with a 116-character,
  22-word sequence: "Settle the yearling or finish the outer seal first. On LURE,
  only then return south, west, and up for the loft cast." Keep its destination,
  two existing condition groups, every room variant and legal action, and all
  other primary and secondary blocked messages unchanged.
settled_copy: >
  Settle the yearling or finish the outer seal first. On LURE, only then return
  south, west, and up for the loft cast.
