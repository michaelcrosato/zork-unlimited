symptom: >
  Registration, promise/report setup, and Station support presented repeated policy and
  engine language before departure. Registration cards exposed DEF/import fit and duplicate
  permanence/obligation rows. Ready-made cards projected technical benefits as their main
  promise. Compact preparation cards removed canonical checkFit entirely, so Emery's paid
  Drover Route did not disclose the character-relative Streetwise +0 vs DC 12 check until
  after selection.

root_cause: >
  First-tier cards reused exact-receipt fields instead of composing the few facts needed
  for a choice. The compact journey projection treated every checkFit as inspection-only,
  despite a paid field kit whose later recovery check makes current skill fit material
  before purchase. Briefing copy accumulated progress, purpose, planning context, and
  instructions across six successive Albany stages.

fix: >
  Recompose only the first presentation layer. Registration now shows one permanent
  background outcome, one starter skill-and-kit fact, starting cash/cost, and the active
  return obligation; exact DEF/import and field-trigger terms remain in the existing
  consequence and inspection. Known ready-made dispatches show neutral adventure outcomes,
  while mapping or mechanics drift falls back to the live promise/report titles and exact
  benefits remain inspection-only. Canonical preparation remains unchanged; compact
  preparation alone converts its existing character-relative checkFit into one Governing
  skill highlight, and UI/terminal render that check once before purchase. Each Albany stage
  receives one concise required-or-optional sentence, and Station guidance truthfully starts
  with Ready to depart now. Registration action projection and departure recap explicitly
  retain their authenticated journal and authored tradeoff sources so the new display copy
  cannot alter existing receipt or recap bytes.

deterministic_witnesses:
  - "full, compact MCP, terminal, and UI registration cards preserve all four ids and authored order while showing only background, starts-with, cost/cash, and return obligation facts"
  - "registration first-tier summaries contain no DEF, import, or fieldTrigger language while exact consequence inspection retains the prior technical terms"
  - "ready-made dispatch cards use neutral Outcome copy, preserve exact costs and closed alternatives, and keep exact Benefit bytes behind read-only inspection"
  - "known ready-made prose is gated by profile, oath, source, title, and trigger identity; valid counterfactual drift derives the live promise/report pairing"
  - "canonical preparation summaries retain one checkFit and no duplicate highlight; compact preparation exposes the same value once as Governing skill"
  - "Emery's Drover Route shows Streetwise +0 vs DC 12 before selection in compact MCP, CLI, and UI"
  - "preparation option inspection remains read-only and zero, one, or multiple inspections produce identical action results and snapshot hashes"
  - "registration, ready-made, custom promise, report, field-kit, relief-wagon, and riding stages each use one concise instruction"
  - "Station guidance says Ready to depart now, derives selected versus optional support, and agrees grammatically for zero, one, two, or three open support rows"
  - "registration action entry text remains the durable journal text, while its exact consequence still carries Field trigger and DEF/import terms"
  - "departure recap role activeFieldTerm remains the authenticated authored profile tradeoff, not the new first-tier obligation copy"
  - "option ids, order, actions, costs, consequences, mechanics, journal entries, snapshots, and compact Station V4 tuples remain unchanged"

mechanics_unchanged:
  - "opening ids, story kinds, option order, reveal affordances, action tuples, and Station V4 schema"
  - "character packages, skills, equipment, cash, promises, checks, DCs, costs, dispatch minutes, and outcomes"
  - "journal and snapshot evidence, exact selection consequences, departure recap terms, RNG, providers, and seeds"

nonclaims:
  - "The pilot establishes a repeated clarity complaint and one direct S1 reliability report; it does not establish causal retention or enjoyment lift from this correction."
  - "This correction is uncommitted focused work after the tested predecessor build, not pilot evidence for the replacement and not starting-slice certification."
  - "The field-kit check is an intentional first-tier exception: its character-relative modifier and DC remain visible because they determine paid preparation reliability."
  - "Technical exact terms are staged, not deleted; read-only inspection and receipts retain authored mechanics and consequence text."
  - "No schema/version, mechanics, content-pack, provider, seed, feedback-selection, or Gallowmere change is included."

