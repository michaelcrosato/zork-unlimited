id: bug_0546
title: "Loop-state rotation archived the frozen feedback selection at the live-entry boundary"
pack: n/a (AFK loop-state finalization)
reported_by: 2026-08-09 commit-enabled Cycle 6 boundary audit
severity: S2
symptom: >
  AI_LOOP_STATE.md already held the configured 15 rich cycle results when the next
  commit-enabled assessment appended its terse cycle scaffold below them. After the
  agent froze the actual feedback selection in that scaffold and prepended the new
  result, a final rotation had to remove the oldest of 16 results for integrity. The
  rotation cut at that oldest result and archived the entire remaining suffix, including
  the frozen feedback_cycle_selection marker. Leaving the file unrotated instead violated
  the 15-entry integrity cap; rotating it made the later feedback seal reject the cycle
  for having no live frozen selection attestation.
root_cause: >
  rotateLoopState treated every byte below the first archived rich result as historical
  prose. That was true for old driver tails, but not for the current cycle scaffold:
  src/ai-loop.ts appends the scaffold after the existing newest-first result history, so
  its machine-owned selection line can sit on the archived side of the deterministic cut.
  The rotation preserved machine markers in the introductory prefix but had no equivalent
  rule for a frozen selection below the rich entries.
fix: >
  When rotation is actually required, relocate every feedback_cycle_selection line from
  the archived suffix into the live preamble before the first retained result, preserving
  its exact bytes rather than parsing, canonicalizing, deduplicating, or repairing it.
  Remove those relocated lines from the ignored archive, then retain the newest 15 rich
  results and update the historical count exactly as before. Valid selection authority
  therefore remains available to the seal, while malformed or duplicate markers remain
  live for its existing fail-closed validation instead of disappearing into history. A
  repo-local rotation command runs unconditionally after the provisional-commit check and
  before post-change crawl, health, and integrity, so commit-enabled and evidence-only
  cycles both apply this boundary after their required clean evidence timing. Rotation
  failure is a classified cycle rejection and reset, never a best-effort warning.
deterministic_witnesses:
  - "a 16-result log with a tail-scaffold selection rotates exactly one result and leaves exactly 15 live"
  - "the exact frozen selection line occurs once in the live preamble and never in the ignored archive"
  - "the relocated marker still parses to the same run id and selected recommendation id"
  - "malformed and duplicate selection lines are relocated byte-for-byte so the seal can still reject them"
  - "the valid relocated selection remains sealable and is removed only by successful acceptance sealing"
  - "historical plus live cycle counts remain exact, and a second rotation is a byte-for-byte no-op"
  - "the existing feedback acceptance marker remains in the live introduction"
  - "loop.sh invokes the repo-local rotation once after provisional validation and before every post-change gate"
  - "rotation failure rejects and resets the cycle under the loop-state-rotation stage"
tests:
  - tests/regression/loop_state_rotation.test.ts
  - tests/regression/loop_driver_gates.test.ts
  - tests/unit/seal_feedback_acceptance.test.ts
verification:
  - bash -n loop.sh
  - npx vitest run tests/regression/loop_state_rotation.test.ts tests/regression/loop_driver_gates.test.ts tests/unit/seal_feedback_acceptance.test.ts
  - npm run verify:bug-traces
