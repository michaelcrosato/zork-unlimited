symptom: >
  Cade's first-root cards already shared plain-language plan names and costs,
  but they did not expose comparable help or outcome fields. HUNT alone said
  plainly that wolves may die, while LURE, DRIVE, and FORTIFY described movement
  or separation without equally plain living-wolf outcomes. The valid pilot
  then selected LURE eight times despite five of ten seeded grounds favoring
  HUNT and only three favoring LURE; all ten clarity ratings remained 4/5.

root_cause: >
  The peer cards had unequal comparison resolution. LURE's keep-the-pack-moving
  framing made its living-pack aim easiest to infer, while DRIVE and FORTIFY
  omitted that their successful endings also leave the wolves alive, and no
  card used one stable field for the relevant aid. The detailed opt-in bodies
  already hold the full conditional truth, so the smallest correction is a
  symmetric preview rather than new mechanics or another commitment step.

fix: >
  Rewrite only the one HUNT prompt and the byte-identical three copies each of
  LURE, DRIVE, and FORTIFY. Give every peer card the exact visible sequence
  `Goal`, `Cost`, `Help`, then an ask-only choice boundary. Name Cade lessons
  plus jerkin for HUNT, Fieldcraft for LURE and DRIVE, and Repair for FORTIFY.
  State that LURE, DRIVE, and FORTIFY keep the wolves alive; retain HUNT's
  wolf-death risk and identify its cattle/outer-defense exposure. Restore no
  retreat to DRIVE and FORTIFY. Describe FORTIFY's property-for-Cade-aid or
  public-seal spend without guaranteeing that Cade aid is received. Keep Cade's
  root, all detail bodies, and every action and commitment mechanic byte-for-byte
  unchanged.

