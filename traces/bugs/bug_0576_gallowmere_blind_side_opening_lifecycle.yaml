revision_liveness: >
  Cycle 37 begins from the same compiled Gallowmere predecessor hash
  67fa0f962ea27b5011aece91ef4e47037d3b4bd555bc84e0de4748bbe22f206e
  exercised by the raw surface and preserved on main. The selected maintenance
  target localizes a current pack lifecycle contradiction; no accepted hotspot is
  treated as product authority for it.

symptom: >
  A fully prepared hunter could decline the learned blind-side knife action, make
  an ordinary attack, take the sow's counterattack, and still receive both the
  action and prose for a clean opening "before the first tusk-swing." The sow was
  already wounded and the first exchange had happened, so the optional first-cut
  opportunity and its room/object descriptions had outlived their authored moment.

root_cause: >
  The one-shot USE interaction gated knowledge, `blind_side_struck`, and
  `sow_slain`, but had no predicate for whether ordinary combat had begun. This
  pack enters the hollow at exactly player HP 24, no earlier nonterminal Gallowmere
  beat deals HP damage, and every surviving sow counterattack deals at least 1 HP,
  so player HP <= 23 is a complete pack-local proof that an ordinary exchange has
  occurred. The room and object likewise had variants for a successful special
  strike and sow defeat, but no learned-opening variant for that surviving ordinary
  first exchange, so the earlier `found_kill` copy continued to project.

fix: >
  Keep the prepared blind-side tactic available only before the proven HP boundary
  by adding `none_of: [{ var_lte: { name: hp, value: 23 } }]` to its existing
  conditions. Add first-match room and object variants for the precise living,
  learned, unspent, post-ordinary-attack state: not sow_slain, not
  blind_side_struck, found_kill, and player HP <= 23. Those variants say that the
  first exchange spent the clean opening while retaining ordinary combat and a
  truthful EXAMINE surface. Requiring found_kill keeps the unprepared
  counterfactual on its existing generic room and unreadable-angle object copy.

settled_predicates:
  special_use_added_condition: "none_of: [{ var_lte: { name: hp, value: 23 } }]"
  spent_room_and_object_variant:
    - "not_flag: sow_slain"
    - "not_flag: blind_side_struck"
    - "has_flag: found_kill"
    - "var_lte: { name: hp, value: 23 }"
  hp_boundary_proof: >
    The exact Gallowmere opening state has player HP 24. No prior nonterminal
    beat in this pack deals HP damage, and every surviving sow reply deals at
    least 1 HP in every RNG regime. Therefore HP <= 23 identifies an ordinary
    combat exchange without reading hidden enemy state.
  precedence: >
    The existing sow_slain and blind_side_struck variants remain first. The new
    living survivor variant follows them and precedes found_kill/default copy.
    The existing none_of(found_kill) object variant remains the unprepared truth.

settled_copy:
  precombat_room: >-
    A shallow bowl of black peat and broken reed, ringed by taller hags. It smells of old musk and blood. The Gallowmere sow is here — a great grey animal, heavy across the shoulders, her tusks yellowed and her eyes small and still. The charge angle you read at the kill-site shows you the blind-side opening before the first tusk-swing. The gully is back to the south.
  post_ordinary_attack_room: >-
    The Gallowmere hollow, black peat and broken reed churned by the fight. The wounded sow is still on you; the clean first opening has passed into the close exchange of tusk and knife. The gully is back to the south.
  precombat_object: >-
    The fighting angle Cradoc's ground described: the sow rolls right as she charges, lifting her left tusk late and showing a narrow blind-side opening to a hunter who has read both ground and wind.
  post_ordinary_attack_object: >-
    The first exchange has spent the clean opening. The sow is wounded and still fighting; now her blind side shifts with every tusk-swing instead of holding as a first-cut angle.

