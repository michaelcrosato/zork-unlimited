revision_liveness: >
  Wolf-Winter is byte-identical from the accepted f941d934 build through Cycle
  34's bc0a1ea9 baseline and compiles at exact source hash 95a44131. The accepted
  compile retains pure:b7a98dfb... as the sole evidence behind f75b8f23. Although
  the compiler labels the hotspot location unmapped and infers overworld from the
  cohort metric, raw items 10-13 and the unchanged root prompt localize the
  bounded repair to Cade's one LURE topic label.
symptom: >
  Cade's root action said only that LURE would relocate the pack, keep the herd,
  spend the last feed, break the paling, risk two cattle on a foul, and
  "Inspect." The action was an inquiry that opened a second menu containing the
  actual Commit LURE choice. After the optional lesson deliberately returned to
  the four-plan root, the same generic label was the scan surface for reopening
  that commit menu. Detailed prose explained the boundary, but the root action
  label itself did not, matching the accepted player's skimming friction.
root_cause: >
  bug_0549 repaired the previously missing disclosure inside the LURE detail and
  lesson choice while preserving the shared lesson's intentional return to Cade's
  root. The unchanged root topic prompt still summarized outcome and cost but
  called the transition only "Inspect." Full, compact, and terminal action lists
  all project that prompt, so the most frequently scanned surface did not name the
  separate commit choice that it opens or reopens.
fix: >
  Replace only Cade's root LURE topic prompt. Keep the same outcome and costs in a
  shorter first sentence, then state that this action opens or reopens the separate
  Commit LURE choice. Preserve the inquiry, the direct no-lesson commitment, the
  optional lesson's root return, every reconsideration path, and the exact
  ask_lure -> ask_quick_lesson -> ask_lure -> ask_commit_lure sequence.
settled_copy:
  predecessor: >-
    LURE — Relocate pack beyond the breach; keep the herd. Cost: last feed, broken paling, two cattle risked on a foul. Inspect.
  replacement: >-
    LURE — Keep herd; move pack beyond breach. Costs last feed and broken paling; a foul risks two cattle. Open or reopen the separate Commit LURE choice.
  predecessor_characters: 124
  replacement_characters: 150
