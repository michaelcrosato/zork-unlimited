symptom: >
  After the relevance-first overview, the revealed compact rows begin with raw
  preparation, relief_allocation, and field_team slot ids. Their short purpose
  cells describe a kit, wagon, and cattle-first help, but do not state at the
  beginning that the current inspect or talk action is optional and precedes a
  later commitment. Nine reports independently described Station or linked setup
  density; no report claimed a broken action or support mechanic.

root_cause: >
  Board V6 correctly hides unopened support, retains its authenticated skill
  scent, and returns the three legal actions through a narrow base-bound reveal.
  The remaining purpose literals were authored as terse outcome summaries rather
  than as pre-choice labels, leaving the legend and action tuple to distinguish
  kit and wagon inspection plus June's substantive conversation from later
  support commitment.

fix: >
  Change only SUPPORT_COPY.inlinePurpose for the three open rows. Prefix them
  Optional kit, Optional wagon, and Optional rider. State that kit and wagon are
  comparisons without choosing and that June is asked before choosing. Retain
  one named danger, Albany's last wagon to one crisis, one cattle line, and never
  combat. Keep the relevance-first overview, skill domains, full purposes,
  detail hints, labels, ids, row order, actions, version, and envelopes unchanged.

