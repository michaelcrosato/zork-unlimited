revision_liveness: >
  Cycle 26 changed only Oswin's resolved-stall NPC predicate and preserved every
  ending. Cycle 27's merge and the prior clean Cycle 28 evidence-only baseline
  likewise left Advocate's Case content unchanged. The tracked false-ending
  follow-up therefore remains live at exact predecessor hash c3dd6268. The accepted top hotspot 64f5227e is a
  one-report Wolf-Winter density observation that is partly revision-stale after
  Cycle 25; the current ending contradiction is a smaller, deterministic hard-
  truth defect under the exact on-list Advocate's Case maintenance candidate.
symptom: >
  Dying to Craf always narrated the charter roll as still on Marta's stall table
  and unargued. Both details contradicted reachable state: the player could be
  carrying the roll, could have dropped it in the antechamber, or could already
  have made a formal appeal that the deputy adjourned without ruling. Combat and
  the terminal outcome remained mechanically sound.
root_cause: >
  ending_expelled was one unconditional death ending shared by all Craf-loss
  states, but its closing sentence encoded the untouched direct-combat route's
  item location and argument history. It had no predicates or variants capable
  of distinguishing runtime object placement or appeal_attempted.
fix: >
  Replace only the false charter-location and unargued sentence with a neutral
  legal-status close. Marta's claim remains unresolved at market day's end on
  every reachable Craf death: direct combat leaves it pending, while a failed
  formal appeal is explicitly adjourned without ruling. Preserve the ending id,
  title, death flag, and every item, appeal, combat, score, exit, and route rule.
settled_copy: >-
  Craf gets his weight into you before you reach the doorway, and after that the choice is no longer yours. Oswin arrives in the antechamber with the measured expression of a man who had anticipated this outcome and is not surprised by it. The deputy notes the disturbance in the hearing record. Marta's bolts remain impounded; Oswin's notice stands. Marta's claim remains unresolved when market day ends. *** You have fallen. ***
