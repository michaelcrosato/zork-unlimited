symptom: >
  After the sow died, the old reactive hollow description said only that the moor
  lifted north to the ridge and the gully lay south. Both exits were correctly
  legal, but only visiting the ridge closes the hunt. On the latest accepted raw
  route, the player instead went south, crossed a safe checkpoint, returned to
  Hedrick, and then retraced four rooms north to the ridge. That action sequence
  supports a narrow closure-signposting inference; the report itself rated the run
  clear and playable and did not claim a Gallowmere bug or stuck state.
root_cause: >
  The sow-slain room variant described topology but not the existing locomotion
  completion boundary. The authored win condition has always required visited:
  moor_ridge, while go_south intentionally remains available for backtracking.
  Consequently, the only post-hunt sentence shown before that choice did not tell
  a player that north was closure rather than merely another explorable room.
fix: >
  Change only the sow-slain hollow description to say, "The hunt closes on the
  ridge to the north; the gully is back to the south." Preserve both exits and
  every existing condition and effect. This is a presentation-only clarification:
  south remains a legal detour, while north still performs the sole authored
  locomotion win at the ridge.
