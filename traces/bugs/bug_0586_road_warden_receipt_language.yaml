symptom: >
  The universal Road-Warden confirmation described an imported starting DEF
  floor, and its matching ready-made dispatch projected terse DEF/LURE/HUNT,
  ordinary-hunt, public-wedge, field-team, and relief-allocation terms before the
  player had reached Cade's plan comparison. Exact mechanics were available, but
  the selected receipts led with parser and plan vocabulary instead of the result
  in the story.

root_cause: >
  The authored profile consequence and matching doctrine trigger, preview, and
  consequence were written as compact implementation summaries. Those four
  strings feed the Road-Warden result and ready-dispatch result directly. The
  known-doctrine presentation also authenticates its special player-facing
  summary by exact trigger-category equality, so changing only the manifest
  literal would silently fall back to the generic pairing copy.

fix: >
  Rewrite only the four Road-Warden-specific presentation strings. The profile
  now says Fieldcraft 4 sets Wolf-Winter's defense to 4 instead of 3. The visible
  ready-card benefit names defense and cattle alarm in plain causal clauses before
  their LURE and HUNT aliases and stays within its existing 160-character/32-word guards.
  The selected preview gives the exact Aid-Only clean/fouled first-cast boundary
  and the exact Hayden attempt, frost split, loose rail, yearling, bare-spear,
  skip/bind/Works exclusions in narrative order. Its final sentence translates
  the still-open preparation, wagon, June, and road choices. Mirror the exact
  trigger literal in the known-doctrine presentation guard. The separate exact
  Hayden source detail and Wolf-Winter plan surfaces remain authoritative and
  unchanged.

deterministic_witnesses:
  - "the shipped Road-Warden profile receipt says Fieldcraft 4 sets defense 4 instead of an imported DEF floor"
  - "the ready-card trigger is exactly 132 characters and 21 words; its complete inspected receipt remains at the 32-word cap"
  - "manifest trigger_category and the known-doctrine presentation guard are byte-identical, retaining the matched player-facing commitment"
  - "the accepted Aid-Only/Hayden receipt names the final ordinary +1 cattle-alarm boundary and preserves the fouled-cast exclusion"
  - "the accepted receipt retains attempted public fence brace, frost split, loose rail, yearling death, bare spear north, and skip/bind/Works exclusions"
  - "the accepted receipt contextualizes LURE after its clean-feed consequence and HUNT after hold-the-ground language; old parser phrases are absent"
  - "the pure Road-Warden response is exactly 6,330 UTF-8 bytes, below its 6,400-byte regression budget and the pilot's 6,414 bytes"
  - "the pure ready-dispatch response is exactly 9,195 UTF-8 bytes, below its 9,250-byte regression budget and the pilot's 9,196 bytes"
  - "the ready-made selection still advances from accepted decision 3 to 5 and manual oath/source selection yields the same snapshot"

mechanics_unchanged:
  - "Fieldcraft rank 4, Wolf-Winter starting defense 4 instead of 3, import condition, and direct-start defense 3"
  - "Aid-Only's final ordinary +1 cattle-alarm suppression only after a clean first LURE cast; fouled openings retain it"
  - "Hayden's HUNT-only attempted public wedge, frozen split, unbound rail, yearling death, bare-spear north, and Works/skip/bind exclusions"
  - "profile, doctrine, oath, source, preparation, allocation, ally, road, quest, strategy, action, and outcome ids"
  - "costs, time, funds, skills, checks, effects, promises, relationships, equipment, knowledge, journals, and decision counts"
  - "compact context v49, Station board V6, reveal V1, June modal V1, support breadth/order, and full following support responses"
  - "all roads, four Wolf-Winter strategies, Continue/End, saves, restore, UI, terminal, CLI, and Gallowmere"

