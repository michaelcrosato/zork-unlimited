symptom: >
  The custom duty message named duty in its 2/3 progress header, purpose, and
  "Now choose" recap, while announcing evidence in both the purpose and "Next"
  recap. The following source message likewise named evidence in its 3/3 header and
  purpose, then announced Station in a separate state recap before its authored
  title and comparison header. All of those statements were accurate, but their
  stacked administrative headings made a two-choice handoff feel denser than its
  mechanics. Two consecutive successful fresh-overworld players reported the same
  minor friction.
root_cause: >
  withOpeningDispatchBriefing composed progress, purpose, planningContext, and the
  authored displayMessage as independently descriptive blocks. On the genuine
  custom route, purpose and planningContext repeated the stage and handoff already
  established by the 2/3 or 3/3 progress header. The three-stage route, option set,
  and transition logic were already correct.
fix: >
  Keep the genuine 2/3 duty and 3/3 evidence progress headers, but reduce each
  derived purpose to the immediate choice and fold its handoff into one short
  sentence. Leave the role and matched-shortcut messages byte-identical. The exact
  settled custom messages are pinned below; only presentation copy changes.
settled_copy:
  duty: >
    The Wolf-Winter Civic docket · 2/3 — duty. Purpose: choose duty; every field
    plan stays open. Evidence follows. Set the Wolf-Winter Relief Terms. Compare
    promise, exact cost, and what each duty gives up. Field checks surface with
    their action before resolution.
  source: >
    The Wolf-Winter Civic docket · 3/3 — evidence. Purpose: choose evidence; every
    field plan stays open. Hayden's Station launch board follows. Certify the
    Wolf-Winter Source Packet. Other accounts close. Compare field priority, exact
    cost, and tradeoff. Field checks surface with their action before resolution.
