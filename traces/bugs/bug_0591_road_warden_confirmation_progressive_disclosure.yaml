symptom: >
  The selected Road-Warden Aid Route confirmation repeated the complete Aid-Only
  and Hayden branch manual after the dispatch was already chosen. It introduced
  LURE and HUNT aliases plus public-brace, frost-split, loose-rail, yearling,
  bare-spear, and Works exclusions before Cade's existing plan and steading
  surfaces made those conditions actionable.

root_cause: >
  bug_0586 translated implementation vocabulary but deliberately retained every
  exact branch term in the selected doctrine preview and explicitly made no
  progressive-disclosure change. The doctrine trigger already supplies exact
  read-only option detail, and Wolf-Winter already supplies the full Hayden
  branch before the paling commitment, so the selected receipt duplicated a
  future decision manual instead of confirming the chosen dispatch.

fix: >
  Rewrite only opening_registration.doctrines[id=albany:doctrine_road_warden_aid_route].preview.
  Keep the defense-4 result, state the Aid-Only clean/foul final ordinary
  cattle-alarm boundary without a plan alias, and say that Hayden matters only
  when holding Cade's ground and that exact brace terms appear at the steading
  before commitment. Leave trigger_category and every other scalar byte-identical.

