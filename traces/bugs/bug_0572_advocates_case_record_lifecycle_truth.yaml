revision_liveness: >
  The Cycle 32 baseline carries exact Advocate's Case source hash 36350b77. The
  accepted bd527711 bundle is already consumed by Cycle 31 and concerns a distinct
  Wolf-Winter action-handoff seam. Cycle 32's deterministic maintenance audit
  reproduces this contradiction directly in the loaded current pack; no earlier
  certified-extract, absent-Oswin, or expelled-ending repair changed case_record's
  static description or READ text.
symptom: >
  The same case slate presented mutually exclusive legal states at once. After a
  successful primary or recovered appeal, the room said the filing was discharged
  while examining or reading the slate said it was still pending and unargued.
  After a failed appeal, the deputy had heard and adjourned the presentation, but
  the object still said no argument had been made. The untouched pre-presentation
  and combat-only states before any legal presentation were the routes for which
  the old pending object copy remained accurate.
root_cause: >
  case_record exposed only one unconditional object description and one
  unconditional read_text even though appeal_attempted and oswin_overruled already
  encode three live presentation states: untouched, attempted and adjourned, and
  discharged. The room used those flags reactively, but its visible object did not.
fix: >
  Keep the untouched base description. Add a first-priority oswin_overruled object
  variant that names the deputy's discharge and struck-through pending field, then
  an appeal_attempted-without-oswin_overruled variant that names the adjournment and
  corrected-sequence recovery. Reframe READ as the original filed lines plus a
  neutral statement that the current disposition, if any, is recorded on the same
  slate. Preserve every action, interaction, check, effect, flag writer, recovery,
  room, exit, score, combat path, and ending.
settled_copy:
  untouched: >-
    The case slate on the clerk's table: 'Holm, Marta — impound notice filed by Warden Oswin under Guild Schedule, Article Fourteen. Goods held. Hearing: this session.' The alderman's deputy is in the hall; the case is waiting for a party to make the argument. The slate and its stylus are there to be used.
  failed_appeal: >-
    The case slate on the clerk's table. Marta's original impound filing remains pending after the deputy adjourned the first presentation without ruling. The slate and stylus remain ready for a corrected legal sequence.
  resolved_appeal: >-
    The case slate on the clerk's table, the original impound filing still legible beneath the deputy's disposition: 'discharged, charter exemption confirmed.' The word 'pending' is struck through. The slate and stylus remain with the hearing record.
  read: >-
    The filed lines read: 'Holm, Marta — impound. Warden: Oswin (Weavers' Guild). Article: Schedule Fourteen, unlicensed sale. Goods: twelve bolts broadcloth, held. Claimant response: pending.' That is the original guild claim and response field; the deputy's current disposition, if any, is recorded on the same slate.
