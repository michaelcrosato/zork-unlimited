symptom: >
  The exact pure Station reveal changed one durable receipt, its snapshot hash,
  and station_dispatch_board, but returned the entire compact context and journey
  again. The revealed board occupied only 788–802 bytes inside 5,314–5,418-byte
  responses, amplifying a bounded disclosure with unrelated retained state.

root_cause: >
  The pure server forwarded the canonical manager's full context response for
  every get_overworld_session_context call. It had no typed, versioned response
  member for a single-field context delta and did not bind such a delta to the
  player's immediately retained snapshot. Narrowing after mutation without a
  base hash would have made an ambiguous partial context and unsafe splicing.

fix: >
  Reveal-only pure calls now require the latest if_snapshot_hash. Before the
  canonical handler runs, the server captures the current manager snapshot hash
  and rejects a missing or stale retained base without mutation. After the
  canonical reveal and evidence hooks succeed, an exact six-slot board V6 with
  null overview becomes V1
  station_dispatch_reveal:{version,base_snapshot_hash,station_dispatch_board},
  beside ok, the new outer snapshot_hash, and the canonical pure
  overworld_session_id. It deliberately omits journey and context. The player
  retains the prior journey/context/quests/quest_starts, replaces only the board,
  and adopts the new hash only when the base matches. Unexpected post-mutation
  projection falls back to the complete canonical success rather than converting
  a successful mutation into an error. Requests combining reveal with either
  explicit detail expansion also keep the complete canonical response and their
  legacy no-hash/stale-if behavior.

deterministic_witnesses:
  - "missing or stale reveal-only if_snapshot_hash rejects before mutation; the captured manager hash, never caller text, becomes base_snapshot_hash"
  - "supported reveal-only V6/null-overview returns exactly ok, overworld_session_id, outer snapshot_hash, and station_dispatch_reveal V1; no session_id, journey, context, unchanged, or legend_delta"
  - "the current Station fixture is exactly 1,023 UTF-8 bytes under a 1,100-byte regression budget; the ten authenticated pilot counterfactual boards are at most 1,034 bytes"
  - "first reveal binds base to the retained hidden-board hash and returns a different new hash; exact repeat binds to the then-current hash and may return the same new hash"
  - "explicit false expansion flags remain V1-eligible; either true flag or both true preserve full context, journey, requested fields, and legacy stale-if/no-if compatibility"
  - "ordinary no-reveal pure reads, full-mode tools/list bytes, canonical manager responses, export/restore, and non-pure responses retain their established shape"
  - "a dedicated pure server witness retains pre-reveal journey/context/quests/quest_starts, replaces only the board, then starts Wolf-Winter with the returned outer hash without a context refresh"
  - "the post-launch parent read has no Station board, preserving the established reveal-receipt clear lifecycle"
  - "board V6 stays length six with overview null after reveal, and its purposes/actions match the canonical full refresh byte-for-byte"
  - "prompt 16,027 + pure catalogue 16,773 + fresh context 2,042 = 34,842 bytes, below sealed V6's 34,868; first Station aggregate is 38,469 versus 38,495"
  - "pure get-context catalogue entry is digest-pinned; full catalogue remains exactly 40,374 bytes with its old tool and input descriptions"
  - "the dual-mode get-context description is selected outside the measured registration block, keeping overworld ToolSearch schema source at 9,192 characters under its unchanged 9,250 ceiling without changing either emitted catalogue"

mechanics_unchanged:
  - "compact context v49 and Station board V6 version, tuple, reveal id, durable canonical receipt, authentication, persistence, and clear conditions"
  - "quest, story, option, character, support, action, road, and approach ids; support purposes/actions and all eight overview subsets"
  - "support order, availability, costs, minutes, money, checks, DCs, effects, RNG, outcomes, selected terms, and accepted-decision counts"
  - "four Wolf-Winter strategies, legal quest starts, journey checkpoints, Continue/End choices, saves, full UI, terminal, and CLI presentation"
  - "canonical manager, full/non-pure get-context, refresh, export/restore, and explicit detail expansion response behavior"

nonclaims:
  - "The valid pilot failed only clarity and enjoyment gates; it diagnoses transport density but does not prove the correction improves either rating, continuation, completion speed, strategy mix, or certification."
  - "The raw size/repetition relationship is structural amplification correlated with density reports, not causal proof of the failed ratings."
  - "authority_certified is false; official_npm_shim Codex 0.146.0, Terra identity, and retained per-run hashes authenticate the recorded cohort without turning a ten-player pilot into a 100-player certification fleet."
  - "The reconstructed 1,020–1,034-byte envelopes use the actual retained 24-character base hashes and exact pilot boards, but are not responses the sealed V6 build returned; the 1,100-byte number is a regression budget, not an exhaustively proven global runtime cap."
  - "V6's lower preparation-inspection counts support preserving its information scent, not a causal claim that its copy improved ratings or that every reveal was unnecessary."
  - "June was selected in 8/10 pilot runs, but her clean/stabilized no-benefit boundary and mechanics are unchanged; selection frequency is not a reason to alter her."
  - "No Gallowmere content, behavior, checkpoint, or conclusion is in scope or claimed, even where a rollout continued there."
  - "No Continue/End wording, availability, counting, or other retention-metric mechanism changes; this is not metric gaming."
  - "This is a pure compact-MCP transport correction, not a human UI redesign or parity claim; no browser screenshot or human usability result is claimed."
  - "This AI pilot is neither human market validation nor authority certification."

