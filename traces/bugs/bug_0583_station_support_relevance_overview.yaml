    finding_boundary: >
      All ten authenticated raw direct-MCP rollouts called the exact Station
      optional-support reveal. Nine then inspected the field-kit comparison.
      Six of those nine were Road-Warden players whose only background skill was
      Fieldcraft, while the three authored kit checks name Repair, Streetwise,
      and Mediation. This is repeated unnecessary comparison work and weak
      information scent; it is not evidence that a kit could never help or that
      the underlying support mechanics failed.

symptom: >
  Station board V5 replaced three first-level support rows with the generic label
  "Review optional support (3 choices)." A fresh player could not know whether
  the hidden support was a kit, wagon, or rider, nor that kit fit was governed by
  Repair, Streetwise, or Mediation, without first opening the reveal and then
  opening the preparation comparison.

root_cause: >
  The durable reveal boundary carried only a count, and the pure prompt told the
  player to review one support row after presenting the reveal as the Station
  workflow. Neither surface made the review conditional on relevance. The
  compacter also checked only the remaining-support count, which was insufficient
  once the overview's category names depended on the exact remaining slot set.

fix: >
  Compact v49 emits Station board V6 in the same six slots as
  [6, quest_id, dispatch_status, dispatch, rows, overview|null]. Before review,
  overview keeps the exact existing reveal id but names only the still-open
  categories. The all-open label says kits use Repair, Streetwise, or Mediation,
  plus Albany's last relief wagon or a cattle-first second rider, and tells the
  player to review only if one interests them. Closed categories disappear from
  every subset label. After review, overview is null and the existing V5
  five-field rows, purposes, and actions return unchanged. The pure prompt makes
  review conditional and removes V2/V3 history while retaining a version-neutral
  fail-closed fallback for explicitly returned support detail. Remaining slot
  identity and order must now match the dispatch receipt exactly.

deterministic_witnesses:
  - "all eight kit/wagon/rider open-slot subsets pin an exact overview label or null, truthful remaining count, canonical order, and omitted open rows"
  - "the three advertised kit domains are bound directly to the authored preparation check_disclosure skill labels: Repair, Streetwise, and Mediation"
  - "before review the board contains no preparation, relief-allocation, or June support action handle; ordinary compact contacts, including June, remain unchanged"
  - "after review every subset restores the frozen V5 five-field row bytes: 395, 451, 456, 512, 478, 534, 539, or 595 bytes by open-slot mask"
  - "the exact reveal id and persisted receipt lifecycle remain unchanged across repeat, refresh, export/restore, area return, support seal, launch, End, and forged receipt rejection"
  - "a same-count reordered or duplicated remaining-support receipt now rejects rather than naming the wrong category"
  - "the pure prompt says review only when an overview category interests the player, does not enumerate V2/V3 history, and retains a version-neutral exact-action fallback"
  - "the normalized pure tools/list catalogue remains 16,790 bytes and its changed get-context entry is hash-pinned"
  - "UTF-8 accounting is exact: prompt 16,036; fresh context 2,042; board 585; first-Station context 4,928; Station legend 741"
  - "prompt + catalogue + fresh context is 34,868 versus V5's 35,207 (-339); first Station plus its delivered legend is 38,495 versus V5's 38,619 (-124)"

mechanics_unchanged:
  - "existing quest, story, option, character, support, action, road, approach, and reveal ids"
  - "the disclosure receipt schema, persistence, authentication, clear conditions, and accepted-decision behavior"
  - "support order, availability, costs, minutes, money, checks, DCs, gameplay effects, RNG, outcomes, and selected terms"
  - "canonical route detail, four Wolf-Winter strategies, Continue/End choices, saves, full UI, and CLI presentation"
  - "legacy include_station_dispatch_support request and response compatibility"

nonclaims:
  - "The failed pilot identifies a correction target; it is not evidence that V6 improves clarity, enjoyment, continuation, or any certification metric."
  - "The standalone board plus legend grows from V5's 1,111 bytes to 1,326; the aggregate reduction comes from removing fresh-player legacy prompt history."
  - "Six Road-Warden comparisons show avoidable review work, not that a mismatched kit has zero possible utility or that players chose irrationally."
  - "The board hides support action/story/contact handles before review; it does not remove June from the ordinary contacts list or claim whole-response id suppression."
  - "Report hashes authenticate report bytes; the 10/10 reveal and 9/10 preparation counts come from the retained authenticated raw rollout call records."
  - "No Gallowmere content, behavior, checkpoint, or conclusion is in scope or claimed."
  - "This correction is compact-MCP-only; it makes no human UI redesign or parity claim and changes no terminal or browser presentation."
  - "This AI pilot is neither authority certification nor human market validation."

