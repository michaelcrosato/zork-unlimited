revision_liveness: >
  The false journal is byte-identical in Cycle 21 item 27 and Cycle 22 item 26.
  Cycle 22 already contains bug_0562's corrected primary north block, so its
  independent exact-build witness proves that the journal contradiction survived
  that later copy revision and remains live on the Cycle 23 baseline.
symptom: >
  Defeating the yearling during committed LURE appended a journal claiming that
  the byre ran on north while the same observation truthfully kept north blocked
  and required the player to return south, west, and up for the loft cast. The
  sentence is correct for ordinary/HUNT, where yearling_down opens north, but
  false at LURE's bounded hybrid defeat boundary. This is an S1 state-to-copy
  contradiction, not an invalid exit or dead end.
root_cause: >
  yearling_wolf.on_defeat is shared by ordinary/HUNT combat and the bounded LURE
  hybrid. Its journal combined route-neutral defeat truth with an unconditional
  direction sentence even though north's existing condition also requires a
  committed LURE to have flank_redirected. A shared effect cannot truthfully own
  that route-conditioned next step.
fix: >
  Remove only "The byre runs on north." from the shared on_defeat journal. Keep
  the exact 92-character, 20-word route-neutral defeat sentence and leave the
  existing live room, exit, blocked-exit, and action projections responsible for
  direction. Preserve the remaining on_defeat effects and their order.
settled_copy: >
  You take the yearling on its rush as it commits, and it goes down in the snow
  of the breach.
