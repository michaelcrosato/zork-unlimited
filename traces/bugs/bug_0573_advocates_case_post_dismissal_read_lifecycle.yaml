current_reproduction:
  predecessor_source_hash: d8b85620ac7ee8b4672f25e8b5a1552478b3d9d6add0b4894df32bb09dd19dff
  boundary: >
    A reachable primary presentation needs only the held precedent packet and a
    successful rhetoric roll. The player can therefore take the certified register
    extract and precedent packet without reading either, leave the charter untouched,
    force a legal success, and return south with appeal_attempted and oswin_overruled
    set, weavers_appeal at case_dismissed, score 10, and rhetoric 3. Before this edit,
    read_charter_roll, read_town_register, and read_prior_convictions were all still
    legal. Taking them after the ruling added all three read flags, raised score to 35
    and rhetoric to 9, and rewrote the resolved quest stage successively to
    charter_read, register_confirmed, and finally precedents_found while replaying
    pre-hearing urgency.
revision_liveness: >
  The Cycle 33 baseline carries exact Advocate's Case source hash d8b85620. Its
  previous case-record repair did not change any evidence READ predicate or effect.
  The accepted bd527711 recommendation is already consumed and concerns a distinct
  Wolf-Winter handoff. Cycle 33's on-list maintenance audit reproduces this current
  pack contradiction directly; neither the assessment nor accepted feedback is
  treated as causal gameplay evidence.
symptom: >
  A legally dismissed appeal exposed three optional evidence-progress actions whose
  existing effects describe preparation for a hearing that has already ended. Those
  actions could add 25 points and 6 rhetoric after the outcome, append stale
  preparation journal entries, and overwrite case_dismissed with an earlier evidence
  stage. Failed appeals and combat-only passage are different states: Oswin has not
  been legally overruled there, so unread evidence remains useful for a later legal
  presentation and must stay readable.
root_cause: >
  Each evidence object's one-shot READ predicate retired only on its own read flag;
  none also retired on oswin_overruled. The generic READ resolver correctly ANDs the
  authored interaction conditions, applies the object's read_text and interaction
  effects, and the generic set_quest_stage effect correctly assigns the authored
  stage. The engine has no pack-specific basis for inferring that these three named
  preparation stages precede case_dismissed, so this is an authored lifecycle gate.
fix: >
  Add not_flag oswin_overruled to the existing one-shot READ conditions for
  charter_roll, town_register, and prior_convictions. Preserve every read_text and
  effect for unresolved routes. After legal dismissal the three READ actions retire;
  after a failed appeal or Craf's combat defeat they remain available because neither
  state sets oswin_overruled.
deterministic_witnesses:
  - "an all-unread primary-success route sets appeal_attempted and oswin_overruled, leaves charter_read/register_read/priors_read absent, and reaches the stall at case_dismissed, score 10, rhetoric 3, and one accepted-appeal journal entry"
  - "after that legal dismissal, full and compact projections omit read_charter_roll, read_town_register, and read_prior_convictions while retaining all three EXAMINE actions; projection does not mutate state"
  - "direct structured READ attempts against each evidence object after dismissal reject with the ordinary unavailable-action event and preserve the identical state object, stage, variables, and journal"
  - "the identical all-unread route with a failed rhetoric roll retains all three READ actions at the stall because appeal_attempted is set without oswin_overruled"
  - "an ordinary two-hit Craf defeat also retains all three READ actions at the stall, craf_defeated and craf_down remain intact, and oswin_overruled remains absent"
  - "the exact Advocate's Case source hash advances directly from d8b85620ac7ee8b4672f25e8b5a1552478b3d9d6add0b4894df32bb09dd19dff to c9c92f95afba12b968d4d5e1aa9701749e0048140bc486b090233584f6e66396"
