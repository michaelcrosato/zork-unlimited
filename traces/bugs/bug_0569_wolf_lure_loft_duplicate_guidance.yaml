revision_liveness: >
  The accepted 19-41 raw observation, the later exact-build Cycle 28 observation,
  and Cycle 29 baseline source all retain the pending room suffix and east-lock
  prefix byte-for-byte apart from sentence-initial capitalization. Cycle 28's
  intervening Advocate's Case-only revision did not touch Wolf-Winter. The later
  7beba188 witness also rules out attributing the duplicate solely to an older
  accepted build, while the current regression matrix proves the same loaded-pack
  projection across every clean and recovery LURE route.
symptom: >
  Before the second LURE cast, one observation told the player twice that the
  hauled ladder leaves no retreat: once in the room description and immediately
  again in the blocked-east explanation. The second sentence was the actionable
  one because it also said to complete the committed feed cast. This was a small
  first-contact density seam, not a trap: the legal cast was visible, both source
  players advanced, and east opened afterward.
root_cause: >
  The strategy_lure_committed pending room variant restated the one-way-route fact
  already owned by the same room's locked east exit. Both fields project together
  in full observations and the compact blind-player surface, so individually true
  copy became adjacent duplicate guidance in the actual player view.
fix: >
  Remove only the trailing hauled-ladder/no-retreat clause from the pending LURE
  room variant. Keep its instruction to cast through the hatch before dropping
  east, and retain the exact blocked-east explanation as the single actionable
  warning. Do not change the variant predicates, exit conditions, destination,
  cast action, one-way geometry, post-cast room text, object text, or any LURE
  state transition.
settled_copy:
  pending_room: >-
    Cade's local feed-plan instruction takes you across the feed-hauler's crawlboard with his sack. Below, the flank-wolf circles from the low hatch. Cast the second measure through it before dropping east.
  retained_east_lock: >-
    The hauled ladder leaves no retreat. Complete the committed second feed cast through the low hatch before dropping east.
  retained_postcast_room: >-
    The second feed measure is spent beyond the low hatch. The flank-wolf followed it alive into the high wood, leaving the byre threshold empty east. The hauled ladder still leaves no retreat.
