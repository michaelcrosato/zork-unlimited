revision_liveness: >
  Accepted Cycle 22 item 21 directly proves the stale pre-cast held-feed fallback,
  including the false invitation to compare the four plans after LURE commitment.
  That variant gap survives on the merged Cycle 24 baseline. Loaded-pack
  counterfactuals extend the same live selector boundary to a detour south
  immediately after the foul and a late yard backtrack after the loft cast. Those
  two states could likewise miss every specialized LURE leaf and fall to base or
  generic yard prose that omitted the active one-sack route. The accepted raw item
  is direct causal evidence for pre-cast; only the post-failure and late-backtrack
  extensions are deterministic inference.
symptom: >
  Re-entering the byre yard while committed to LURE and holding the winter-feed
  sack did not always preserve the commitment in room copy. At the pre-cast,
  post-failure, and late-backtrack boundaries, the legal route still worked, but
  the fallback could present opening-plan prose or an unqualified wolf tally
  instead of naming the closed strategies and the active northward one-sack line.
  This is S1 state-to-copy guidance friction, not a route lock or dead end.
root_cause: >
  The yard had precise leaves for feed pickup before the sack was taken, the
  relief-protocol interruption, the settled first beat, and completed outcomes,
  but no bounded fallback for the shared state strategy_lure_committed plus a held
  winter_feed_sack. Specialized leaves correctly won where applicable; all other
  held-feed LURE returns leaked into general yard variants authored for open play.
fix: >
  Add one ordered yard variant for strategy_lure_committed plus a held
  winter_feed_sack. State that HUNT, DRIVE, and FORTIFY are closed and direct the
  player north to the one-sack feed line or its current recovery step. Preserve
  the higher-priority pickup, protocol, first-beat, and resolved leaves and change
  no exit, action, check, resource, failure, retry, or outcome rule.
settled_copy: >
  LURE is committed; HUNT, DRIVE, and FORTIFY are closed. Go north to continue
  the one-sack feed line or its current recovery step.
