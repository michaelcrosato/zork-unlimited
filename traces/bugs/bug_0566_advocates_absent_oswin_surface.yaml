revision_liveness: >
  The July Spark witness predates the certified-extract copy revision, so it is
  causal evidence for the defect rather than proof of current bytes. The current
  deterministic predecessor reproduces the same stable oswin_overruled boundary
  at source hash 284d5e2e, proving the finding remained live when Cycle 26 selected
  the routine Advocates review.
symptom: >
  After either legal route overruled Oswin, the market-stall room truthfully said
  he had left but full and compact projections still advertised him as present and
  offered TALK. Opening that action merely had the absent man explain that he was
  absent, then exposed a leave topic. The surface contradicted itself after the
  consequential legal success even though quest progression was sound.
root_cause: >
  The resolved room variant and dialogue fallback both knew about
  oswin_overruled, but the market-stall NPC definition was unconditional. Generic
  RPG NPC and TALK enumeration therefore retained Oswin whenever the player was in
  his authored room, regardless of the state that had already removed him in the
  fiction.
fix: >
  Add the existing not_flag: oswin_overruled predicate to Oswin's NPC definition.
  Legal success now removes the NPC and its generated TALK action from both full
  and compact stall projections. Preserve Oswin before resolution, including
  after a failed appeal and after combat-only defeat of Craf.
