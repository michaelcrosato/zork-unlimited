  - "the first-goal pending Continue/End screen and the following dawn-dispatch story screen render the same state-neutral priority guidance"
  - "while either choice is shown, leads stays empty and deferredLeadCount stays exact; no optional title, district, access state, id, consequence, reward, or outcome leaks"
  - "after the dawn dispatch resolves, storyChoice and deferredLeadCount disappear, the Gallowmere goal becomes active, and the same four structured optional leads return with the existing active-play guidance"
  - "the 370130d9 raw item_23 -> item_24 -> item_25 sequence independently proves the pending -> story -> active restoration boundary that the deterministic tests preserve"
  - "full journey, compact MCP, JourneyChoiceScreen, JourneyStoryChoiceScreen, and active JourneyStatus presentations remain consistent"
  - "cloning and presentation reads remain deep, frozen, and state-neutral; snapshots, snapshot hashes, and accepted-decision counts do not change"
  - "the existing compact opportunity tuple shape and compact-view schema version remain unchanged because only the guidance value changes"
