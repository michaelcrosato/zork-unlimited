symptom: >
  The accepted player continued after Wolf-Winter, encountered the required dawn
  dispatch, and then received the detailed optional leads only after resolving that
  second choice. At the intervening story-choice surface, the old aftercare line said
  only to "finish this journey decision first" and that details would return "if play
  continues." It did not name the shown option as the immediate priority or explain
  that a second authored choice can follow Continue before ordinary play resumes.
  The sequence worked and the player completed Gallowmere, but the generic framing
  made the optional lead summary read like another layer of scaffolding.
root_cause: >
  deferJourneyOpportunityDetails correctly removes lead details whenever a pending
  journey choice or story choice pauses ordinary actions, but its single shared copy
  described both boundaries as "this journey decision." That abstract label omitted
  the only universally truthful instruction: choose the option currently shown, then
  finish any immediately following choice. Counts, detail deferral, restoration, and
  every journey guard were already correct.
fix: >
  Change only the derived deferred-guidance string to: "Choose the shown journey
  option first. N optional aftermath lead(s) remain; if another choice follows,
  finish it too. District details return when play resumes." Preserve singular/plural
  grammar and every existing projection field. The wording prioritizes the visible
  gate, covers both Continue-to-story and direct story-choice boundaries, and says
  when the optional detail returns without exposing it early.
deterministic_witnesses:
