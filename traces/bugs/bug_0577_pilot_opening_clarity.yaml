symptom: >
  Before Wolf-Winter's first field action, the Albany registration and matched quick setup
  repeated role labels, commitments, plan-legality, and setup boundaries across message,
  option, and highlight rows. The four-plan read-only compass was complete but syntactically
  uneven. In the quest, ask_prepare_hunt was visibly labeled PREPARE even though its authored
  end:true topic has no effects, and one firm-ground room variant told a no-June player to ask
  June.

root_cause: >
  Presentation projections copied facts already carried by the option label or commitment into
  additional highlights and repeated shared facts on every matched card. The plan compass grew
  by accretion instead of a parallel clause grammar. Wolf-Winter's no-op dialogue exit inherited
  preparation language despite being only a conversation closure, while the leading firm-ground
  room copy used a conditional June instruction without checking or projecting June's absence.

fix: >
  Keep the Albany choices and authored consequences unchanged while deduplicating only their
  projections: each registration card keeps the shared permanence fact visible once without
  repeating the role title, plus one obligation and one unique Wolf-Winter fit. Each matched
  setup names its exact duty/evidence pair once, exposes only unique support in commitment, and
  states only the closed alternatives as tradeoff. The read-only compass gives each plan
  parallel Outcome, Cost or risk, and Later clauses and retains the explicit neutral/no-state
  boundary. Rename ask_prepare_hunt's visible prompt to LEAVE REVIEW and state its no-state-change
  truth. Remove the unguarded June instruction from the firm-ground room; actual June-present
  observations still name June and offer TALK.

