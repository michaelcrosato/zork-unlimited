symptom: >
  The model-visible inspect_overworld_session_story catalogue described the
  comparison and detail results but did not locally state the complete call binding:
  the tool still needs the exact current parent overworld_session_id under the input
  key session_id, while visible revealOption/reviewOption arguments contribute only
  story-specific fields. Four retained players first submitted an empty object, and
  three independently retried with a story id but no parent handle. Each failure was
  recoverable and read-only, but it spent a call and interrupted the opening choice.
root_cause: >
  Pure play deliberately leaves session_id schema-optional so a missing handle reaches
  the authoritative recovery envelope. The existing tool description explained story
  isolation, reveal persistence, and compact/full results, but it did not join the
  parent-handle rule, the exact visible story id, and the emitted reveal/review operand
  objects into one tool-local invocation recipe. Global player instructions did not
  prevent repeated incomplete calls; the refined tools/list schema publishes no
  field-level guidance, leaving this tool-local description as the binding recipe
  before the first call.
fix: >
  Replace only inspect_overworld_session_story's model-visible description. It now says
  to pass session_id as the exact current parent overworld_session_id, pass the exact
  visible story_choice_id, merge visible revealOption/reviewOption arguments without
  treating them as a replacement for session_id, and keep option_id/reveal_id mutually
  exclusive. Pin the exact tools/list catalogue projection to its reviewed digest and
  add live pure-server counterexamples for missing-parent recovery, exact-parent
  success, mutual-exclusion rejection, and state nonmutation.
settled_description: >-
  Inspect journey.storyChoice, Station ['inspect', story_choice_id], or legacy departure_interactions by calling with session_id set to the exact current parent overworld_session_id and story_choice_id set to that exact visible id. Merge visible revealOption/reviewOption arguments into that call; they do not replace session_id, and option_id/reveal_id are mutually exclusive. Compact returns comparison + an unchanged journey receipt without board/world repetition. option_id returns one visible option detail; reveal_id expands and records a durable session receipt that survives export/restore. Detail may include selected terms. compact_result:false returns full story and preserves reveals.
catalog_contract:
  projection: "canonical JSON of {name, description, input_schema} from the actual tools/list entry"
