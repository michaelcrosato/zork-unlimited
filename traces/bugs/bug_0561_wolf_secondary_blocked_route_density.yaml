symptom: >
  Once DRIVE or FORTIFY hard-committed, the yard, paling, threshold, and byre-mouth
  correctly closed their secondary retreat/preparation exits. Their five static
  messages nevertheless restated a shared LURE/DRIVE/FORTIFY rule union at every
  beat, even though each room description and legal action already named the
  immediate forward task. Three consecutive successful FORTIFY players traversed
  those same rows; the strongest report paused to rule out a progression trap.
  This is repeated S1 copy density, not a dead end.
root_cause: >
  The five locked_msg fields are shared by completed LURE, committed DRIVE, and
  committed FORTIFY states. Their old prose tried to preserve the entire
  cross-strategy history and no-switch rule on every secondary direction instead
  of first naming the closed direction and then indexing the visible current beat.
  The exit conditions, current-room variants, primary north locks, and legal-action
  projection already held the exact state truth.
fix: >
  Replace only the five secondary south/west locked messages with short,
  direction-first route indexes. Keep every condition and destination unchanged,
  leave bug_0558's primary north guidance byte-identical, and preserve all actions,
  checks, resources, flags, consequences, and endings.
settled_copy:
  byre_yard_south: >
    South is closed. LURE complete: go north for the cattle count. DRIVE/FORTIFY:
    take any shown gear, then go north.
  byre_yard_west: >
    West is closed. LURE complete: go north for the cattle count. DRIVE/FORTIFY:
    take any shown gear, then go north.
  paling_south: >
    South is closed. LURE complete: go north for the cattle count. DRIVE/FORTIFY:
    follow shown paling steps until north opens.
  threshold_south: >
    South is closed. LURE complete: go north for the cattle count. DRIVE/FORTIFY:
    finish any shown threshold step, then go north.
  byre_mouth_south: >
    South is closed. LURE complete: go north for the cattle count. DRIVE: resolve
    the crisis. FORTIFY: hold the dawn watch.
