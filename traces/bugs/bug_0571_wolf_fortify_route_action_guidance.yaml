revision_liveness: >
  The accepted de8a2258 source and Cycle 31's deb9d007 baseline expose the same
  byre_mouth north locked_msg byte-for-byte and the same 09bd7660 Wolf-Winter
  source hash. The accepted compile preserves that source report as its sole
  bd527711 evidence row. The compiler labels the location unmapped and infers
  target overworld only from the cohort metric; the raw item boundary, current
  source, and route-state regressions localize the bounded repair to this one
  Wolf-Winter exit string.
symptom: >
  At the final byre room, the locked north exit repeated a 117-character menu of
  possible route outcomes beside the route-specific action already shown. On
  the accepted failed-seal FORTIFY path, use_fortify_dawn_watch was legal, but
  the adjacent lock still said "Before passing" and listed defeating old grey,
  Cade's scent or drive line, and holding the seals. FORTIFY's shown dawn watch
  finishes directly; DRIVE first shows crisis-priority choices and then the
  evacuation that finishes directly; LURE and ordinary HUNT can open north.
  The copy therefore added cross-route attention cost and blurred the
  direct-finish versus open-north distinction without hiding any action.
root_cause: >
  One static byre_mouth locked_msg projects across HUNT, LURE, DRIVE, both
  FORTIFY stances, and their recovery states. It tried to restate every route's
  terminal requirement even though the room's legal-action projection already
  owns the exact next step. That duplicated staged guidance and framed all
  routes as preparation for a northward passage, which is false for FORTIFY's
  direct dawn watch and DRIVE's priority-to-evacuation resolution.
fix: >
  Replace only the final north exit's predecessor sentence with the exact
  98-character route-action handoff. It tells the player to follow the actions
  shown in the current state and truthfully distinguishes routes that finish
  without north from routes whose actions open it. Keep the exit destination and
  leader_down/leader_redirected conditions, every route action and predicate,
  unavailable-action reason, room-variant predicates, projection mechanism,
  check, item, state transition, score, ending, and route order unchanged.
settled_copy:
  predecessor: >-
    Before passing, defeat old grey, complete Cade's scent or drive line, or hold the joined fortification seals to dawn.
  replacement: >-
    Follow the route actions shown here. The route either finishes directly or opens north when ready.
  replacement_characters: 98
