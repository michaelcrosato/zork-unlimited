# The Breaking Weir — a Stage 4 (Hero's-Quest) pack (spec §13, §14 gate).
#
# The game's FIFTH RPG pack — and the FIRST COMBATLESS one: `enemies: []`, no ATTACK,
# no hp loss in a fight. Where cold_forge / sunken_barrow / dawn_beacon / wolf_winter
# all turn on turn-based combat, this pack's whole spine is a CHAIN OF SKILL CHECKS over
# the same deterministic RPG core — three distinct skills (craft / nerve / might), each a
# seeded d20 + skill vs a difficulty, gating a flag that opens the next stretch of the
# weir. It is the untried RPG axis the loop has been pointing at (the non-combat
# skill-check-chain pack): it exercises the RPG validator's skill-check passability proof
# (SKILL_CHECK_IMPOSSIBLE), the exhaustive ending-reachability / liveness / score-economy
# solvers, and the §17 prep-vs-gamble identity — all with ZERO enemies.
#
# The fiction earns the mechanic the same honesty the combat packs earn theirs (bug_0027/
# 0029/0069/0114): not blind luck but skill and preparation decide the night. A week of
# storm-rain has the river in spate, and the great weir above the valley is choking — the
# head-rack jammed with drift, the relief-race shut — and if the water tops the weir before
# dawn the whole valley below drowns in its sleep. The old weir-keeper, Pell, has gone down
# with a broken leg and cannot work the weir himself this night; but he has held this weir
# forty winters and there is nothing about it he does not know. Heed him on the one place
# that KILLS men — the storm-walk out across the spillway, where a wrong step puts you in
# the race (his counsel steadies your nerve, +5) — and the crossing is safe; go onto that
# walk cold and unsteadied and the flood may yet have you (the death ending stays reachable
# for the rash, telegraphed in the room prose and by Pell and the flood-book, never a
# gotcha). The two MECHANICAL obstacles either side of it — freeing the jammed head-rack
# (craft) and heaving the seized relief-race winch (might) — are not killers but honest
# work: they yield to the knack and a stubborn back, retryable until they give (the
# sunken_barrow slab pattern), so a player can never be hard-locked out of the valley.
# Opening the race exposes the keeper's final course-frame: concentrate the crest in the
# old stone race and preserve the winter grain at the cost of Pell's works, or spread it
# over the lower fields and preserve the old defense at the cost of the grain. Both routes
# save every sleeping household, award the same score, and leave a distinct consequence.
#
#   keeper_lodge ─N─ weir_head ─N*─ weir_walk ─N**─ race_house ─N***─ valley_held (WIN, +15)
#   (start; Pell,    (head-rack:     (storm-walk:     (relief-race
#    flood-book,      free with       LETHAL nerve     winch: heave
#    weir-iron,       weir-iron,      crossing,        with weir-iron,
#    life-line)       craft, retry)   life-line)       might, retry)
#   (*   N gated on rack_freed   — the freed head-rack)
#   (**  N gated on walk_crossed — the safely-crossed storm-walk)
#   (*** N gated on race_open plus one committed flood course)
#
# Score (max 50, the milestone economy the curated RPG packs share — the exact 5+10+10+10+15
# shape as wolf_winter): read Pell's flood-book (+5, the §17 clue that names the three
# obstacles, the two tools, and points at Pell's counsel), clear each of the three obstacles
# (+10 each, on the SUCCESS of each skill check, one-shot), and reach the valley with the
# weir held (+15 — the locomotion win, like wolf_winter's cattle and the Beacon's crown).
# The perfect 50 coincides with reaching the saved valley, never before; SCORE_PEAKS_BEFORE_WIN
# does not fire on a navigation win (bug_0116). No score rides any skill check's on_failure
# (the score-economy bracket-completeness rule, rpg_score_economy_sound.test.ts).

meta:
  id: breaking_weir_v1
  title: "The Breaking Weir"
  start_room: keeper_lodge
  # hp is required by the RPG validator (> 0) and present for the core, but nothing in
  # this combatless pack damages it — there is no fight. attack/defense are 0 (no combat).
  # The three SKILLS are the live stats: craft (working the old gate-iron), nerve
  # (steadiness on the killing storm-walk), might (heaving the seized winch). Base 3 each:
  # an unprepared check is a real d20+3-vs-9 roll (~75%/try); Pell's counsel lifts nerve to
  # 8, so the one LETHAL check (the walk) becomes a guaranteed-safe min-roll pass (1+8>=9).
  vars_init: { hp: 20, attack: 0, defense: 0, craft: 3, nerve: 3, might: 3 }
  flags_init: []
  # No combat_guaranteed flag — there is no combat to guarantee. The safety the prep buys
  # on the lethal walk is proven the ordinary way: with Pell's +5 nerve counsel the DC-9
  # crossing passes on the player's WORST roll (1 + 8 = 9 >= 9), so heeding him is safe; the
  # under-prepared crossing (base nerve 3, needs d20>=6) is the declared gamble (bug_0114's
  # "the guarantee covers only the best-prepared" contract, here as honest prep-vs-rush).
  max_score: 50

rooms:
  - id: keeper_lodge
    name: "The Keeper's Lodge"
    description: >
      Old Pell cannot walk on his splinted leg. His flood-book is on the table.
      The weir-iron and life-line were kept by the door. TAKE weir-iron and TAKE
      life-line if each is here; retrieve either where dropped if needed. If unfinished,
      READ flood-book and TALK TO old Pell the weir-keeper, then choose "Ask how to cross
      the storm-walk safely." Go north to the Weir-Head.
      Floodwater pounds the walls.
    # NON-VACUOUS reactive read (§13): once the relief-race is open the climbing flood has
    # somewhere to go, and the river's voice outside the lodge changes from the rising roar to a
    # steadier, falling note — the change Pell is listening for from his cot, named here so a
    # player who comes back down to the lodge after opening the race hears the night turning.
    # Changes only prose: it gates no exit, alters no score, and the north signpost is kept.
    #
    # bug_0250 (the bug_0248/0249 stale-on-regression class): this variant ORIGINALLY keyed off
    # `quest_stage the_weir == race_running`, but a quest stage is NON-MONOTONIC — entering
    # valley_held re-seats the_weir to `weir_held`, so at that stage this variant would stop
    # matching and the lodge would revert to its BASE text ("the river is loud and wrong … too
    # high, too fast"), which flatly CONTRADICTS a world where the flood has already been
    # diverted. Today that contradiction is unreachable only by luck — the `visited: valley_held`
    # win ends the game the instant weir_held is set, so the lodge is never observed at that
    # stage — but the prose must not depend on that coincidence. Re-keyed onto the MONOTONIC,
    # never-unset `race_open` flag (set in the SAME race_winch on_success that sets race_running),
    # exactly mirroring this pack's own sibling rooms (weir_head keys on `rack_freed`, race_house
    # on `race_open`). race_open ⟺ race_running on every state reachable AT the lodge, so play is
    # byte-identical, but the calmed-water prose can now never revert to the contradictory base.
    variants:
      - when: [{ has_flag: flood_down_stone_race }]
        text: >
          The stone race carries the flood, so the winter grain stays dry. The old
          gate and race-house are breaking and will need rebuilding. Pell rests on
          his cot, and the flood-book remains on the table. Go north to the Weir-Head.
      - when: [{ has_flag: flood_over_lower_fields }]
        text: >
          The field wash carries the flood, so the old gate and race-house remain
          usable. The lower winter grain is destroyed. Pell rests on his cot, and
          the flood-book remains on the table. Go north to the Weir-Head.
      - when: [{ has_flag: race_open }]
        text: >
          The open relief-race has stopped the water from rising. You must still set
          one course pin in the Relief-Race House: save the winter grain and destroy
          the old works, or save the old works and destroy the grain. Go north.
      # bug_0314 (reactive-description-blindness): base description names both the weir-iron
      # and the life-line even after they are in the player's hands, making the lodge look
      # untouched on any return visit between taking the tools and opening the relief-race.
      # Three variants cover the three reachable taken-states; race_open (above) already omits
      # both tools for the post-race return, so these variants only fire pre-race.
      - when: [{ has_item: weir_iron }, { has_item: life_line }]
        text: >
          You have the weir-iron and life-line. Old Pell cannot walk on his splinted
          leg, and his flood-book remains on the table. Complete only unfinished
          reading or crossing counsel, then go north to the Weir-Head.
      - when: [{ has_item: weir_iron }]
        text: >
          You have the weir-iron. TAKE life-line if it is here, or retrieve it
          if needed. Complete only unfinished flood-book reading or Pell's crossing
          counsel. Go north to the Weir-Head.
      - when: [{ has_item: life_line }]
        text: >
          You have the life-line. TAKE weir-iron if it is here, or retrieve it
          if needed. Complete only unfinished flood-book reading or Pell's crossing
          counsel. Go north to the Weir-Head.
    objects: [flood_book, weir_iron, life_line]
    exits:
      - { direction: north, to: weir_head }

  - id: weir_head
    name: "The Weir-Head"
    description: >
      The jammed head-rack blocks the rising water with branches, weeds, and a
      broken hurdle. FREE jammed head-rack with weir-iron; failed attempts are
      safe and can be retried. North remains blocked until the rack is clear. The
      Keeper's Lodge is south.
    variants:
      - when: [{ has_flag: rack_freed }]
        text: >
          The cleared head-rack now drains the rising water. Go north to the
          Storm-Walk or south to the Keeper's Lodge.
    objects: [head_rack]
    exits:
      - { direction: south, to: keeper_lodge }
      - direction: north
        to: weir_walk
        conditions: [{ has_flag: rack_freed }]
        locked_msg: "The jammed head-rack blocks north. In the Keeper's Lodge, TAKE weir-iron. Then FREE jammed head-rack with weir-iron. Failed attempts can be retried without penalty."

  - id: weir_walk
    name: "The Storm-Walk"
    description: >
      Floodwater covers the storm-walk. If you have Pell's crossing instructions,
      RIG storm-walk with life-line for a safe crossing. Without his instructions,
      the same action risks immediate death on a failed nerve check. The Relief-Race
      House is north, and the Weir-Head is south.
    variants:
      - when: [{ has_flag: walk_crossed }]
        text: >
          You crossed the storm-walk, and the life-line remains clipped to the
          run-wire. Go north to the Relief-Race House or south to the Weir-Head.
      # bug_0321 (reactive-description-blindness): both the base and the not_flag:heard_walk
      # variants said "clip on" even when the life-line was still on its peg in the lodge —
      # implying the crossing action was available when the item was not held. Ordered before
      # not_flag:heard_walk so it always wins when the rope is absent; walk_crossed is first
      # so a crossed walk never shows this.
      - when: [{ not_item: life_line }]
        text: >
          You cannot cross without the life-line. In the Keeper's Lodge, TAKE life-line,
          TALK TO old Pell the weir-keeper, select the displayed "Ask how to cross the
          storm-walk safely." topic, then RIG storm-walk with life-line.
          Crossing without Pell's instructions risks immediate death. The Weir-Head
          is south.
      # The un-counselled crossing made VISIBLE as the gamble it is (bug_0204): a player who
      # never asked Pell how a man crosses (not_flag heard_walk) goes out on raw nerve (base
      # nerve 3, DC 9, ~25% death), but at base the room read identically to the steadied
      # crossing, so the gamble was hidden behind a stat. This variant surfaces it AT THE
      # DECISION POINT without hard-gating — you can still go (it stays a gamble, not a wall),
      # and it stays HONEST (the water MAY have you, not certain death) the way the prose and
      # Pell are honest elsewhere (bug_0027/0114/0200). The walk_crossed variant matches first,
      # so a crossed walk never shows this; a counselled-but-not-yet-crossed player falls to the
      # base text, which reads true once you know the trick.
      - when: [{ not_flag: heard_walk }]
        text: >
          You have the life-line but not Pell's crossing instructions. Using the
          life-line on the storm-walk now makes a nerve check; failure ends the game.
          Go south to the Keeper's Lodge, TALK TO old Pell the weir-keeper, and select
          the displayed "Ask how to cross the storm-walk safely." topic; or accept the risk
          and attempt the crossing.
    objects: [walk_span]
    exits:
      - { direction: south, to: weir_head }
      - direction: north
        to: race_house
        conditions: [{ has_flag: walk_crossed }]
        # locked_msg names the PRECONDITION (the life-line clipped to the run-wire) — WHY
        # blocked, not HOW to clear (the crossing action stays hidden until the line is held,
        # the bug_0201 blocked_exits discipline). The bug_0225 blind-pass finding: the old generic
        # "still ahead of you" named no precondition, so a player who left the life-line in the
        # lodge stood on the awash walk with ominous prose, a blocked north, and no signpost to
        # what was missing. Naming the line turns the dead-end into a pointer back to the rope.
        locked_msg: "North is blocked. In the Keeper's Lodge, TAKE life-line, TALK TO old Pell the weir-keeper, then choose \"Ask how to cross the storm-walk safely.\" Return here and RIG storm-walk with life-line. Crossing without Pell's instructions can kill you."

  - id: race_house
    name: "The Relief-Race House"
    description: >
      The seized winch-gate blocks the relief-race. HEAVE seized winch-gate with
      weir-iron; failed attempts are safe and can be retried. After it opens, choose
      exactly one course pin. The Storm-Walk is south.
    variants:
      - when: [{ has_flag: flood_down_stone_race }]
        text: >
          The stone race carries the flood. The lower winter grain stays dry, but
          the old gate and race-house are breaking and will need rebuilding. Go north
          to the Valley-Rim or south to the Storm-Walk.
      - when: [{ has_flag: flood_over_lower_fields }]
        text: >
          The field wash carries the flood. The old gate and race-house remain usable,
          but the lower winter grain is destroyed. Go north to the Valley-Rim or south
          to the Storm-Walk.
      - when: [{ has_flag: race_open }]
        text: >
          The relief-race is open. SET stone-race course pin to save the winter
          grain and destroy the old works, or SET field-wash course pin to save
          the old works and destroy the grain. The choice is permanent; setting one
          locks out the other. Every house survives. The Storm-Walk is south.
    objects: [race_winch, stone_race_pin, field_wash_pin]
    exits:
      - { direction: south, to: weir_walk }
      - direction: north
        to: valley_held
        conditions:
          - { has_flag: race_open }
          - { any_of: [{ has_flag: flood_down_stone_race }, { has_flag: flood_over_lower_fields }] }
        locked_msg: "North needs the open race and one permanent pin. If closed, HEAVE seized winch-gate WITH weir-iron. Then SET stone-race course pin to save grain but lose old works, or SET field-wash course pin to save old works but lose grain. Every house survives."

  - id: valley_held
    name: "The Valley-Rim, at Dawn"
    description: >
      Every house is dry, and the river is falling. Your selected course paid its
      stated cost: either the old works broke or the lower winter grain was destroyed.
      The Relief-Race House is south. Dawn reaches the valley.
    # The locomotion win (visited: valley_held), like wolf_winter's cattle and the Beacon's
    # crown: the +15 capstone rides reaching the rim with the weir held (the chained exit
    # gates make that reachable only with all three obstacles cleared), so the full 50
    # coincides with the valley being saved, never before. SCORE_PEAKS_BEFORE_WIN does not
    # fire on a navigation win (bug_0116).
    on_enter:
      # Quest progress (§13): the_weir reaches its final stage, weir_held, as you make the
      # rim and the valley is saved. Pure progress-tracking on the denouement step beside the
      # +15 capstone — it gates nothing (the win still rides `visited: valley_held` below) and
      # leaves the score economy untouched; it simply records that the night was won.
      - set_quest_stage: { quest: the_weir, stage: weir_held }
      - add_journal: "The river is falling, and every house is dry. Your permanent course choice cost either the old works or the lower winter grain."
      - inc_var: { name: score, by: 15 }
    exits:
      - { direction: south, to: race_house }

objects:
  - id: flood_book
    name: "flood-book"
    aliases: [book, floodbook, log, journal, marks, tally, notice]
    description: >
      Pell's flood-book records the rising water and the exact steps needed to hold
      the weir. READ flood-book only if that action is still offered; completed reading stays recorded.
    read_text: >
      The flood-book records four steps: FREE jammed head-rack WITH weir-iron; learn
      Pell's safe crossing, then RIG storm-walk WITH life-line; HEAVE seized winch-gate
      WITH weir-iron; and choose SET stone-race course pin or SET field-wash course pin.
      Follow only actions still offered.
      If none remain, this reading records the completed method without reopening work.
      Crossing without Pell's instructions can kill you. The
      stone-race course pin saves the winter grain but destroys the old gate and
      race-house; the field-wash course pin saves the works but destroys the grain.
      Every house survives either choice, and completed steps stay complete.
    interactions:
      - verb: READ
        target: flood_book
        conditions: [{ not_flag: read_marks }]
        effects:
          - set_flag: read_marks
          - inc_var: { name: score, by: 5 }
          # Journal gives the player a lasting reference for what the marks said and explains
          # the +5 score diegetically — the only key preparatory action in the pack that
          # previously awarded score with no accompanying journal record (all other milestone
          # actions — rack_freed, walk_crossed, race_open, valley_held, pell_walk, pell_weir —
          # each add a journal entry). bug_0317_class: silent score with no journal.
          - add_journal: "Pell's recorded steps are FREE jammed head-rack WITH weir-iron; learn his safe method, then RIG storm-walk WITH life-line; HEAVE seized winch-gate WITH weir-iron; finally choose SET stone-race course pin or SET field-wash course pin. Follow only actions still offered; completed work and a chosen course stay fixed."

  - id: weir_iron
    name: "weir-iron"
    aliases: [iron, bar, pry, prybar, crowbar, lever]
    description: "A long pry-bar used on the jammed head-rack and seized winch-gate. If either matching action is still offered and you are not holding the bar, TAKE weir-iron. Completed openings stay open."
    takeable: true

  - id: life_line
    name: "life-line"
    aliases: [line, lifeline, rope, cord, snap]
    description: >
      A tarred rope with an iron snap, used to RIG storm-walk WITH life-line after
      learning Pell's safe crossing. Continue only with actions still offered; a
      completed crossing stays complete.
    takeable: true

  - id: head_rack
    name: "jammed head-rack"
    aliases: [rack, grating, grate, head, drift]
    description: "Branches, weeds, and a broken hurdle jam the iron head-rack. FREE jammed head-rack with weir-iron. A failed attempt makes progress and can be retried without penalty."
    variants:
      # name override (bug_0188 reactive-name shape) so visible_objects and the
      # enumerated commands stop labelling it "jammed" once the rack is clear — the
      # stale label contradicted this variant's own text on the winning path.
      - when: [{ has_flag: rack_freed }]
        name: "cleared head-rack"
        text: "The cleared head-rack drains water through its open bars."
    takeable: false
    interactions:
      # craft skill check (the §13 RPG mechanic, sunken_barrow's slab shape). Tool-on-target
      # USE — the RPG runner requires the player to HOLD the item (runner.ts), so every skill
      # check here is "weir-iron / life-line on <obstacle>". RETRYABLE and NON-LETHAL: on a
      # failed roll the rack simply does not give yet (no death, no penalty), so a player can
      # never be hard-locked out — leverage and persistence always clear it (the bug_0027
      # honesty discipline: the failure prose reads as repeatable progress, not a missing
      # tool or a strength wall). One-shot award: gated none_of rack_freed, so the +10 cannot
      # be farmed by re-levering an already-clear rack.
      - verb: USE
        item: weir_iron
        target: head_rack
        command_verb: free
        command_template: "free {target} with {item}"
        conditions: [{ none_of: [{ has_flag: rack_freed }] }]
        skill_check:
          skill: craft
          difficulty: 9
          on_success:
            - set_flag: rack_freed
            # Quest progress (§13): the_weir advances to rack_cleared the instant the rack
            # gives. Pure progress-tracking alongside the existing rack_freed flag (which the
            # north exit still gates on) — it changes no gate, DC, or score; it is what the
            # lodge's reactive read keys off to know the keeper is one obstacle into the night.
            - set_quest_stage: { quest: the_weir, stage: rack_cleared }
            - inc_var: { name: score, by: 10 }
            - add_journal: "You cleared the jammed head-rack with the weir-iron. Water now drains through the bars, and the Storm-Walk is open to the north."
            - narrate: "The weir-iron frees the packed branches, weeds, and broken hurdle. The head-rack is clear, and north is open."
          on_failure:
            - narrate: "The weir-iron removes part of the jam, but the head-rack remains blocked. Retry with FREE jammed head-rack WITH weir-iron; there is no penalty or lockout."

  - id: walk_span
    name: "storm-walk"
    aliases: [walk, span, plank, boards, planks, spillway, runwire, wire]
    description: "Floodwater covers the storm-walk. TALK TO old Pell the weir-keeper, select the displayed \"Ask how to cross the storm-walk safely.\" topic, then RIG storm-walk with life-line. Without his instructions, a failed nerve check ends the game."
    variants:
      - when: [{ has_flag: walk_crossed }]
        text: "You crossed the storm-walk. The life-line remains clipped to the run-wire."
      # examine-side twin of the room's gamble cue (bug_0204): on a closer look the un-counselled
      # player is told plainly that the knack of the crossing — the half Pell would teach — is the
      # half that keeps you UPRIGHT, so going un-told is the gamble. No `name` override here, so the
      # object name stays "storm-walk" (the bug_0197 reactive-name pins are untouched).
      - when: [{ not_flag: heard_walk }]
        text: "You have not asked Pell for crossing instructions. Acting now makes a nerve check, and failure ends the game. The exact command is RIG storm-walk WITH life-line. Go south to the Keeper's Lodge, TALK TO old Pell the weir-keeper, and select the displayed \"Ask how to cross the storm-walk safely.\" topic; or accept the risk."
    takeable: false
    interactions:
      # nerve skill check — the ONE LETHAL obstacle (the pack's prep-vs-gamble identity, the
      # wolf_winter/bug_0114 contract transposed to a skill check). Tool-on-target USE: the
      # life-line must be HELD to attempt the crossing at all (you cannot clip on without it),
      # so the death is reachable only by a held-line player who fails the roll. NON-retryable:
      # on_failure ends the game (ending_swept) — a slip into the race is final. Gated none_of
      # walk_crossed so a re-USE after success cannot re-roll a fatal fall on an already-crossed
      # walk. DC 9 vs nerve: base nerve 3 needs d20>=6 (~75%, a real gamble); Pell's +5 counsel
      # lifts nerve to 8 so the WORST roll still passes (1+8>=9) — heeding him makes the
      # crossing safe, exactly the load-bearing prep the prose promises. No score on the fatal
      # branch (score-economy bracket rule); the +10 rides the safe crossing only.
      #
      # bug_0320 (reactive-description-blindness): the original success narrate opened with
      # "go out low, hands on the wire, feet feeling the slick boards" — Pell's exact taught
      # technique (bug_0197 removed "the way Pell told you" credit but left the technique
      # language). A blind playtester noted the character executes a technique they may never
      # have been shown. Prose-only fix: the opening is now neutral on technique; the key
      # preservation of the line ("you find yourself lower than you expected to be, hands
      # tight on the wire, and that is what saves you") works on both the counselled path
      # (the technique was deliberate) and the gamble path (found under the feet). Journal
      # likewise drops "and going low and steady" — a known Pell phrase.
      - verb: USE
        item: life_line
        target: walk_span
        command_verb: rig
        command_template: "rig {target} with {item}"
        conditions: [{ none_of: [{ has_flag: walk_crossed }] }]
        skill_check:
          skill: nerve
          difficulty: 9
          on_success:
            - set_flag: walk_crossed
            # Quest progress (§13): the_weir advances to walk_won when the storm-walk is
            # behind you — the night's one killing place crossed. Tracks alongside the
            # walk_crossed flag (which the north exit still gates on); no gate, DC, or score
            # touched. The stage name is walk_won so it cannot be confused with the flag.
            - set_quest_stage: { quest: the_weir, stage: walk_won }
            - inc_var: { name: score, by: 10 }
            - add_journal: "You crossed the storm-walk with the life-line clipped to the run-wire. The Relief-Race House is open to the north."
            - narrate: "You clip the life-line to the run-wire and cross the flooded boards. The line catches one slip, and you reach the far side safely."
          on_failure:
            - add_journal: "You attempted the storm-walk without enough nerve. You slipped, the life-line snap tore loose, and the flood carried you under the weir."
            - narrate: "You lose your footing on the storm-walk. The life-line snap tears loose, and the flood carries you under the weir."
            - end_game: ending_swept

  - id: race_winch
    name: "seized winch-gate"
    aliases: [winch, gate, wheel, crank, race]
    description: "Rust and swollen timber hold the seized winch-gate shut. HEAVE seized winch-gate with weir-iron. Failed attempts make progress and can be retried without penalty."
    variants:
      # name override (bug_0188) so the gate stops reading "seized" once it is hauled
      # open — the stale label contradicted this variant's own text and the room prose.
      - when: [{ has_flag: race_open }]
        name: "open winch-gate"
        text: "The open winch-gate is secured in its frame, and the relief-race runs beneath the floor."
    takeable: false
    interactions:
      # might skill check — the third obstacle, RETRYABLE and NON-LETHAL like the rack (a
      # seized winch is honest work, not a killer). Tool-on-target USE (weir-iron held). The
      # failure prose reads as repeatable progress (bug_0027), so persistence always opens the
      # race and the valley can never be hard-locked off. One-shot +10 (gated none_of race_open).
      - verb: USE
        item: weir_iron
        target: race_winch
        command_verb: heave
        command_template: "heave {target} with {item}"
        conditions: [{ none_of: [{ has_flag: race_open }] }]
        skill_check:
          skill: might
          difficulty: 9
          on_success:
            - set_flag: race_open
            # Quest progress (§13): the_weir advances to race_running the moment the relief-
            # race opens and the flood starts to draw off safe — the turn of the night, the
            # weir saved though the valley is not yet reached. Tracks alongside the race_open
            # flag (which the north exit still gates on); no gate, DC, or score touched. This
            # is the stage the keeper's-lodge variant reads to change the river's voice below.
            - set_quest_stage: { quest: the_weir, stage: race_running }
            - inc_var: { name: score, by: 10 }
            - add_journal: "You opened the seized winch-gate with the weir-iron. Now choose SET stone-race course pin to save the winter grain and destroy the old works, or SET field-wash course pin to save the works and destroy the grain."
            - narrate: "The weir-iron turns the winch, and the gate opens. Choose SET stone-race course pin or SET field-wash course pin; setting one locks out the other."
          on_failure:
            - narrate: "The winch turns partway, but the seized winch-gate remains closed. Retry with HEAVE seized winch-gate WITH weir-iron; there is no penalty or lockout."

  - id: stone_race_pin
    name: "stone-race course pin"
    aliases: [stonepin, stonecourse, masonrycourse, graincourse]
    description: "SET stone-race course pin to save the lower winter grain. This permanently destroys the old gate and race-house and locks out the field-wash course pin. Every house survives."
    variants:
      - when: [{ has_flag: flood_down_stone_race }]
        text: "The stone-race course pin is set. The winter grain is safe, the old gate and race-house are destroyed, and this permanent cost is fixed."
      - when: [{ has_flag: flood_over_lower_fields }]
        text: "The field-wash course is already set, so the stone-race course pin is locked out and cannot be set. The completed choice stays fixed."
    visible_when: [{ has_flag: race_open }]
    takeable: false
    interactions:
      - verb: USE
        target: stone_race_pin
        command_verb: set
        conditions:
          - { has_flag: race_open }
          - { none_of: [{ has_flag: flood_down_stone_race }, { has_flag: flood_over_lower_fields }] }
        effects:
          - set_flag: flood_down_stone_race
          - add_journal: "You set the stone-race course pin. The lower winter grain stays dry, but the old gate and race-house are destroyed. The field-wash course pin is locked out."
          - narrate: "The stone-race course pin sends the flood through the masonry channel. The grain stays dry while the old gate and race-house break."

  - id: field_wash_pin
    name: "field-wash course pin"
    aliases: [fieldpin, fieldcourse, floodfields, grainwash]
    description: "SET field-wash course pin to preserve the old gate and race-house. This permanently destroys the lower winter grain and locks out the stone-race course pin. Every house survives."
    variants:
      - when: [{ has_flag: flood_over_lower_fields }]
        text: "The field-wash course pin is set. The old gate and race-house are safe, the lower winter grain is destroyed, and this permanent cost is fixed."
      - when: [{ has_flag: flood_down_stone_race }]
        text: "The stone-race course is already set, so the field-wash course pin is locked out and cannot be set. The completed choice stays fixed."
    visible_when: [{ has_flag: race_open }]
    takeable: false
    interactions:
      - verb: USE
        target: field_wash_pin
        command_verb: set
        conditions:
          - { has_flag: race_open }
          - { none_of: [{ has_flag: flood_down_stone_race }, { has_flag: flood_over_lower_fields }] }
        effects:
          - set_flag: flood_over_lower_fields
          - add_journal: "You set the field-wash course pin. The old gate and race-house survive, but the lower winter grain is destroyed. The stone-race course pin is locked out."
          - narrate: "The field-wash course pin sends the flood over the lower fields. The old works remain usable while the winter grain is buried under water and silt."

# No NPC combat counsel here — Pell is a weir-keeper, not a war-captain. His one
# load-bearing counsel (ask_walk, +5 nerve) is what makes the lethal storm-walk safe; his
# second topic (ask_weir) is pure lore/plan with no buff (the wolf_winter Cade shape:
# one mechanical topic, one lore topic, an ungated leave to keep the root TERMINATING so
# DIALOGUE_NONTERMINATING cannot fire). Every npc_text is PURE SPOKEN words (bug_0071): the
# engine renders `old Pell the weir-keeper: "<npc_text>"`.
npcs:
  - id: pell
    name: "old Pell the weir-keeper"
    description: >
      Pell has kept this weir for forty winters. His splinted leg prevents him from
      working tonight, but he can explain the safe route and its final cost.
    room: keeper_lodge
    dialogue:
      root: pell_root
      nodes:
        - id: pell_root
          npc_text: >
            My broken leg keeps me here. Ask about any unfinished storm-walk crossing
            or weir step, and collect only missing tools. Completed work stays complete;
            the final course choice remains permanent.
          # Reactive greeting (the bug_0246 dialogue-variant feature, the §7.3 reactive-text
          # convention brought to NPC lines): once Pell has told you ANYTHING — the walk
          # (heard_walk) or the plan (heard_plan) — coming back to his menu no longer replays
          # the whole "Thank God someone came" emergency, which read robotic to a blind
          # playtester on a return loop. He just asks what else you need. Two variants (one per
          # flag) so EITHER topic first makes the return terse; first-match-wins, both the same
          # spoken line. Only the text changes — the topics (hence dialogue termination) are
          # untouched, and a fresh first contact still gets the full opening.
          variants:
            - when: [{ has_flag: heard_walk }]
              text: >
                What else do you need? Continue only with unfinished weir work.
            - when: [{ has_flag: heard_plan }]
              text: >
                What else do you need? Continue only with unfinished weir work.
          topics:
            - id: ask_walk
              prompt: "Ask how to cross the storm-walk safely."
              conditions: [{ not_flag: heard_walk }]
              goto: pell_walk
            - id: ask_weir
              prompt: "Ask for the steps to hold the weir."
              conditions: [{ not_flag: heard_plan }]
              goto: pell_weir
            - id: leave_pell
              prompt: "Leave Pell and go to the weir."
              end: true
        - id: pell_walk
          # The load-bearing counsel — and TRUE: with +5 nerve the DC-9 crossing passes on the
          # WORST roll (1+8>=9), so a player who heeds Pell crosses safe, and one who skips this
          # goes onto a killing walk under-steadied (base nerve 3, ~75%). Pell names plainly that
          # the line is what keeps you ON the walk and a steady nerve is what keeps you UPRIGHT —
          # both, and the honest stakes (the race keeps what it takes). No over-promise (bug_0132):
          # he says heeding him makes it safe, not that the walk is harmless.
          npc_text: >
            For an unfinished crossing, carry the life-line and RIG storm-walk with
            life-line. Clip its snap to the run-wire, stay low, keep both hands on the
            wire, and slide your feet. With these instructions, the crossing is safe.
            Without them, a failed nerve check kills you.
          effects:
            - set_flag: heard_walk
            - inc_var: { name: nerve, by: 5 }
            - add_journal: "Pell teaches the safe storm-walk method: clip the life-line to the run-wire, stay low, use both hands, and slide your feet. The +5 nerve guarantees the crossing only if it remains unfinished."
          topics:
            - id: walk_back
              prompt: "Ask Pell about something else."
              goto: pell_root
        - id: pell_weir
          # bug_0319 (reactive-description-blindness): when the player asks ask_weir BEFORE
          # ask_walk, the phrase "which I've told you of" was factually false — heard_walk was not
          # set, so Pell had told the player nothing yet about the walk. Added a heard_walk variant
          # that preserves the accurate back-reference; the base npc_text now reads "ask me about
          # that next" for the un-counselled player, directing them to the one topic that matters.
          npc_text: >
            The recorded order is: FREE jammed head-rack WITH weir-iron; learn the safe
            crossing method, then RIG storm-walk WITH life-line; HEAVE seized winch-gate
            WITH weir-iron; finally choose SET stone-race course pin or SET field-wash
            course pin. Follow only actions still offered;
            completed work and a chosen course do not reopen. The stone-race course pin saves the winter
            grain but destroys the old works. The field-wash course pin saves the
            works but destroys the grain. That final choice is permanent. The rack
            and winch checks are safe to retry.
          variants:
            - when: [{ has_flag: heard_walk }]
              text: >
                The recorded order uses the safe crossing method: FREE jammed head-rack
                WITH weir-iron; RIG storm-walk WITH life-line; HEAVE seized winch-gate WITH weir-iron;
                then choose SET stone-race course pin or SET field-wash course pin. Follow only actions still offered;
                completed work and a chosen course do not reopen. The final choice saves the winter grain
                and destroys the old works, or saves the works and destroys the grain.
                The rack and winch checks are safe to retry.
          effects:
            - set_flag: heard_plan
            - add_journal: "Pell described the weir sequence and his safe crossing method: FREE jammed head-rack WITH weir-iron, RIG storm-walk WITH life-line, HEAVE seized winch-gate WITH weir-iron, then choose SET stone-race course pin or SET field-wash course pin. Completed steps stay complete."
          topics:
            - id: weir_back
              prompt: "Ask Pell about something else."
              goto: pell_root

# The defining line of this pack: no enemies. The whole challenge is the skill-check chain
# above. The RPG validator runs cleanly with an empty enemy set (mode is detected by the
# PRESENCE of the `enemies` key, src/mcp/types.ts), and the combat-winnability / gauntlet
# bounds simply have nothing to prove — only the skill-check passability bound (each DC <=
# 20 + best reachable skill) and the parser-layer soundness apply.
enemies: []

win_conditions:
  # Locomotion win, like wolf_winter (visited: cattle_stand) and the Beacon (visited:
  # beacon_crown): reaching the valley-rim — only possible once all three obstacles are
  # cleared (the chained exit gates) — fires the win via the engine's post-action checkWin.
  # SCORE_PEAKS_BEFORE_WIN does not fire on a navigation win (bug_0116), and the +15 capstone
  # is the accepted denouement-step.
  - id: hold_the_fields
    conditions: [{ visited: valley_held }, { has_flag: flood_down_stone_race }]
    ending: ending_fields_held_race_spent
  - id: hold_the_race
    conditions: [{ visited: valley_held }, { has_flag: flood_over_lower_fields }]
    ending: ending_race_held_fields_given

endings:
  - id: ending_fields_held_race_spent
    title: "The Fields Held, the Old Race Spent"
    variants:
      - when: [{ not_flag: read_marks }]
        text: >
          Every house is dry, and the winter grain is safe. The old gate and race-house
          are destroyed and must be rebuilt before another flood. You left the flood-book
          unread. *** You have won. ***
    text: >
      Every house is dry, and the winter grain is safe. The old gate and race-house
      are destroyed and must be rebuilt before another flood. *** You have won. ***
  - id: ending_race_held_fields_given
    title: "The Old Race Held, the Lower Fields Given"
    variants:
      - when: [{ not_flag: read_marks }]
        text: >
          Every house is dry, and the old gate and race-house remain usable. The lower
          winter grain is destroyed, so the valley faces a lean season. You left the
          flood-book unread. *** You have won. ***
    text: >
      Every house is dry, and the old gate and race-house remain usable. The lower
      winter grain is destroyed, so the valley faces a lean season. *** You have won. ***
  - id: ending_swept
    title: "The Race Takes You"
    text: >
      You fall from the storm-walk and drown under the weir. With no keeper, the
      river overflows into the valley before the farms can respond. *** You have fallen. ***
    death: true
