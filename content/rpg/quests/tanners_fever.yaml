# The Tanner's Fever — a Stage 4 (Hero's-Quest) pack (spec §13).
#
# The game's NINTH RPG pack — and the FIRST to introduce `physick`, a medical/
# diagnostic stat measuring systematic clinical observation, knowledge of remedies,
# and the ability to identify a misdiagnosis and correct it under professional
# pressure. No prior RPG pack uses a medical stat: the eight predecessors use
# physical or craft vars (might, craft, nerve, tracking, lore) or social command
# (authority, cunning). Physick is different: it represents accumulated clinical
# knowledge applied at the moment of treatment — the ability to name what is wrong,
# demonstrate why the current treatment is harmful, and administer the correct remedy
# with enough precision and confidence to override an established practitioner's
# objection.
#
# Setting: a wool merchant's house in a river town in winter. An itinerant surgeon
# is called to see Edric (14), the merchant's son, who has been ill for five days
# under the care of Godwin, the resident apothecary. Edric is not improving.
#
# True diagnosis: Godwin correctly identified an autumn fever but prescribed a
# wormwood tonic at three times the standard dose to 'accelerate resolution.' The
# overdose is suppressing appetite and stripping fluids faster than the fever alone
# would — the treatment is sustaining the crisis it was meant to end. The correct
# remedy is meadowsweet (stomach-settling, anti-inflammatory) to allow the gut to
# rest while the fever clears on its own. Godwin's notes contain the overdose
# evidence; the herb store holds the meadowsweet.
#
# TWO RESOLUTION PATHS (third in the RPG corpus after factors_mark and falconers_ransom):
#   PHYSICK (primary, full score): examine Edric (+5, +3 physick: overdose symptoms
#   identified), read Godwin's case notes (+10, +3 physick: overdose formula confirmed),
#   take and examine meadowsweet from herb_store (+10: corrective ingredient ready).
#   Then USE meadowsweet ON sick_edric in the sickroom — physick DC 12. Success:
#   Godwin concedes; Holt stands aside; corridor N exit opens. Failure retires the
#   improvised roll and unlocks a deterministic, same-action recovery once all three
#   pieces of medical evidence have been assembled.
#   COMBAT (fallback, partial score): skip the physick evidence or fail the check —
#   Holt may be fought in the corridor. A forced-passage ending still requires an
#   identified remedy for Edric and caps at 40/50.
#
#   sickroom (start; Godwin NPC; sick_edric examine +5 physick+3)
#   │  W → apothecary_store (godwin_notes: +10 read, +3 physick)
#   │  E → herb_store (meadowsweet: +10 examine when held, takeable)
#   │  N → corridor (Holt enemy; N gated on treatment_given OR
#   │         holt_defeated + identified carried remedy)
#   └─────── corridor: N → market_lane (WIN +15)
#
# Score (max 50, the 5+10+10+10+15 shape):
#   +5  INSPECT sick_edric  — overdose symptoms identified (physick+3; one-shot)
#   +10 READ godwin_notes   — overdose formula confirmed (physick+3; one-shot, must hold)
#   +10 INSPECT meadowsweet — corrective ingredient ready (one-shot, must hold)
#   +10 treatment accepted  — USE meadowsweet ON sick_edric, DC 12. The first
#       presentation is the only roll; a failed presentation escalates the scene
#       and can be corrected deterministically after gathering all evidence.
#   +15 market_lane on_enter — WIN (locomotion win)
#
# Physick stat calibration (skill checks use d20, combat uses d6):
#   Base physick 3: d20+3 >= 12 → d20 >= 9 → 12/20 = 60% (significant gamble).
#   After examining Edric (+3): physick 6, d20 >= 6 → 15/20 = 75%.
#   After reading notes (+3): physick 9, d20 >= 3 → 18/20 = 90% (near-certain).
#   The pack's honest answer: gather the evidence first.
#
# Combat death check (no combat_guaranteed):
#   Player base hp 20 / atk 4 / def 2. Holt: hp 12 / atk 5 / def 2.
#   Worst player dmg per round (d6 min=1): 1+4-2 = 3. Rounds to kill Holt: ceil(12/3) = 4.
#   Worst Holt dmg per round (d6 max=6): 6+5-2 = 9. Over 3 rounds (before kill): 27.
#   27 > 20 HP — Holt CAN kill on worst dice. ending_expelled (death) is reachable.
#   No combat_guaranteed. The pack's answer to the combat threat is the physick path.

meta:
  id: tanners_fever_v1
  title: "The Tanner's Fever"
  start_room: sickroom
  # `physick` (3 base): systematic clinical observation, knowledge of remedies,
  # and the ability to identify a misdiagnosis in front of the practitioner who
  # made it. New to the corpus — no prior RPG pack uses a medical stat. Used in
  # the treatment skill_check (USE meadowsweet ON sick_edric, DC 12): base 3 →
  # 60% gamble; with Edric examined (+3) → physick 6, 75%; with both preps →
  # physick 9, 90% near-certain. Physick does not boost combat stats.
  vars_init: { hp: 20, attack: 4, defense: 2, physick: 3 }
  flags_init: []
  max_score: 50

rooms:
  - id: sickroom
    name: "The Sickroom"
    description: >
      Complete only unfinished evidence. LOOK AT Edric for +3 physick. In the room west,
      READ Godwin's case notes. In the room east, TAKE meadowsweet, then LOOK AT meadowsweet.
      Back in the Sickroom, TREAT Edric WITH meadowsweet. The first treatment check is one-shot; failure consumes no
      meadowsweet and unlocks a guaranteed retry after all three pieces of evidence.
      The Corridor is north.
    variants:
      - when: [{ has_flag: treatment_given }]
        text: >
          You treated Edric with meadowsweet, and he can keep water down. Go north
          through the Corridor to finish, east to the Herb Store, or west to the
          Apothecary's Store.
      - when:
          - { has_flag: confrontation_attempted }
          - { not_flag: treatment_given }
        text: >
          Your first treatment attempt failed and cannot be repeated. Complete only
          unfinished evidence: LOOK AT Edric, READ Godwin's case notes, and LOOK AT
          meadowsweet. Then TREAT Edric WITH meadowsweet after ordering the evidence; that
          retry is guaranteed. The Corridor is north.
      - when: [{ has_flag: notes_read }]
        text: >
          You READ Godwin's case notes and confirmed the wormwood overdose. Complete
          the remaining evidence, then TREAT Edric WITH meadowsweet. The Herb
          Store is east, the Apothecary's Store is west, and the Corridor is north.
      - when: [{ has_flag: godwin_notes_taken }]
        text: >
          Godwin's case notes were taken. Complete only unfinished reading, Edric's
          examination, or meadowsweet identification, then TREAT Edric WITH meadowsweet. The Herb
          Store is east, the Corridor north, and the Apothecary's Store west.
    objects: [sick_edric]
    exits:
      - { direction: west, to: apothecary_store }
      - { direction: east, to: herb_store }
      - { direction: north, to: corridor }

  - id: apothecary_store
    name: "The Apothecary's Store"
    description: >
      Godwin's case notes record the disputed dose. Before treatment, TAKE Godwin's
      case notes and READ Godwin's case notes if that evidence is unfinished to gain
      +3 physick. After treatment, that evidence is closed. Go east to the Sickroom.
    variants:
      - when: [{ has_flag: notes_read }]
        text: >
          You READ Godwin's case notes and gained +3 physick. Go east to the Sickroom.
      - when: [{ has_flag: godwin_notes_taken }]
        text: >
          Godwin's case notes were taken. Before treatment, retrieve and READ Godwin's case notes
          only if that evidence is unfinished. Go east to the Sickroom.
    objects: [godwin_notes]
    exits:
      - { direction: east, to: sickroom }

  - id: herb_store
    name: "The Herb Store"
    description: >
      Meadowsweet is Edric's remedy. Before treatment, TAKE meadowsweet and LOOK AT meadowsweet only if
      that evidence is unfinished. Go west to the Sickroom. Other drying herbs hang
      along the cool wall.
    variants:
      - when: [{ has_flag: meadowsweet_taken }]
        text: >
          The meadowsweet was taken. If treatment and identification are unfinished,
          retrieve and LOOK AT meadowsweet. Otherwise the completed evidence stays recorded.
          Go west to the Sickroom.
    objects: [meadowsweet]
    exits:
      - { direction: west, to: sickroom }

  - id: corridor
    name: "The Corridor"
    description: >
      Holt blocks the north exit while treatment is disputed. Go south and use the exact
      TREAT action shown for Edric and meadowsweet for the nonviolent route. You may ATTACK Holt, but the
      fight can kill you; after victory, the north exit still requires held and
      INSPECTED meadowsweet.
    variants:
      - when: [{ has_flag: treatment_given }]
        text: >
          You treated Edric, and Holt no longer blocks the doorway. Go north to the
          Market Lane, or south to the Sickroom.
      - when: [{ has_flag: holt_defeated }]
        text: >
          You defeated Holt, but Edric is untreated. Go north only while carrying
          meadowsweet that you have INSPECTED, or go south and use the exact TREAT action
          shown for Edric and meadowsweet at the bedside.
    exits:
      - { direction: south, to: sickroom }
      - direction: north
        to: market_lane
        conditions:
          - any_of:
              - { has_flag: treatment_given }
              - all_of:
                  - { has_flag: holt_defeated }
                  - { has_item: meadowsweet }
                  - { has_flag: herbs_examined }
        locked_msg: >-
          North opens after Edric is treated, or after Holt is defeated while you carry
          meadowsweet that you have INSPECTED. Complete only the prerequisite still missing;
          completed treatment, combat, and evidence stay complete.

  - id: market_lane
    name: "The Market Lane"
    description: >
      You left the identified meadowsweet with Edric, either by treating him or by
      giving instructions to the factor's boy. Godwin's triple-strength tonic is now
      challenged. The merchant's lane opens onto the market square.
    on_enter:
      - set_quest_stage: { quest: tanners_fever, stage: treatment_complete }
      - remove_item: meadowsweet
      - add_journal: >
          You left the meadowsweet with Edric, administered or accompanied by
          directions. The remedy is no longer in your inventory. (+15 score)
      - inc_var: { name: score, by: 15 }
    exits:
      - { direction: south, to: corridor }

objects:
  - id: sick_edric
    name: "Edric"
    aliases: [edric, boy, patient, sick boy, sick patient, sick child, child, bed,
              bedside, patient edric, young edric, tonic cup, cup, cup of tonic,
              tonic, half-full cup]
    description: >
      LOOK AT Edric to identify his symptoms, gain +3 physick, and gain +5 score.
      After gathering meadowsweet, use the exact TREAT action shown for Edric and
      meadowsweet. The fourteen-year-old is
      pale, dehydrated, and unable to finish Godwin's tonic.
    # Reactive variants: treatment_given (priority) then edric_examined intermediate.
    variants:
      - when: [{ has_flag: treatment_given }]
        text: >
          You treated Edric with meadowsweet. He can keep water down, and Godwin's
          tonic remains unused.
      - when: [{ has_flag: edric_examined }]
        text: >
          You already INSPECTED Edric and gained +3 physick. His fever is real, but
          the wormwood overdose is worsening his dehydration.
    takeable: false
    interactions:
      # Clinical examination rides on the natural "look at Edric" action: +5 score,
      # +3 physick, one-shot. Repeated looks retain the reactive description but
      # cannot farm the evidence reward.
      - verb: INSPECT
        target: sick_edric
        conditions:
          - { not_flag: edric_examined }
          - { not_flag: treatment_given }
        effects:
          - set_flag: edric_examined
          - inc_var: { name: physick, by: 3 }
          - inc_var: { name: score, by: 5 }
          - set_quest_stage: { quest: tanners_fever, stage: symptoms_read }
          - add_journal: >
              You INSPECTED Edric. The fever is real, but wormwood is worsening his
              fluid loss. Complete only remaining Edric, case-notes, and meadowsweet
              evidence. (+3 physick, +5 score)
          - narrate: >
              You INSPECT Edric and identify dehydration beyond the fever's effects.
              A high wormwood dose is worsening the illness. You gain +3 physick and
              +5 score. Complete only remaining evidence—LOOK AT Edric, READ Godwin's
              case notes, and LOOK AT meadowsweet—then use the exact TREAT action shown
              for Edric and meadowsweet. Completed evidence stays complete.
      # The treatment's first presentation: USE meadowsweet ON sick_edric — physick
      # DC 12. `confrontation_attempted` is a base effect, so success and failure both
      # retire the roll. Failure preserves every clue/remedy and unlocks the finite,
      # evidence-gated recovery interaction below.
      - verb: USE
        item: meadowsweet
        target: sick_edric
        command_verb: treat
        command_template: "treat {target} with {item}"
        conditions: [{ not_flag: confrontation_attempted }]
        effects:
          - set_flag: confrontation_attempted
        skill_check:
          skill: physick
          difficulty: 12
          on_success:
            - set_flag: treatment_given
            - inc_var: { name: score, by: 10 }
            - set_quest_stage: { quest: tanners_fever, stage: treatment_given }
            - add_journal: >
                You TREATED Edric with meadowsweet. Godwin stopped the wormwood
                tonic, and the Corridor is clear. (+10 score)
            - narrate: >
                You explain that the wormwood tonic is worsening Edric's dehydration
                and that meadowsweet will settle his stomach. Godwin accepts the treatment,
                stops the tonic, and Edric takes the meadowsweet. You gain +10 score.
          on_failure:
            - add_journal: >-
                TREAT failed. Finish Edric, case-notes, and meadowsweet evidence; then
                TREAT Edric WITH meadowsweet after ordering the evidence.
            - narrate: >-
                Godwin rejects your first treatment case. The meadowsweet is not
                consumed. Complete all three actions—LOOK AT Edric, READ Godwin's case
                notes, and LOOK AT meadowsweet—then TREAT Edric WITH meadowsweet after
                ordering the evidence. That retry is guaranteed.
      # Deterministic recovery after the one failed roll. The action id remains
      # `use_meadowsweet_on_sick_edric`, but the command now names the ordered case.
      # Requiring all three evidence flags makes an underprepared gamble costly
      # without consuming the unique cure or forcing the player into violence.
      - verb: USE
        item: meadowsweet
        target: sick_edric
        command_verb: treat
        command_template: "treat {target} with {item} after ordering the evidence"
        blocked_hint:
          visible_when:
            - all_of:
                - { has_flag: confrontation_attempted }
                - { not_flag: treatment_given }
          reason: >-
            The guaranteed TREAT retry is locked until you LOOK AT Edric, READ
            Godwin's case notes, and, while holding meadowsweet, LOOK AT meadowsweet.
        conditions:
          - all_of:
              - { has_flag: confrontation_attempted }
              - { not_flag: treatment_given }
              - { has_flag: edric_examined }
              - { has_flag: notes_read }
              - { has_flag: herbs_examined }
        effects:
          - set_flag: treatment_given
          - inc_var: { name: score, by: 10 }
          - set_quest_stage: { quest: tanners_fever, stage: treatment_given }
          - add_journal: >
              You completed the guaranteed TREAT retry after gathering all evidence.
              Godwin stopped the wormwood tonic. (+10 score)
          - narrate: >
              You present Edric's dehydration, Godwin's three-to-one wormwood dose,
              and meadowsweet's stomach-settling effect. Godwin stops the tonic, and Edric
              takes the meadowsweet. The guaranteed retry succeeds for +10 score.

  - id: godwin_notes
    name: "Godwin's case notes"
    aliases: [notes, case notes, ledger, book, log, godwin ledger, apothecary notes,
              apothecary ledger, case book, dosage record, godwin book, preparation
              notes, treatment notes, wormwood notes, case ledger, month ledger]
    description: >
      Godwin's case notes include Edric's dose ratio and a reference table. Before
      treatment, TAKE Godwin's case notes and READ Godwin's case notes only if that evidence is unfinished; doing so
      grants +3 physick and +10 score.
    variants:
      - when: [{ has_flag: notes_read }]
        text: >
          You already READ Godwin's case notes and gained +3 physick. Godwin used
          three parts wormwood extract to one part water; the standard is one-to-one.
      - when:
          - all_of:
              - { has_flag: godwin_notes_taken }
              - { not_flag: notes_read }
        text: >
          Godwin's case notes have not been READ. Before treatment, retrieve the notes
          where dropped and READ Godwin's case notes if that evidence remains open;
          afterward it is closed.
    takeable: true
    take_effects:
      - set_flag: godwin_notes_taken
      - narrate: >
          You TAKE Godwin's case notes. If treatment evidence remains open, READ Godwin's case notes
          while held to turn the dose ratio into usable evidence.
    read_text: >
      Edric has had autumn fever for five days. Godwin prescribed three parts
      wormwood extract to one part water, while the reference table sets one-to-one
      for Edric's age and weight. The written ratio confirms an overdose.
    interactions:
      # Reading the case notes: +10 score, +3 physick. One-shot (has_item + not notes_read).
      - verb: READ
        target: godwin_notes
        conditions:
          - all_of:
              - { has_item: godwin_notes }
              - { not_flag: notes_read }
              - { not_flag: treatment_given }
        effects:
          - set_flag: notes_read
          - inc_var: { name: physick, by: 3 }
          - inc_var: { name: score, by: 10 }
          - set_quest_stage: { quest: tanners_fever, stage: overdose_confirmed }
          - add_journal: >
              You READ Godwin's case notes. His wormwood dose is three-to-one, while
              the standard is one-to-one. (+3 physick, +10 score)
          - narrate: >
              You compare Godwin's three-to-one wormwood dose with the one-to-one
              standard and confirm the overdose. You gain +3 physick and +10 score.
              Complete only remaining evidence—LOOK AT Edric, READ Godwin's case notes,
              and LOOK AT meadowsweet—then use the exact TREAT action shown for Edric and
              meadowsweet. Completed evidence stays complete.

  - id: meadowsweet
    name: "meadowsweet"
    aliases: [herbs, herb, herb bundle, bundle, meadowsweet bundle, meadow sweet,
              white flowers, flowering herbs, stomach herbs, river herbs, plant,
              plants, dried herbs, fresh herbs, green bundle, white herb, herbs bundle]
    description: >
      Meadowsweet is Edric's remedy. If the evidence is unfinished, TAKE meadowsweet if
      needed, LOOK AT meadowsweet only while unidentified, and use the exact TREAT action
      shown for Edric and meadowsweet only while treatment remains unfinished. Its white
      flowers stay fresh despite the winter.
    takeable: true
    take_effects:
      - set_flag: meadowsweet_taken
    interactions:
      # Identifying a physical herb rides on LOOK, not the nonsensical "read
      # meadowsweet": +10 score, one-shot, and only once the bundle is in hand.
      - verb: INSPECT
        target: meadowsweet
        conditions:
          - all_of:
              - { has_item: meadowsweet }
              - { not_flag: herbs_examined }
              - { not_flag: treatment_given }
        effects:
          - set_flag: herbs_examined
          - inc_var: { name: score, by: 10 }
          - set_quest_stage: { quest: tanners_fever, stage: remedy_identified }
          - add_journal: >
              You INSPECTED meadowsweet and identified it as the remedy for Edric's
              dehydration. (+10 score)
          - narrate: >
              You INSPECT the meadowsweet and confirm that it will settle Edric's
              stomach so he can keep water down while the fever clears. You gain
              +10 score. Complete only remaining evidence—LOOK AT Edric, READ Godwin's
              case notes, and LOOK AT meadowsweet. In the Sickroom, use the exact TREAT
              action shown for Edric and meadowsweet. Completed evidence stays complete.

npcs:
  - id: godwin
    name: "Godwin"
    description: >
      TALK TO Godwin. Select any displayed diagnosis, dose, or recovery topic you
      still need. He is the family's experienced apothecary. He began the case
      believing his wormwood treatment was safe.
    room: sickroom
    dialogue:
      root: godwin_root
      nodes:
        - id: godwin_root
          npc_text: >
            Edric has autumn fever. I prescribed a stronger wormwood dose to reduce
            it within two days. He needs time for the tonic to work.
          variants:
            - when: [{ has_flag: treatment_given }]
              text: >
                You treated Edric, and I am revising the case notes. I have nothing
                more to add.
            - when: [{ has_flag: confrontation_attempted }]
              text: >
                Your first TREAT attempt failed. The retry needs evidence from Edric,
                my case notes, and the meadowsweet. Complete only the unfinished
                evidence, then TREAT Edric WITH meadowsweet after ordering the evidence;
                I will accept that complete case.
            - when:
                - any_of:
                    - { has_flag: asked_diagnosis }
                    - { has_flag: asked_dose }
                    - { has_flag: asked_recovery }
              text: >
                Questions will not change the treatment. Build the case from Edric,
                my case notes, and the meadowsweet. Complete only the unfinished
                evidence, then TREAT Edric WITH meadowsweet.
          topics:
            - id: ask_diagnosis
              prompt: "Ask Godwin about the diagnosis."
              conditions:
                - { not_flag: treatment_given }
                - { not_flag: asked_diagnosis }
              goto: godwin_diagnosis
            - id: ask_dose
              prompt: "Ask about the dose strength."
              conditions:
                - { not_flag: treatment_given }
                - { not_flag: asked_dose }
              goto: godwin_dose
            - id: ask_recovery
              prompt: "Ask when he expects Edric to recover."
              conditions:
                - { not_flag: treatment_given }
                - { not_flag: asked_recovery }
              goto: godwin_recovery
            - id: leave_godwin
              prompt: "Step away."
              end: true
        - id: godwin_dose
          npc_text: >
            I increased the wormwood dose because I believe a stronger preparation
            will reduce the fever faster. I do not believe the increased dose will
            harm Edric.
          effects:
            - set_flag: asked_dose
            - add_journal: >
                Godwin believes the stronger wormwood dose will speed recovery. He
                did not compare it with the reference table in his case notes.
          topics:
            - id: dose_back
              prompt: "Walk away."
              goto: godwin_root
        - id: godwin_diagnosis
          npc_text: >
            Edric has autumn fever. Wormwood is the usual treatment, and I chose
            its strength because the fever has lasted five days.
          effects:
            - set_flag: asked_diagnosis
            - add_journal: >
                Godwin diagnosed autumn fever and defended the stronger wormwood
                dose without checking whether it causes Edric's dehydration.
          topics:
            - id: diagnosis_back
              prompt: "Nod and step away."
              goto: godwin_root
        - id: godwin_recovery
          npc_text: >
            I expect Edric to recover tomorrow or the next day. I have treated this
            family for twenty years and do not consider this a difficult case.
          effects:
            - set_flag: asked_recovery
            - add_journal: >
                Godwin expects Edric to recover within two days and sees no reason
                to question the wormwood treatment.
          topics:
            - id: recovery_back
              prompt: "Step away."
              goto: godwin_root

enemies:
  # Holt — Godwin's journeyman, the corridor obstacle. Combat is the fallback when
  # the physick path is skipped or the skill check fails. He is not malicious —
  # he is doing his job, which is to enforce his master's authority in this house.
  # No preparation buffs combat stats; physick is the relevant lever, not fighting.
  #
  # Death check (no combat_guaranteed): Holt hp 12 / atk 5 / def 2.
  #   Worst player dmg: 1+4-2 = 3/round. Rounds to kill Holt: ceil(12/3) = 4.
  #   Worst Holt dmg: 6+5-2 = 9/round. Over 3 rounds (before kill): 27. 27 > 20 HP.
  #   Holt CAN kill on worst dice. ending_expelled (death) is reachable.
  #   No combat_guaranteed: the pack's answer to the combat threat is physick, not prep.
  - id: holt
    name: "Holt"
    description: >
      ATTACK Holt to force the Corridor's north exit, but the fight can kill you.
      Defeating him does not treat Edric; you must still carry meadowsweet after
      you LOOK AT meadowsweet. Holt is Godwin's stocky journeyman.
    room: corridor
    conditions: [{ not_flag: treatment_given }]
    hp: 12
    attack: 5
    defense: 2
    defeat_flag: holt_defeated
    death_ending: ending_expelled
    on_defeat:
      - set_quest_stage: { quest: tanners_fever, stage: corridor_forced }
      - add_journal: >
          You defeated Holt, but Edric is untreated. Go north only with held and
          INSPECTED meadowsweet, or go south and use the exact TREAT action shown
          for Edric and meadowsweet.

win_conditions:
  # Locomotion win: reaching market_lane — accessible via physick path
  # (treatment_given unlocks corridor N) OR forced passage (holt_defeated plus
  # identified, carried meadowsweet). The combat route cannot invent a remedy the
  # player never found.
  # The +15 capstone fires on market_lane's on_enter in the same step as the win.
  - id: lane_reached
    conditions: [{ visited: market_lane }]
    ending: ending_recovered

endings:
  - id: ending_expelled
    title: "Killed in the Corridor"
    text: >
      Holt kills you in the corridor. Edric remains on Godwin's three-to-one
      wormwood tonic. *** You have fallen. ***
    death: true

  - id: ending_recovered
    title: "The Meadowsweet"
    # Reactive: the hybrid epilogue acknowledges Holt before the peaceful physick
    # path. Base text covers forced passage with an identified remedy delivered.
    variants:
      - when:
          - { has_flag: treatment_given }
          - { has_flag: holt_defeated }
        text: >
          You treated Edric with meadowsweet, and Godwin stopped the wormwood tonic.
          Edric will recover, but you also injured Holt before resolving the case.
          *** You have won. ***
      - when: [{ has_flag: treatment_given }]
        text: >
          You treated Edric with meadowsweet. Godwin stopped the wormwood tonic and
          will revise the formula. Edric should recover by week's end.
          *** You have won. ***
    text: >
      You defeated Holt and left the identified meadowsweet with the factor's boy,
      along with preparation directions. Edric has the correct remedy, but you did
