# The Gallowmere — a Stage 4 (Hero's-Quest) pack (spec §13, §14 gate).
#
# The game's SIXTH RPG pack. It introduces TWO new skill vars — `tracking`
# (reading spoor and sign on the ground) and `lore` (moorland animal-behaviour and
# wind-reading) — as the pack's primary skill axes, and becomes the FIRST curated
# pack to combine `combat_guaranteed: true` with a LETHAL one-shot skill check in
# the same narrative. None of the five prior packs use both simultaneously:
#   - dawn_beacon / wolf_winter: combat_guaranteed + non-lethal skill checks only
#   - breaking_weir: lethal skill check (nerve, DC 9) + NO combat at all
# Here BOTH are load-bearing and orthogonal: tracking the kill-site gives +2 attack
# (makes the combat guaranteed); heeding Hedrick's lore counsel gives +5 lore (makes
# the lethal DC-9 wind-check pass on worst roll). Skip either prep and you carry the
# cost into the relevant danger; skip both and the moor takes you.
#
# The fiction earns both guarantees the same way prior packs earn theirs (bug_0027/
# 0029/0069/0114): not blind luck but skill and preparation decide the hunt. The
# Gallowmere sow — a great old grey tusker, yellow-tusked, heavy in the shoulder —
# has killed a shepherd on the high moor. You are the huntsman hired to take her
# before nightfall. Hedrick Cradoc, the dead shepherd's son, keeps his father's
# tracking-log and knows the moor better than anyone living; he can tell you how the
# sow charges (opens the attack angle, +2 attack once applied at the kill-site, and
# unlocks a one-shot blind-side strike in the hollow) and, more critically, how to
# read the wind-stone at the Gallowmere Gully before entering — because a sow this old
# always charges from upwind, and a hunter who misreads the gully entrance is gored
# before she sees the blade (+5 lore so the DC-9 wind check passes on worst roll). The
# combat_guaranteed flag is spoken aloud by Hedrick and proved by the validator; the
# lethal check is telegraphed by the log, Hedrick, and the room prose, never an ambush
# (bug_0123).
#
#   moor_edge ─ W ─ shepherd_bothy (Hedrick NPC; shepherd_log +5)
#   (start; hunting_knife)
#   │ N
#   moor_trail ─ E ─ kill_site (spoor_ground; tracking check → found_kill, +2 atk, +10)
#   │ N
#   moor_gully (wind_stone; LETHAL lore check DC9 → +2 def, +10; death: ending_gored)
#   │ N* (gated on read_wind)
#   moor_hollow (the Gallowmere sow — FIGHT; death_ending: ending_taken)
#   │ N* (gated on sow_slain)
#   moor_ridge (WIN +15, locomotion win)
#   (* each gated on prior beat)
#
# Score (max 50, the 5+10+10+10+15 milestone shape the corpus shares): read the
# shepherd's log (+5, §17 clue naming the sow's lair, wind-stone, and charge angle),
# read the kill-site (+10 after one tracking roll or its deterministic recovery, then
# retired by found_kill), pass the lore check at the gully (+10, one-shot on_success, gated
# none_of read_wind — scored ONLY on survival, never on the death branch per the
# score-economy bracket rule), put the sow down (+10, on_defeat), and reach the ridge
# with the Gallowmere behind you (+15, locomotion win). The perfect 50 coincides with
# the ridge, never before; SCORE_PEAKS_BEFORE_WIN does not fire on a navigation win
# (bug_0116).
#
# Combat-guaranteed proof (best reachable: atk8/def4/hp24 — tracking +2 atk, the
# blind-side strike +2 atk, the lore check +2 def, and base hp):
#   - sow (hp15/atk5/def2): worst player dmg 1+8-2 = 7, so 3 rounds to kill;
#     worst incoming 6+5-4 = 7, over the 2 rounds the sow survives = 14.
#   - 14 < 24 HP, margin 10 — clears COMBAT_NOT_GUARANTEED.
# Without tracking (atk4/def4/hp24): worst dmg 1+4-2 = 3, 5 rounds to kill;
# worst incoming 7 × 4 surviving rounds = 28 > 24 → sow CAN kill on worst dice,
# gamble stays live for the un-tracked hunter.
# Heeding Hedrick (lore=8, DC=9): 1+8=9>=9, worst-roll guaranteed safe.
# Without counsel (lore=3, DC=9): d20>=6 required (~75%), real lethal gamble.
# Note: every hunter who reaches the fight has def4 (the lore check is the gully gate;
# its on_success awards +2 def; no one enters moor_hollow without it). The un-tracked
# gamble is atk4/def4, not atk4/def2. Sow hp=15 (not 12) is chosen so that worst-dice
# atk4/def4/hp24 dies (28>24), while atk6/def4/hp24 still survives (14<24).

meta:
  id: gallowmere_v1
  title: "The Gallowmere"
  start_room: moor_edge
  # Two new skill vars alongside the standard combat pair and hp:
  # `tracking`: reading spoor, hoof-sign, and ground evidence.
  # `lore`: moorland animal behaviour, wind-reading, hunter's knowledge.
  # hp 24 is tuned for the combat_guaranteed margin (14 worst-case < 24).
  vars_init: { hp: 24, attack: 4, defense: 2, tracking: 3, lore: 3 }
  flags_init: []
  # With both preps (tracking +2 atk at kill_site, the one-shot blind-side strike
  # +2 atk in the hollow, lore +2 def at wind_stone) best reachable = atk8/def4/hp24;
  # sow worst-case damage = 14 < 24 HP. Proved above.
  combat_guaranteed: true
  max_score: 50

rooms:
  - id: moor_edge
    name: "The Moor's Edge"
    description: >
      Go west to the Shepherd's Bothy to TALK TO Hedrick and READ shepherd's log.
      Go north to follow the Moor Trail. Your hunting-knife is already secured
      at your belt. The Gallowmere sow killed Hedrick's father this morning.
    exits:
      - { direction: west, to: shepherd_bothy }
      - { direction: north, to: moor_trail }

  - id: shepherd_bothy
    name: "The Shepherd's Bothy"
    description: >
      At the work-bench, READ shepherd's log for instructions about the Gallowmere
      sow. TALK TO Hedrick. Choose any displayed advice topic you still need. Go east
      to return to the Moor's Edge. The low stone hut smells of cold ash and wool.
    # Reactive: once the log is read, the bench reads as already studied.
    variants:
      - when: [{ has_flag: read_log }]
        text: >
          You have read the shepherd's log. TALK TO Hedrick if you still need
          advice, or go east to return to the Moor's Edge.
    objects: [shepherd_log]
    exits:
      - { direction: east, to: moor_edge }

  - id: moor_trail
    name: "The Moor Trail"
    description: >
      If tracking is unfinished, go east and use the exact TRACK action shown for
      kill-site ground and hunting-knife. It reconstructs the sow's charge and grants
      persistent +2 attack. A completed hunt stays complete. Go north to the Moor Gully,
      or south to the Moor's Edge.
    objects: [peat_sign]
    exits:
      - { direction: south, to: moor_edge }
      - { direction: east, to: kill_site }
      - { direction: north, to: moor_gully }

  - id: kill_site
    name: "The Kill Site"
    description: >
      TRACK kill-site ground WITH hunting-knife to reconstruct the Gallowmere
      sow's charge angle. Success grants persistent +2 attack. If the first check fails,
      TRACK kill-site ground from a lower stance WITH hunting-knife; the second attempt is guaranteed. This does
      not reopen a completed hunt. Go west to return to the Moor Trail.
    # Reactive: after a failed first reading, the disturbed ground truthfully frames
    # the one deterministic recovery; once read, it no longer invites close reading.
    variants:
      - when: [{ has_flag: found_kill }]
        text: >
          You have read the kill-site ground and gained +2 attack. Go west to return
          to the Moor Trail.
      - when:
          - { has_flag: kill_site_attempted }
          - { not_flag: found_kill }
        text: >
          Your first TRACK attempt failed. TRACK kill-site ground from a lower stance
          WITH hunting-knife; this retry is guaranteed. Go
          west to return to the Moor Trail.
    objects: [spoor_ground]
    exits:
      - { direction: west, to: moor_trail }

  - id: moor_gully
    name: "The Moor Gully"
    description: >
      GAUGE wind-stone WITH hunting-knife before going north. Success grants
      +2 defense and unlocks the north exit. Failure ends the game: the Gallowmere
      sow gores you. Go south to return to the Moor Trail. Black water stands between
      the peat banks.
    # Reactive: once wind is read, the gully looks passable.
    variants:
      - when: [{ has_flag: read_wind }]
        text: >
          You have gauged the wind-stone and gained +2 defense. Go north to the
          Gallowmere Hollow, or south to the Moor Trail.
    objects: [wind_stone]
    exits:
      - { direction: south, to: moor_trail }
      - direction: north
        to: moor_hollow
        conditions: [{ has_flag: read_wind }]
        locked_msg: >
          The north exit is locked until you GAUGE wind-stone WITH hunting-knife.
          Failure on that check ends the game.

  - id: moor_hollow
    name: "The Gallowmere Hollow"
    description: >
      ATTACK Gallowmere sow to continue the hunt. Go south to retreat to the
      Moor Gully. The great grey sow waits among black peat and broken reeds.
    # Reactive: once the sow is down the hollow opens north.
    variants:
      - when: [{ has_flag: sow_slain }]
        text: >
          The Gallowmere sow is dead. Go north to the Moor Ridge to finish the hunt,
          or south to the Moor Gully.
      - when: [{ has_flag: blind_side_struck }]
        text: >
          You struck the blind side and gained +2 attack. Continue with ATTACK
          Gallowmere sow, or go south to the Moor Gully.
      - when:
          - { not_flag: sow_slain }
          - { not_flag: blind_side_struck }
          - { has_flag: found_kill }
          # No prior nonterminal Gallowmere beat deals HP damage, and every surviving
          # sow counterattack deals at least 1, so hp <= 23 marks ordinary combat in
          # every RNG regime from the exact 24 HP opening state.
          - { var_lte: { name: hp, value: 23 } }
        text: >
          The first-round chance to STRIKE the blind side is gone. Continue to ATTACK
          Gallowmere sow, or go south to the Moor Gully.
      - when: [{ has_flag: found_kill }]
        text: >
          Before your first attack, STRIKE the blind side WITH hunting-knife to
          gain +2 attack. This option locks after you use it or take a counterattack.
          Go south to retreat to the Moor Gully. The Gallowmere sow waits in the reeds.
    objects: [sow_blind_side]
    exits:
      - { direction: south, to: moor_gully }
      - direction: north
        to: moor_ridge
        conditions: [{ has_flag: sow_slain }]
        locked_msg: >
          The north exit is locked while the Gallowmere sow lives. ATTACK
          Gallowmere sow until you defeat her.

  - id: moor_ridge
    name: "The Moor Ridge"
    description: >
      You defeated the Gallowmere sow and made the valley safe for the shepherds.
      The last grey light crosses the valley below.
    # Locomotion win: score fires on entry, quest stage closes.
    on_enter:
      - set_quest_stage: { quest: gallowmere_hunt, stage: hunt_done }
      - add_journal: >
          You killed the Gallowmere sow. The valley shepherds are safe from her
          this winter.
      - inc_var: { name: score, by: 15 }
    exits:
      - { direction: south, to: moor_hollow }

objects:
  - id: hunting_knife
    name: "hunting-knife"
    aliases: [knife, blade, edge, hunting blade, hunter's knife, huntsman's knife, hunting knife]
    description: >
      Its exact offered uses are TRACK kill-site ground WITH hunting-knife or the shown
      lower-stance retry, GAUGE wind-stone WITH hunting-knife, and STRIKE the blind side
      WITH hunting-knife. Use only each currently offered action; completed steps stay
      complete. The knife is held and cannot be dropped.
    # Real starting gear, not prose-only equipment or a zero-payoff mandatory pickup.
    # `held` seeds fresh inventory and makes the knife non-droppable, matching the
    # same contract used by Wolf-Winter's Albany relief spear.
    held: true

  - id: sow_blind_side
    name: "the blind side"
    aliases: [blind side, sow's blind side, opening, angle, charge angle, tusk line, left tusk, shoulder]
    description: >
      STRIKE the blind side WITH hunting-knife before your first attack to gain
      +2 attack. The option requires the kill-site ground and wind-stone preparations.
    variants:
      - when: [{ has_flag: sow_slain }]
        text: "The Gallowmere sow is dead, so the blind side can no longer be used."
      - when: [{ has_flag: blind_side_struck }]
        text: >
          You already struck the blind side and gained +2 attack. It cannot be used again.
      - when:
          - { not_flag: sow_slain }
          - { not_flag: blind_side_struck }
          - { has_flag: found_kill }
          # The same proof-safe one-round boundary drives the room copy above: no
          # earlier nonterminal beat costs HP, while every surviving reply costs 1+.
          - { var_lte: { name: hp, value: 23 } }
        text: >
          The chance to STRIKE the blind side expired after the first counterattack.
          Continue with ATTACK Gallowmere sow.
      - when: [{ none_of: [{ has_flag: found_kill }] }]
        text: >
          You cannot STRIKE the blind side because you did not read the kill-site
          ground. Continue with ATTACK Gallowmere sow.
    takeable: false
    interactions:
      # The blind pass (20260622T164710Z, seed 7) called out the climax: all the
      # tactical prep (charge angle, tusk side, wind quarter) collapsed into plain
      # repeated ATTACK. This one-shot knife-on-opening use turns the learned kill-site
      # angle into a visible choice in the fight without changing the score economy. It is gated
      # on BOTH earned knowledge beats, so an untracked hunter still gets the riskier
      # simple fight the comments above tune as the live gamble.
      - verb: USE
        item: hunting_knife
        target: sow_blind_side
        command_verb: strike
        command_template: "strike {target} with {item}"
        conditions:
          - { in_room: moor_hollow }
          - { has_flag: found_kill }
          - { has_flag: read_wind }
          - { not_flag: blind_side_struck }
          - { not_flag: sow_slain }
          # Gallowmere has no earlier nonterminal HP cost; from the exact 24 HP
          # opening, every surviving ordinary counterattack crosses hp <= 23 even
          # on the lowest roll. Negating that boundary keeps this first-cut tactic
          # strictly precombat without reading hidden enemy state.
          - none_of:
              - { var_lte: { name: hp, value: 23 } }
        effects:
          - set_flag: blind_side_struck
          - inc_var: { name: attack, by: 2 }
          - add_journal: >
              You struck the Gallowmere sow's blind side with the hunting-knife and
              gained +2 attack.
          - narrate: >
              You STRIKE the blind side with your hunting-knife before the left tusk
              rises. The cut slows the sow's turns and grants +2 attack for later strikes.

  - id: shepherd_log
    name: "shepherd's log"
    aliases: [log, ledger, journal, book, notes, tracking log, cradoc's log, shepherd log]
    description: >
      The shepherd's log records the Gallowmere sow's location, wind warning, and
      charge angle. READ shepherd's log only if that action is still offered; completed reading
      stays recorded.
    # read_text is shown when the player READs the object; the interactions block
    # fires the one-shot flag-and-score effect on the first READ.
    read_text: >
      Cradoc's last entries say the Gallowmere sow waits in the Gallowmere Hollow
      and attacks from upwind. Use the exact TRACK action shown for kill-site ground
      and hunting-knife, then GAUGE wind-stone WITH hunting-knife before entering.
      Complete only the next offered preparation; finished steps stay complete.
    takeable: false
    interactions:
      - verb: READ
        target: shepherd_log
        conditions: [{ not_flag: read_log }]
        effects:
          - set_flag: read_log
          - set_quest_stage: { quest: gallowmere_hunt, stage: log_read }
          - inc_var: { name: score, by: 5 }
          - add_journal: >
              Cradoc's log records that the kill-site ground revealed the sow's charge
              angle and the wind-stone revealed the safe approach to Gallowmere Hollow.
              Complete only preparation still offered; a completed hunt stays complete.

  - id: peat_sign
    name: "peat sign"
    aliases: [sign, peat, trod, passage, hoofmarks, hoof marks, peat marks]
    description: >
      These hoofprints lead north toward the Moor Gully. If tracking remains unfinished,
      go east and use the offered TRACK action on the kill-site ground. Otherwise, the
      recorded charge angle and +2 attack persist; a completed hunt stays complete.
    takeable: false

  - id: spoor_ground
    name: "kill-site ground"
    aliases: [ground, spoor, tracks, blood, marks, trail, kill, hoof, hoofprints, prints, site, kill site, kill-site]
    description: >
      TRACK kill-site ground WITH hunting-knife to reconstruct the Gallowmere sow's
      charge angle and gain persistent +2 attack. If the first check fails, the shown
      lower-stance TRACK action is a guaranteed retry. A completed hunt stays complete.
    # Reactive: a failed first reading names the remaining, deliberate recovery.
    variants:
      - when: [{ has_flag: found_kill }]
        text: >
          You already TRACKED the kill-site ground and gained +2 attack. The ground
          showed that the Gallowmere sow pivoted right and raised her left tusk when
          charging. The bonus persists, and a completed hunt stays complete.
      - when:
          - { has_flag: kill_site_attempted }
          - { not_flag: found_kill }
        text: >
          Your first TRACK attempt failed. TRACK kill-site ground from a lower stance
          WITH hunting-knife; this retry is guaranteed.
    takeable: false
    interactions:
      # The first tracking reading is a real check. Failure retires that random roll,
      # records what was learned, and exposes the deterministic same-action recovery
      # below; the +10 can still never be farmed after found_kill.
      - verb: USE
        item: hunting_knife
        target: spoor_ground
        command_verb: track
        command_template: "track {target} with {item}"
        conditions:
          - all_of:
              - { not_flag: kill_site_attempted }
              - { not_flag: found_kill }
        skill_check:
          skill: tracking
          difficulty: 10
          on_success:
            - set_flag: found_kill
            - set_quest_stage: { quest: gallowmere_hunt, stage: kill_read }
            - inc_var: { name: attack, by: 2 }
            - inc_var: { name: score, by: 10 }
            - add_journal: >
                You TRACKED the kill-site ground. The spoor shows that the Gallowmere sow
                pivoted right and raised her left tusk when charging. (+2 attack)
            - narrate: >
                You compare the deepest print with your hunting-knife and reconstruct how
                the Gallowmere sow pivoted right, raised her left tusk, and exposed her
                blind side. You gain persistent +2 attack; completed fights stay complete.
          on_failure:
            - set_flag: kill_site_attempted
            - add_journal: >
                Your first TRACK attempt failed. TRACK kill-site ground from a lower
                stance WITH hunting-knife for a guaranteed retry.
            - narrate: >
                The overlapping prints prevent a clear reading. TRACK kill-site ground
                from a lower stance WITH hunting-knife; the next
                attempt is guaranteed and consumes no item or HP.

      # Same player-facing track action after the failed first reading: no second die
      # roll, but the original successful preparation, reward, and combat option remain.
      - verb: USE
        item: hunting_knife
        target: spoor_ground
        command_verb: track
        command_template: "track {target} from a lower stance with {item}"
        conditions:
          - all_of:
              - { has_flag: kill_site_attempted }
              - { not_flag: found_kill }
        effects:
          - set_flag: found_kill
          - set_quest_stage: { quest: gallowmere_hunt, stage: kill_read }
          - inc_var: { name: attack, by: 2 }
          - inc_var: { name: score, by: 10 }
          - add_journal: >
              You TRACKED the kill-site ground. The spoor shows that the Gallowmere sow
              pivoted right and raised her left tusk when charging. (+2 attack)
          - narrate: >
              From a lower stance, you compare the deepest print with your hunting-knife
              and reconstruct how the Gallowmere sow pivoted right, raised her left tusk,
              and exposed her blind side. You gain persistent +2 attack; completed fights stay complete.

  - id: wind_stone
    name: "wind-stone"
    aliases: [stone, standing stone, old stone, pitted stone, wind stone, windstone, marker, standing]
    description: >
      GAUGE wind-stone WITH hunting-knife before entering the Gallowmere
      Hollow. Success grants +2 defense and unlocks the north exit. Failure ends the
      game when the Gallowmere sow gores you. The stone's east face is deeply pitted.
    # Reactive: once wind is read, the stone shows as already worked.
    variants:
      - when: [{ has_flag: read_wind }]
        text: >
          You already GAUGED the wind-stone and gained +2 defense. The wind runs
          northeast, so you can enter the Gallowmere Hollow from the southwest.
    takeable: false
    interactions:
      # Lore skill check — the ONE LETHAL obstacle (the pack's single one-shot death gate,
      # the breaking_weir storm-walk shape applied to a hunting context). Tool-on-target
      # USE: the hunting-knife must be held to attempt the reading (you hold the flat of
      # the blade into the wind and match it to the stone's weathering). NON-retryable:
      # on_failure ends the game (ending_gored) — misread the wind, the sow circles
      # downwind, she is on you from behind a peat-hag before you have your knife up. A
      # final fatal fall cannot be retried (bug_0027 honesty: the failure narrate explains
      # the consequence and the prose telegraphs it clearly ahead of time). DC 9 vs lore:
      # base lore 3 needs d20>=6 (~75%, real gamble); Hedrick's counsel (+5 lore) lifts
      # lore to 8 so the WORST roll passes (1+8=9>=9) — heeding Hedrick makes the reading
      # safe, exactly the load-bearing prep the prose promises. One-shot award: gated
      # none_of read_wind; no score on the fatal branch (score-economy bracket rule). The
      # +2 defense on success is also what makes the combat_guaranteed bound hold: every
      # hunter who reaches the fight has def4 (this check is the gate; you cannot enter
      # moor_hollow without read_wind, and read_wind is set only on success, which also
      # grants +2 def). Telegraphed by the log, by Hedrick, and by the room prose
      # (bug_0123: never an ambush).
      - verb: USE
        item: hunting_knife
        target: wind_stone
        command_verb: gauge
        command_template: "gauge {target} with {item}"
        conditions: [{ none_of: [{ has_flag: read_wind }] }]
        skill_check:
          skill: lore
          difficulty: 9
          on_success:
            - set_flag: read_wind
            - set_quest_stage: { quest: gallowmere_hunt, stage: wind_read }
            - inc_var: { name: defense, by: 2 }
            - inc_var: { name: score, by: 10 }
            - add_journal: >
                You GAUGED the wind-stone. The wind runs northeast, so you can enter
                from the southwest without warning the Gallowmere sow. (+2 defense)
            - narrate: >
                You hold the hunting-knife against the wind-stone and confirm a
                northeast wind. You choose the southwest approach, unlock the north
                exit, and gain +2 defense.
          on_failure:
            - end_game: ending_gored

npcs:
  - id: hedrick
    name: "Hedrick"
    description: "Hedrick Cradoc is the dead shepherd's son. He can explain how the Gallowmere sow hunts and where his father failed."
    room: shepherd_bothy
    dialogue:
      root: hedrick_root
      nodes:
        - id: hedrick_root
          npc_text: >
            If the shepherd's log is unread, it is on the work-bench. READ shepherd's log.
            Ask me about the Gallowmere sow or my father. The log contains forty years
            of his notes.
          # bug_0325/0322 pattern: short variant on return after any topic heard,
          # so the full greeting does not re-fire on every return from a topic node.
          variants:
            - when:
                - any_of:
                    - { has_flag: heard_lore_counsel }
                    - { has_flag: heard_father }
              text: "What else do you need from me?"
          topics:
            - id: ask_sow
              prompt: "Ask Hedrick how the sow hunts."
              conditions: [{ not_flag: heard_lore_counsel }]
              goto: hedrick_sow
            - id: ask_father
              prompt: "Ask Hedrick about his father."
              conditions: [{ not_flag: heard_father }]
              goto: hedrick_father
            - id: leave_hedrick
              prompt: "Thank him and step out."
              end: true
        - id: hedrick_sow
          npc_text: >
            The Gallowmere sow's habit was to attack from upwind. If the wind-stone reading
            is unfinished and GAUGE is offered, GAUGE wind-stone WITH hunting-knife before
            entering the Gallowmere Hollow. A correct reading points to the southwest
            approach and grants +2 defense. Before the stone was read, failure could let
            her gore you and end the journey. Completed reading and combat stay complete.
          effects:
            - set_flag: heard_lore_counsel
            - inc_var: { name: lore, by: 5 }
            - add_journal: >
                Hedrick warned that the wind-stone and hunting-knife reveal the safe
                southwest approach to the Gallowmere Hollow. (+5 lore)
          topics:
            - id: hedrick_sow_back
              prompt: "Nod, and ask something else."
              goto: hedrick_root
        - id: hedrick_father
          npc_text: >
            My father rushed into the Gallowmere Hollow and misread the wind. His
            shepherd's log records that mistake. READ shepherd's log if unfinished. If the sow
            still stands, GAUGE wind-stone WITH hunting-knife when offered before entering; completed
            preparation and combat stay complete.
          effects:
            - set_flag: heard_father
            - add_journal: >
                Hedrick said his father died after rushing and misreading the wind.
                The shepherd's log and wind-stone preserve the safer approach.
          topics:
            - id: hedrick_father_back
              prompt: "Promise to read carefully, then ask something else."
              goto: hedrick_root

enemies:
  # The Gallowmere sow — the pack's single combat, the fair one-fight guaranteed proof.
  # Combat is one ATTACK = one round: player deals d6+attack-enemy.defense (min 1),
  # and the enemy, if it survives, deals d6+enemy.attack-playerDef (min 1). Player
  # strikes first each round.
  #
  # Tuned so the fully-prepared hunter (best reachable: atk8/def4/hp24 — tracking
  # check +2 atk, blind-side strike +2 atk, lore-check +2 def, base hp) survives on
  # the WORST rolls:
  #   - sow (hp15/atk5/def2): worst player dmg 1+8-2=7, so 3 rounds to kill;
  #     worst incoming 6+5-4=7, over the 2 rounds the sow survives = 14.
  #   - 14 < 24 HP — clears COMBAT_NOT_GUARANTEED with margin 10.
  # Without tracking (atk4/def4/hp24): worst dmg 1+4-2=3, 5 rounds to kill;
  # worst incoming 7 × 4 surviving rounds = 28 > 24 → sow CAN fell the hunter
  # on worst dice, so the death ending ending_taken is reachable (gamble stays live,
  # by design). Sow hp=15 chosen so both inequalities hold: 14<24 (guaranteed) and
  # 28>24 (gamble reachable). hp=12 was insufficient: worst-dice atk4/def4/hp24
  # still survives 21<24 — ending_taken would be unreachable.
  # Note: def4 is guaranteed for ALL fighters (lore check awards +2 def on success;
  # moor_gully's north exit is gated on read_wind which sets only on success).
  # The un-tracked gamble is atk4/def4/hp24, never atk4/def2/hp24.
  # Both enemies telegraphed in room prose; a fall is save-recoverable (§8.7).
  - id: gallowmere_sow
    name: "Gallowmere sow"
    description: >
      ATTACK Gallowmere sow to defeat her. STRIKE the blind side WITH hunting-knife
      only while that action is offered; its +2 attack persists once gained. Otherwise,
      continue with ATTACK Gallowmere sow. The old grey sow has long tusks and heavy shoulders.
    room: moor_hollow
    hp: 15
    attack: 5
    defense: 2
    defeat_flag: sow_slain
    death_ending: ending_taken
    on_defeat:
      - add_journal: >
          You killed the Gallowmere sow. The north exit to the Moor Ridge is open.
      - inc_var: { name: score, by: 10 }

win_conditions:
  # Locomotion win: reaching moor_ridge after the sow is down (the north exit from
  # moor_hollow is gated on sow_slain, so the ridge is only accessible via the hunt).
  # The on_enter inc_var +15 fires in the same frame; SCORE_PEAKS_BEFORE_WIN is exempt
  # for navigation wins (bug_0116). The full 50 coincides with stepping onto the ridge.
  - id: hunt_won
    conditions: [{ visited: moor_ridge }]
    ending: ending_hunt_won

endings:
  - id: ending_hunt_won
    title: "The Gallowmere Taken"
    text: >
      You killed the Gallowmere sow and reached the Moor Ridge. The valley shepherds
      are safe, and Hedrick can close his father's log. Grey evening settles over the
      moor. *** You have won. ***

  - id: ending_gored
    title: "The Moor's Keeping"
    text: >
      You failed to GAUGE the wind-stone. The Gallowmere sow attacked from the
      northeast and gored you before you could raise the hunting-knife. This ending
      cannot be retried within the journey. *** You have fallen. ***
    death: true

  - id: ending_taken
    title: "The Old Tusker Won"
    text: >
      The Gallowmere sow killed you in combat. Her tusks knocked you down, and she
      crushed you under her weight. She remains alive in Gallowmere Hollow.
      *** You have fallen. ***
    death: true
