# The Factor's Mark — a Stage 4 (Hero's-Quest) pack (spec §13).
#
# The game's SEVENTH RPG pack — and the FIRST to introduce `authority`, a social/
# command stat measuring official bearing, institutional command, and the ability to
# make a formal argument carry weight under pressure. No prior RPG pack uses a social
# stat: all six predecessors use physical or craft vars (might, tracking, lore, nerve)
# or the standard combat pair. Here authority is the PRIMARY resolution lever — this is
# a bureaucratic ambush, not a hunt or a haunting, and the right tool is calling out a
# corrupt official in front of a witness, not a blade.
#
# Factor Harwick has impounded your merchant's passage-seal at the Saltmere waystation
# on invented contraband grounds — standard extortion, a form he can write on anyone.
# His enforcement man Breckel holds the north gate. You need the seal and the road.
#
# TWO RESOLUTION PATHS (a first in the RPG corpus — prior packs resolve via a single
# primary mechanic with optional preparation):
#   SOCIAL (primary, full score): gather evidence (read the factor's ledger for the
#   systematic overcharges, +3 authority) and a witness (Silas the drover's testimony,
#   +3 authority), then USE the ledger AGAINST the impound notice to make the public
#   confrontation. Authority DC 11 vs authority 3 base (6 with ledger evidence, 9 with
#   both). Success: Harwick folds, gate open, Breckel stands aside — never fought.
#   COMBAT (fallback, partial score): skip the social path or fail the check — Breckel
#   must be fought to pass. He CAN kill a base-stat player on worst dice (no
#   combat_guaranteed). The brute path caps at 40/50; the social path reaches 50.
#
#   waystation_yard (start, seal_notice object, Harwick NPC)
#   │  E → weighing_room (factor_ledger: +10 read, +3 authority)
#   │  W → drover_stall (Silas NPC: +10 testimony, +3 authority)
#   │  N → gate_arch (Breckel enemy; N gated on factor_shamed OR breckel_defeated)
#   └─────── gate_arch: N (factor_shamed OR breckel_defeated) → toll_road (WIN +15)
#
# Score (max 50, the 5+10+10+10+15 shape):
#   +5  READ seal_notice   — impound notice in waystation_yard (one-shot: not_flag notice_read)
#   +10 READ factor_ledger — close reading of the toll register (+3 authority; one-shot: not_flag ledger_studied)
#   +10 Silas testimony    — witnessed account (+3 authority; one-shot: not_flag heard_silas)
#   +10 authority check success — USE ledger ON seal_notice, DC 11 (retires only on success)
#   +15 toll_road on_enter — WIN (locomotion win, coincides with game end)
#   Breckel on_defeat: +0  — combat path is valid but sub-optimal; brute-force is its own cost.
#
# Combat death check (no combat_guaranteed):
#   Player base hp 20 / atk 4 / def 2. Breckel hp 14 / atk 5 / def 1.
#   Worst player dmg per round: 1+4-1 = 4. Rounds to kill Breckel: ceil(14/4) = 4.
#   Worst Breckel dmg per round: 6+5-2 = 9. Total over 3 rounds: 27 > 20 HP.
#   Breckel CAN kill on worst dice. ending_impounded (death) is reachable. No
#   combat_guaranteed flag — the pack's honest survival path is social, not combat prep.
#   Breckel telegraphed in room prose (never an ambush, bug_0123). A fall is
#   save-recoverable (§8.7).

meta:
  id: factors_mark_v1
  title: "The Factor's Mark"
  start_room: waystation_yard
  # `authority` (3 base): projects official bearing, institutional command, the
  # ability to make a formal argument stick in front of a witness. New to the corpus —
  # no prior RPG pack uses a social stat. Used in the confrontation skill_check
  # (USE factor_ledger ON seal_notice, DC 11): base 3 → d20>=8 (65% gamble); with
  # ledger evidence (+3) → d20>=5 (80%); with both preps → d20>=2 (~95% near-certain).
  # Authority does NOT boost combat stats — it is the wrong tool for a fight.
  vars_init: { hp: 20, attack: 4, defense: 2, authority: 3 }
  flags_init: []
  # No combat_guaranteed: Breckel on worst dice kills a base-stat player (27 > 20 HP).
  # The pack's answer to the combat threat is to take the social path, not to buff for
  # the fight. See the enemies block for the math.
  max_score: 50

rooms:
  - id: waystation_yard
    name: "The Waystation Yard"
    description: >
      Factor Harwick holds your passage-seal under an impound notice. READ
      impound notice, go east to the Weighing Room for the factor's ledger, and go
      west to the Drover's Stall for a witness. Breckel guards the north gate.
    # Reactive: once factor_shamed the yard reads as resolved.
    variants:
      - when: [{ has_flag: factor_shamed }]
        text: >
          Harwick returned your passage-seal. Breckel no longer blocks north. Go north
          to the Gate Arch, east to the Weighing Room, or west to the Drover's Stall.
      - when: [{ has_flag: breckel_defeated }]
        text: >
          You defeated Breckel, so the north gate is open. Harwick remains in the
          yard with your disputed passage-seal. Go north to the Gate Arch, east to
          the Weighing Room, or west to the Drover's Stall.
    objects: [seal_notice]
    exits:
      - { direction: east, to: weighing_room }
      - { direction: west, to: drover_stall }
      - { direction: north, to: gate_arch }

  - id: weighing_room
    name: "The Weighing Room"
    description: >
      The workbench is where the factor's ledger was kept. TAKE factor's ledger if it
      is here, or retrieve the ledger if needed. If its evidence is unfinished, READ
      factor's ledger to document
      Harwick's overcharges and gain +3 authority. The Waystation Yard is west.
    # Reactive: once the ledger is taken the bench reads as cleared.
    variants:
      - when: [{ has_item: factor_ledger }]
        text: >
          You hold the factor's ledger. Its overcharge pattern grants +3 authority
          when first documented; complete only unfinished evidence. The Waystation
          Yard is west.
    objects: [factor_ledger]
    exits:
      - { direction: west, to: waystation_yard }

  - id: drover_stall
    name: "The Drover's Stall"
    description: >
      Silas has waited three hours and saw Harwick take payment from another
      merchant. If the dispute is unresolved, TALK TO Silas, then select the displayed "Ask
      Silas to put his testimony on record." topic for +3 authority. If already settled, his testimony records what happened. The
      Waystation Yard is east.
    # Reactive: once Silas has given testimony the stall reads as already visited.
    variants:
      - when: [{ has_flag: heard_silas }]
        text: >
          Silas agreed to confirm the factor's ledger in public. If the dispute is
          unresolved, go east to the Waystation Yard and PRESENT factor's ledger
          against impound notice. The yard is east.
    exits:
      - { direction: east, to: waystation_yard }

  - id: gate_arch
    name: "The Gate Arch"
    description: >
      Breckel blocks north with a truncheon. Go south to the Waystation Yard and
      PRESENT factor's ledger against impound notice to make Harwick call him off, or
      ATTACK Breckel. Combat risks death and gives no confrontation score.
    # Two variants: social victory (factor_shamed) and combat victory (breckel_defeated).
    # Most-specific first: breckel_defeated with factor_shamed is the combat path even
    # if factor_shamed was somehow also set (not achievable in normal play, but safe).
    variants:
      - when: [{ has_flag: factor_shamed }]
        text: >
          Harwick yielded, Breckel no longer blocks the gate, and north is open. Go
          north to the Toll Road or south to the Waystation Yard.
      - when: [{ has_flag: breckel_defeated }]
        text: >
          Breckel is down, and the gate is open. Go north to the Toll Road or south
          to the Waystation Yard.
    exits:
      - { direction: south, to: waystation_yard }
      - direction: north
        to: toll_road
        conditions: [{ any_of: [{ has_flag: factor_shamed }, { has_flag: breckel_defeated }] }]
        locked_msg: >
          Breckel blocks north. PRESENT factor's ledger against impound notice to make
          Harwick call him off, or ATTACK Breckel. Combat risks death and
          forfeits the confrontation score.

  - id: toll_road
    name: "The Toll Road North"
    description: >
      You recovered the passage-seal and cleared the waystation. The Gate Arch is
      south. Town lights are visible along the Saltmere Road.
    # The locomotion win (+15 capstone): reaches the full 50 on first entry and fires
    # end_game simultaneously. SCORE_PEAKS_BEFORE_WIN does not fire on a navigation win
    # (bug_0116): the +15 is the last award and the win fires in the same step.
    on_enter:
      - set_quest_stage: { quest: saltmere_crossing, stage: crossing_made }
      - add_journal: >
          You recovered the passage-seal and reached the Toll Road North. The
          waystation is behind you.
      - inc_var: { name: score, by: 15 }
    exits:
      - { direction: south, to: gate_arch }

objects:
  - id: seal_notice
    name: "impound notice"
    aliases: [notice, seal, impound, papers, board, gatehouse board, notice board, official notice, passage seal, impound notice]
    description: >
      Harwick's official impound notice gives no specific contraband. READ impound notice if that
      examination is still unfinished. If the dispute remains open, gather the factor's
      ledger and Silas's testimony.
    # Reactive: once the notice is read, the board shows as already studied.
    variants:
      - when: [{ has_flag: notice_read }]
        text: >
          You read the impound notice. It cites Article Nine but names no unlicensed
          goods. The factor's ledger and Silas's testimony support the public
          challenge. If the dispute is unresolved, complete any missing evidence,
          then PRESENT factor's ledger against impound notice.
    takeable: false
    read_text: >
      The notice cites Article Nine for suspected contraband but names no goods.
      Article Nine applies only to unlicensed goods, and every item on your manifest
      is licensed. The charge has no stated basis. If the dispute remains unresolved,
      the factor's ledger and a witness can establish the pattern.
    interactions:
      # First-read: +5 score (the opening discovery — understanding the charge).
      # One-shot: gated on not_flag notice_read, retired on first READ.
      - verb: READ
        target: seal_notice
        conditions: [{ not_flag: notice_read }]
        effects:
          - set_flag: notice_read
          - set_quest_stage: { quest: saltmere_crossing, stage: charge_read }
          - inc_var: { name: score, by: 5 }
          - add_journal: >
              The notice cites Article Nine but names no unlicensed goods. Your manifest
              is licensed, so the charge has no basis. The factor's ledger and Silas's
              testimony support your case. If unresolved, complete only evidence actions
              still offered; finished work stays complete. (+5)
          - narrate: >
              You confirm that Article Nine applies only to unlicensed goods and
              that the notice names none. Your manifest is fully licensed. The
              factor's ledger and Silas's testimony establish the rest of the case.
              If the dispute remains unresolved, complete only what is unfinished.
      # The confrontation: USE factor_ledger ON seal_notice presents the evidence
      # against the charge — a formal public challenge in Harwick's own yard.
      # Skill check: authority DC 11. Retires only on SUCCESS (bug_0455): a bad roll
      # after complete evidence is a faltering public argument, not a permanent loss of
      # the pack's primary social route. Combat remains the fallback if the player skips
      # or abandons the confrontation, but the evidence path can be pressed again.
      # command_verb: present (not in BUILTIN_VERBS); command_template passes both placeholders.
      - verb: USE
        item: factor_ledger
        target: seal_notice
        command_verb: present
        command_template: "present {item} against {target}"
        conditions: [{ not_flag: confrontation_attempted }]
        skill_check:
          skill: authority
          difficulty: 11
          on_success:
            - set_flag: confrontation_attempted
            - set_flag: factor_shamed
            - inc_var: { name: score, by: 10 }
            - set_quest_stage: { quest: saltmere_crossing, stage: factor_shamed }
            - add_journal: >
                Harwick returned your passage-seal after you presented his overcharge
                records against the unsupported impound notice. Breckel no longer blocks
                the north gate. (+10)
            - narrate: >
                You compare the factor's ledger with the unsupported impound notice
                in public. Harwick returns your passage-seal, and the north gate is open.
          on_failure:
            - narrate: >
                Harwick calls the overcharges a clerical error and keeps your
                passage-seal. Breckel still blocks north. Retry with PRESENT factor's
                ledger against impound notice; the check has no penalty or lockout.
                Fighting Breckel instead risks death and gives no confrontation score.

  - id: factor_ledger
    name: "factor's ledger"
    aliases: [ledger, register, toll register, book, record, accounts, tally, factor ledger, toll ledger, harwick ledger, register book]
    description: >
      Harwick's official toll register shows fees above the posted rate. If you are
      not holding the ledger, TAKE factor's ledger. READ factor's ledger for the exact overcharge pattern
      and +3 authority.
    # Reactive: once the ledger is studied closely the description acknowledges it.
    variants:
      - when: [{ has_flag: ledger_studied }]
        text: >
          You read the factor's ledger. Harwick charged eight merchants three times
          the posted rate under a nonexistent seal inspection fee. If the dispute is
          unresolved, secure any missing testimony. In the Waystation Yard, PRESENT
          factor's ledger against impound notice.
    read_text: >
      Harwick charged a two-shilling levy and a one-shilling seal fee when the
      posted rate is one shilling total. The nonexistent seal inspection fee appears
      on all eight impounds this season in Harwick's handwriting. This is a repeated
      overcharge, not a clerical error.
    takeable: true
    interactions:
      # Close reading of the register: +10 score and +3 authority (you now have
      # the specific numbers needed to call Harwick out). One-shot: gated on
      # has_item (ledger in hand) AND not_flag ledger_studied; retired after first read.
      # On subsequent READs, the read_text shows instead.
      - verb: READ
        target: factor_ledger
        conditions: [{ all_of: [{ has_item: factor_ledger }, { not_flag: ledger_studied }] }]
        effects:
          - set_flag: ledger_studied
          - inc_var: { name: authority, by: 3 }
          - inc_var: { name: score, by: 10 }
          - set_quest_stage: { quest: saltmere_crossing, stage: evidence_found }
          - add_journal: >
              The factor's ledger shows eight merchants charged three times the
              posted rate under a nonexistent seal inspection fee, all in Harwick's
              handwriting. (+3 authority, +10)
          - narrate: >
              You confirm eight matching overcharges in Harwick's handwriting.
              Silas's testimony completes the evidence if it is still missing. If
              the dispute remains unresolved, PRESENT factor's ledger against
              impound notice.

npcs:
  - id: harwick
    name: "Factor Harwick"
    description: >
      The waystation factor issued the impound and controls the north gate until the
      dispute is resolved. His official manner hides a repeated overcharge scheme.
    room: waystation_yard
    dialogue:
      root: harwick_root
      nodes:
        - id: harwick_root
          npc_text: >
            I am holding your passage-seal while I inspect goods that may be outside
            the licensed schedule. Wait here until I finish.
          # Return variants (bug_0322/0325 pattern): short acknowledgment on re-entry
          # so the full opening speech does not re-fire on every visit.
          variants:
            - when: [{ has_flag: factor_shamed }]
              text: >
                I returned your passage-seal. I have nothing more to say.
            - when: [{ has_flag: confrontation_attempted }]
              text: >
                The correction is already entered. Good afternoon.
            - when: [{ any_of: [{ has_flag: asked_contraband }, { has_flag: demanded_seal }] }]
              text: >
                I have nothing to add to what I have already told you.
          topics:
            - id: ask_contraband
              prompt: "Ask what contraband he found in the manifest."
              conditions: [{ not_flag: asked_contraband }]
              goto: harwick_contraband
            - id: demand_seal_back
              prompt: "Ask about his earlier refusal to return your passage-seal."
              conditions: [{ not_flag: demanded_seal }]
              goto: harwick_demand
            - id: leave_harwick
              prompt: "Step away."
              end: true
        - id: harwick_contraband
          npc_text: >
            My stated answer was that I would compare your manifest with the district
            schedule during the next inspection cycle. Until the dispute forced a result,
            I meant to keep your passage-seal.
          effects:
            - set_flag: asked_contraband
          topics:
            - id: contraband_back
              prompt: "Walk away."
              goto: harwick_root
        - id: harwick_demand
          npc_text: >
            I told you to file a complaint with the district collector in Saltmere, eight
            miles north. While I held your passage-seal, that instruction also blocked the
            gate. The record now shows whether that obstruction held.
          effects:
            - set_flag: demanded_seal
            - add_journal: >
                Harwick had controlled access to the office where complaints had to be
                filed. The factor's ledger and Silas's testimony were the supporting
                evidence; a completed confrontation and all evidence remain valid.
          topics:
            - id: demand_back
              prompt: "Walk away."
              goto: harwick_root

  - id: silas
    name: "Silas"
    description: >
      A drover who has waited three hours and saw another merchant pay Harwick.
      He can serve as a public witness.
    room: drover_stall
    dialogue:
      root: silas_root
      nodes:
        - id: silas_root
          npc_text: >
            Harwick has held my manifest for three hours. The previous merchant got
            his seal back in twenty minutes after paying Harwick privately. The posted
            fee is legal; the higher fees in Harwick's ledger are not.
          # Return variant: once testimony given, Silas has done his part.
          variants:
            - when: [{ has_flag: heard_silas }]
              text: >
                I will confirm the factor's ledger in public if the confrontation is
                still unresolved. Any evidence already presented remains on the record.
            - when: [{ has_flag: heard_bribe_detail }]
              text: >
                You know what I saw at the gatehouse steps. Ask what else you need;
                if the dispute is settled, any testimony remains on the record.
          topics:
            - id: ask_testimony
              prompt: "Ask Silas to put his testimony on record."
              conditions: [{ not_flag: heard_silas }]
              goto: silas_testimony
            - id: ask_private
              prompt: "Ask what Silas saw at the gatehouse steps."
              conditions: [{ not_flag: heard_bribe_detail }]
              goto: silas_private
            - id: leave_silas
              prompt: "Leave Silas."
              end: true
        - id: silas_testimony
          npc_text: >
            I will witness the confrontation and confirm the factor's ledger in
            public. If the dispute is still unresolved, go east to the Waystation Yard
            and PRESENT factor's ledger against impound notice. If it is settled, my
            testimony remains on the record. I want my cattle through before dark.
          effects:
            - set_flag: heard_silas
            - inc_var: { name: authority, by: 3 }
            - inc_var: { name: score, by: 10 }
            - set_quest_stage: { quest: saltmere_crossing, stage: witness_secured }
            - add_journal: >
                Silas agreed to confirm the factor's ledger in public if the dispute
                remains unresolved. His testimony adds +3 authority. (+10 score)
          topics:
            - id: testimony_back
              prompt: "Return to Silas's questions."
              goto: silas_root
        - id: silas_private
          npc_text: >
            The previous merchant paid Harwick at the gatehouse steps. I could not
            see the amount. Harwick returned that merchant's seal within twenty minutes.
          effects:
            - set_flag: heard_bribe_detail
            - add_journal: >
                Silas saw another merchant pay Harwick directly, after which Harwick
                returned the merchant's seal within twenty minutes. The inspection
                delay is part of the payment scheme.
          topics:
            - id: private_back
              prompt: "Return to Silas's questions."
              goto: silas_root

enemies:
  # Breckel — the gate-arch enforcer and the combat-path obstacle. Combat is the
  # fallback when the social path is skipped or the authority check fails; it is not
  # the designed resolution and rewards no score — the brute-path cost is correct. No
  # preparation in this pack buffs the fight (authority is the social lever, not a
  # combat stat), so a player who prepares for the social path and fails the check
  # enters combat at base stats. That is honest: the wrong tool, applied too hard,
  # has a price.
  #
  # Death check (no combat_guaranteed): Breckel hp 14 / atk 5 / def 1.
  #   Worst player dmg: 1+4-1 = 4 per round. Rounds to kill: ceil(14/4) = 4.
  #   Worst Breckel dmg: 6+5-2 = 9 per round. Total over 3 rounds (before kill): 27.
  #   27 > 20 HP — Breckel CAN kill on worst dice. ending_impounded is reachable.
  #   Breckel is telegraphed in waystation_yard and gate_arch prose (bug_0123: no
  #   ambush). A fall is save-recoverable (§8.7).
  - id: breckel
    name: "Breckel"
    description: >
      Harwick's armed guard blocks the north gate. A successful public confrontation
      makes Harwick call him off. Fighting Breckel risks death and gives no score.
    room: gate_arch
    conditions: [{ not_flag: factor_shamed }]
    hp: 14
    attack: 5
    defense: 1
    defeat_flag: breckel_defeated
    death_ending: ending_impounded
    on_defeat:
      - set_quest_stage: { quest: saltmere_crossing, stage: breckel_down }
      - add_journal: >
          You defeated Breckel, and the north gate is open. Combat gave no score and
          leaves an official incident to answer for.

win_conditions:
  # Locomotion win: reaching toll_road — accessible via the social path (factor_shamed
  # unlocks the gate_arch north exit) OR the combat path (breckel_defeated unlocks it).
  # The +15 capstone fires on toll_road's on_enter in the same step as the win.
  # SCORE_PEAKS_BEFORE_WIN does not fire on a navigation win (bug_0116).
  - id: road_cleared
    conditions: [{ visited: toll_road }]
    ending: ending_cleared

endings:
  - id: ending_cleared
    title: "The Road North"
    # Reactive: social-path epilogue is richer (Harwick's calculation, Silas at the steps).
    # Base text covers the combat path. The test reaches this ending via Breckel combat;
    # base text must be variant-free on that route (factor_shamed not set => no variant fires).
    variants:
      - when: [{ has_flag: factor_shamed }]
        text: >
          Harwick returned your passage-seal after the factor's ledger exposed his
          overcharges. A deputy has replaced him while officials review the records.
          The Saltmere Road is open. *** You have won. ***
    text: >
      You defeated Breckel, recovered your passage-seal, and reached the Saltmere
      Road. The fight will be reported, and you missed the evidence-path score.
      *** You have won. ***

  - id: ending_impounded
    title: "Killed at the Waystation"
    text: >
      Breckel kills you at the waystation. Harwick keeps your passage-seal and reports
      that you assaulted a toll officer. *** You have fallen. ***
    death: true
