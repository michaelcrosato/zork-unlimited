# The Falconer's Ransom — a Stage 4 (Hero's-Quest) pack (spec §13).
#
# The game's EIGHTH RPG pack — and the FIRST to introduce `cunning`, a social/
# psychological stat measuring quick thinking, misdirection, and the ability to
# spring a trap on a deceiver in the moment he least expects it. No prior RPG pack
# uses an improvisational-deception stat: the seven predecessors use physical or craft
# vars (might, craft, nerve, tracking, lore) or formal institutional command (authority).
# Cunning is different from authority: authority makes a formal argument carry weight
# in front of a witness; cunning makes a deception collapse from the inside by turning
# the deceiver's own method against him, faster than he can adjust.
#
# A guest of the manor, one Aldric of Haverstock, claims your trained hunting tiercel
# "strayed into his mews" three days ago while you were on the hunt and he is nursing
# it at his expense — implying a recovery fee. The bird is yours by the jesses' mark,
# and Aldric has a forged bill of sale ready to produce if pressed. Your task: recover
# the falcon without paying a thief's toll.
#
# TWO RESOLUTION PATHS (second in the RPG corpus after factors_mark):
#   CUNNING (primary, full score): read the jesses (+5, confirms ownership), take and
#   read the gate log (+10, +3 cunning: Aldric's entry has no mews equipment — he could
#   not have housed a falcon for three days), take and read the hidden bill (+10, +3
#   cunning: the forged guild seal has been applied to dry wax, not fresh — it was made
#   for this document after the fact). Then USE hidden_bill ON falcon_jesses in the
#   hawk_yard — cunning DC 12. Success: Aldric shamed and Thorn steps aside; road open.
#   COMBAT (fallback, partial score): skip the evidence or fail the check — Thorn must
#   be fought in the stable_yard to leave. Combat path caps at 40/50.
#
#   hawk_yard (start; Aldric NPC; falcon_jesses +5)
#   │  E → guest_chambers (hidden_bill: +10 read, +3 cunning)
#   │  W → gate_lodge (gate_log: +10 read, +3 cunning)
#   │  N → stable_yard (Thorn enemy; N gated on aldric_shamed OR thorn_defeated)
#   └─────── stable_yard: N (aldric_shamed OR thorn_defeated) → manor_road (WIN +15)
#
# Score (max 50, the 5+10+10+10+15 shape):
#   +5  READ falcon_jesses     — your mark on both cuffs (one-shot: not_flag jesses_read)
#   +10 READ gate_log          — no mews equipment entered (+3 cunning; one-shot: not_flag log_read)
#   +10 READ hidden_bill       — forged guild seal (+3 cunning; one-shot: not_flag bill_read)
#   +10 cunning check success  — USE hidden_bill ON falcon_jesses, DC 12 (retires only on success)
#   +15 manor_road on_enter    — WIN (locomotion win, coincides with game end)
#   Thorn on_defeat: +0        — combat path is valid but sub-optimal; brute-force is its own cost.
#
# Combat death check (no combat_guaranteed):
#   Player base hp 20 / atk 4 / def 2. Thorn hp 12 / atk 5 / def 2.
#   Worst player dmg per round: 1+4-2 = 3. Rounds to kill Thorn: ceil(12/3) = 4.
#   Worst Thorn dmg per round: 6+5-2 = 9. Total over 3 rounds (before kill): 27.
#   27 > 20 HP — Thorn CAN kill on worst dice. ending_held (death) is reachable.
#   No combat_guaranteed flag — the pack's honest survival path is cunning, not combat prep.
#   Thorn telegraphed in hawk_yard description and Aldric's dialogue (bug_0123: never an ambush).

meta:
  id: falconers_ransom_v1
  title: "The Falconer's Ransom"
  start_room: hawk_yard
  # `cunning` (3 base): quick thinking, misdirection, reading deception, and the
  # ability to spring a trap on a trickster before he can adjust. New to the corpus —
  # no prior RPG pack uses a psychological/improvisational stat. Used in the confrontation
  # skill_check (USE hidden_bill ON falcon_jesses, DC 12): base 3 → d20>=10 (55% gamble);
  # with gate_log (+3) → cunning 6, d20>=7 (70%); with both preps → cunning 9, d20>=4
  # (~85% near-certain). Cunning does NOT boost combat stats — it is the wrong tool for a fight.
  vars_init: { hp: 20, attack: 4, defense: 2, cunning: 3 }
  flags_init: []
  # No combat_guaranteed: Thorn on worst dice kills a base-stat player (27 > 20 HP).
  # The pack's answer to the combat threat is to take the cunning path, not to buff for
  # the fight. See the enemies block for the math.
  max_score: 50

rooms:
  - id: hawk_yard
    name: "The Hawk-Yard"
    description: >
      Your tiercel is hooded on the block beside Aldric. READ falcon's jesses
      to confirm your mark. Go east to the Guest Chambers for Aldric's bill of sale,
      west to the Gate Lodge for his arrival record, or north to the Stable Yard.
      Thorn guards the northern gate.
    # Reactive: once aldric_shamed, the yard reads as resolved.
    variants:
      - when: [{ has_flag: aldric_shamed }]
        text: >
          Aldric released your tiercel and stepped away from the block. Go north
          through the Stable Yard to leave, east to the Guest Chambers, or west to
          the Gate Lodge.
      - when: [{ has_flag: thorn_defeated }]
        text: >
          You defeated Thorn, so the north gate is open. Your tiercel remains hooded
          on the block beside Aldric. Go north through the Stable Yard to leave, east
          to the Guest Chambers, or west to the Gate Lodge.
    objects: [falcon_jesses]
    exits:
      - { direction: east, to: guest_chambers }
      - { direction: west, to: gate_lodge }
      - { direction: north, to: stable_yard }

  - id: guest_chambers
    name: "The Guest Chambers"
    description: >
      The bill of sale is partly hidden under riding gloves in Aldric's open satchel.
      TAKE bill of sale and READ bill of sale to identify the forged seal and gain +3 cunning. The
      Hawk-Yard is west.
    # Reactive: once the bill is taken, the satchel reads as emptied of interest.
    variants:
      - when: [{ has_flag: bill_read }]
        text: >
          You took and read the bill of sale. Its guild seal is forged. If the
          ownership dispute is unresolved, go west to the Hawk-Yard and PRESENT bill
          of sale against falcon's jesses. The Hawk-Yard is west.
      - when: [{ has_flag: hidden_bill_taken }]
        text: >
          You took the bill of sale. Retrieve the bill if needed, then READ bill of sale to identify
          the forged seal and gain +3 cunning. The Hawk-Yard is west.
    objects: [hidden_bill]
    exits:
      - { direction: west, to: hawk_yard }

  - id: gate_lodge
    name: "The Gate Lodge"
    description: >
      The gate log was kept on the counter. TAKE gate log if it is here, or retrieve the log
      if needed, then READ gate log for Aldric's entry, evidence, and +3 cunning. The Hawk-Yard
      is east.
    # Reactive: once the log is read, the counter reads as already checked.
    variants:
      - when: [{ has_flag: log_read }]
        text: >
          You read Aldric's entry in the gate log. It shows he brought no equipment
          for keeping a falcon. If the ownership dispute is unresolved, go east to the
          Hawk-Yard and PRESENT bill of sale against falcon's jesses. The Hawk-Yard is east.
    objects: [gate_log]
    exits:
      - { direction: east, to: hawk_yard }

  - id: stable_yard
    name: "The Stable Yard"
    description: >
      Thorn blocks north. Go south to the Hawk-Yard and PRESENT bill of sale against
      falcon's jesses to make Aldric call him off, or ATTACK Thorn. Combat risks death
      and gives no confrontation score.
    # Two variants: social path (aldric_shamed) and combat path (thorn_defeated).
    variants:
      - when: [{ has_flag: aldric_shamed }]
        text: >
          Aldric yielded, Thorn no longer blocks the gate, and north is open. Go north
          to the Manor Road or south to the Hawk-Yard.
      - when: [{ has_flag: thorn_defeated }]
        text: >
          Thorn is down, and the main gate is open. Go north to the Manor Road or
          south to the Hawk-Yard.
    exits:
      - { direction: south, to: hawk_yard }
      - direction: north
        to: manor_road
        conditions: [{ any_of: [{ has_flag: aldric_shamed }, { has_flag: thorn_defeated }] }]
        locked_msg: >
          Thorn blocks north. PRESENT bill of sale against falcon's jesses to make
          Aldric call him off, or ATTACK Thorn. Combat risks death and
          forfeits the confrontation score.

  - id: manor_road
    name: "The Manor Road"
    description: >
      You recovered your tiercel and cleared the manor gate. The Stable Yard is
      south. Your bird rides hooded on your wrist.
    # Locomotion win (+15 capstone): reaches the full 50 on first entry and fires
    # end_game simultaneously. SCORE_PEAKS_BEFORE_WIN does not fire on a navigation win
    # (bug_0116): the +15 is the last award and the win fires in the same step.
    on_enter:
      - set_quest_stage: { quest: falcon_recovery, stage: road_clear }
      - add_journal: >
          You recovered your tiercel and reached the Manor Road. The manor is behind you.
      - inc_var: { name: score, by: 15 }
    exits:
      - { direction: south, to: stable_yard }

objects:
  - id: falcon_jesses
    name: "falcon's jesses"
    aliases: [jesses, jess, falcon jesses, bird jesses, tiercel jesses, leg straps, leather jesses, bird, falcon, tiercel, hood, hooded bird, hooded tiercel, block]
    description: >
      Your three-pointed-crown mark is tooled into both leather jesses and registered
      with the Carlisle guild. READ falcon's jesses to confirm ownership.
    # Reactive: once read, the jesses read as already identified.
    variants:
      - when: [{ has_flag: jesses_read }]
        text: >
          You read the falcon's jesses. Your registered three-pointed-crown mark on
          both cuffs proves the tiercel is yours. The bill of sale and gate log are
          supporting evidence; gather and read only what remains unfinished.
    takeable: false
    read_text: >
      Both cuffs bear the three-pointed-crown mark you registered with the Carlisle
      guild two seasons ago. The stitching also matches your work. The tiercel is
      yours. Aldric's bill of sale and gate record supply the supporting evidence;
      completed evidence remains valid.
    interactions:
      # First-read: +5 score (establishing ownership — the opening position).
      # One-shot: gated on not_flag jesses_read; retired on first READ.
      - verb: READ
        target: falcon_jesses
        conditions: [{ not_flag: jesses_read }]
        effects:
          - set_flag: jesses_read
          - set_quest_stage: { quest: falcon_recovery, stage: ownership_confirmed }
          - inc_var: { name: score, by: 5 }
          - add_journal: >
              Both jesses bear your registered three-pointed-crown mark, proving the
              tiercel is yours. Aldric's bill of sale and the gate record were the
              supporting evidence. If the dispute remains unresolved, complete only
              evidence actions still offered; a completed resolution stays complete. (+5)
          - narrate: >
              You confirm your registered mark and stitching on both jesses. The
              tiercel is yours. The bill of sale in the Guest Chambers and gate log
              in the Gate Lodge are supporting evidence; complete only what remains.
      # The confrontation: USE hidden_bill ON falcon_jesses — spring the trap by presenting
      # the forged bill against the jesses in front of Aldric. Cunning DC 12.
      # Retires only on SUCCESS (bug_0456): a bad roll is a public falter, not Aldric
      # deleting the pack's primary social route. Requires the player to have read the
      # bill (and ideally the gate log) first, which raises cunning from base 3 toward
      # the near-certain 9.
      - verb: USE
        item: hidden_bill
        target: falcon_jesses
        command_verb: present
        command_template: "present {item} against {target}"
        conditions: [{ not_flag: confrontation_attempted }]
        skill_check:
          skill: cunning
          difficulty: 12
          on_success:
            - set_flag: confrontation_attempted
            - set_flag: aldric_shamed
            - inc_var: { name: score, by: 10 }
            - set_quest_stage: { quest: falcon_recovery, stage: aldric_shamed }
            - add_journal: >
                You used Aldric's bill of sale to defeat his ownership claim in a
                public confrontation. Aldric released the tiercel, and Thorn no longer
                blocks the gate. (+10)
            - narrate: >
                You present Aldric's bill of sale against the falcon's jesses and defeat
                his ownership claim in public. Aldric releases the tiercel, and the north
                gate is open.
          on_failure:
            - narrate: >
                Aldric dismisses the evidence and keeps control of the tiercel. Thorn
                still blocks north. Retry with PRESENT bill of sale against falcon's
                jesses; the check has no penalty or lockout. Fighting Thorn
                instead risks death and gives no confrontation score.

  - id: hidden_bill
    name: "bill of sale"
    aliases: [bill, sale, document, paper, papers, forged bill, purchase document, ownership document, satchel document, folded document, folded paper]
    description: >
      A bill of sale claims Aldric bought a trained grey tiercel six weeks ago. The
      guild seal looks wrong. If you are not holding the bill, TAKE bill of sale. READ bill of sale to verify the forgery
      and gain +3 cunning.
    # Reactive: once studied, the bill reads as already identified as forged.
    variants:
      - when: [{ has_flag: bill_read }]
        text: >
          You read the bill of sale. The deep impression and uneven wax prove the
          guild seal was applied after the document dried. If the ownership dispute
          is unresolved, in the Hawk-Yard, PRESENT bill of sale against falcon's jesses.
    takeable: true
    take_effects:
      - set_flag: hidden_bill_taken
    read_text: >
      The description matches your tiercel, but the guild seal is forged. Its wax is
      too thick, and the impression was pressed into a dry document instead of fresh
      wax during a licensed sale. The forged bill is evidence against Aldric's claim.
    interactions:
      # Close study of the bill: +10 score and +3 cunning (the forged seal's tell is now
      # in your head — you can name it precisely under pressure). One-shot: gated on
      # has_item AND not_flag bill_read; retired after first scored read.
      - verb: READ
        target: hidden_bill
        conditions: [{ all_of: [{ has_item: hidden_bill }, { not_flag: bill_read }] }]
        effects:
          - set_flag: bill_read
          - inc_var: { name: cunning, by: 3 }
          - inc_var: { name: score, by: 10 }
          - set_quest_stage: { quest: falcon_recovery, stage: forgery_found }
          - add_journal: >
              The bill of sale is forged. Its guild seal was pressed too deep into
              dry wax after the document was made. (+3 cunning, +10)
          - narrate: >
              You identify the seal as a forgery made after the document dried.
              The gate log can add evidence if it is still unread. If the ownership
              dispute is unresolved, PRESENT bill of sale against falcon's jesses.

  - id: gate_log
    name: "gate log"
    aliases: [log, record, porter log, gate record, porter record, arrival log, entry log, gate book, arrivals, equipment record, arrivals record]
    description: >
      The gate log records every guest and item brought through the manor gate.
      Aldric's entry may test his story. If you are not holding the log, TAKE gate
      log. READ gate log for +3 cunning.
    # Reactive: once read, the log reads as already studied.
    variants:
      - when: [{ has_flag: log_read }]
        text: >
          You read the gate log. Aldric arrived with an empty hawk-bag but no cadge,
          perch, gauntlet, hood, or feed. He could not have kept a stray falcon for
          three days.
    takeable: true
    read_text: >
      Aldric arrived three days ago with a horse, two bags, and an empty hawk-bag.
      He brought no cadge, perch, gauntlet, hood, or feed. He lacked the equipment
      needed to keep a stray falcon for three days and planned to transport a bird
      he did not bring.
    interactions:
      # Close reading of the gate record: +10 score and +3 cunning (you now have the
      # precise column entry to quote under pressure). One-shot: gated on has_item AND
      # not_flag log_read; retired after first scored read.
      - verb: READ
        target: gate_log
        conditions: [{ all_of: [{ has_item: gate_log }, { not_flag: log_read }] }]
        effects:
          - set_flag: log_read
          - inc_var: { name: cunning, by: 3 }
          - inc_var: { name: score, by: 10 }
          - set_quest_stage: { quest: falcon_recovery, stage: record_checked }
          - add_journal: >
              The gate log shows that Aldric arrived with an empty hawk-bag but no
              equipment to house or feed a falcon. His stray-falcon story is false.
              (+3 cunning, +10)
          - narrate: >
              You confirm that Aldric brought an empty hawk-bag but no equipment to
              care for a falcon. His arrival was planned around taking a bird. If the
              ownership dispute is unresolved, in the Hawk-Yard, PRESENT bill of sale
              AGAINST falcon's jesses.

npcs:
  - id: aldric
    name: "Aldric"
    description: >
      A well-dressed guest who claimed your tiercel and asked for a recovery payment.
      He based that claim on a bill of sale and a prepared story.
    room: hawk_yard
    dialogue:
      root: aldric_root
      nodes:
        - id: aldric_root
          npc_text: >
            Your tiercel entered my mews three days ago. I kept and fed him while
            you were away. Pay a fair recovery fee and I will return him.
          # Return variants (bug_0322/0325 pattern): short acknowledgment on re-entry
          # so the full opening speech does not re-fire on every visit.
          variants:
            - when: [{ has_flag: aldric_shamed }]
              text: >
                I released the tiercel. We have nothing more to discuss.
            - when: [{ has_flag: confrontation_attempted }]
              text: >
                I believe I have said everything I have to say on this matter.
            - when:
                - any_of:
                    - { has_flag: asked_bill }
                    - { has_flag: asked_jesses }
                    - { has_flag: asked_mews }
              text: >
                I have explained my claim. Consider the recovery payment.
          topics:
            - id: ask_bill
              prompt: "Ask about the bill he had offered as proof."
              conditions: [{ not_flag: asked_bill }]
              goto: aldric_bill
            - id: ask_jesses
              prompt: "Ask about his earlier dismissal of your registered jesses."
              conditions: [{ not_flag: asked_jesses }]
              goto: aldric_jesses
            - id: ask_mews
              prompt: "Ask about his earlier travelling-mews claim."
              conditions: [{ not_flag: asked_mews }]
              goto: aldric_mews
            - id: leave_aldric
              prompt: "Step away."
              end: true
        - id: aldric_bill
          npc_text: >
            My claim had rested on a bill of sale saying I bought a trained grey tiercel
            from a licensed Carlisle falconer six weeks earlier. That was the document I
            said matched this bird; the completed resolution remains valid.
          effects:
            - set_flag: asked_bill
            - add_journal: >
                Aldric's ownership claim had rested on a six-week-old guild bill of sale
                kept in the Guest Chambers. Completed reading and resolution remain valid.
          topics:
            - id: bill_back
              prompt: "Return to Aldric's questions."
              goto: aldric_root
        - id: aldric_jesses
          npc_text: >
            I argued that marks can fade or be copied, and that without other evidence
            my witnessed bill of sale was the stronger ownership record.
          effects:
            - set_flag: asked_jesses
            - add_journal: >
                Aldric had dismissed your registered mark and relied on his bill of sale.
                The bill in the Guest Chambers was the supporting evidence; completed
                reading and resolution remain valid.
          topics:
            - id: jesses_back
              prompt: "Return to Aldric's questions."
              goto: aldric_root
        - id: aldric_mews
          npc_text: >
            I claimed I carried a travelling cadge and falcon supplies in my saddlebag,
            with everything needed to care for the bird.
          effects:
            - set_flag: asked_mews
            - add_journal: >
                Aldric had claimed he arrived with a travelling cadge and falcon supplies.
                The Gate Lodge log was the supporting evidence; completed reading and
                resolution remain valid.
          topics:
            - id: mews_back
              prompt: "Return to Aldric's questions."
              goto: aldric_root

enemies:
  # Thorn — the stable-yard enforcer and the combat-path obstacle. Combat is the
  # fallback when the cunning path is skipped or the authority check fails; it is not
  # the designed resolution and rewards no score — the brute-path cost is correct. No
  # preparation in this pack buffs the fight (cunning is the psychological lever, not
  # a combat stat), so a player who prepares for the cunning path and fails the check
  # enters combat at base stats. That is honest: the wrong tool applied too hard
  # has a price.
  #
  # Death check (no combat_guaranteed): Thorn hp 12 / atk 5 / def 2.
  #   Worst player dmg: 1+4-2 = 3 per round. Rounds to kill: ceil(12/3) = 4.
  #   Worst Thorn dmg: 6+5-2 = 9 per round. Total over 3 rounds (before kill): 27.
  #   27 > 20 HP — Thorn CAN kill on worst dice. ending_held is reachable.
  #   Thorn telegraphed in hawk_yard and stable_yard prose (bug_0123: no ambush).
  - id: thorn
    name: "Thorn"
    description: >
      Aldric's armed guard blocks the main gate. A successful evidence confrontation
      makes Aldric call him off. Fighting Thorn risks death and gives no score.
    room: stable_yard
    conditions: [{ not_flag: aldric_shamed }]
    hp: 12
    attack: 5
    defense: 2
    defeat_flag: thorn_defeated
    death_ending: ending_held
    on_defeat:
      - set_quest_stage: { quest: falcon_recovery, stage: thorn_down }
      - add_journal: >
          You defeated Thorn, and the Manor Road is open north. The fight is now
          part of the gate record and gave no score.

win_conditions:
  # Locomotion win: reaching manor_road — accessible via the cunning path (aldric_shamed
  # unlocks the stable_yard north exit) OR the combat path (thorn_defeated unlocks it).
  # The +15 capstone fires on manor_road's on_enter in the same step as the win.
  # SCORE_PEAKS_BEFORE_WIN does not fire on a navigation win (bug_0116).
  - id: road_opened
    conditions: [{ visited: manor_road }]
    ending: ending_cleared

endings:
  - id: ending_cleared
    title: "The Road North"
    # Reactive: cunning-path epilogue names Aldric's reckoning.
    # Base text covers the combat path. The test reaches this ending via Thorn combat;
    # base text must be variant-free on that route (aldric_shamed not set => no variant fires).
    variants:
      - when: [{ has_flag: aldric_shamed }]
        text: >
          You defeated Aldric's ownership claim in public. He released your tiercel,
          Thorn no longer blocks the gate, and you leave by the Manor Road. *** You have won. ***
    text: >
      You defeated Thorn, recovered your tiercel, and reached the Manor Road. The
      fight is in the gate record, and you missed the evidence-path score.
      *** You have won. ***

  - id: ending_held
    title: "Killed in the Gate Passage"
    text: >
      Thorn kills you in the gate passage. Aldric tells the steward that you started
      the dispute, and your tiercel remains on the block.
      *** You have fallen. ***
    death: true
