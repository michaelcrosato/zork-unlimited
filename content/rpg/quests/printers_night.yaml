# The Printer's Night — a Stage 4 (Hero's-Quest) pack (spec §13).
#
# The game's ELEVENTH RPG pack — and the FIRST to introduce `stealth`, a
# physical-concealment stat measuring the ability to move through a closed space
# at night without sound, manage a dark lantern's light to avoid casting shadows
# into the wrong corners, and time actions to the gaps in ambient noise.
#
# Stealth is not social: cunning (falconers_ransom) works by manipulating another
# person's mental model — stealth works by becoming absent from that model entirely.
# The distinction: misdirecting attention vs. removing yourself from its field.
# No prior RPG pack uses a physical-concealment stat; the ten predecessors use
# physical force (might, craft, nerve), social command (authority, cunning),
# clinical observation (physick), formal argumentation (rhetoric), or wilderness
# reading (tracking, lore). Stealth is purely kinetic/spatial — the ability to
# occupy a space without claiming it.
#
# London, 3 August 1696. A Privy Council warrant has tasked you — an agent of the
# Sergeant-at-Arms' department — with entering a back-street print shop off
# Aldersgate Street and seizing the type-block for a pamphlet called "The Barfleur
# Memorandum." The pamphlet names naval officers who withheld wages from pressed
# seamen aboard HMS Barfleur in the 1694 campaign. The Admiralty's position: the
# document is seditious and the block must be taken before sunrise.
#
# Master Fen (the printer) is asleep upstairs. His journeyman Birch sleeps in the
# gate-house across the lane. The shop was entered through a picked side-lock. Your
# contact left a dark lantern on the counter. You have until first light.
#
# NEW STAT: STEALTH (3 base). Physical concealment and silent movement.
# Distinct from all prior RPG stats:
#   might (raw force) — the opposite axis; stealth is the minimum of force
#   craft (artisan precision) — fine skill at making; stealth is fine skill at
#     un-making your presence
#   nerve (composure under pressure) — related but distinct: nerve is internal
#     steadiness; stealth is external silence — both can differ independently
#   cunning (psychological misdirection) — social, not physical: cunning changes
#     what the watcher SEES; stealth changes what there IS to see
#   authority (formal institutional command) — the opposite mode; authority claims
#     presence; stealth refuses it
#   physick/rhetoric/tracking/lore — epistemic/technical; stealth is purely kinetic
# Stealth is the ability to become absent in an occupied space: controlling sound,
# light, and timing so that what you do leaves no trace in anyone's awareness.
#
# Used in the exit skill_check: USE dark_lantern ON back_door (stealth DC 12).
# Base 3 → d20+3 >= 12 → d20 >= 9 → 12/20 = 60% (significant gamble).
# After proof_schedule (+3): stealth 6 → d20 >= 6 → 15/20 = 75%.
# After pamphlet_proof (+3): stealth 9 → d20 >= 3 → 18/20 = 90% near-certain.
# Both preparations: 90%. The pack's answer: read both before the door.
#
# TWO RESOLUTION PATHS (eleventh in RPG corpus; pattern from falconers_ransom):
#   STEALTH (primary, full score 50): take dark_lantern (shop_floor, start);
#   read proof_schedule (+5, +3 stealth: Birch confirmed in gate-house, Fen at 5am);
#   read pamphlet_proof (+10, +3 stealth: block location and approach angle mapped);
#   TAKE type_block (take_effects +10: objective secured); USE dark_lantern ON
#   back_door (stealth DC 12, +10: silent exit); WIN night_lane on_enter +15.
#   COMBAT (fallback, partial 40): fail or skip stealth check — must defeat
#   Edgar Tew (night watchman, back_court) before the east exit opens.
#
# Map:
#   shop_floor (start; dark_lantern)
#   │  E → composing_room (proof_schedule: +5, +3 stealth)
#   │       E → press_room (pamphlet_proof: +10, +3 stealth;
#   │                        type_block: TAKE +10;
#   │                        back_door: stealth skill_check +10)
#   │                N → back_court (Edgar Tew; E gated: block_taken + [slip_past OR edgar_defeated])
#   │                     E → night_lane (WIN +15)
#
# Score (max 50, the 5+10+10+10+15 shape):
#   +5  READ proof_schedule    — Birch absent inside, Fen's morning pattern (+3 stealth)
#   +10 READ pamphlet_proof    — block location and approach angle (+3 stealth)
#   +10 TAKE type_block        — objective secured (take_effects, one-shot)
#   +10 stealth check success  — USE dark_lantern ON back_door (stealth DC 12)
#   +15 night_lane on_enter    — WIN (locomotion win, same step as end_game)
#
# Stealth calibration (d20):
#   Base stealth 3: d20+3 >= 12 → 60% gamble.
#   +proof_schedule: stealth 6, d20 >= 6 → 75%.
#   +pamphlet_proof: stealth 9, d20 >= 3 → 90% near-certain.
#   Both: 90%. The pack's honest answer: gather both reads before the door.
#
# Combat death check (no combat_guaranteed):
#   Player hp 20 / atk 4 / def 2. Edgar Tew hp 12 / atk 5 / def 2.
#   Worst player dmg: 1+4-2 = 3. Rounds to kill Edgar: ceil(12/3) = 4.
#   Worst Edgar dmg: 6+5-2 = 9. Over 3 rounds: 27 > 20 HP.
#   Edgar CAN kill on worst dice. ending_stopped (death) is reachable.
#   No combat_guaranteed — the pack's answer is the stealth path.

meta:
  id: printers_night_v1
  title: "The Printer's Night"
  start_room: shop_floor
  # `stealth` (3 base): physical concealment and silent movement — the ability to
  # occupy a space without claiming it. First in the RPG corpus to use a physical-
  # concealment stat. Used in the exit skill_check (USE dark_lantern ON back_door,
  # DC 12): base 3 (60% gamble); +proof_schedule (+3) = 75%; +pamphlet_proof (+3)
  # = 90% near-certain; both preps = 90%. Does not boost combat stats.
  vars_init: { hp: 20, attack: 4, defense: 2, stealth: 3 }
  flags_init: []
  max_score: 50

rooms:
  - id: shop_floor
    name: "The Print Shop"
    description: >
      At the counter, TAKE dark lantern, then go east to the Composing Room. Use it
      to READ Fen's schedule and READ proof sheet, then EASE back door USING dark
      lantern. Master Fen sleeps upstairs until five. The closed shop smells of damp
      paper and ink.
    variants:
      - when: [{ has_flag: slip_past }]
        text: >
          You EASED the back door without making new noise. Any earlier confrontation
          remains recorded. Go east to the Press Room; TAKE type-block if it remains there.
      - when: [{ has_flag: dark_lantern_taken }]
        text: >
          You took the dark lantern. Retrieve it if needed, then go east to the
          Composing Room. Master Fen sleeps upstairs until five, so avoid making noise.
    objects: [dark_lantern]
    exits:
      - { direction: east, to: composing_room }

  - id: composing_room
    name: "The Composing Room"
    description: >
      Carry dark lantern, then READ Fen's schedule to learn the household routine and
      gain +3 stealth. Go east to the Press Room, or west to the Print Shop. Type
      cases line the wall beside the composing bench.
    variants:
      - when: [{ has_flag: schedule_read }]
        text: >
          You read Fen's schedule and gained +3 stealth. Birch is in the gate-house,
          and Fen remains upstairs until five. Go east to the Press Room, or west to
          the Print Shop.
      - when: [{ has_flag: proof_schedule_taken }]
        text: >
          Fen's schedule is no longer on the board. Go east to the Press Room, or west
          to the Print Shop.
    objects: [proof_schedule]
    exits:
      - { direction: west, to: shop_floor }
      - { direction: east, to: press_room }

  - id: press_room
    name: "The Press Room"
    description: >
      Complete only unfinished work: carry dark lantern and READ proof sheet for
      +3 stealth, TAKE type-block, and EASE back door USING dark lantern if its one stealth
      check remains. Failure locks the stealth route; Edgar must be fought only if he still stands.
      Go west to the Composing Room.
    # Three variants: block taken; clean exit confirmed; else default (all objects visible).
    variants:
      - when: [{ has_flag: slip_past }]
        text: >
          You successfully EASED the back door without new noise. Any earlier confrontation
          remains recorded. TAKE type-block if it remains in the press chase. Go west
          to the Composing Room, or north to the clear Back Court.
      - when: [{ has_flag: block_taken }, { has_flag: proof_sheet_taken }]
        text: >
          You took the type-block and proof sheet. If the back-door check remains,
          EASE back door USING dark lantern; otherwise go north. ATTACK Edgar Tew only
          if he still stands; a completed route stays clear. The Composing Room is west.
      - when: [{ has_flag: proof_sheet_taken }]
        text: >
          You took the proof sheet, but the type-block remains in the press chase. TAKE
          type-block before leaving. The Back Court is north, and the Composing
          Room is west.
      - when: [{ has_flag: block_taken }]
        text: >
          You took the type-block. The proof sheet remains optional evidence. If the
          back-door check remains, EASE back door USING dark lantern; otherwise go north.
          ATTACK Edgar Tew only if he still stands; a completed route stays clear. The
          Composing Room is west.
    objects: [pamphlet_proof, type_block, back_door]
    exits:
      - { direction: west, to: composing_room }
      - { direction: north, to: back_court }

  - id: back_court
    name: "The Back Court"
    description: >
      Edgar Tew blocks the east exit unless you successfully EASED the back door.
      If he noticed you, ATTACK Edgar Tew to open the exit. Go south to return
      to the Press Room. His lantern lights the narrow cobbled court.
    # Two variants: stealth (slip_past); combat (edgar_defeated).
    variants:
      - when: [{ has_flag: slip_past }]
        text: >
          The back-door route is quiet now, and Edgar Tew no longer blocks east. Any earlier
          confrontation remains recorded. After removing the type-block, go east to the
          Night Lane, or south to the Press Room.
      - when: [{ has_flag: edgar_defeated }]
        text: >
          You defeated Edgar Tew. After removing the type-block, go east to the Night
          Lane, or south to the Press Room.
    exits:
      - { direction: south, to: press_room }
      - direction: east
        to: night_lane
        conditions:
          - { has_flag: block_taken }
          - { any_of: [{ has_flag: slip_past }, { has_flag: edgar_defeated }] }
        locked_msg: >
          East requires the type-block and a clear route. In the Press Room, TAKE type-block
          if missing. If offered, EASE back door USING dark lantern; otherwise ATTACK Edgar
          Tew only while he blocks east. A cleared route stays clear.

  - id: night_lane
    name: "The Night Lane"
    description: >
      You removed the type-block and served the warrant. Fen's scheduled Barfleur
      Memorandum run is disrupted. The lane behind Aldersgate is quiet before dawn.
    # Locomotion win (+15 capstone): fires on first entry, same step as end_game.
    # SCORE_PEAKS_BEFORE_WIN does not fire on a navigation win (bug_0116).
    on_enter:
      - set_quest_stage: { quest: pamphlet_retrieval, stage: mission_complete }
      - add_journal: >
          You reached the Night Lane after removing the type-block. Fen will find the
          press chase empty at five, disrupting the scheduled Memorandum run. (+15)
      - inc_var: { name: score, by: 15 }
    exits:
      - { direction: south, to: back_court }

objects:
  - id: dark_lantern
    name: "dark lantern"
    aliases: [lantern, lamp, dark lamp, shuttered lantern, oil lantern, light, hand lantern, pocket lantern, small lantern, shutter, lantern shutter, bull's eye, bullseye lantern, bull-eye, iron lantern]
    description: >
      The dark lantern supports any unfinished READ of Fen's schedule or proof sheet
      and the one-shot EASE back door USING dark lantern action. Completed or failed
      steps stay recorded.
      TAKE dark lantern if needed; its iron shutter hides the light when closed.
    takeable: true
    take_effects:
      - set_flag: dark_lantern_taken

  - id: proof_schedule
    name: "Fen's schedule"
    aliases: [schedule, work schedule, schedule sheet, fen's schedule, weekly schedule, work sheet, timetable, posted schedule, pinned schedule, board note, pinned paper, note, household schedule, bench note, routine, morning routine]
    description: >
      Carry dark lantern, then READ Fen's schedule to learn when the shop is
      empty and gain +3 stealth. If you want the optional physical evidence and are
      not holding it, TAKE Fen's schedule.
    variants:
      - when: [{ has_flag: schedule_read }]
        text: >
          You already READ Fen's schedule and gained +3 stealth. Birch is in the
          gate-house, and Fen stays upstairs until five.
    takeable: true
    take_effects:
      - set_flag: proof_schedule_taken
    read_text: >
      Fen's schedule says Birch is on night watch in the separate gate-house. Fen
      comes downstairs at five, about ninety minutes from now, and Birch enters at
      seven. The print shop is empty until Fen comes down.
    interactions:
      # First read (lantern required): +5 score, +3 stealth (Birch absent, Fen's timing known).
      # One-shot: gated on has_item dark_lantern (dark room, need light) + not_flag schedule_read.
      - verb: READ
        target: proof_schedule
        conditions:
          - { has_item: dark_lantern }
          - { not_flag: schedule_read }
        effects:
          - set_flag: schedule_read
          - inc_var: { name: stealth, by: 3 }
          - inc_var: { name: score, by: 5 }
          - set_quest_stage: { quest: pamphlet_retrieval, stage: intel_gathered }
          - add_journal: >
              You READ Fen's schedule. Birch is in the gate-house, and Fen remains
              upstairs until five. (+3 stealth, +5 score)
          - narrate: >
              You READ Fen's schedule by the dark lantern. Birch is outside in the
              gate-house, and Fen will stay upstairs for about ninety minutes. You gain
              +3 stealth and +5 score.

  - id: pamphlet_proof
    name: "proof sheet"
    aliases: [proof, proof sheet, pamphlet, memorandum, barfleur memorandum, the memorandum, printed proof, proof copy, press proof, draft, printed sheet, text, document, sheet, barfleur, broadsheet draft, pamphlet text, pamphlet sheet]
    description: >
      Carry dark lantern, then READ proof sheet to record Fen's quiet removal
      method and gain +3 stealth. If the type-block remains, the method shows how to remove
      it. TAKE proof sheet only if you want evidence; the warrant requires the block.
    variants:
      - when: [{ has_flag: proof_sheet_taken }, { has_flag: block_taken }]
        text: >
          You took the proof sheet and removed the type-block. The sheet is evidence,
          and the scheduled print run is disrupted.
      - when: [{ has_flag: proof_sheet_taken }]
        text: >
          You took the proof sheet, but the type-block remains in the press chase. TAKE
          type-block to complete the warrant.
      - when: [{ has_flag: block_taken }]
        text: >
          You removed the type-block. The proof sheet remains optional evidence;
          anything already read or taken remains recorded.
      - when: [{ has_flag: proof_read }]
        text: >
          You READ the proof sheet and gained +3 stealth. At the press chase, TAKE
          type-block to complete the warrant.
    takeable: true
    take_effects:
      - set_flag: proof_sheet_taken
      - add_journal: >
          You put the optional proof sheet in your satchel as evidence. If the type-block
          remains in the press chase, TAKE type-block; completed warrant work stays complete.
      - narrate: >
          You TAKE proof sheet and fold it. It proves what Fen planned to print. If the
          type-block remains, removing it will disrupt the scheduled run; completed work stays complete.
    read_text: >
      The Barfleur Memorandum lists fifteen pressed sailors whose final nine days of
      wages were withheld, with names and amounts sworn on oath. Fen's pencil note records
      the type-block in the left side of the press chase, held by three bolts, and identifies
      the bench side as the quiet approach.
    interactions:
      # First read (lantern required): +10 score, +3 stealth (block location and approach angle).
      # One-shot: gated on has_item dark_lantern + not_flag proof_read.
      - verb: READ
        target: pamphlet_proof
        conditions:
          - { has_item: dark_lantern }
          - { not_flag: proof_read }
        effects:
          - set_flag: proof_read
          - inc_var: { name: stealth, by: 3 }
          - inc_var: { name: score, by: 10 }
          - set_quest_stage: { quest: pamphlet_retrieval, stage: pamphlet_known }
          - add_journal: >
              You READ the proof sheet. It names fifteen pressed sailors denied nine
              days' wages. Fen's note gives a quiet bench-side approach to the
              type-block. (+3 stealth, +10 score)
          - narrate: >
              You READ the proof sheet and Fen's pencil note by the dark lantern. It records
              the bench-side approach and three-bolt removal that avoids a press creak. You
              gain +3 stealth and +10 score; completed work stays complete.

  - id: type_block
    name: "type-block"
    aliases: [block, type block, type, type set, press block, letter block, set type, pamphlet block, moveable type, forme, type forme, chase block, galley, barfleur block, memorandum block, the block, wooden block, forme block]
    description: >
      At the press chase, TAKE type-block to remove the warrant's target and gain
      +10 score. Three iron type-bolts hold its two thousand pieces of movable type.
    variants:
      - when: [{ has_flag: block_taken }]
        text: >
          You already TOOK the type-block. The press chase is empty, and the three
          type-bolts remain on the bench.
    takeable: true
    # take_effects: award +10 on the deliberate CLAIM of the mission objective (bug_0107
    # pattern: "took the type-block" is a distinct act from "reached the press room").
    # One-shot intrinsic: once in inventory, TAKE can no longer resolve.
    take_effects:
      - set_flag: block_taken
      - inc_var: { name: score, by: 10 }
      - set_quest_stage: { quest: pamphlet_retrieval, stage: block_secured }
      - add_journal: >
          You TOOK the type-block from the press chase. The scheduled Barfleur
          Memorandum run is disrupted. (+10 score)
      - narrate: >
          You remove the three type-bolts, TAKE the type-block, and wrap it in your
          satchel cloth. The press chase is now empty, and you gain +10 score.

  - id: back_door
    name: "back door"
    aliases: [door, back door, rear door, exit, latch, iron latch, back exit, shop door, press door, court door, wooden door, door latch, night door, rear exit, back wall door]
    description: >
      EASE back door USING dark lantern for one stealth check. Success opens a
      quiet route, grants +10 score, and moves you to the Back Court. Failure makes noise
      and permanently locks the stealth route. Edgar must be fought only if he still stands.
    variants:
      - when: [{ has_flag: slip_past }]
        text: >
          You already EASED the back door without new noise. Any earlier confrontation remains recorded.
      - when: [{ has_flag: door_attempted }]
        text: >
          Your EASE attempt failed and cannot be retried. Go north to the Back Court.
          ATTACK Edgar Tew only if he still blocks the east exit.
    takeable: false
    interactions:
      # The exit skill_check — USE dark_lantern ON back_door (stealth DC 12).
      # Success: slip_past set and move into back_court; east exit opens with no fight.
      # Failure: door_attempted set, no slip_past → must defeat Edgar in back_court.
      # One-shot: gated on not_flag door_attempted; both branches set door_attempted.
      - verb: USE
        item: dark_lantern
        target: back_door
        command_verb: ease
        command_template: "ease {target} using {item}"
        conditions: [{ not_flag: door_attempted }]
        skill_check:
          skill: stealth
          difficulty: 12
          on_success:
            - set_flag: door_attempted
            - set_flag: slip_past
            - inc_var: { name: score, by: 10 }
            - set_quest_stage: { quest: pamphlet_retrieval, stage: door_cleared }
            - goto: back_court
            - add_journal: >
                You EASED the back door using the dark lantern without new noise and
                reached the Back Court. Any earlier confrontation remains recorded. (+10 score)
            - narrate: >
                You shutter the dark lantern, raise the latch slowly, and close the back
                door behind you without new noise. You reach the Back Court and gain +10
                score. Any earlier confrontation remains recorded.
          on_failure:
            - set_flag: door_attempted
            - add_journal: >
                Your EASE attempt made noise and cannot be retried. Go north to the Back
                Court; ATTACK Edgar Tew only if he still blocks the east exit.
            - narrate: >
                The latch slips and strikes the frame. The stealth route is permanently
                locked. Go north; ATTACK Edgar Tew only if he still blocks the east exit.

enemies:
  - id: edgar_tew
    name: "Edgar Tew"
    description: >
      ATTACK Edgar Tew to clear the east exit when stealth is skipped or failed. He
      is the ward's night watchman and carries a short staff.
    room: back_court
    conditions: [{ not_flag: slip_past }]
    hp: 12
    attack: 5
    defense: 2
    defeat_flag: edgar_defeated
    death_ending: ending_stopped
    on_defeat:
      - set_quest_stage: { quest: pamphlet_retrieval, stage: court_cleared }
      - add_journal: >
          You defeated Edgar Tew. The east exit to the Night Lane is open after you
          remove the type-block.

win_conditions:
  # Locomotion win: reaching night_lane — accessible from back_court east exit only
  # when block_taken AND (slip_past OR edgar_defeated). The +15 capstone fires on
  # night_lane's on_enter in the same step as the win. SCORE_PEAKS_BEFORE_WIN does
  # not fire on a navigation win (bug_0116).
  - id: block_retrieved
    conditions: [{ visited: night_lane }]
    ending: ending_retrieved

endings:
  - id: ending_retrieved
    title: "The Press Run Disrupted"
    # Reactive: stealth-path epilogue (slip_past) names the clean exit.
    # Base text covers the combat path. Test reaches this via Edgar combat;
    # base text must be variant-free on that route (slip_past not set).
    variants:
      - when: [{ has_flag: slip_past }]
        text: >
          You removed the type-block and used the quiet back-door route. Any earlier
          confrontation remains part of the record. The scheduled Barfleur Memorandum run
          is disrupted. The fifteen sailors' unpaid wages remain hidden from Parliament for
          now. The lane behind Aldersgate stays quiet.
          *** You have won. ***
    text: >
      You removed the type-block after defeating Edgar Tew. The scheduled Barfleur
      Memorandum run is disrupted, but the watchman can report the intrusion. The Privy
      Council will suppress the investigation, and the fifteen sailors' unpaid wages
      remain hidden from Parliament for now. *** You have won. ***

  - id: ending_stopped
    title: "Killed in the Back Court"
    text: >
      Edgar Tew kills you in the Back Court. The type-block remains in Fen's reach,
      so the Barfleur Memorandum can still be printed. The Privy Council suppresses
      the investigation.
      *** You have fallen. ***
    death: true
