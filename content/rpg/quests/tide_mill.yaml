# The Tide-Mill -- RPG benchmark slice.
#
# Ported from the retired parser-era Tide-Mill and upgraded for the single RPG
# engine. The core loop is a contained dependency DAG rather than a chain:
# defeat the tool-shed guard, then solve two independent mill faults in either
# order, then wind the sea-gate and go down to the staith to save the boat.
# The failure forks are explicit and telegraphed: walk off with the takings,
# force the rotten flood-hatch, or fight the saboteur barehanded and lose to the
# seeded combat. The final +20 capstone pays only when the player reaches the
# saved staith, so full score and the win coincide only on the clean route.

meta:
  id: tide_mill_v1
  title: "The Tide-Mill"
  start_room: mill_house
  vars_init: { hp: 20, attack: 3, defense: 1, craft: 3, might: 3 }
  flags_init: []
  max_score: 55

rooms:
  - id: mill_house
    name: "The Mill-House"
    description: >
      If unfinished, READ millboard and TALK TO Miller Ives for instructions.
      The gaff-pole began here, and the oilskin mill-coat began in the Counting-Nook
      east. Each grants a lasting bonus when first taken; those bonuses matter only if
      the saboteur still stands. Go north to the Wheel-Room. A boat is trapped above
      the weir as the tide falls.
    variants:
      - when: [{ has_flag: gate_up }]
        text: >
          The sea-gate is open. Go north to the Wheel-Room, then down to the Staith
          to save the boat. The optional coin-bag choice, if still available, is in
          the Counting-Nook east.
      - when: [{ has_flag: hook_taken }]
        text: >
          You took the gaff-pole and retain +2 attack. Complete only unfinished
          millboard or Miller Ives preparation. The oilskin mill-coat began in the
          Counting-Nook east; its lasting +2 defense, once gained, matters only if the
          saboteur stands. The Wheel-Room is north.
    objects: [millboard, gaff_hook]
    exits:
      - { direction: north, to: wheel_room }
      - { direction: east, to: counting_nook }

  - id: counting_nook
    name: "The Counting-Nook"
    description: >
      The oilskin mill-coat grants lasting +2 defense when first taken; it matters
      only if the tool-shed saboteur still stands. Leave the coin-bag here for the
      clean rescue. After the sea-gate opens, POCKET coin-bag permanently costs 5 score.
    variants:
      - when: [{ has_item: coin_bag }, { has_flag: oilskin_taken }]
        text: >
          You have the coin-bag and took the oilskin mill-coat; its +2 defense remains.
          RETURN pocketed coin-bag to avoid keeping the stolen money, but the 5-point
          loss is permanent. Go west to the Mill-House.
      - when: [{ has_item: coin_bag }]
        text: >
          You have the coin-bag. RETURN pocketed coin-bag if you do not want to keep the stolen
          money; the 5-point loss remains. The oilskin coat grants lasting +2 defense
          when first taken, useful only if the saboteur stands. The Mill-House is west.
      - when: [{ has_flag: coin_bag_returned }, { has_flag: oilskin_taken }]
        text: >
          You RETURNED the coin-bag and took the oilskin mill-coat; its +2 defense
          remains. The 5-point loss from POCKETING the bag is permanent. Go west to the
          Mill-House.
      - when: [{ has_flag: coin_bag_returned }]
        text: >
          You RETURNED the coin-bag, but the 5-point loss remains. The oilskin coat
          grants lasting +2 defense when first taken, useful only if the saboteur
          stands. The Mill-House is west.
      - when: [{ has_flag: gate_up }, { has_flag: oilskin_taken }]
        text: >
          The sea-gate is open. You took the oilskin mill-coat and retain +2 defense.
          Leave the coin-bag here for the clean rescue, or POCKET coin-bag for a permanent
          5-point loss. Go west to the Mill-House, then north and down to save the boat.
      - when: [{ has_flag: gate_up }]
        text: >
          The sea-gate is open. Leave the coin-bag here for the clean rescue, or POCKET
          coin-bag for a permanent 5-point loss. TAKE oilskin mill-coat if wanted, or go
          west to the Mill-House and then north and down to save the boat.
      - when: [{ has_flag: oilskin_taken }]
        text: >
          You took the oilskin mill-coat and retain +2 defense. Leave the coin-bag on
          the desk until the rescue is complete. Go west to the Mill-House.
    objects: [coin_bag, oilskin_coat]
    exits:
      - { direction: west, to: mill_house }

  - id: wheel_room
    name: "The Wheel-Room"
    description: >
      Fix both faults in either order: CUT choked head-race WITH billhook, and FREE
      brake-pawl WITH crow-bar. If the tool-shed saboteur still stands, ATTACK tool-shed
      saboteur; then, in the Tool-Shed, TAKE billhook and TAKE crow-bar, or retrieve either
      where dropped. TAKE crank-handle if it is here, or retrieve it, then WIND sea-gate winch
      WITH crank-handle. The Mill-House is south.
    variants:
      - when: [{ has_flag: gate_up }]
        text: >
          The sea-gate is open. Go down to the Staith now to save the boat. Go south
          only to review the Mill-House or Counting-Nook; any coin-bag action still
          available is optional, and POCKET coin-bag costs 5 score permanently.
      - when: [{ has_flag: sluice_clear }, { has_flag: pawl_free }, { has_flag: crank_handle_taken }]
        text: >
          Both faults are fixed, and you took the crank-handle. Retrieve it if needed,
          then WIND sea-gate winch WITH crank-handle; failure consumes no item or HP and can be
          retried. The Head-Race is west, Mill-Yard east, and Mill-House south.
      - when: [{ has_flag: sluice_clear }, { has_flag: pawl_free }]
        text: >
          Both faults are fixed. TAKE crank-handle, then WIND sea-gate winch WITH
          crank-handle. The Head-Race is west, Mill-Yard east, and Mill-House south.
      - when: [{ has_flag: sluice_clear }, { has_flag: crank_handle_taken }]
        text: >
          The choked head-race is clear, and you took the crank-handle. Retrieve the
          crow-bar if needed, then FREE brake-pawl WITH crow-bar; failure consumes no item
          or HP and can be retried. The Mill-Yard is east, Head-Race west, and Mill-House south.
      - when: [{ has_flag: sluice_clear }]
        text: >
          The choked head-race is clear, but the brake-pawl still locks the wheel. TAKE
          crow-bar or retrieve it, then FREE brake-pawl WITH crow-bar. TAKE crank-handle.
          The Mill-Yard is east, Head-Race west, and Mill-House south.
      - when: [{ has_flag: pawl_free }, { has_flag: crank_handle_taken }]
        text: >
          The brake-pawl is free, and you took the crank-handle. Retrieve the billhook
          if needed, then go west and CUT choked head-race WITH billhook; failure consumes
          no item or HP and can be retried. The Mill-Yard is east, and the Mill-House is south.
      - when: [{ has_flag: pawl_free }]
        text: >
          The brake-pawl is free, but the choked head-race still blocks the water. TAKE
          billhook or retrieve it, then go west and CUT choked head-race WITH billhook.
          TAKE crank-handle if it is here. The Mill-Yard is east, and the Mill-House is south.
      - when: [{ has_flag: crank_handle_taken }]
        text: >
          You took the crank-handle, but both wheel faults remain. Retrieve each tool if
          needed. Go west and CUT choked head-race WITH billhook, and FREE brake-pawl
          WITH crow-bar. The Mill-Yard is east, and the Mill-House is south.
    objects: [brake_pawl, sea_winch, crank_handle]
    exits:
      - { direction: south, to: mill_house }
      - { direction: west, to: head_race }
      - { direction: east, to: mill_yard }
      - direction: down
        to: the_staith
        conditions: [{ has_flag: gate_up }]
        locked_msg: "The down exit is locked until the sea-gate opens. Fix the choked head-race and brake-pawl, then WIND sea-gate winch WITH crank-handle."

  - id: mill_yard
    name: "The Mill-Yard"
    description: >
      ATTACK tool-shed saboteur to unlock the east exit. The fight can kill you.
      The gaff-pole grants persistent +2 attack, and the oilskin mill-coat grants persistent
      +2 defense. TAKE gaff-pole or TAKE oilskin mill-coat only while each pickup is
      offered. Go west to the Wheel-Room.
    variants:
      - when: [{ has_flag: yard_clear }]
        text: >
          You defeated the tool-shed saboteur. Go east to the Tool-Shed for the
          billhook and crow-bar, or west to the Wheel-Room.
    exits:
      - { direction: west, to: wheel_room }
      - direction: east
        to: tool_shed
        conditions: [{ has_flag: yard_clear }]
        locked_msg: "The east exit is locked while the tool-shed saboteur lives. ATTACK tool-shed saboteur and defeat him to enter the Tool-Shed."

  - id: tool_shed
    name: "The Tool-Shed"
    description: >
      TAKE billhook and TAKE crow-bar. CUT choked head-race WITH billhook, and FREE
      brake-pawl WITH crow-bar. Do not LEVER flood-hatch WITH crow-bar unless you accept
      a lethal check while also holding billhook. Go west to the Mill-Yard.
    variants:
      - when: [{ has_flag: billhook_taken }, { has_flag: crow_bar_taken }]
        text: >
          You took the billhook and crow-bar. Retrieve either where dropped if a
          remaining repair needs it. Go west to the Mill-Yard.
      - when: [{ has_flag: billhook_taken }]
        text: >
          You took the billhook. Retrieve it if needed, TAKE crow-bar, then go west
          to the Mill-Yard.
      - when: [{ has_flag: crow_bar_taken }]
        text: >
          You took the crow-bar. Retrieve it if needed, TAKE billhook, then go west
          to the Mill-Yard.
    objects: [billhook, crow_bar]
    exits:
      - { direction: west, to: mill_yard }

  - id: head_race
    name: "The Head-Race"
    description: >
      Retrieve the billhook if needed, then CUT choked head-race WITH billhook; failure consumes no item or HP and
      can be retried. Do not LEVER flood-hatch WITH crow-bar unless you accept
      a lethal check. Go east to the Wheel-Room. Water stands behind the weed and bough.
    variants:
      - when: [{ has_flag: sluice_clear }]
        text: >
          You cleared the choked head-race. The flood-hatch is now unnecessary and
          cannot help further. Go east to the Wheel-Room.
    objects: [choked_sluice, flood_hatch]
    exits:
      - { direction: east, to: wheel_room }

  - id: the_staith
    name: "The Staith, Water Up"
    description: >
      You opened the sea-gate and saved the trapped boat. The boat passes the Staith
      safely as water covers the mud. The quest is complete.
    on_enter:
      - inc_var: { name: score, by: 20 }
      - add_journal: "You reached the Staith after opening the sea-gate and saved the trapped boat. (+20 score)"
    exits:
      - { direction: up, to: wheel_room }

objects:
  - id: millboard
    name: "millboard"
    aliases: [board, notice, orders, chalk, sign]
    description: >
      The millboard records the repair order, combat preparation, flood-hatch
      warning, and coin-bag instruction. READ millboard only if that action is still offered.
    read_text: >
      The order is to collect any missing combat gear, ATTACK tool-shed saboteur,
      CUT choked head-race WITH billhook, FREE brake-pawl WITH crow-bar, and WIND
      sea-gate winch WITH crank-handle, then go down to the Staith. Complete only
      unfinished steps. Never LEVER flood-hatch WITH crow-bar. Leave the coin-bag in
      the Counting-Nook.
    interactions:
      - verb: READ
        target: millboard
        conditions: [{ not_flag: read_board }]
        effects:
          - set_flag: read_board
          - inc_var: { name: score, by: 5 }
          - add_journal: "You READ the millboard. Fix the head-race and brake-pawl, then WIND sea-gate winch WITH crank-handle. Completed repairs remain recorded. Never LEVER flood-hatch WITH crow-bar. (+5 score)"

  - id: gaff_hook
    name: "gaff-pole"
    aliases: [gaff, hook, pole, gaff hook, gaff-pole]
    description: >
      TAKE gaff-pole if needed to gain lasting +2 attack. The bonus helps only if
      the tool-shed saboteur still stands. Its hook keeps a knife at a distance.
    variants:
      - when: [{ has_flag: hook_taken }]
        text: "You already gained the gaff-pole's lasting +2 attack. The bonus persists after dropping or re-taking the pole and matters only while the tool-shed saboteur still stands."
    takeable: true
    take_effects:
      - set_flag: hook_taken
      - inc_var: { name: attack, by: 2 }
      - add_journal: "You TOOK the gaff-pole and gained lasting +2 attack; it helps against the tool-shed saboteur only while he still stands."

  - id: coin_bag
    name: "coin-bag"
    aliases: [bag, coin bag, purse, takings, toll, money, silver, cash]
    description: >
      Leave the coin-bag on the desk for the clean rescue. After the sea-gate opens,
      POCKET coin-bag permanently costs 5 score. Only in the Counting-Nook can you
      RETURN pocketed coin-bag. You can instead keep the bag while saving the boat.
      Outside the nook, STEAL pocketed coin-bag to end the journey without saving the boat.
    variants:
      - when: [{ has_item: coin_bag }]
        name: "pocketed coin-bag"
        text: >
          You POCKETED the coin-bag and permanently lost 5 score. In the Counting-Nook,
          RETURN pocketed coin-bag. You can instead keep the bag while saving the boat.
          Outside the nook, STEAL pocketed coin-bag to end the journey without saving the boat.
      - when: [{ has_flag: coin_bag_returned }]
        text: >
          You RETURNED the coin-bag to the counting-desk. The 5-point loss from
          the earlier pocketing remains.
    droppable: false
    interactions:
      - verb: USE
        target: coin_bag
        command_verb: pocket
        conditions: [{ has_flag: gate_up }, { not_flag: coin_bag_returned }, { not_item: coin_bag }]
        effects:
          - add_item: coin_bag
          - dec_var: { name: score, by: 5 }
          - add_journal: "You POCKETED Ives's coin-bag after opening the sea-gate. You permanently lost 5 score, even if you RETURN pocketed coin-bag."
          - narrate: "You POCKET the coin-bag and permanently lose 5 score. In the Counting-Nook, RETURN pocketed coin-bag if you do not want to keep the stolen money."
      - verb: USE
        item: coin_bag
        target: coin_bag
        command_verb: return
        conditions: [{ has_item: coin_bag }, { in_room: counting_nook }]
        effects:
          - remove_item: coin_bag
          - place_object: { id: coin_bag, room: counting_nook, takenBy: player }
          - set_flag: coin_bag_returned
          - add_journal: "You RETURNED the coin-bag to the counting-desk. The earlier 5-point loss remains."
          - narrate: "You RETURN the coin-bag to the counting-desk. You no longer carry the stolen money, but the 5-point loss is not restored."
      - verb: USE
        item: coin_bag
        target: coin_bag
        command_verb: steal
        conditions: [{ has_item: coin_bag }, { none_of: [{ in_room: counting_nook }] }]
        effects:
          - end_game: ending_thief

  - id: oilskin_coat
    name: "oilskin mill-coat"
    aliases: [coat, oilskin, mill-coat, jacket]
    description: >
      TAKE oilskin mill-coat if needed to gain lasting +2 defense. The bonus
      helps only if the tool-shed saboteur still stands. Old wool pads its shoulders.
    variants:
      - when: [{ has_flag: oilskin_taken }]
        text: "You already gained the oilskin mill-coat's lasting +2 defense. The bonus persists after dropping or re-taking the coat and matters only while the tool-shed saboteur still stands."
    takeable: true
    take_effects:
      - set_flag: oilskin_taken
      - inc_var: { name: defense, by: 2 }
      - add_journal: "You TOOK the oilskin mill-coat and gained lasting +2 defense; it helps against the tool-shed saboteur only while he still stands."

  - id: crank_handle
    name: "crank-handle"
    aliases: [handle, crank, winding-handle, winch-handle]
    description: >
      The crank-handle operates the sea-gate winch after both wheel faults are
      cleared. If that repair is unfinished, TAKE crank-handle if needed and WIND
      sea-gate winch WITH crank-handle only when offered.
    takeable: true
    quest_critical: true
    take_effects:
      - set_flag: crank_handle_taken

  - id: billhook
    name: "billhook"
    aliases: [bill, bill-hook, blade, hedging-hook]
    description: >
      The billhook clears the choked head-race. If that fault remains, TAKE billhook if
      needed and CUT choked head-race WITH billhook when offered; failure costs no item
      or HP and can be retried.
    takeable: true
    quest_critical: true
    take_effects:
      - set_flag: billhook_taken

  - id: crow_bar
    name: "crow-bar"
    aliases: [crowbar, bar, crow bar, iron bar, lever, pry-bar, prybar]
    description: >
      The crow-bar frees the brake-pawl. If that fault remains, TAKE crow-bar if needed
      and FREE brake-pawl WITH crow-bar when offered. While the head-race remains choked,
      LEVER flood-hatch WITH crow-bar is a harder alternative offered only while you also
      hold billhook; failure kills you.
    takeable: true
    quest_critical: true
    take_effects:
      - set_flag: crow_bar_taken

  - id: choked_sluice
    name: "choked head-race"
    aliases: [sluice, race, head-race, head race, weed, wrack, bough, channel, choke]
    description: >
      Retrieve the billhook if needed, then CUT choked head-race WITH billhook. Success clears one wheel fault and
      grants +10 score. Failure consumes no item or HP and can be retried. TALK TO Miller
      Ives, then select the displayed "Ask how to clear the choked race." topic for +5 craft.
    variants:
      - when: [{ has_flag: sluice_clear }]
        name: "head-race"
        text: "You cleared the choked head-race and gained +10 score. Water now reaches the wheel."
    interactions:
      - verb: USE
        target: choked_sluice
        command_verb: check
        conditions: [{ not_item: billhook }, { not_flag: sluice_clear }]
        effects:
          - narrate: >
              You cannot CHECK the choked head-race clear by hand. If the tool-shed
              saboteur still stands, ATTACK tool-shed saboteur. Then, in the Tool-Shed, TAKE
              billhook, or retrieve it where dropped. CUT choked head-race WITH billhook.
      - verb: USE
        item: billhook
        target: choked_sluice
        command_verb: cut
        command_template: "cut {target} with {item}"
        conditions: [{ not_flag: sluice_clear }, { has_flag: pawl_free }]
        skill_check:
          skill: craft
          difficulty: 9
          on_success:
            - set_flag: sluice_clear
            - inc_var: { name: score, by: 10 }
            - add_journal: "You CUT the choked head-race with the billhook. Both wheel faults are now fixed. (+10 score)"
            - narrate: "You CUT away the weed and bough with the billhook. Water reaches the wheel, both faults are fixed, and you gain +10 score."
          on_failure:
            - narrate: "The CUT check failed, and the choked head-race remains blocked. You lost no item or HP. Retry with CUT choked head-race WITH billhook; retries are unlimited."
      - verb: USE
        item: billhook
        target: choked_sluice
        command_verb: cut
        command_template: "cut {target} with {item}"
        conditions: [{ not_flag: sluice_clear }, { not_flag: pawl_free }]
        skill_check:
          skill: craft
          difficulty: 9
          on_success:
            - set_flag: sluice_clear
            - inc_var: { name: score, by: 10 }
            - add_journal: "You CUT the choked head-race with the billhook. The brake-pawl still needs repair. (+10 score)"
            - narrate: "You CUT away the weed and bough with the billhook. Water reaches the wheel, one fault is fixed, and you gain +10 score."
          on_failure:
            - narrate: "The CUT check failed, and the choked head-race remains blocked. You lost no item or HP. Retry with CUT choked head-race WITH billhook; retries are unlimited."
      - verb: USE
        target: choked_sluice
        command_verb: clear
        conditions: [{ has_item: billhook }, { not_flag: sluice_clear }, { has_flag: pawl_free }]
        skill_check:
          skill: craft
          difficulty: 9
          on_success:
            - set_flag: sluice_clear
            - inc_var: { name: score, by: 10 }
            - add_journal: "You CLEARED the choked head-race with the billhook. Both wheel faults are now fixed. (+10 score)"
            - narrate: "You CLEAR away the weed and bough with the billhook. Water reaches the wheel, both faults are fixed, and you gain +10 score."
          on_failure:
            - narrate: "The CLEAR check failed, and the choked head-race remains blocked. You lost no item or HP. Retry with CLEAR choked head-race; retries are unlimited."
      - verb: USE
        target: choked_sluice
        command_verb: clear
        conditions: [{ has_item: billhook }, { not_flag: sluice_clear }, { not_flag: pawl_free }]
        skill_check:
          skill: craft
          difficulty: 9
          on_success:
            - set_flag: sluice_clear
            - inc_var: { name: score, by: 10 }
            - add_journal: "You CLEARED the choked head-race with the billhook. The brake-pawl still needs repair. (+10 score)"
            - narrate: "You CLEAR away the weed and bough with the billhook. Water reaches the wheel, one fault is fixed, and you gain +10 score."
          on_failure:
            - narrate: "The CLEAR check failed, and the choked head-race remains blocked. You lost no item or HP. Retry with CLEAR choked head-race; retries are unlimited."

  - id: brake_pawl
    name: "brake-pawl"
    aliases: [pawl, brake, catch, dog, ratchet, lock]
    description: >
      Retrieve the crow-bar if needed, then FREE brake-pawl WITH crow-bar. Success clears one wheel fault and grants
      +10 score. Failure consumes no item or HP and can be retried. TALK TO Miller Ives,
      then select the displayed "Ask how to free the brake-pawl and wind the gate." topic
      for +5 might.
    variants:
      - when: [{ has_flag: pawl_free }]
        text: "You FREED the brake-pawl and gained +10 score. It is pinned clear of the drive-gear."
    interactions:
      - verb: USE
        item: crow_bar
        target: brake_pawl
        command_verb: free
        command_template: "free {target} with {item}"
        conditions: [{ has_item: crow_bar }, { not_flag: pawl_free }, { has_flag: sluice_clear }]
        skill_check:
          skill: might
          difficulty: 9
          on_success:
            - set_flag: pawl_free
            - inc_var: { name: score, by: 10 }
            - add_journal: "You FREED the brake-pawl with the crow-bar. Both wheel faults are now fixed. (+10 score)"
            - narrate: "You FREE the brake-pawl with the crow-bar and pin it clear. Both faults are fixed, and you gain +10 score."
          on_failure:
            - narrate: "The FREE check failed, and the brake-pawl dropped back into place. You lost no item or HP. Retry with FREE brake-pawl WITH crow-bar; retries are unlimited."
      - verb: USE
        item: crow_bar
        target: brake_pawl
        command_verb: free
        command_template: "free {target} with {item}"
        conditions: [{ has_item: crow_bar }, { not_flag: pawl_free }, { not_flag: sluice_clear }]
        skill_check:
          skill: might
          difficulty: 9
          on_success:
            - set_flag: pawl_free
            - inc_var: { name: score, by: 10 }
            - add_journal: "You FREED the brake-pawl with the crow-bar. The choked head-race still needs repair. (+10 score)"
            - narrate: "You FREE the brake-pawl with the crow-bar and pin it clear. One fault is fixed, and you gain +10 score."
          on_failure:
            - narrate: "The FREE check failed, and the brake-pawl dropped back into place. You lost no item or HP. Retry with FREE brake-pawl WITH crow-bar; retries are unlimited."

  - id: flood_hatch
    name: "flood-hatch"
    aliases: [hatch, flood hatch, floodgate, flood-gate, staging, trap]
    description: >
      Do not LEVER flood-hatch WITH crow-bar unless you accept a difficult, lethal
      shortcut while holding billhook. Success clears the choked head-race; failure
      drops you into the wheel-pit and ends the game. CUT choked head-race WITH billhook
      for the safe, retryable route.
    variants:
      - when: [{ has_flag: sluice_clear }]
        text: >
          The choked head-race is already clear, so the flood-hatch cannot help and
          no longer has an available LEVER action.
    interactions:
      - verb: USE
        item: crow_bar
        target: flood_hatch
        command_verb: lever
        command_template: "lever {target} with {item}"
        conditions: [{ has_item: crow_bar }, { has_item: billhook }, { not_flag: sluice_clear }, { has_flag: pawl_free }]
        skill_check:
          skill: might
          difficulty: 16
          on_success:
            - set_flag: sluice_clear
            - inc_var: { name: score, by: 10 }
            - add_journal: "You LEVERED the flood-hatch and cleared the choked head-race. Both wheel faults are now fixed. (+10 score)"
            - narrate: >
                You LEVER the flood-hatch with the crow-bar while holding it with the
                billhook. The hatch opens, clears the head-race fault, and grants +10
                score. Both wheel faults are now fixed.
          on_failure:
            - add_journal: "You failed the lethal flood-hatch check. The rotten staging dropped you into the wheel-pit."
            - narrate: >
                The LEVER check fails. The rotten staging breaks, and you fall into
                the wheel-pit. This ends the game immediately.
            - end_game: ending_drowned
      - verb: USE
        item: crow_bar
        target: flood_hatch
        command_verb: lever
        command_template: "lever {target} with {item}"
        conditions: [{ has_item: crow_bar }, { has_item: billhook }, { not_flag: sluice_clear }, { not_flag: pawl_free }]
        skill_check:
          skill: might
          difficulty: 16
          on_success:
            - set_flag: sluice_clear
            - inc_var: { name: score, by: 10 }
            - add_journal: "You LEVERED the flood-hatch and cleared the choked head-race. The brake-pawl still needs repair. (+10 score)"
            - narrate: >
                You LEVER the flood-hatch with the crow-bar while holding it with the
                billhook. The hatch opens, clears one wheel fault, and grants +10 score.
          on_failure:
            - add_journal: "You failed the lethal flood-hatch check. The rotten staging dropped you into the wheel-pit."
            - narrate: >
                The LEVER check fails. The rotten staging breaks, and you fall into
                the wheel-pit. This ends the game immediately.
            - end_game: ending_drowned

  - id: sea_winch
    name: "sea-gate winch"
    aliases: [winch, gate, sea-gate, sea gate, socket, capstan]
    description: >
      Retrieve the crank-handle if needed, then WIND sea-gate winch WITH crank-handle after
      clearing the choked head-race and freeing the brake-pawl. Failure consumes no item or HP and can
      be retried.
      Success opens the down exit to the Staith.
    variants:
      - when: [{ has_flag: gate_up }]
        text: "You already WOUND the sea-gate winch. The sea-gate is open, and the down exit to the Staith is unlocked."
    interactions:
      - verb: USE
        item: crank_handle
        target: sea_winch
        command_verb: wind
        command_template: "wind {target} with {item}"
        conditions:
          - { has_item: crank_handle }
          - { has_flag: sluice_clear }
          - { has_flag: pawl_free }
          - { not_flag: gate_up }
        skill_check:
          skill: might
          difficulty: 9
          on_success:
            - set_flag: gate_up
            - add_journal: "You WOUND the sea-gate winch with the crank-handle. The down exit to the Staith is open."
            - narrate: "You WIND the sea-gate winch with the crank-handle. The gate opens and water reaches the Staith. Go down to save the boat."
          on_failure:
            - narrate: "The WIND check failed, and the sea-gate remains closed. You lost no item or HP. Retry with WIND sea-gate winch WITH crank-handle; retries are unlimited."

npcs:
  - id: ives
    name: "Miller Ives"
    description: >
      Miller Ives can grant +5 craft for the head-race, +5 might for the brake-pawl,
      and combat advice while those tasks remain. Asked later, he records the method
      without reopening completed work. He is injured and cannot make the repairs.
    room: mill_house
    dialogue:
      root: ives_root
      nodes:
        - id: ives_root
          npc_text: >
            If the millboard is unread, READ millboard for the full order. Ask me how to
            clear the choked head-race, free the brake-pawl, or fight the tool-shed saboteur.
          variants:
            - when:
                - any_of:
                    - { has_flag: heard_race_trick }
                    - { has_flag: heard_pawl_trick }
                    - { has_flag: heard_yard_trick }
              text: "What else do you need: the choked head-race, brake-pawl, or tool-shed saboteur?"
          topics:
            - id: race
              prompt: "Ask how to clear the choked race."
              conditions: [{ not_flag: heard_race_trick }]
              goto: race_trick
            - id: pawl
              prompt: "Ask how to free the brake-pawl and wind the gate."
              conditions: [{ not_flag: heard_pawl_trick }]
              goto: pawl_trick
            - id: yard
              prompt: "Ask about the saboteur at the tool-shed."
              conditions: [{ not_flag: heard_yard_trick }]
              goto: yard_trick
            - id: leave
              prompt: "Leave Ives and work the mill."
              end: true
        - id: race_trick
          npc_text: >
            To clear an unfinished head-race, CUT choked head-race WITH billhook: start at the
            downstream weed, pull the bough toward the wheel, and cut the exposed
            strands. This advice grants +5 craft. Failed CUT checks consume no item or
            HP and can be retried; a completed repair stays complete.
          effects:
            - set_flag: heard_race_trick
            - inc_var: { name: craft, by: 5 }
            - add_journal: "Miller Ives explained how to CUT the choked head-race with the billhook. (+5 craft)"
          topics:
            - id: pawl
              prompt: "Ask next about the brake-pawl and sea-gate."
              conditions: [{ not_flag: heard_pawl_trick }]
              goto: pawl_trick
            - id: yard
              prompt: "Ask next about the saboteur at the tool-shed."
              conditions: [{ not_flag: heard_yard_trick }]
              goto: yard_trick
            - id: back
              prompt: "Nod, and ask something else."
              goto: ives_root
            - id: leave
              prompt: "Leave Ives and work the mill."
              end: true
        - id: pawl_trick
          npc_text: >
            For unfinished work, put the crow-bar under the pawl's heel, not against
            the gear teeth. Then FREE brake-pawl WITH crow-bar and pin it before it
            drops. Use the same steady motion to WIND sea-gate winch WITH crank-handle.
            This advice grants +5 might; completed repairs stay complete.
          effects:
            - set_flag: heard_pawl_trick
            - inc_var: { name: might, by: 5 }
            - add_journal: "Miller Ives explained how to FREE brake-pawl WITH crow-bar and WIND sea-gate winch WITH crank-handle. (+5 might)"
          topics:
            - id: race
              prompt: "Ask next how to clear the choked race."
              conditions: [{ not_flag: heard_race_trick }]
              goto: race_trick
            - id: yard
              prompt: "Ask next about the saboteur at the tool-shed."
              conditions: [{ not_flag: heard_yard_trick }]
              goto: yard_trick
            - id: back
              prompt: "Nod, and ask something else."
              goto: ives_root
            - id: leave
              prompt: "Leave Ives and work the mill."
              end: true
        - id: yard_trick
          npc_text: >
            If the tool-shed saboteur still stands, TAKE gaff-pole and TAKE oilskin
            mill-coat before you ATTACK tool-shed saboteur. Their +2 attack and +2 defense bonuses last.
            Fighting without both is a lethal gamble; a completed fight stays complete.
          effects:
            - set_flag: heard_yard_trick
            - add_journal: "Miller Ives said the gaff-pole and oilskin mill-coat grant lasting +2 attack and +2 defense; they help only if the tool-shed saboteur still stands."
          topics:
            - id: race
              prompt: "Ask next how to clear the choked race."
              conditions: [{ not_flag: heard_race_trick }]
              goto: race_trick
            - id: pawl
              prompt: "Ask next about the brake-pawl and sea-gate."
              conditions: [{ not_flag: heard_pawl_trick }]
              goto: pawl_trick
            - id: back
              prompt: "Nod, and ask something else."
              goto: ives_root
            - id: leave
              prompt: "Leave Ives and work the mill."
              end: true

enemies:
  - id: mill_saboteur
    name: "tool-shed saboteur"
    description: "ATTACK tool-shed saboteur to unlock the Tool-Shed. The fight can kill you. The gaff-pole's +2 attack and oilskin mill-coat's +2 defense persist once taken; TAKE gaff-pole or TAKE oilskin mill-coat only while each pickup is offered."
    room: mill_yard
    hp: 8
    attack: 4
    defense: 2
    defeat_flag: yard_clear
    death_ending: ending_cut_down
    on_defeat:
      - inc_var: { name: score, by: 10 }
      - add_journal: "You defeated the tool-shed saboteur and unlocked the east exit to the Tool-Shed. (+10 score)"

win_conditions:
  - id: save_boat_with_takings
    conditions: [{ visited: the_staith }, { has_item: coin_bag }]
    ending: ending_saved_with_takings
  - id: save_boat_after_returning_takings
    conditions: [{ visited: the_staith }, { has_flag: coin_bag_returned }, { not_item: coin_bag }]
    ending: ending_saved_returned_takings
  - id: save_boat
    conditions: [{ visited: the_staith }]
    ending: ending_saved

endings:
  - id: ending_saved
    title: "The Boat Comes Down"
    variants:
      - when: [{ not_flag: read_board }]
        text: >
          You repaired both wheel faults and opened the sea-gate without reading the
          millboard. The boat is safe, and Miller Ives's coin-bag remains on the desk.
          *** You have won. ***
    text: >
      You fixed both wheel faults, opened the sea-gate, and saved the boat. You
      defeated the tool-shed saboteur, and Miller Ives's coin-bag remains on the desk.
      *** You have won. ***
  - id: ending_saved_returned_takings
    title: "The Boat Comes Down, The Bag Put Back"
    text: >
      You opened the sea-gate, saved the boat, and RETURNED Miller Ives's coin-bag.
      The earlier 5-point pocketing loss remains. *** You have won. ***
  - id: ending_saved_with_takings
    title: "The Boat Comes Down, Silver in Your Coat"
    text: >
      You opened the sea-gate and saved the boat while keeping Miller Ives's
      coin-bag. You permanently lost 5 score and leave with the stolen money.
      *** You have won. ***
  - id: ending_thief
    title: "The Week's Takings"
    text: >
      You STOLE Miller Ives's coin-bag and ended the journey without reaching the
      Staith. The trapped boat remains above the weir as the tide falls.
      *** You have taken the takings. ***
  - id: ending_drowned
    title: "Under the Wheel"
    text: >
      You failed the lethal flood-hatch check. The rotten staging broke, and the
      released water pulled you into the wheel-pit. *** You have died. ***
    death: true
  - id: ending_cut_down
    title: "Knife on the Wet Cobble"
    text: >
      The tool-shed saboteur killed you in combat. Without enough attack or defense,
      his knife passed your guard. The Tool-Shed remains locked, and the boat remains
      trapped. *** You have died. ***
    death: true
