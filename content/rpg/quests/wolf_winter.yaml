endings:
  - id: ending_bloodied_byre_evacuated_june_released
    title: "The Bloodied Byre Evacuated — June Released"
    text: >
      Victory with losses: Cade and every rider escape. The grey leader keeps the byre,
      two cattle are missing, and the byre and outer defense are abandoned. June had
      already returned to Albany after you released her from HUNT. Your
      agreement remains intact, but she provided no field aid. Albany receives the full
      report. *** You have won, by evacuation and with loss. ***
  - id: ending_bloodied_byre_evacuated
    title: "The Bloodied Byre Evacuated"
    text: >
      Victory with losses: Cade and every rider escape. The grey leader keeps the byre,
      two cattle are missing, and the byre and outer defense are abandoned. Albany
      receives the full report. *** You have won, by evacuation and with loss. ***
  - id: ending_fortified_cade_terms
    title: "Dawn Behind Cade's Shutters"
    text: >
      Victory with property exposed: The whole herd is safe, and all three wolves remain
      alive outside the sealed byre. Cade's two household shutters held. His smokehouse
      and outer property are exposed, and Albany's relief seals remain unused. Cade records
      the terms that supplied his aid. *** You have won, with property exposed. ***
    variants:
      - when: [{ has_flag: june_fortify_cattle_line_taken }]
        text: >
          Victory with property exposed: The whole herd is safe, and all three wolves
          remain alive outside Cade's sealed byre. June Pike independently held the lower
          cattle brace under her authority. Cade's smokehouse and outer property are exposed,
          and Albany's relief seals remain unused. Both reports record the accepted terms.
          *** You have won, with property exposed. ***
  - id: ending_fortified_albany_authority
    title: "Dawn Under Albany Seal"
    text: >
      Victory at Albany's cost: The whole herd is safe, and all three wolves remain alive
      outside the sealed byre. Albany's relief seals protected Cade's property, but the
      public supply is spent. Cade records the lawful order and his refusal. The emergency
      public binding strip was the available recovery. *** You have won, at Albany's cost. ***
    variants:
      - when: [{ has_flag: june_fortify_cattle_line_taken }]
        text: >
          Victory at Albany's cost: The whole herd is safe, and all three wolves remain
          alive outside the sealed byre. June Pike independently held the lower cattle
          brace under her authority. Albany's relief seals protected Cade's property, but
          the public supply is spent and Cade's refusal stands. Both reports record the
          lawful order. *** You have won, at Albany's cost. ***
  - id: ending_drive_cattle_wounded
    title: "The Herd Out, Rider Hurt"
    text: >
      Victory with a persistent wound: Cade, every rider, and the whole herd escape. All
      three wolves remain alive. The iron gate struck your shoulder, costing 6 HP
      and a persistent wound. The outer defense is abandoned, and the signal-and-rope rig
      returns to Albany for repair. *** You have won, wounded. ***
    variants:
      - when: [{ has_flag: june_drive_cattle_line_taken }]
        text: >
          Victory with a persistent wound: Cade, June Pike, every rider, and the whole herd
          escape. All three wolves remain alive. June independently held the lower gate
          under her authority. The iron gate struck your shoulder, costing 6 HP
          and a persistent wound. Her promise remains intact; the outer defense is abandoned,
          and the signal-and-rope rig returns for repair. *** You have won, wounded. ***
  - id: ending_drive_person_cattle_lost
    title: "The People Out, Cattle Lost"
    text: >
      Victory with losses: Cade and every rider escape, and all three wolves remain alive.
      Choosing the people-first crossing costs two cattle in the lower pasture. The outer
      defense is abandoned, and the spent signal-and-rope rig returns to Albany. *** You
      have won, with loss. ***
    variants:
      - when: [{ has_flag: june_drive_cattle_line_taken }]
        text: >
          Victory with losses: Cade, June Pike, and every rider escape, and all three wolves
          remain alive. June held the lower gate under her authority, but the people-first
          crossing still costs two cattle in the lower pasture. Her promise remains intact;
          the outer defense is abandoned, and the spent signal-and-rope rig returns to
          Albany. *** You have won, with loss. ***
  - id: ending_drive_reserve_spent
    title: "The Steading Evacuated, Reserve Spent"
    text: >
      Victory at the reserve's cost: Cade, every rider, and the whole herd escape. All three
      wolves remain alive. The signal-and-rope rig is lost because its cut rope and housing
      became the final anchor. The outer defense is abandoned, and you return unwounded.
      *** You have won, at the reserve's cost. ***
    variants:
      - when: [{ has_flag: june_drive_cattle_line_taken }]
        text: >
          Victory at the reserve's cost: Cade, June Pike, every rider, and the whole herd
          escape. All three wolves remain alive. June held the lower gate under her authority.
          The signal-and-rope rig is lost, the outer defense is abandoned, and her promise
          remains intact. *** You have won, at the reserve's cost. ***
  - id: ending_pack_diverted_after_blood
    title: "The Pack Broken After Blood"
    text: >
      Victory with losses: The yearling wolf is dead; the flank-wolf and grey leader remain
      alive. Two cattle are missing after the failed first diversion scattered the herd.
      Albany receives the full count. *** You have won, after changing strategy and with loss. ***
    variants:
      - when: [{ has_flag: june_pike_present }, { has_flag: june_blood_condition_broken }]
        text: >
          Victory with losses: The yearling wolf is dead; the flank-wolf and grey leader
          remain alive. The first wolf death ended June Pike's agreement before the inner
          rail, and two cattle are missing. Her separate report records both costs. *** You
          have won, after changing strategy and with loss. ***
  - id: ending_pack_diverted_cattle_scattered
    title: "The Pack Diverted, Cattle Scattered"
    text: >
      Victory with losses: All three wolves survive and the byre stands, but cattle alarm
      reached Breaking before the grey leader left. Two cattle are missing in the lower
      pasture. Cade and Albany record the nonlethal result and its cost. *** You have won,
      with loss. ***
    variants:
      - when: [{ has_flag: june_cattle_line_taken }]
        text: >
          Victory with losses: All three wolves survive. June Pike refused to help with
          the wolves and protected the lower rail, but cattle alarm had already reached
          Breaking. Two cattle are missing, and her report records the loss. *** You have
          won, with loss. ***
      - when: [{ has_flag: lure_trail_fouled }]
        text: >
          Victory with losses: All three wolves survive and the byre stands, but the failed
          first LAY attempt raised cattle alarm to Breaking before the grey leader left.
          Two cattle are missing in the lower pasture. Cade and Albany record the nonlethal
          result and its cost. *** You have won, with loss. ***
  - id: ending_pack_diverted
    title: "The Pack Diverted Alive"
    text: >
      Victory without bloodshed: The whole herd survives, and all three wolves leave for
      the high wood. Cade's winter feed is gone after the three diversions, but cattle
      alarm stayed below Breaking. *** You have won. ***
    variants:
      - when:
          - { has_flag: june_cattle_line_taken }
          - { has_flag: read_tally }
          - { has_flag: jerkin_donned }
          - { not_flag: heard_counsel }
        text: >
          Victory without bloodshed: The whole herd survives, and all three wolves leave.
          June Pike refused to help with the wolves but protected the lower rail and kept
          cattle alarm below Breaking. You followed only part of the day-book: you wore the
          padded byre-jerkin but skipped Cade's quick spear lesson, reducing the outcome
          score by 5. Albany receives both reports. *** You have won. ***
      - when: [{ has_flag: june_cattle_line_taken }]
        text: >
          Victory without bloodshed: The whole herd survives, and all three wolves leave.
          June Pike refused to help with the wolves but protected the lower rail and kept
