  # The fortification family receives exactly one stance-owned bundle at commitment.
  # Both bundles remain non-droppable until their second spatial use installs them in the
  # byre. They are mutually exclusive and never enter the campaign inventory.
  - id: cade_household_shutters
    name: "Cade's two household shutters"
    aliases: [household shutters, Cade's shutters, shutter bundle, two shutters]
    description: >
      SEAT Cade's two household shutters ON outer fortification frame, then SET Cade's
      two household shutters ON byre threshold seal. This exposes Cade's smokehouse and
      outer property, preserves Albany's relief seals, and makes Cade's offered bracing hand
      available after a failed outer seal.
    variants:
      - when: [{ has_flag: fortify_cade_recovery_helped }]
        text: >
          Go north and SET Cade's two household shutters ON byre threshold seal. Cade's
          offered bracing hand completed the failed outer seal, but its added fortification
          pressure remains.
      - when: [{ has_flag: fortify_outer_sealed }]
        text: >
          Go north and SET Cade's two household shutters ON byre threshold seal. The
          first shutter protects the Broken Paling. Cade's outer property is exposed,
          Albany's relief seals are preserved, and Cade can help after a failed outer seal.
    visible_when:
      - { has_flag: fortify_cade_terms_accepted }
      - { not_visited: paling_gap }
    takeable: true
    droppable: false
    take_effects:
      - add_journal: "You take Cade's two household shutters. SEAT Cade's two household shutters ON outer fortification frame, SET Cade's two household shutters ON byre threshold seal, then HOLD sealed-byre dawn watch. Cade's outer property is exposed; Albany's relief seals are preserved."

  - id: albany_relief_seals
    name: "Albany relief seal roll"
    aliases: [relief seals, public seals, Albany seals, seal roll, binding strips]
    description: >
      SEAT Albany relief seal roll ON outer fortification frame, then SET Albany
      relief seal roll ON byre threshold seal. An emergency strip can recover one failed
      outer seal. This protects Cade's property but consumes public stock, and Cade will not help.
    variants:
      - when: [{ has_flag: fortify_authority_emergency_seal_spent }]
        text: >
          Go north and SET Albany relief seal roll ON byre threshold seal. The
          emergency strip completed the failed outer seal. Cade's property remains
          protected, public material was spent, and Cade still refuses to help.
      - when: [{ has_flag: fortify_outer_sealed }]
        text: >
