              effects:
                - inc_var: { name: fortification_pressure, by: 1 }
                - add_journal: "The delayed dispatch adds another 1 fortification pressure after the failed outer seal."
                - narrate: >
                    The delayed dispatch raises fortification pressure by another 1.

      - verb: USE
        item: albany_relief_seals
        target: fortify_outer_seal
        command_verb: seat
        conditions:
          - { has_item: albany_relief_seals }
          - { has_flag: fortify_albany_authority_invoked }
          - { not_flag: opening_condition_sound_lower_frame }
          - { not_flag: relief_oath_full_duty }
          - { not_flag: works_fortification_prepared }
          - { not_flag: fortify_outer_seal_attempted }
        effects:
          - set_flag: fortify_outer_seal_attempted
          - inc_var: { name: fortification_pressure, by: 1 }
        skill_check:
          skill: repair
          difficulty: 14
          on_success:
            - set_flag: fortify_outer_sealed
            - set_quest_stage: { quest: the_watch, stage: outer_sealed }
            - add_journal: "The Repair check succeeds at DC 14. The first Albany band holds; fortification pressure becomes Testing. Carry the remaining band north."
            - narrate: >
                The first Albany band holds at the Broken Paling. Cade's property stays
                protected, and one band remains for the Byre Door.
          on_failure:
            - set_flag: fortify_outer_seal_failed
            - inc_var: { name: fortification_pressure, by: 1 }
            - add_journal: "The Repair check fails and cannot be retried. Fortification pressure becomes Hammering. BIND authority emergency binding WITH Albany relief seal roll; Cade will not help."
            - narrate: >
                The first Albany band slips. The Repair check cannot be retried, and
                fortification pressure becomes Hammering. BIND authority emergency
                binding WITH Albany relief seal roll to complete the outer seal. Cade will not help.

          on_failure_when:
            - conditions:
                - { has_flag: dispatch_opening_delayed }
              effects:
                - inc_var: { name: fortification_pressure, by: 1 }
                - add_journal: "The delayed dispatch adds another 1 fortification pressure after the failed outer seal."
                - narrate: >
                    The delayed dispatch raises fortification pressure by another 1.

  - id: cade_failed_seal_help
