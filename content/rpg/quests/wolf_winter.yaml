      - when:
          - { has_flag: flank_wolf_down }
          - { has_flag: leader_split_guard_set }
        text: >
          Go north. The flank-wolf is dead, and the split-rail guard was spent against the
          grey leader. The Broken Paling is south.
      - when:
          - { has_flag: flank_wolf_down }
          - { has_flag: leader_turned_over_crossbrace }
        text: >
          Go north. The flank-wolf is dead, and the saved brace-stake was spent against
          the grey leader. The Broken Paling is south.
      - when:
          - { has_flag: flank_wolf_down }
          - { has_item: saved_brace_stake }
        text: >
          Go north with the saved brace-stake. The flank-wolf is dead. You removed the
          stake from the fallen paling-rail instead of making the stronger pinning attack.
          The Broken Paling is south.
      - when:
          - { has_flag: flank_wolf_down }
          - { has_flag: flank_fallen_brace_driven }
        text: >
          Go north. The flank-wolf is dead beneath the frost-jammed door-brace. You tripped
          it and drove it with the bare Albany relief spear. The split fallen paling-rail
          remains unbound to the south.
      - when:
          - { has_flag: flank_wolf_down }
          - { has_flag: flank_frost_brace_tripped }
        text: >
          Go north. The flank-wolf is dead beneath the frost-jammed door-brace that you
          tripped with the bare Albany relief spear. The split fallen paling-rail remains
          unbound to the south.
      - when:
          - { has_flag: flank_wolf_down }
          - { has_flag: flank_dropped_from_loft }
          - { has_flag: jamie_market_testimony_certified }
          - { not_item: split_rail_guard }
        text: >
          Go north. The flank-wolf is dead below the low wolf-hatch. Jamie's feed-hauler's
          crawlboard let you drop behind it, and you carried no split-rail guard. The Broken
          Paling is south.
      - when:
          - { has_flag: flank_wolf_down }
          - { has_flag: flank_dropped_from_loft }
          - { has_item: split_rail_guard }
        text: >
          Go north with the split-rail guard. The flank-wolf is dead below the low wolf-hatch
          after your drop and finishing spear thrust. The Broken Paling is south.
      - when:
          - { has_flag: flank_wolf_down }
          - { has_item: split_rail_guard }
        text: >
          The flank-wolf is dead, and the split-rail guard is unspent. Go north with it if
          the grey leader still stands; after that fight, BAR inner cattle-gate WITH bound
          split-rail guard if offered, or keep the guard for daylight repair. Completed fights stay complete.
      - when: [{ has_flag: flank_wolf_down }, { has_flag: flank_pinned_at_rail }]
        text: >
          Go north. The flank-wolf is dead after the braced fallen paling-rail held it for
          your finishing thrust. The Broken Paling is south.
      - when: [{ has_flag: flank_wolf_down }, { has_flag: flank_turned_through_return }]
        text: >
          Go north. The flank-wolf is dead after your off-side wheel and return stroke.
          The Broken Paling is south.
      - when: [{ has_flag: flank_wolf_down }, { has_flag: flank_hooked_over_guard }]
        text: >
          Go north. The flank-wolf is dead after you hooked the Albany relief spear over
          the split-rail guard. The guard is broken. The Broken Paling is south.
      - when: [{ has_flag: flank_wolf_down }]
        text: >
          Go north. The flank-wolf is dead across the Byre Door. The Broken Paling is south.
      - when:
          - any_of:
              - { has_flag: flank_turned_through_return }
              - { has_flag: flank_fallen_brace_driven }
          - { not_flag: flank_wolf_down }
        text: >
          ATTACK flank-wolf until it is dead. Your authored two-step maneuver is complete,
          so its earlier command is no longer available.
      - when: [{ has_flag: flank_pinned_at_rail }]
        text: >
          ATTACK flank-wolf until it is dead. Your second authored maneuver pinned it
          against the braced fallen paling-rail and exposed its shoulder.
      - when: [{ has_flag: flank_hooked_over_guard }]
        text: >
          ATTACK flank-wolf until it is dead. The split-rail guard broke after your hook
          and is no longer available.
      - when:
          - { has_flag: flank_brace_stake_saved }
          - { has_item: saved_brace_stake }
        text: >
          ATTACK flank-wolf until it is dead. You saved the brace-stake, so your previous
          maneuver did less damage. The stake remains in your hands.
      - when: [{ has_flag: flank_funneled }]
        text: >
          Choose now. PIN the flank-wolf against the braced rail for the stronger attack,
          or WRENCH the paling's brace-stake free behind the spear guard for a weaker attack
          that saves the stake. This choice cannot be changed after you act.
      - when: [{ has_flag: flank_offside_cut }]
        text: >
          Now, TURN through the flank-wolf's returning stroke. Your off-side attack left
          your guard open, so delaying risks its next bite.
      - when: [{ has_flag: flank_splinter_guarded }]
        text: >
          Now, HOOK the spear over the breaking splinter guard. The guard caught the
          flank-wolf's first attack but will break after this use.
      - when: [{ has_flag: flank_frost_brace_tripped }]
        text: >
          Now, DRIVE Hayden's fallen brace through the checked flank-wolf. The brace pins
          the wolf, but Hayden's opening can be used only once.
      - when: [{ has_flag: flank_dropped_from_loft }]
        text: >
          ATTACK flank-wolf until it is dead. Your drop through the low wolf-hatch placed
          you behind it but left your guard open.
      - when:
          - { visited: fodder_loft }
          - { has_flag: jamie_market_testimony_certified }
          - { not_item: split_rail_guard }
        text: >
          Now, DRIVE from the fodder-loft drop behind the flank-wolf. Jamie's feed-hauler's
          crawlboard brought you to the low wolf-hatch without a split-rail guard. This
          maneuver closes every ground maneuver.
      - when:
          - { visited: fodder_loft }
          - { has_item: split_rail_guard }
        text: >
          Now, DRIVE from the fodder-loft drop behind the flank-wolf. This maneuver closes
          every ground maneuver but keeps the split-rail guard for any later use if you survive.
      - when:
          - { has_flag: hayden_frost_report_certified }
          - { not_flag: strategy_lure_committed }
          - { has_flag: rail_split }
          - { not_flag: split_rail_guard_made }
          - { not_item: split_rail_guard }
          - { none_of: [{ visited: fodder_loft }] }
        text: >
          TRIP Hayden's frost-jammed brace across the flank-wolf's turn. If it survives,
          DRIVE Hayden's fallen brace through the checked flank-wolf. Other available
          ground maneuvers remain open until you choose.
      - when: [{ has_flag: breach_braced }, { has_flag: heard_counsel }]
        text: >
          Choose a maneuver. HOLD the flank-wolf in the braced breach's funnel for a guarded
          attack, or WHEEL into the flank-wolf's off-side cut for a faster attack that leaves
          your guard open.
      - when: [{ has_item: split_rail_guard }, { has_flag: heard_counsel }]
        text: >
          Choose a maneuver. CATCH the flank-wolf's turn on the bound splinter guard and
          spend it here, or WHEEL into the flank-wolf's off-side cut for a riskier attack
          that preserves the guard.
      - when: [{ has_item: split_rail_guard }]
        text: >
          CATCH the flank-wolf's turn on the bound splinter guard. It blocks the first
          attack and will be spent here. The Broken Paling is south.
      - when: [{ has_flag: breach_braced }]
        text: >
          HOLD the flank-wolf in the braced breach's funnel for a guarded attack.
          Otherwise, ATTACK flank-wolf. The Broken Paling is south.
      - when: [{ has_flag: heard_counsel }, { not_flag: strategy_fortify_committed }]
        text: >
          WHEEL into the flank-wolf's off-side cut for Cade's faster attack, which leaves
          your guard open. Otherwise, ATTACK flank-wolf. The Broken Paling is south.
      - when:
          - { has_flag: fortify_cade_terms_accepted }
          - { not_flag: fortify_threshold_sealed }
        text: >
          SET Cade's two household shutters ON byre threshold seal. All three wolves
          remain outside the first shutter. Cade's outer property stays exposed, while
          Albany's relief seals stay preserved.
      - when:
          - { has_flag: fortify_albany_authority_invoked }
          - { not_flag: fortify_threshold_sealed }
        text: >
          SET Albany relief seal roll ON byre threshold seal. All three wolves
          remain outside the first seal. Cade's property stays protected, but public stock
          is spent and Cade still refuses to help.
      - when:
          - { has_flag: fortify_cade_terms_accepted }
          - { has_flag: fortify_threshold_sealed }
        text: >
          Go north and begin the sealed-byre dawn watch. Cade's two household shutters
          keep the living wolves outside. Retreat and all combat actions are closed.
      - when:
          - { has_flag: fortify_albany_authority_invoked }
          - { has_flag: fortify_threshold_sealed }
        text: >
          Go north and begin the sealed-byre dawn watch. The two Albany relief seals keep
          the living wolves outside, and public stock is spent. Retreat and all combat
          actions are closed.
    exits:
      - direction: south
        to: paling_gap
        conditions:
          - { not_flag: strategy_drive_committed }
          - { not_flag: strategy_fortify_committed }
          - { not_flag: pack_diverted }
        locked_msg: "South is closed. After LURE, go north for the cattle count. During DRIVE or FORTIFY, complete the shown Byre Door action, then go north."
      - direction: north
        to: byre_mouth
        conditions:
          - any_of:
              - { has_flag: flank_wolf_down }
              - { has_flag: flank_redirected }
              - { has_flag: drive_flank_turned }
              - { has_flag: fortify_threshold_sealed }
          - any_of:
              - all_of:
                  - { not_flag: strategy_drive_committed }
              - { not_flag: june_blood_condition_broken }
              - all_of:
                  - { has_flag: yearling_down }
                  - { has_flag: flank_wolf_down }
        locked_msg: "North is blocked. Complete the currently listed flank-wolf, DRIVE, or FORTIFY threshold action. You cannot change plans after choosing one."

  - id: byre_mouth
    name: "Deep in the Byre"
    description: >
      Use one exact action shown. Cade's plan offers HOLD the spear point and wait out the
      grey leader's feint. His lesson offers CLOSE before the grey leader can finish her
      feint. Saved rail gear offers its own named maneuver. Otherwise, ATTACK grey leader.
    objects:
      [
        inner_cattle_gate,
        outer_scent_gate,
        cattle_crisis_priority,
        person_crisis_priority,
        reserve_crisis_priority,
        drive_overrun_recovery,
        cattle_first_evacuation,
        person_first_evacuation,
        reserve_spent_evacuation,
        bloodied_byre_evacuation,
        fortify_dawn_watch,
      ]
    variants:
      - when: [{ has_flag: drive_courier_wounded }]
        text: >
          Now, FINISH cattle-first lower-lane evacuation. Other evacuations are closed.
          Your cattle-first choice saved the whole herd but the gate wound cost 6 HP.
      - when: [{ has_flag: drive_cattle_lost }]
        text: >
          Now, FINISH person-first cross-yard evacuation. Other evacuations are closed.
          Your people-first choice saved everyone but lost two cattle.
      - when: [{ has_flag: drive_reserve_spent }]
        text: >
          Now, FINISH reserve-spent smoke-lane evacuation. Other evacuations are closed.
          This choice saves everyone and the whole herd but consumes the drive rig.
      - when:
          - { has_flag: strategy_drive_committed }
          - { has_flag: drive_flank_turned }
          - { var_gte: { name: pack_drive, value: 3 } }
          - { has_flag: june_pike_present }
          - { not_flag: june_blood_condition_broken }
          - { not_flag: june_drive_cattle_line_taken }
          - none_of:
              - { has_flag: drive_courier_wounded }
              - { has_flag: drive_cattle_lost }
              - { has_flag: drive_reserve_spent }
        text: >
          TALK TO Road Warden June Pike before choosing a crisis priority. The failed drive shutter signal
          caused Overrun, but June can brace the lower swing-gate without your 2 HP cost.
          After her decision, choose cattle first, people first, or relief reserve.
      - when:
          - { has_flag: strategy_drive_committed }
          - { has_flag: drive_flank_turned }
          - { var_gte: { name: pack_drive, value: 3 } }
          - none_of:
              - { has_flag: drive_courier_wounded }
              - { has_flag: drive_cattle_lost }
              - { has_flag: drive_reserve_spent }
        text: >
          BRACE overrun swing-gate brace and lose 2 HP before choosing a crisis priority.
          Then choose cattle first, people first, or relief reserve. A successful RUN of
          Emery's shutter-recovery marks would have prevented this cost.
      - when:
          - { has_flag: strategy_drive_committed }
          - { has_flag: drive_flank_turned }
          - { var_lte: { name: pack_drive, value: 2 } }
          - none_of:
              - { has_flag: drive_courier_wounded }
              - { has_flag: drive_cattle_lost }
              - { has_flag: drive_reserve_spent }
        text: >
          Choose one crisis priority. Cattle first saves the whole herd and returns the rig
          but costs 6 HP. People first saves everyone and returns the rig but loses two
          cattle. Relief reserve saves everyone and the whole herd without injury but consumes the rig.
      - when: [{ has_flag: leader_redirected }, { has_flag: yearling_down }]
        text: >
          Go north and stand among the cattle to finish the count. South is closed. The
          grey leader and flank-wolf followed the final feed cast into the high wood alive;
          the yearling wolf is dead.
      - when: [{ has_flag: leader_redirected }, { not_flag: yearling_down }]
        text: >
          Go north and stand among the cattle to finish the count. South is closed. All
          three wolves followed the final feed cast into the high wood alive.
      - when:
          - { has_flag: june_pike_present }
          - { has_flag: strategy_lure_committed }
          - { has_flag: lure_trail_fouled }
          - { has_flag: yearling_redirected }
          - { has_flag: flank_redirected }
          - { not_flag: june_blood_condition_broken }
          - { not_flag: june_cattle_line_taken }
        text: >
          TALK TO Road Warden June Pike before the final feed cast if you want her cattle-first help. The
          failed first LAY action raised cattle alarm, and the grey leader blocks the herd.
          The Byre Door is south.
      - when:
          - { has_flag: strategy_lure_committed }
          - { has_item: winter_feed_sack }
          - { has_flag: yearling_down }
          - { has_flag: flank_redirected }
          - { not_flag: leader_down }
          - { not_flag: leader_redirected }
        text: >
          CAST Cade's winter-feed sack THROUGH outer scent gate to redirect the grey
          leader. The flank-wolf is alive in the high wood, the yearling wolf is dead,
          and existing cattle alarm remains. The Byre Door is south.
      - when:
          - { has_flag: strategy_lure_committed }
          - { has_item: winter_feed_sack }
          - { has_flag: yearling_redirected }
          - { has_flag: flank_redirected }
          - { not_flag: yearling_down }
          - { not_flag: leader_down }
          - { not_flag: leader_redirected }
        text: >
          CAST Cade's winter-feed sack THROUGH outer scent gate to redirect the grey
          leader. Both younger wolves are alive in the high wood. Current cattle alarm
          determines the result. The Byre Door is south.
      - when:
          - { has_flag: leader_down }
          - { has_item: split_rail_guard }
        text: >
          Choose here: BAR inner cattle-gate WITH bound split-rail guard, or go north
          to keep it for daylight repair at the Broken Paling. The grey leader is dead.
      - when:
          - { has_flag: leader_down }
          - { has_item: saved_brace_stake }
        text: >
          Choose here: BAR inner cattle-gate WITH saved brace-stake, or go north
          to keep it for daylight repair at the Broken Paling. The grey leader is dead.
      - when:
          - { has_flag: leader_down }
          - { has_flag: leader_split_guard_set }
        text: >
          Go north to the whole herd. The grey leader is dead, and the split-rail guard
          was spent against it. The Byre Door is south.
      - when:
          - { has_flag: leader_down }
          - { has_flag: leader_turned_over_crossbrace }
        text: >
          Go north to the whole herd. The grey leader is dead, and the saved brace-stake
          split when you used it. The Byre Door is south.
      - when: [{ has_flag: leader_down }, { has_flag: leader_true_rush_taken }]
        text: >
          Go north to the whole herd. The grey leader is dead after you waited through
          its feint and met its real attack. The Byre Door is south.
      - when: [{ has_flag: leader_down }, { has_flag: leader_driven_before_recovery }]
        text: >
          Go north to the whole herd. The grey leader is dead after you closed during its
          feint and attacked again before it recovered. The Byre Door is south.
      - when: [{ has_flag: leader_down }]
        text: >
          Go north and stand among the whole, unhurt herd. The grey leader is dead among
          the straw. The Byre Door is south.
      - when: [{ has_flag: leader_turned_over_crossbrace }]
        text: >
          ATTACK grey leader until it is dead. The saved brace-stake split and is spent.
      - when:
          - { has_flag: leader_stake_crossbraced }
          - { has_item: saved_brace_stake }
        text: >
          Now, TURN the grey leader over the committed crossbrace. The saved brace-stake
          caught the leader but will be spent by this maneuver.
      - when: [{ has_flag: leader_split_guard_set }]
        text: >
          ATTACK grey leader until it is dead. The split-rail guard caught it but is now spent.
      - when: [{ has_flag: leader_true_rush_taken }]
        text: >
          ATTACK grey leader until it is dead. You stopped its real attack after waiting
          through the feint.
      - when: [{ has_flag: leader_waited_out }]
        text: >
          Now, TAKE the grey leader's true rush on the held spear. You waited through its
          feint; this follow-up is required before it can recover.
      - when: [{ has_flag: leader_closed_on }]
        text: >
          DRIVE again before the grey leader can recover. Your close during its feint did
          not finish it.
      - when:
          - { has_item: split_rail_guard }
          - { has_flag: heard_plan }
          - { has_flag: heard_counsel }
        text: >
          Choose one maneuver: SET the saved split-rail guard across the grey leader's rush;
          HOLD the spear point and wait out the grey leader's feint; or CLOSE before the
          grey leader can finish her feint. Each choice closes the others.
      - when: [{ has_item: split_rail_guard }, { has_flag: heard_plan }]
        text: >
          Choose one maneuver: SET the saved split-rail guard across the grey leader's
          rush, or HOLD the spear point and wait out the grey leader's feint. Either choice
          closes the other.
      - when: [{ has_item: split_rail_guard }, { has_flag: heard_counsel }]
        text: >
          Choose one maneuver: SET the saved split-rail guard across the grey leader's
          rush, or CLOSE before the grey leader can finish her feint. Either choice closes
          the other.
      - when: [{ has_item: split_rail_guard }]
        text: >
          SET the saved split-rail guard across the grey leader's rush. The guard will
          break; if the leader survives, ATTACK grey leader.
      - when:
          - { has_item: saved_brace_stake }
          - { has_flag: heard_plan }
          - { has_flag: heard_counsel }
        text: >
          Choose one maneuver: HOLD the spear point and wait out the grey leader's feint;
          CLOSE before the grey leader can finish her feint; or SET the saved brace-stake
          across the spear against the grey leader. Each choice closes the others.
      - when:
          - { has_item: saved_brace_stake }
          - { has_flag: heard_plan }
        text: >
          Choose one maneuver: HOLD the spear point and wait out the grey leader's feint,
          or SET the saved brace-stake across the spear against the grey leader. Either
          choice closes the other.
      - when:
          - { has_item: saved_brace_stake }
          - { has_flag: heard_counsel }
        text: >
          Choose one maneuver: CLOSE before the grey leader can finish her feint, or SET
          the saved brace-stake across the spear against the grey leader. Either choice
          closes the other.
      - when: [{ has_item: saved_brace_stake }]
        text: >
          SET the saved brace-stake across the spear against the grey leader. If it survives,
          TURN the grey leader over the committed crossbrace.
      - when:
          - { has_flag: heard_plan }
          - { has_flag: heard_counsel }
          - { not_flag: strategy_fortify_committed }
        text: >
          Choose one maneuver. HOLD the spear point and wait out the grey leader's feint,
          then TAKE the grey leader's true rush on the held spear; or CLOSE before the grey
          leader can finish her feint, then DRIVE again before the grey leader can recover.
      - when: [{ has_flag: heard_plan }, { not_flag: strategy_fortify_committed }]
        text: >
          HOLD the spear point and wait out the grey leader's feint. Then TAKE the grey
          leader's true rush on the held spear. The Byre Door is south.
      - when: [{ has_flag: heard_counsel }, { not_flag: strategy_fortify_committed }]
        text: >
          CLOSE before the grey leader can finish her feint, then DRIVE again before the
          grey leader can recover. This faster attack leaves your guard open.
      - when: [{ has_flag: fortify_cade_terms_accepted }]
        text: >
          HOLD sealed-byre dawn watch. Cade's household shutters protect the whole herd
          from the living wolves. Cade's outer property is exposed, while Albany's relief
          seals are preserved. Combat is closed.
      - when: [{ has_flag: fortify_albany_authority_invoked }]
        text: >
          HOLD sealed-byre dawn watch. Albany's relief seals protect the whole herd
          from the living wolves. Cade's property is protected, but public stock is spent
          and Cade will not help. Combat is closed.
    exits:
      - direction: south
        to: byre_door
        conditions:
          - { not_flag: strategy_drive_committed }
          - { not_flag: strategy_fortify_committed }
          - { not_flag: pack_diverted }
        locked_msg: "South is closed. After LURE, go north for the cattle count. During DRIVE, choose and finish a crisis evacuation. During FORTIFY, HOLD sealed-byre dawn watch."
      - direction: north
        to: cattle_stand
        conditions:
          - any_of:
              - { has_flag: leader_down }
              - { has_flag: leader_redirected }
        locked_msg: "North is blocked. Complete the exact action shown here. That action either ends the quest or opens north."

  - id: cattle_stand
    name: "Among the Cattle"
    description: >
      The quest is complete. Cade records the surviving cattle and wolves for Albany.
    # The locomotion win (visited: cattle_stand), like the Beacon's crown and cold_forge's
    # ember chamber: the +15 capstone rides reaching the safe cattle after the pack is
    # defeated, redirected, driven clear, or outlasted behind joined seals. The full 60
    # still coincides with a completed route, never before; SCORE_PEAKS_BEFORE_WIN does not
    # fire on a navigation win (bug_0116).
    on_enter:
      - add_journal: "The wolves no longer threaten the byre. Grey dawn reveals the surviving herd and the cost of your chosen plan."
      - inc_var: { name: score, by: 15 }
    exits:
      - { direction: south, to: byre_mouth }

objects:
  # One seed-selected physical fact is visible before any plan choice. These two
  # read-only scenery records repeat the same fact on each side of the last-mile
  # approach. They permit LOOK/EXAMINE but provide no custom plan action, resource,
  # or recommendation. The matching strategy's first execution beat consumes no
  # roll, while every later cost remains authored.
  - id: steading_field_condition
    name: "approach field condition"
    aliases: [approach ground sign, night approach condition]
    description: "LOOK AT approach field condition to see which plan's opening action was guaranteed. Looking does not choose or reopen a plan."
    variants:
      - when: [{ has_flag: opening_condition_firm_frozen_rail }]
