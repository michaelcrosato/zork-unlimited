          - inc_var: { name: fortification_pressure, by: 1 }
          - set_flag: fortify_outer_sealed
          - set_quest_stage: { quest: the_watch, stage: outer_sealed }
          - add_journal: "The sound lower frame seats Cade's first shutter without a Repair check. One shutter remains for the threshold; exposed-property and dawn-watch costs remain."
          - narrate: >
