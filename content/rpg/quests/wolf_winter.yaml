  # Imported overworld approach knowledge becomes exactly one visible last-mile action.
  # Visit history retires both objects as soon as either action reaches the byre, and the
  # ordinary north exit remains the unchanged direct-start path when neither import exists.
  # Mutually exclusive conditions fail closed if a malformed save carries both route flags.
  - id: exposed_ridge_last_mile
    name: "exposed ridge last mile"
    aliases: [exposed ridge, ridge road, open crest, ridge descent]
    description: >
      DESCEND exposed ridge last mile to reveal the crosswind for the first LURE LAY check. This
      route raises cattle alarm by 1 because the herd sees you approach.
    visible_when:
      - { has_flag: approach_exposed_ridge }
      - { not_flag: approach_sheltered_stockway }
      - { not_visited: byre_yard }
    interactions:
      - verb: USE
        target: exposed_ridge_last_mile
        command_verb: descend
        conditions:
          - { has_flag: approach_exposed_ridge }
          - { not_flag: approach_sheltered_stockway }
          - { not_visited: byre_yard }
        effects:
          - inc_var: { name: cattle_alarm, by: 1 }
          - add_journal: "You descend the exposed ridge. The crosswind is visible for the first LURE LAY check, but cattle alarm rises to 1."
          - narrate: >
              You descend the exposed ridge. Smoke and breath reveal the crosswind for
              the first LURE LAY check. The cattle see you approach and press the slats;
              cattle alarm rises by 1.
          - goto: byre_yard

  - id: sheltered_stockway_last_mile
    name: "sheltered stockway last mile"
    aliases: [sheltered stockway, stockway, stock gate, lee path]
    description: >
      FOLLOW sheltered stockway last mile to keep cattle alarm at 0. This route hides the
      crosswind that can help the first LURE LAY check.
    visible_when:
      - { has_flag: approach_sheltered_stockway }
      - { not_flag: approach_exposed_ridge }
      - { not_visited: byre_yard }
    interactions:
      - verb: USE
        target: sheltered_stockway_last_mile
        command_verb: follow
        conditions:
          - { has_flag: approach_sheltered_stockway }
          - { not_flag: approach_exposed_ridge }
          - { not_visited: byre_yard }
        effects:
          - add_journal: "You follow the sheltered stockway. Cattle alarm stays at 0, but the crosswind for the first LURE LAY check remains hidden."
          - narrate: >
              You follow the sheltered stockway. The hedges hide you from the herd, so
              cattle alarm stays at 0. They also hide the crosswind for the first LURE LAY check.
          - goto: byre_yard

  # The Albany relief spear is real runtime gear, not prose-only equipment. Earlier
  # blind passes repeatedly opened INVENTORY after the yard said it was "already in
  # your fist" and found nothing, a small contradiction that weakened trust in every
  # later preparation choice. `held: true` puts it in the fresh inventory and also
  # makes it non-droppable: base attack 5 already includes the weapon, so this object
  # adds no permanent stat and leaves the combat-guarantee math unchanged. The three
  # enemies' opening maneuvers require it explicitly.
  - id: relief_spear
    name: "Albany relief spear"
    aliases: [spear, hunting-spear, hunting spear, relief spear, ash spear, ash-shafted spear]
    description: >
      You already hold this spear. It provides your base attack and cannot be dropped.
      Albany's road-warden tag is tied below its ash-wood head.
    variants:
      - when: [{ has_flag: leader_true_rush_taken }]
        text: >
          You met the grey leader's true rush with this spear after waiting through its feint.
          Blood and straw mark the spearhead.
      - when: [{ has_flag: leader_driven_before_recovery }]
        text: >
          You drove this spear into the grey leader after closing during its feint and
          attacking again before it recovered. Blood and straw mark the spearhead.
      - when:
          - any_of:
              - { has_flag: leader_waited_out }
              - { has_flag: leader_closed_on }
        text: >
          The grey leader's blood and byre straw mark the Albany relief spear. Its
          road-warden tag remains tied below the head.
      - when: [{ has_flag: flank_pinned_at_rail }]
        text: >
          This spear struck the flank-wolf after pinning it against the braced fallen
          paling-rail. The shaft is scored.
      - when: [{ has_flag: flank_turned_through_return }]
        text: >
          This spear struck the flank-wolf with the return attack after your off-side
          wheel. The shaft is scored.
      - when: [{ has_flag: flank_hooked_over_guard }]
        text: >
          This spear hooked the flank-wolf over the split-rail guard. Rawhide
          from the broken guard clings below the head.
      - when:
          - any_of:
              - { has_flag: flank_funneled }
              - { has_flag: flank_offside_cut }
        text: >
          Your first attack against the flank-wolf scored the Albany relief spear's shaft.
      - when:
          - any_of:
              - { has_flag: yearling_spear_driven }
              - { has_flag: yearling_spear_driven_unarmored }
        text: >
          Your second attack against the yearling wolf marked this spearhead. Snow packs
          the butt where you set it at the Broken Paling.
      - when: [{ has_flag: yearling_spear_set }]
        text: >
          You set this spear against the yearling wolf's first attack. Snow packs the butt.
      - when:
          - { var_gte: { name: fieldcraft, value: 4 } }
          - { not_flag: jamie_market_testimony_certified }
          - { not_flag: hayden_frost_report_certified }
          - any_of:
              - { has_flag: relief_oath_full_duty }
              - { has_flag: relief_oath_limited_duty }
              - { has_flag: relief_oath_unaffiliated_bond }
        text: >
          You already hold the Albany relief spear; it provides your base attack. Your
          Fieldcraft 4 set starting DEF to 4 instead of 3. Rowan's civic docket provides
          only the public routes and split-rail guard recovery. It provides no certified
          feed-hauler's crawlboard or frost-jammed door-brace option.
      - when: [{ var_gte: { name: fieldcraft, value: 4 } }]
        text: >
          You already hold the Albany relief spear, which provides your base attack.
          Fieldcraft 4 set your starting DEF to 4 instead of 3. Your dispatch packet
          provides the additional action described on that packet.
      - when:
          - { not_flag: jamie_market_testimony_certified }
          - { not_flag: hayden_frost_report_certified }
          - any_of:
              - { has_flag: relief_oath_full_duty }
              - { has_flag: relief_oath_limited_duty }
              - { has_flag: relief_oath_unaffiliated_bond }
        text: >
          You already hold the Albany relief spear; it provides your base attack. Rowan's
          civic docket provides only the public routes and split-rail guard recovery. It
          provides no certified feed-hauler's crawlboard or frost-jammed door-brace option.
    held: true

  # The drive family owns one origin-honest quest-local resource. Cade issues it only
  # after a separate explanation and commitment. Its two charges are consumed by two
  # different spatial actions; there is no store pickup or invisible refill. The spent
  # rope and signal housing remain recoverable unless the crisis priority sacrifices them.
  - id: drive_signal_rope_kit
    name: "Cade's two-charge signal-and-rope rig"
    aliases: [signal rig, drive kit, signal kit, rope kit, cattle signal rig]
    description: >
      This rig has exactly two charges and cannot be restocked. FIRE drive shutter signal
      WITH Cade's two-charge signal-and-rope rig, then CAST byre rope-and-bell line WITH
      Cade's two-charge signal-and-rope rig. The empty rig returns to Albany unless you
      spend it on the relief-reserve crisis priority.
    variants:
      - when:
          - any_of:
              - { has_flag: drive_courier_wounded }
              - { has_flag: drive_cattle_lost }
        text: >
          Both rig charges are spent. Your chosen cattle-first or people-first priority
          returns the rope, bell, and copper housing to Albany. The relief-reserve priority
          is closed.
      - when: [{ var_lte: { name: drive_kit_charges, value: 0 } }]
        text: >
          Both rig charges are spent. Choose whether to return the rope, bell, and copper
          housing to Albany or consume them with the relief-reserve crisis priority.
      - when: [{ var_lte: { name: drive_kit_charges, value: 1 } }]
        text: >
          One rig charge remains. CAST byre rope-and-bell line WITH Cade's two-charge
          signal-and-rope rig. The drive shutter signal cannot be fired again.
    visible_when:
      - { has_flag: strategy_drive_committed }
      - { not_visited: paling_gap }
    takeable: true
    droppable: false
    take_effects:
      - add_journal: "You take Cade's signal-and-rope rig. It has two charges and no restock: FIRE drive shutter signal WITH Cade's two-charge signal-and-rope rig, then CAST byre rope-and-bell line WITH Cade's two-charge signal-and-rope rig."

  - id: drive_breach_signal
    name: "drive shutter signal"
    aliases: [shutter signal, paling signal, first drive, drive signal]
    description: >
      FIRE drive shutter signal WITH Cade's two-charge signal-and-rope rig to redirect the yearling
      wolf alive. This spends one charge and starts moving the herd. The signal can be
      attempted once.
    variants:
      - when:
          - { has_flag: opening_condition_open_ash_lane }
          - { not_flag: drive_opening_fouled }
          - { not_flag: drive_yearling_turned }
        text: >
          FIRE drive shutter signal WITH Cade's two-charge signal-and-rope rig without a check.
          The open ash lane guarantees the
          yearling wolf is redirected alive. This spends one charge and raises pack drive
          by 1. The second charge and final crisis priority remain.
      - when:
          - { has_flag: relief_oath_unaffiliated_bond }
          - { not_flag: drive_opening_fouled }
          - { not_flag: drive_yearling_turned }
        text: >
          FIRE drive shutter signal WITH Cade's two-charge signal-and-rope rig. This makes
          a Fieldcraft check (DC 10 instead of 12).
          This spends one charge. Failure raises cattle alarm by 1, cannot be retried, and
          requires the loose drive hurdle. Emery's service marks provide the lower difficulty.
      - when: [{ has_flag: drive_opening_fouled }]
        text: >
          RELEASE loose drive hurdle to redirect the yearling wolf alive. The drive shutter
          signal failed, spent one charge, and cannot be retried. HUNT and combat are closed.
    visible_when:
      - { has_flag: strategy_drive_committed }
      - { has_flag: drive_combat_withheld }
      - { not_flag: drive_yearling_turned }
      - { not_flag: yearling_down }
    interactions:
      - verb: USE
        item: drive_signal_rope_kit
        target: drive_breach_signal
        command_verb: fire
        command_template: "fire {target} with {item}"
        conditions:
          - { has_item: drive_signal_rope_kit }
          - { has_flag: strategy_drive_committed }
          - { has_flag: drive_combat_withheld }
          - { has_flag: opening_condition_open_ash_lane }
          - { var_gte: { name: drive_kit_charges, value: 2 } }
          - { not_flag: drive_opening_fouled }
          - { not_flag: june_blood_condition_broken }
          - { not_flag: yearling_down }
          - { not_flag: drive_yearling_turned }
        effects:
          - dec_var: { name: drive_kit_charges, by: 1 }
          - inc_var: { name: pack_drive, by: 1 }
          - set_flag: drive_yearling_turned
          - set_quest_stage: { quest: the_watch, stage: breach_redirected }
          - add_journal: "The open ash lane guarantees the drive shutter signal. The yearling wolf is redirected alive; one rig charge and the crisis priority remain."
          - narrate: >
              The drive shutter signal redirects the yearling wolf alive and starts moving
              the herd. The open ash lane guaranteed success. One rig charge remains for
              the Byre Door, and the final crisis priority is unchanged.

      - verb: USE
        item: drive_signal_rope_kit
        target: drive_breach_signal
        command_verb: fire
        command_template: "fire {target} with {item}"
        conditions:
          - { has_item: drive_signal_rope_kit }
          - { has_flag: strategy_drive_committed }
          - { has_flag: drive_combat_withheld }
          - { not_flag: opening_condition_open_ash_lane }
          - { has_flag: relief_oath_unaffiliated_bond }
          - { var_gte: { name: drive_kit_charges, value: 2 } }
          - { not_flag: drive_opening_fouled }
          - { not_flag: june_blood_condition_broken }
          - { not_flag: yearling_down }
          - { not_flag: drive_yearling_turned }
        effects:
          - dec_var: { name: drive_kit_charges, by: 1 }
          - inc_var: { name: pack_drive, by: 1 }
        skill_check:
          skill: fieldcraft
          difficulty: 10
          on_success:
            - set_flag: drive_yearling_turned
            - set_quest_stage: { quest: the_watch, stage: breach_redirected }
            - add_journal: "The Fieldcraft check succeeds at DC 10. The drive shutter signal redirects the yearling wolf alive; one rig charge remains."
            - narrate: >
                The drive shutter signal redirects the yearling wolf alive and starts
                moving the herd. Emery's service marks helped place the signal. One rig
                charge remains for the Byre Door.
          on_failure:
            - set_flag: drive_opening_fouled
            - inc_var: { name: pack_drive, by: 1 }
            - inc_var: { name: cattle_alarm, by: 1 }
            - add_journal: "The Fieldcraft check fails at DC 10. The signal cannot be retried; cattle alarm rises by 1. RELEASE loose drive hurdle."
            - narrate: >
                The drive shutter signal fails. One rig charge is spent, cattle alarm rises
                by 1, and the signal cannot be retried. RELEASE loose drive hurdle to
                redirect the yearling wolf alive.
          on_failure_when:
            - conditions:
                - { has_flag: dispatch_opening_delayed }
              effects:
                - inc_var: { name: cattle_alarm, by: 1 }
                - add_journal: "The delayed dispatch adds another 1 cattle alarm after the failed drive shutter signal."
                - narrate: >
                    The delayed dispatch raises cattle alarm by another 1.

      - verb: USE
        item: drive_signal_rope_kit
        target: drive_breach_signal
        command_verb: fire
        command_template: "fire {target} with {item}"
        conditions:
          - { has_item: drive_signal_rope_kit }
          - { has_flag: strategy_drive_committed }
          - { has_flag: drive_combat_withheld }
          - { not_flag: opening_condition_open_ash_lane }
          - { not_flag: relief_oath_unaffiliated_bond }
          - { var_gte: { name: drive_kit_charges, value: 2 } }
          - { not_flag: drive_opening_fouled }
          - { not_flag: june_blood_condition_broken }
          - { not_flag: yearling_down }
          - { not_flag: drive_yearling_turned }
        effects:
          - dec_var: { name: drive_kit_charges, by: 1 }
          - inc_var: { name: pack_drive, by: 1 }
        skill_check:
          skill: fieldcraft
          difficulty: 12
          on_success:
            - set_flag: drive_yearling_turned
            - set_quest_stage: { quest: the_watch, stage: breach_redirected }
            - add_journal: "The drive shutter signal redirects the yearling wolf alive. Pack drive becomes Moving; one rig charge remains for the Byre Door."
            - narrate: >
                The drive shutter signal redirects the yearling wolf alive and starts
                moving the herd. One rig charge remains for the Byre Door. This signal
                cannot be repeated.
          on_failure:
            - set_flag: drive_opening_fouled
            - inc_var: { name: pack_drive, by: 1 }
            - inc_var: { name: cattle_alarm, by: 1 }
            - add_journal: "The drive shutter signal fails and cannot be retried. Pack drive reaches Crisis early, cattle alarm rises by 1, and the loose drive hurdle is required."
            - narrate: >
                The drive shutter signal fails. One rig charge is spent, cattle alarm rises
                by 1, and the signal cannot be retried. RELEASE loose drive hurdle to
                redirect the yearling wolf alive. HUNT and combat remain closed.

          on_failure_when:
            - conditions:
                - { has_flag: dispatch_opening_delayed }
              effects:
                - inc_var: { name: cattle_alarm, by: 1 }
                - add_journal: "The delayed dispatch adds another 1 cattle alarm after the failed drive shutter signal."
                - narrate: >
                    The delayed dispatch raises cattle alarm by another 1.

  - id: drive_hurdle_recovery
    name: "loose drive hurdle"
