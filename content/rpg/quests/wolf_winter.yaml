  - id: ending_held_gate_barred_june_released
    title: "The Byre Held, Inner Gate Barred — June Released"
    text: >
      Victory: The whole herd survives, and all three wolves are dead. The inner cattle-gate
      is barred with saved wood. June had already returned to Albany after you
      released her from HUNT. Your agreement remains intact, but she provided no field aid.
      *** You have won. ***
    append_variants:
      - when: [{ has_flag: jerkin_donned }]
        text: "You wore the padded byre-jerkin and received its +2 defense bonus."
      - when: [{ has_item: byre_jerkin }, { not_flag: jerkin_donned }]
        text: "You carried the padded byre-jerkin but never DONNED it, so it provided no defense bonus."
      - when: [{ not_item: byre_jerkin }]
        text: "You never took the padded byre-jerkin, so it provided no defense bonus."
    variants:
