        item: cade_household_shutters
        target: fortify_threshold_seal
        command_verb: set
        conditions:
          - { has_item: cade_household_shutters }
          - { has_flag: fortify_cade_terms_accepted }
          - { has_flag: fortify_outer_sealed }
          - { not_flag: fortify_threshold_sealed }
        effects:
          - remove_item: cade_household_shutters
          - set_flag: fortify_threshold_sealed
          - inc_var: { name: fortification_pressure, by: 1 }
          - set_quest_stage: { quest: the_watch, stage: threshold_sealed }
          - add_journal: "Cade's second shutter seals the Byre Door. Cade's outer property stays exposed, and Albany's relief seals remain preserved. HOLD sealed-byre dawn watch."
          - narrate: >
              Cade's second shutter seals the Byre Door. Both household shutters now protect
              the whole herd from the living wolves. Cade's outer property stays exposed,
              and Albany's relief seals remain preserved.
      - verb: USE
        item: albany_relief_seals
        target: fortify_threshold_seal
        command_verb: set
        conditions:
          - { has_item: albany_relief_seals }
          - { has_flag: fortify_albany_authority_invoked }
          - { has_flag: fortify_outer_sealed }
          - { not_flag: fortify_threshold_sealed }
        effects:
          - remove_item: albany_relief_seals
          - set_flag: fortify_threshold_sealed
          - set_flag: fortify_public_seals_spent
          - inc_var: { name: fortification_pressure, by: 1 }
          - set_quest_stage: { quest: the_watch, stage: threshold_sealed }
          - add_journal: "The second Albany band seals the Byre Door. Cade's property stays protected, and public fortification stock is spent. HOLD sealed-byre dawn watch."
          - narrate: >
              The second Albany band seals the Byre Door. Both public seals now protect the
              whole herd from the living wolves. Cade's property stays protected, and
              Albany's fortification stock is spent.

  # Beat three reads the accumulated pressure instead of rolling again. A clean outer seat
  # reaches Hammering (2); an ordinary recovery reaches Strained (3); a mobile-stabilized
  # failed seat removes one pressure step without erasing the failed state, so a delayed
  # dispatch can still leave it at Strained (3). Every branch remains fully noncombat and
  # awards the same completion score.
  - id: fortify_dawn_watch
    name: "sealed-byre dawn watch"
    aliases: [dawn watch, outlast the pack, hold seals, sealed watch]
    description: >
      HOLD sealed-byre dawn watch to protect every person and the whole herd until dawn. This is not a
      Repair check. If the outer seal failed and was not stabilized, Strained pressure 3 or
      higher costs 2 HP unless an uninjured June braces the cattle. A deployed mobile relief
      failure crew prevents that HP loss but gives June no injury benefit. Hammering pressure
      2 also costs no HP. Combat and retreat remain closed.
    visible_when:
      - { has_flag: strategy_fortify_committed }
      - { has_flag: fortify_threshold_sealed }
      - { not_flag: fortify_dawn_held }
    interactions:
      - verb: USE
        target: fortify_dawn_watch
        command_verb: hold
        conditions:
          - { has_flag: strategy_fortify_committed }
          - { has_flag: fortify_threshold_sealed }
          - { has_flag: fortify_outer_seal_failed }
          - { has_flag: fortify_mobile_crew_stabilized }
          - { var_lte: { name: fortification_pressure, value: 3 } }
          - any_of:
              - { not_flag: june_pike_present }
              - { has_flag: june_blood_condition_broken }
              - { has_flag: june_fortify_cattle_line_taken }
          - { not_flag: fortify_dawn_held }
        blocked_hint:
          visible_when:
            - { has_flag: june_pike_present }
            - { not_flag: june_blood_condition_broken }
            - { not_flag: june_fortify_cattle_line_taken }
            - { has_flag: fortify_mobile_crew_stabilized }
          reason: "First, TALK TO Road Warden June Pike. The mobile relief failure crew already prevents HP loss, so June cannot add an injury benefit."
        effects:
          - set_flag: fortify_dawn_held
          - set_flag: fortify_pack_outlasted
          - set_var: { name: fortification_pressure, value: 6 }
          - inc_var: { name: score, by: 20 }
          - set_quest_stage: { quest: the_watch, stage: byre_outlasted }
          - add_journal: "The stabilized seals hold until dawn with no HP loss, even at Strained pressure 3. The failed outer seal remains recorded; June adds no injury benefit. Every person and the whole herd are safe."
          - narrate: >
              The stabilized seals hold until dawn with no HP loss. The failed outer seal
              remains recorded, and June adds no injury benefit. All three wolves withdraw
              alive; every person and the whole herd are safe.
          - goto: cattle_stand
      - verb: USE
        target: fortify_dawn_watch
        command_verb: hold
        conditions:
          - { has_flag: strategy_fortify_committed }
          - { has_flag: fortify_threshold_sealed }
          - { not_flag: fortify_outer_seal_failed }
          - { var_lte: { name: fortification_pressure, value: 2 } }
          - any_of:
              - { not_flag: june_pike_present }
              - { has_flag: june_blood_condition_broken }
              - { has_flag: june_fortify_cattle_line_taken }
          - { not_flag: fortify_dawn_held }
        blocked_hint:
          visible_when:
            - { has_flag: june_pike_present }
            - { not_flag: june_blood_condition_broken }
            - { not_flag: june_fortify_cattle_line_taken }
            - { var_lte: { name: fortification_pressure, value: 2 } }
          reason: "TALK TO Road Warden June Pike before starting the sealed-byre dawn watch. She must resolve her cattle-first decision."
        effects:
          - set_flag: fortify_dawn_held
          - set_flag: fortify_pack_outlasted
          - set_var: { name: fortification_pressure, value: 6 }
          - inc_var: { name: score, by: 20 }
          - set_quest_stage: { quest: the_watch, stage: byre_outlasted }
          - add_journal: "The seals hold until dawn with no HP loss. All three wolves withdraw alive; every person and the whole herd are safe."
          - narrate: >
              The seals hold until dawn with no HP loss. All three wolves withdraw alive;
              every person and the whole herd are safe.
          - goto: cattle_stand
      - verb: USE
        target: fortify_dawn_watch
        command_verb: hold
        conditions:
          - { has_flag: strategy_fortify_committed }
          - { has_flag: fortify_threshold_sealed }
          - { has_flag: fortify_outer_seal_failed }
          - { var_gte: { name: fortification_pressure, value: 3 } }
          - { not_flag: fortify_mobile_crew_stabilized }
          - { has_flag: june_pike_present }
          - { not_flag: june_blood_condition_broken }
          - { has_flag: june_fortify_cattle_line_taken }
          - { not_flag: fortify_dawn_held }
        effects:
          - set_flag: fortify_dawn_held
          - set_flag: fortify_pack_outlasted
          - set_var: { name: fortification_pressure, value: 6 }
          - inc_var: { name: score, by: 20 }
          - set_quest_stage: { quest: the_watch, stage: byre_outlasted }
          - add_journal: "June braces the cattle during the Strained dawn watch and prevents 2 HP loss. The failed outer seal remains recorded. All three wolves withdraw alive; every person and the whole herd are safe."
          - narrate: >
              June braces the cattle and prevents the Strained watch's 2 HP loss. The failed
              outer seal remains recorded. At dawn, all three wolves withdraw alive; every
              person and the whole herd are safe.
          - goto: cattle_stand
      - verb: USE
        target: fortify_dawn_watch
        command_verb: hold
        conditions:
          - { has_flag: strategy_fortify_committed }
          - { has_flag: fortify_threshold_sealed }
          - { has_flag: fortify_outer_seal_failed }
          - { var_gte: { name: fortification_pressure, value: 3 } }
          - { not_flag: fortify_mobile_crew_stabilized }
          - any_of:
              - { not_flag: june_pike_present }
              - { has_flag: june_blood_condition_broken }
          - { not_flag: fortify_dawn_held }
        blocked_hint:
          visible_when:
            - { has_flag: june_pike_present }
            - { not_flag: june_blood_condition_broken }
            - { not_flag: june_fortify_cattle_line_taken }
            - { has_flag: fortify_outer_seal_failed }
            - { var_gte: { name: fortification_pressure, value: 3 } }
            - { not_flag: fortify_mobile_crew_stabilized }
          reason: "First, TALK TO Road Warden June Pike. Her cattle-first help can prevent the Strained dawn watch's 2 HP cost."
        effects:
          - dec_var: { name: hp, by: 2 }
          - set_flag: fortify_dawn_held
          - set_flag: fortify_pack_outlasted
          - set_var: { name: fortification_pressure, value: 6 }
          - inc_var: { name: score, by: 20 }
          - set_quest_stage: { quest: the_watch, stage: byre_outlasted }
          - add_journal: "The recovered seals hold until dawn, but the Strained watch costs 2 HP. The failed outer seal remains recorded. All three wolves withdraw alive; every person and the whole herd are safe."
          - narrate: >
              The Strained dawn watch costs 2 HP, but the seals hold. The failed outer seal
              remains recorded. All three wolves withdraw alive; every person and the whole
