  # Emery's preparation is a one-shot recovery, never a retry. A failed first lure cast
  # can use it to turn the yearling; a failed DRIVE shutter can use the same service cut
  # to remove only the failure's extra pack-pressure beat. Both failures retire the route,
  # and DRIVE still requires its loose-hurdle recovery before the final signal.
  - id: drover_route_marks
    name: "Emery's drover-route marks"
    aliases: [drover route, route marks, service cut, drover cut, emery's route]
    description: >
      RUN Emery's drover-route marks after the first feed action fails. This Streetwise check (DC 12) can
      be attempted once. Success redirects the yearling wolf alive and lowers cattle alarm
      by 1. Failure changes nothing, and the rail or spear recovery remains available.
    visible_when:
      - { has_flag: drover_route_prepared }
      - { has_flag: lure_trail_fouled }
      - { not_flag: lure_hybrid_combat_entered }
      - { not_flag: drover_route_attempted }
      - { not_flag: yearling_down }
      - { not_flag: yearling_redirected }
    interactions:
      - verb: USE
        target: drover_route_marks
        command_verb: run
        conditions:
          - { has_flag: drover_route_prepared }
          - { has_flag: lure_trail_fouled }
          - { not_flag: lure_hybrid_combat_entered }
          - { not_flag: drover_route_attempted }
          - { not_flag: yearling_down }
          - { not_flag: yearling_redirected }
        effects:
          - set_flag: drover_route_attempted
        skill_check:
          skill: streetwise
          difficulty: 12
          stakes: "Success redirects the yearling wolf alive and lowers cattle alarm by 1. Failure changes nothing. This route can be attempted once; the rail or spear recovery remains available."
          on_success:
            - set_flag: yearling_redirected
            - dec_var: { name: cattle_alarm, by: 1 }
            - inc_var: { name: score, by: 10 }
            - set_quest_stage: { quest: the_watch, stage: breach_redirected }
            - add_journal: "The Streetwise check succeeds at DC 12. Emery's drover-route marks redirect the yearling wolf alive, and cattle alarm falls by 1."
            - narrate: >
                Emery's drover-route marks redirect the yearling wolf into the high wood
                alive. Cade calms the herd, and cattle alarm falls by 1.
          on_failure:
            - add_journal: "The Streetwise check fails at DC 12 and cannot be retried. Cattle alarm is unchanged. Use any rail recovery currently offered; if none is offered, MAKE a guarded strike and abandon the living recovery."
            - narrate: >
                Emery's route fails and cannot be retried; cattle alarm stays level. If
                holding the guard, PEN downwind feed line WITH bound split-rail guard.
                Otherwise use a shown rail recovery; if none, MAKE a guarded strike and
                abandon the living recovery.

  - id: drive_drover_route_marks
    name: "Emery's shutter-recovery marks"
    aliases: [drive drover route, shutter route, drive service cut, emery's drive cut]
    description: >
      RUN Emery's shutter-recovery marks after the drive shutter signal fails. This Streetwise check (DC 12)
      can be attempted once. Success lowers pack drive by 1 and prevents the later 2 HP
      overrun swing-gate brace; failure leaves that cost. The loose drive hurdle is still required.
    visible_when:
      - { has_flag: drover_route_prepared }
      - { has_flag: strategy_drive_committed }
      - { has_flag: drive_combat_withheld }
      - { has_flag: drive_opening_fouled }
      - { not_flag: drover_route_attempted }
      - { not_flag: drive_yearling_turned }
      - { not_flag: yearling_down }
    interactions:
      - verb: USE
        target: drive_drover_route_marks
        command_verb: run
        conditions:
          - { has_flag: drover_route_prepared }
          - { has_flag: strategy_drive_committed }
          - { has_flag: drive_combat_withheld }
          - { has_flag: drive_opening_fouled }
          - { not_flag: drover_route_attempted }
          - { not_flag: drive_yearling_turned }
          - { not_flag: yearling_down }
          - { not_flag: june_blood_condition_broken }
        effects:
          - set_flag: drover_route_attempted
        skill_check:
          skill: streetwise
          difficulty: 12
          stakes: "Success lowers pack drive by 1 and prevents the later 2 HP overrun swing-gate brace. Failure leaves that cost. This route can be attempted once, and the loose drive hurdle remains required."
          on_success:
            - dec_var: { name: pack_drive, by: 1 }
            - add_journal: "The Streetwise check succeeds at DC 12. Pack drive falls by 1, preventing the later 2 HP overrun swing-gate brace. The loose drive hurdle remains required."
            - narrate: >
                Emery's shutter-recovery marks lower pack drive by 1. The failed drive
                shutter signal is not repaired or repeated, and the yearling wolf is not
                redirected. Next, RELEASE loose drive hurdle.
          on_failure:
            - add_journal: "The Streetwise check fails at DC 12 and cannot be retried. Pack drive is unchanged. The loose drive hurdle remains required, and Overrun will later cost 2 HP unless June prevents it."
            - narrate: >
                Emery's shutter-recovery marks fail and cannot be used again. Pack drive
                is unchanged. Next, RELEASE loose drive hurdle; then expect the 2 HP overrun
                swing-gate brace unless June prevents it.

  # Jamie's protocol waits for the specific public rail recovery: the first cast fouled,
  # the ordinary wedge split, and its bound guard was spent redirecting the yearling.
  # Mediation changes visible pressure once and never blocks the committed loft route.
  - id: relief_protocol_docket
    name: "Jamie's sealed relief protocol"
    aliases: [relief protocol, protocol, sealed docket, jamie's protocol, herd calls]
    description: >
      CALL Jamie's sealed relief protocol after a failed first feed action and split-rail guard recovery.
      This Mediation check (DC 12) can be attempted once. Success lowers cattle alarm by 1;
      failure raises it by 1. LURE continues either way.
    visible_when:
      - { has_flag: relief_protocol_prepared }
      - { has_flag: yearling_redirected_with_split_guard }
      - { not_flag: relief_protocol_attempted }
      - { not_flag: yearling_down }
      - { not_flag: flank_redirected }
    interactions:
      - verb: USE
        target: relief_protocol_docket
        command_verb: call
        conditions:
          - { has_flag: relief_protocol_prepared }
          - { has_flag: yearling_redirected_with_split_guard }
          - { not_flag: relief_protocol_attempted }
          - { not_flag: yearling_down }
          - { not_flag: flank_wolf_down }
          - { not_flag: flank_redirected }
        effects:
          - set_flag: relief_protocol_attempted
        skill_check:
          skill: mediation
          difficulty: 12
          stakes: "Success lowers cattle alarm by 1; failure raises it by 1. The protocol can be attempted once, and LURE continues either way."
          on_success:
            - dec_var: { name: cattle_alarm, by: 1 }
            - add_journal: "The Mediation check succeeds at DC 12. Jamie's relief calls lower cattle alarm by 1 before the Fodder-Loft cast."
            - narrate: >
                You and Cade call Jamie's relief sequence in order. The familiar calls
                calm the herd, and cattle alarm falls by 1. Continue west and up to the Fodder-Loft.
          on_failure:
            - inc_var: { name: cattle_alarm, by: 1 }
            - add_journal: "The Mediation check fails at DC 12 and cannot be retried. Jamie's crossed relief calls raise cattle alarm by 1. Continue through the Fodder-Loft."
            - narrate: >
                Your call overlaps Cade's and alarms the herd. Cattle alarm rises by 1,
                and Jamie's sealed relief protocol cannot be used again. Continue west
                and up to the Fodder-Loft.

  # A spatial tactic rather than another inventory buff. The store signposts this hatch
  # immediately, but the loft route opens only after the yearling is down. Entering that
  # one-way room is the approach commitment, recorded by ordinary visit history instead
  # of a redundant sticky flag; it never changes stats, score, or required locomotion.
  - id: loft_hatch
    name: "low wolf-hatch"
    aliases: [hatch, wolf hatch, loft hatch, drop, door-post]
    description: >
      CAST Cade's winter-feed sack THROUGH low wolf-hatch during LURE, or go east and
      DRIVE from the fodder-loft drop behind the flank-wolf during HUNT, if those actions
      are offered. The hauled ladder prevents retreat after you cross.
    variants:
      - when:
          - { has_flag: strategy_lure_committed }
          - { has_flag: flank_redirected }
        text: >
          Go east through the low wolf-hatch. The flank-wolf followed the second feed
          measure into the high wood alive. The hauled ladder prevents retreat.
    interactions:
      - verb: USE
        item: winter_feed_sack
        target: loft_hatch
        command_verb: cast
        command_template: "cast {item} through {target}"
        conditions:
          - { has_item: winter_feed_sack }
          - { has_flag: strategy_lure_committed }
          - any_of:
              - { has_flag: yearling_down }
              - { has_flag: yearling_redirected }
          - { not_flag: flank_wolf_down }
          - { not_flag: flank_redirected }
        effects:
          - set_flag: flank_redirected
          - inc_var: { name: cattle_alarm, by: 1 }
          - inc_var: { name: score, by: 10 }
          - set_quest_stage: { quest: the_watch, stage: threshold_redirected }
          - add_journal: "The second feed measure redirects the flank-wolf alive. Cattle alarm rises by 1."
          - narrate: >
              The flank-wolf follows the second feed measure into the high wood alive.
              Cattle alarm rises by 1, and the Byre Door is now empty.

  - id: outer_scent_gate
    name: "outer scent gate"
    aliases: [outer line, scent gate, final trail, last feed, leader trail]
    description: >
      CAST Cade's winter-feed sack THROUGH outer scent gate to redirect the grey leader alive.
      This consumes the sack. Current cattle alarm determines whether cattle are lost.
    visible_when: [{ has_flag: strategy_lure_committed }]
    variants:
      - when: [{ has_flag: pack_diverted }, { has_flag: yearling_down }]
        text: "The feed sack is empty. The flank-wolf and grey leader followed it into the high wood alive; the yearling wolf is dead."
      - when: [{ has_flag: pack_diverted }, { not_flag: yearling_down }]
        text: "The feed sack is empty. All three wolves followed it into the high wood alive."
      - when:
          - { has_flag: relief_oath_limited_duty }
          - { not_flag: lure_trail_fouled }
          - { has_flag: yearling_redirected }
          - { has_flag: flank_redirected }
          - { not_flag: yearling_down }
          - { not_flag: flank_wolf_down }
        text: >
          CAST Cade's winter-feed sack THROUGH outer scent gate without raising cattle
          alarm. Your limited-duty oath prevents this final 1 alarm only because all three
          wolves are alive and the first feed action succeeded. Earlier cattle alarm remains.
    interactions:
      - verb: USE
        item: winter_feed_sack
        target: outer_scent_gate
        command_verb: cast
        command_template: "cast {item} through {target}"
        conditions:
          - { has_item: winter_feed_sack }
          - { has_flag: strategy_lure_committed }
          - { has_flag: relief_oath_limited_duty }
          - { not_flag: lure_trail_fouled }
          - { has_flag: yearling_redirected }
          - { has_flag: flank_redirected }
          - { not_flag: yearling_down }
          - { not_flag: flank_wolf_down }
          - { not_flag: leader_down }
          - { not_flag: leader_redirected }
          - any_of:
              - { not_flag: june_pike_present }
              - { not_flag: lure_trail_fouled }
              - { has_flag: june_blood_condition_broken }
              - { has_flag: june_cattle_line_taken }
        blocked_hint:
          visible_when:
            - { has_flag: june_pike_present }
            - { has_flag: lure_trail_fouled }
            - { has_flag: yearling_redirected }
            - { has_flag: flank_redirected }
            - { not_flag: june_blood_condition_broken }
            - { not_flag: june_cattle_line_taken }
          reason: "First, TALK TO Road Warden June Pike. Her cattle-first help lowers cattle alarm by 1 before the final feed cast."
        effects:
          - remove_item: winter_feed_sack
          - set_flag: leader_redirected
          - set_flag: pack_diverted
          - inc_var: { name: score, by: 10 }
          - set_quest_stage: { quest: the_watch, stage: byre_redirected }
          - add_journal: "The limited-duty herd count prevents the final 1 cattle alarm. Earlier alarm remains, and the grey leader follows the spent feed alive."
          - narrate: >
              The grey leader follows the final feed measure into the high wood alive.
              Cade's limited-duty herd count prevents the final 1 cattle alarm. Earlier
              cattle alarm remains.
      - verb: USE
        item: winter_feed_sack
        target: outer_scent_gate
        command_verb: cast
        command_template: "cast {item} through {target}"
        conditions:
          - { has_item: winter_feed_sack }
          - { has_flag: strategy_lure_committed }
          - any_of:
              - { not_flag: relief_oath_limited_duty }
              - { has_flag: lure_trail_fouled }
              - { has_flag: yearling_down }
              - { has_flag: flank_wolf_down }
          - any_of:
              - { has_flag: flank_wolf_down }
              - { has_flag: flank_redirected }
          - { not_flag: leader_down }
          - { not_flag: leader_redirected }
          # If June's disclosed cattle-first condition has actually triggered,
          # her independent refusal/action must resolve before the player can
          # silently finish the same pressure line without her.
          - any_of:
              - { not_flag: june_pike_present }
              - { not_flag: lure_trail_fouled }
              - { has_flag: june_blood_condition_broken }
              - { has_flag: june_cattle_line_taken }
        blocked_hint:
          visible_when:
            - { has_flag: june_pike_present }
            - { has_flag: lure_trail_fouled }
            - { has_flag: yearling_redirected }
            - { has_flag: flank_redirected }
            - { not_flag: june_blood_condition_broken }
            - { not_flag: june_cattle_line_taken }
          reason: "First, TALK TO Road Warden June Pike. Her cattle-first help lowers cattle alarm by 1 before the final feed cast."
        effects:
          - remove_item: winter_feed_sack
          - set_flag: leader_redirected
          - set_flag: pack_diverted
          - inc_var: { name: cattle_alarm, by: 1 }
          - inc_var: { name: score, by: 10 }
          - set_quest_stage: { quest: the_watch, stage: byre_redirected }
          - add_journal: "The final feed measure redirects the grey leader alive and consumes the sack. Cattle alarm rises by 1 and determines whether cattle are lost."
          - narrate: >
              The grey leader follows the final feed measure into the high wood alive.
              Cade's winter-feed sack is consumed, and cattle alarm rises by 1.

  # A terminal post-hunt resource choice. Spending either saved cross-piece moves
  # straight into cattle_stand, whose existing on_enter awards the capstone and ends the
  # quest; there is no new backtrackable flag lattice. Walking north instead retains the
  # wood for daylight repair at the broken paling.
  - id: bloodied_byre_evacuation
    name: "bloodied byre evacuation"
    aliases: [evacuate byre, leave old grey, clear the people]
    description: >
      EVACUATE bloodied byre evacuation to save Cade and every rider without fighting the
      grey leader.
      The grey leader remains, two cattle are lost, and the byre and outer defense are abandoned.
    visible_when:
      - { has_flag: yearling_down }
      - { has_flag: flank_wolf_down }
      - { not_flag: leader_down }
      - { not_flag: leader_redirected }
      - { var_lte: { name: hp, value: 12 } }
      - { not_flag: strategy_lure_committed }
      - { not_flag: strategy_drive_committed }
      - { not_flag: strategy_fortify_committed }
      - { not_flag: leader_stake_crossbraced }
      - { not_flag: leader_turned_over_crossbrace }
      - { not_flag: leader_split_guard_set }
      - { not_flag: leader_waited_out }
      - { not_flag: leader_true_rush_taken }
      - { not_flag: leader_closed_on }
      - { not_flag: leader_driven_before_recovery }
    interactions:
      - verb: USE
        target: bloodied_byre_evacuation
        command_verb: evacuate
        conditions:
          - { has_flag: yearling_down }
          - { has_flag: flank_wolf_down }
          - { not_flag: leader_down }
          - { not_flag: leader_redirected }
          - { var_lte: { name: hp, value: 12 } }
          - { not_flag: strategy_lure_committed }
          - { not_flag: strategy_drive_committed }
          - { not_flag: strategy_fortify_committed }
          - { not_flag: leader_stake_crossbraced }
          - { not_flag: leader_turned_over_crossbrace }
          - { not_flag: leader_split_guard_set }
          - { not_flag: leader_waited_out }
          - { not_flag: leader_true_rush_taken }
          - { not_flag: leader_closed_on }
          - { not_flag: leader_driven_before_recovery }
        effects:
          - set_flag: bloodied_byre_evacuated
          - add_journal: "The bloodied byre evacuation saves Cade and every rider. The grey leader remains, two cattle are lost, and the byre and outer defense are abandoned."
          - narrate: >
              Cade and every rider escape. The grey leader remains in the byre, two cattle
              are lost, and the byre and outer defense are abandoned.

  - id: inner_cattle_gate
    name: "inner cattle-gate"
    aliases: [inner gate, cattle gate, gate, slatted gate, iron loops]
    description: >
      If you carry bound split-rail guard, BAR inner cattle-gate WITH bound split-rail
      guard. If you carry saved brace-stake, BAR inner cattle-gate WITH saved brace-stake.
      Otherwise, go north. Either BAR action consumes that wood; going north preserves
      any carried wood for daylight repair.
    visible_when: [{ has_flag: leader_down }]
    interactions:
      - verb: USE
        item: split_rail_guard
        target: inner_cattle_gate
        command_verb: bar
        command_template: "bar {target} with {item}"
        conditions: [{ has_flag: leader_down }]
        effects:
          - remove_item: split_rail_guard
          - set_flag: cattle_gate_barred_with_split_guard
          - add_journal: "The split-rail guard bars the inner cattle-gate and is consumed. The herd has an extra barrier."
          - narrate: >
              The split-rail guard now bars the inner cattle-gate. The guard is consumed,
              and the herd has an extra barrier.
          - goto: cattle_stand
      - verb: USE
        item: saved_brace_stake
        target: inner_cattle_gate
        command_verb: bar
        command_template: "bar {target} with {item}"
        conditions: [{ has_flag: leader_down }]
        effects:
          - remove_item: saved_brace_stake
          - set_flag: cattle_gate_barred_with_brace_stake
          - add_journal: "The saved brace-stake bars the inner cattle-gate and is consumed. The herd has an extra barrier."
          - narrate: >
              The saved brace-stake now bars the inner cattle-gate. The stake is consumed,
              and the herd has an extra barrier.
          - goto: cattle_stand

  - id: day_book
    name: "day-book"
    aliases: [book, daybook, tally, log, journal, nail, notice]
    description: >
      The day-book records the wolf count and HUNT preparation available before a
      DRIVE or FORTIFY commitment. Any preparation already completed stays recorded.
    read_text: >
      The opening tally recorded three wolves: the yearling wolf, flank-wolf, and grey
      leader. For the safest HUNT, the preparation was TALK TO old Cade the houndsman, then choose PREPARE
      SUPPORT for +2 attack, and DON padded byre-jerkin for +2 defense. Complete only
      actions still offered; these bonuses affect fights still ahead and do not reopen
      completed work. Protect the cattle until dawn.
    interactions:
      - verb: READ
        target: day_book
        conditions:
          - { not_flag: read_tally }
          - { not_flag: strategy_drive_committed }
          - { not_flag: strategy_fortify_committed }
        effects:
          - set_flag: read_tally
          - inc_var: { name: score, by: 5 }

  - id: byre_jerkin
    name: "padded byre-jerkin"
    aliases: [jerkin, padding, jacket, hide, leathers, coat]
    description: >
      Its first DON while offered grants lasting +2 defense against any fights still
      ahead. DRIVE or FORTIFY commitment closes DON; HUNT does not. Carrying it
      without donning gives no bonus, and completed fights stay complete.
    # Reactive examine (bug_0023): once pulled on it is gear you wear, not a loose jerkin
    # on a peg to consider (its self-USE "don" interaction has retired behind jerkin_donned).
    variants:
      - when: [{ has_flag: jerkin_donned }]
        text: "You are wearing the padded byre-jerkin and have its +2 defense bonus."
      - when: [{ has_item: byre_jerkin }, { none_of: [{ has_flag: jerkin_donned }] }]
        text: >
          You carry the unworn padded byre-jerkin. DON padded byre-jerkin only while offered; DRIVE or
          FORTIFY commitment closes it. The bonus helps only in fights still ahead.
    takeable: true
    # Once Albany's rider claims this quest gear, it stays with him. In particular,
    # DROP must never let a donned jerkin leave inventory while its +2 defense and
    # `jerkin_donned` state remain active.
    droppable: false
    take_effects:
      - set_flag: byre_jerkin_taken
      - narrate: >
          You take the padded byre-jerkin. DON padded byre-jerkin only while offered to gain lasting
          +2 defense against fights still ahead; carrying it gives no bonus.
    interactions:
      # Self-USE = "wear this thing" (cold_forge plate / dawn_beacon mail, bug_0074).
      # command_verb: don makes the offered and typed verb match the prose. One-shot
      # (gated none_of jerkin_donned) so the +2 cannot be farmed. The +2 defense is half
      # of the houndsman's promised safety; with his +2-attack counsel it is exactly what
      # carries the cumulative gauntlet bound GREEN for the fully-prepared hunter.
      - verb: USE
        item: byre_jerkin
        target: byre_jerkin
        command_verb: don
        conditions:
          - { none_of: [{ has_flag: jerkin_donned }] }
          - { not_flag: strategy_drive_committed }
          - { not_flag: strategy_fortify_committed }
        effects:
          - set_flag: jerkin_donned
          - inc_var: { name: defense, by: 2 }
          # The diligence award (bug_0239): donning the jerkin is the other prep act the
          # day-book presses, so it scores +5. One-shot — gated behind jerkin_donned (the
          # don interaction retires once worn), so the +5 cannot be farmed.
          - inc_var: { name: score, by: 5 }
          - add_journal: "You don the padded byre-jerkin and gain +2 defense."
          - narrate: "You don the padded byre-jerkin and gain +2 defense. Its layered hide is stiff over your coat."

  # The one skill_check this pack carries — added so the RPG mode is uniform (every
  # curated RPG pack now has at least one §13 check). It is a defence skill check, the
  # breaking_weir tool-on-target shape: wedge a fallen paling-rail back across the breach
  # to shore the line. The initial check remains OPTIONAL — no exit, win, or ending turns
  # on its flag alone — but it is no longer decorative: ordinary success unlocks the
  # guarded funnel sequence, while a committed fouled lure can consume that same brace as
  # a deterministic scent-pen before combat starts. The frozen timber gives ONE honest
  # wedge attempt. `rail_attempted` is
  # set before the d20 branch; ordinary wedge failure sets `rail_split` and exposes a second, deterministic
  # target-only USE with the SAME stable `use_paling_rail` id. Binding the joined lengths
  # makes real, non-droppable `split_rail_guard` gear and a distinct recovered flank line;
  # leaving them unbound preserves Hayden's imported frost-jamb line. Neither choice
  # rerolls or counterfeits the stronger braced-funnel success.
  #   - skill: defense (the only fitting reachable stat — vars_init.defense 3, +2 from the
  #     byre-jerkin = ceiling 5; shoring a defensive line is defence work, not the spear-arm).
  #   - difficulty 11: passable on a MID roll at BASE defence (d20 + 3 ≥ 11 needs a roll of
  #     8, ~65%) and easier once the jerkin is on (d20 + 5, roll of 6). Well under the
  #     SKILL_CHECK_IMPOSSIBLE ceiling 20 + 5 = 25, so the check always reads as winnable.
  #   - on_success: breach_braced + journal + narration, NO persistent stat or score change.
  #     The flag drives reactive prose, the flank-wolf's `funnel_thrust`, and only inside an
  #     unbloodied fouled lure the separate scent-pen action; the flag alone satisfies no
  #     exit/win/ending. Temporary maneuver defense never changes stored stats.
  #   - on_failure: the rail splits. The guarded funnel is lost, but the explicitly
  #     signposted choice either salvages a weaker carried guard or, with Hayden's report,
  #     keeps the spear bare for a high-variance door-brace line.
  - id: paling_rail
    name: "fallen paling-rail"
    aliases: [rail, paling-rail, post, stake, timber, bar]
    description: "Use BRACE fallen paling-rail or WEDGE fallen paling-rail only while offered. The rail makes a combat funnel for wolf fights still ahead; completed fights stay complete. It does not redirect the yearling wolf alive unless TURN braced scent-pen is offered after a failed LURE feed action."
    # The rail is real scenery while loose, split, or wedged into the breach. Once the
    # split lengths become carried gear, the sticky made flag retires this world object;
    # the room text narrates the empty bed and later spent guard without leaving a stale
    # examine affordance behind.
    visible_when:
      - { not_flag: split_rail_guard_made }
      - { not_flag: strategy_fortify_committed }
    variants:
      - when:
          - { has_flag: opening_condition_firm_frozen_rail }
          - { not_flag: rail_attempted }
          - { not_flag: strategy_lure_committed }
          - { not_flag: strategy_drive_committed }
          - { not_flag: strategy_fortify_committed }
        name: "firm-seated paling-rail"
        text: >
          If BRACE is offered, BRACE firm-seated paling-rail without a check. It becomes a
          combat funnel for any wolf fight still ahead, but it neither redirects a living
          wolf nor reopens a completed fight. Deep frost guarantees the brace.
      - when:
          - { has_flag: works_fortification_prepared }
          - { not_flag: rail_attempted }
          - { not_flag: strategy_fortify_committed }
        name: "Works-marked paling-rail"
        text: >
          If SET is offered, SET Works-marked paling-rail. This makes one Repair check (DC 12).
          Success braces it. Failure closes Hayden's frost-jammed door-brace option but
          enables one guaranteed SPLICE that raises cattle alarm by 1. The brace affects
          only fights still ahead and does not reopen completed fights. After a failed LURE
          feed action, it can redirect the yearling wolf alive only while TURN is offered.
      - when: [{ has_flag: leader_turned_over_crossbrace }]
        name: "spent paling brace"
        text: "The fallen paling-rail is canted. Its brace-stake was spent and split against the grey leader."
      - when: [{ has_item: saved_brace_stake }]
        name: "canted paling-rail"
        text: "The fallen paling-rail is canted, and its brace-stake remains unspent. Use it against the grey leader only while SET the saved brace-stake across the spear against the grey leader is offered; otherwise BAR inner cattle-gate WITH saved brace-stake if offered or keep it for daylight repair. Completed fights stay complete."
      - when:
          - { has_flag: lure_hybrid_combat_entered }
          - { not_flag: yearling_down }
        name: "combat paling-rail"
        text: "Your guarded strike closed every nonlethal yearling recovery. ATTACK yearling wolf until it is dead; the fallen paling-rail can no longer redirect it."
      - when:
          - { has_flag: strategy_lure_committed }
          - { has_flag: lure_hybrid_combat_entered }
          - { has_flag: yearling_down }
          - { has_flag: rail_split }
        name: "abandoned split paling-rail"
        text: >
          The yearling wolf is dead. Leave the split fallen paling-rail here and carry the
          remaining feed deeper. Your guarded strike closed BIND and every other rail recovery.
      - when:
          - { has_flag: works_fortification_splice_needed }
          - { not_flag: lure_hybrid_combat_entered }
        name: "marked split paling-rail"
        text: >
          If SPLICE is offered, SPLICE marked split paling-rail without another check.
          This restores the combat funnel for fights still ahead and raises cattle alarm
          by 1. Completed fights stay complete.
      - when:
          - { has_flag: strategy_lure_committed }
          - { has_flag: lure_trail_fouled }
          - { has_flag: breach_braced }
          - { not_flag: lure_hybrid_combat_entered }
          - { not_flag: yearling_down }
          - { not_flag: yearling_redirected }
        name: "braced scent-pen"
        text: >
          TURN braced scent-pen to redirect the yearling wolf alive after the
          failed feed action. This needs no check and causes no damage.
      - when: [{ has_flag: breach_braced }]
        name: "braced paling-rail"
        text: "The braced fallen paling-rail provides a combat funnel for fights still ahead; completed fights stay complete. It redirects the yearling wolf alive only while TURN is offered after a failed LURE feed action."
      - when:
          - { has_flag: hayden_frost_report_certified }
          - { not_flag: strategy_lure_committed }
          - { has_flag: rail_split }
          - { not_flag: split_rail_guard_made }
          - { not_item: split_rail_guard }
        name: "split paling-rail"
        text: >
          If BIND is offered, BIND split paling-rail to make a split-rail guard. Leave it
          unbound for Hayden's door-brace only while the flank-wolf still stands and TRIP
          Hayden's frost-jammed brace across the flank-wolf's turn is offered. Binding the
          guard closes that option; completed fights stay complete.
      - when: [{ has_flag: rail_split }, { not_flag: split_rail_guard_made }]
        name: "split paling-rail"
        text: >
          BIND split paling-rail to make a split-rail guard before going north.
          The split rail cannot provide a combat funnel.
    interactions:
      - verb: USE
        target: paling_rail
        command_verb: brace
        conditions:
          - { has_flag: opening_condition_firm_frozen_rail }
          - { not_flag: lure_hybrid_combat_entered }
          - { not_flag: rail_attempted }
          - { not_flag: breach_braced }
          - { not_flag: strategy_lure_committed }
          - { not_flag: strategy_drive_committed }
          - { not_flag: strategy_fortify_committed }
        effects:
          - set_flag: rail_attempted
          - set_flag: breach_braced
          - add_journal: "The firm frozen rail braces without a check. Its combat funnel affects only wolf fights still ahead; completed fights stay complete."
          - narrate: >
              The fallen paling-rail braces without a check and becomes a combat funnel.
              It affects only wolf fights still ahead; completed fights stay complete.

      # Reese's allocation replaces the public wedge with one Repair check. A miss keeps
      # the honest split-rail consequence, then exposes a deterministic cold-set recovery
      # instead of a retry or the public carried-guard branch.
      - verb: USE
        target: paling_rail
        command_verb: set
        conditions:
          - { has_flag: works_fortification_prepared }
          - { not_flag: lure_hybrid_combat_entered }
          - { not_flag: rail_attempted }
          - { not_flag: breach_braced }
          - any_of:
              - all_of:
                  - { not_flag: strategy_lure_committed }
                  - { not_flag: opening_condition_firm_frozen_rail }
              - all_of:
                  - { has_flag: strategy_lure_committed }
                  - { has_flag: lure_trail_fouled }
          - any_of:
              - { not_flag: strategy_drive_committed }
              - { has_flag: june_blood_condition_broken }
          - { not_flag: strategy_fortify_committed }
        effects:
          - set_flag: rail_attempted
        skill_check:
          skill: repair
          difficulty: 12
          stakes: "Success braces the fallen paling-rail. Failure splits it but enables one guaranteed SPLICE that raises cattle alarm by 1, plus another 1 if the dispatch began late."
          on_success:
            - set_flag: breach_braced
            - add_journal: "The Repair check succeeds at DC 12. The fallen paling-rail is braced for wolf fights still ahead without raising cattle alarm. Completed fights stay complete."
            - narrate: >
                Reese's Works marks help you brace the fallen paling-rail for wolf fights
                still ahead. Cattle alarm does not rise, and completed fights stay complete.
          on_failure:
            - set_flag: works_fortification_splice_needed
            - add_journal: "The Repair check fails at DC 12. The fallen paling-rail splits, but Reese's marked SPLICE guarantees recovery."
            - narrate: >
                The fallen paling-rail splits. SPLICE marked split paling-rail to brace it
                without another check; that action will raise cattle alarm by 1.
          on_failure_when:
            - conditions:
                - { has_flag: dispatch_opening_delayed }
                - { not_flag: strategy_lure_committed }
                - { not_flag: strategy_drive_committed }
                - { not_flag: strategy_fortify_committed }
              effects:
                - inc_var: { name: cattle_alarm, by: 1 }
                - add_journal: "The delayed dispatch adds another 1 cattle alarm after the failed rail SET action."
                - narrate: >
                    The delayed dispatch raises cattle alarm by another 1.
      # Target-only USE: the rail is visible scenery already lying in the breach, so
      # "wedge rail" means lifting and setting it in place without a TAKE/drop cycle.
      # This prevents a wedged or split rail from being immediately re-taken into the
      # inventory. `rail_attempted` retires the wedge after either branch, while
      # breach_braced records success and unlocks the later funnel sequence.
      - verb: USE
        target: paling_rail
        command_verb: wedge
        conditions:
          - { not_flag: works_fortification_prepared }
          - { not_flag: lure_hybrid_combat_entered }
          - { not_flag: rail_attempted }
          - { not_flag: breach_braced }
          - any_of:
              - all_of:
                  - { not_flag: strategy_lure_committed }
                  - { not_flag: opening_condition_firm_frozen_rail }
              - all_of:
                  - { has_flag: strategy_lure_committed }
                  - { has_flag: lure_trail_fouled }
          - any_of:
              - { not_flag: strategy_drive_committed }
              - { has_flag: june_blood_condition_broken }
          - { not_flag: strategy_fortify_committed }
        effects:
          - set_flag: rail_attempted
        skill_check:
          skill: defense
          difficulty: 11
          on_success:
            - set_flag: breach_braced
            - add_journal: "The Defense check succeeds at DC 11. The fallen paling-rail provides a combat funnel for wolf fights still ahead; completed fights stay complete."
            - narrate: "The fallen paling-rail braces across the gap. Its combat funnel affects only wolf fights still ahead; completed fights stay complete."
          on_failure:
            - set_flag: rail_split
            - add_journal: "The Defense check fails at DC 11. The fallen paling-rail splits, so the combat funnel is lost. You may BIND split paling-rail to make a split-rail guard."
            - narrate: "The fallen paling-rail splits and cannot provide a combat funnel. BIND split paling-rail to make a split-rail guard, or leave the rail unbound for any available bare-spear option."
          on_failure_when:
            - conditions:
                - { has_flag: dispatch_opening_delayed }
                - { not_flag: strategy_lure_committed }
                - { not_flag: strategy_drive_committed }
                - { not_flag: strategy_fortify_committed }
              effects:
                - inc_var: { name: cattle_alarm, by: 1 }
                - add_journal: "The delayed dispatch adds another 1 cattle alarm after the failed rail WEDGE action."
                - narrate: >
                    The delayed dispatch raises cattle alarm by another 1.

      - verb: USE
        target: paling_rail
        command_verb: splice
        conditions:
          - { has_flag: works_fortification_prepared }
          - { not_flag: lure_hybrid_combat_entered }
          - { has_flag: works_fortification_splice_needed }
          - { not_flag: breach_braced }
          - { not_flag: strategy_fortify_committed }
        effects:
          - clear_flag: works_fortification_splice_needed
          - set_flag: breach_braced
          - inc_var: { name: cattle_alarm, by: 1 }
          - add_journal: "Reese's marked SPLICE braces the fallen paling-rail without a check for wolf fights still ahead. Cattle alarm rises by 1; completed fights stay complete."
          - narrate: >
              Reese's marked SPLICE braces the fallen paling-rail for wolf fights still
              ahead. Cattle alarm rises by 1, and completed fights stay complete.
      # A successful wedge must not force blood while the authored split-rail failure can
      # redirect alive. This second stable USE exists only inside a previously committed
      # lure after its one feed check fouled. The brace becomes a scent-pen, not a second
      # check or a general-purpose noncombat answer for ordinary hunt-and-hold. Jamie's
      # paid protocol remains a deliberately split-recovery-specific failure mitigator.
      - verb: USE
        target: paling_rail
        command_verb: turn
        conditions:
          - { has_flag: strategy_lure_committed }
          - { has_flag: lure_trail_fouled }
          - { has_flag: breach_braced }
          - { not_flag: strategy_drive_committed }
          - { not_flag: strategy_fortify_committed }
          - { not_flag: lure_hybrid_combat_entered }
          - { not_flag: yearling_down }
          - { not_flag: yearling_redirected }
        effects:
          - set_flag: yearling_redirected
          - set_flag: yearling_redirected_with_braced_rail
          - inc_var: { name: score, by: 10 }
          - set_quest_stage: { quest: the_watch, stage: breach_redirected }
          - add_journal: "The braced fallen paling-rail redirects the yearling wolf alive after the failed feed action. No damage is dealt."
          - narrate: >
              The braced fallen paling-rail redirects the yearling wolf into the high wood
              alive. No damage is dealt, and cattle alarm from the failed feed action remains.
      # Recoverable failure: target-only again, therefore the stable action id remains
      # `use_paling_rail`. Mutually exclusive with the initial wedge and with itself.
      - verb: USE
        target: paling_rail
        command_verb: bind
        conditions:
          - { not_flag: works_fortification_prepared }
          - { not_flag: lure_hybrid_combat_entered }
          - { has_flag: rail_split }
          - { not_flag: split_rail_guard_made }
          - { not_item: split_rail_guard }
          - { not_flag: strategy_fortify_committed }
        effects:
          - add_item: split_rail_guard
          - set_flag: split_rail_guard_made
          - add_journal: "You make a split-rail guard. It can block one wolf attack still ahead or BAR inner cattle-gate WITH bound split-rail guard if offered, but it closes every bare-spear option. Completed fights stay complete."
          - narrate: "You bind the split fallen paling-rail across the Albany relief spear. The guard can block one wolf attack still ahead or BAR inner cattle-gate WITH bound split-rail guard if offered, but the spear is no longer bare. Completed fights stay complete."

  - id: split_rail_guard
    name: "bound split-rail guard"
    aliases: [split rail guard, splinter guard, bound rail, cross-guard, cross guard]
    description: >
      This guard can block one attack only while its matching wolf maneuver is offered. It
      can also BAR inner cattle-gate WITH bound split-rail guard if offered or remain for
      daylight repair. Completed fights stay complete.
    # Real recovered gear, but never loose loot: the maneuver that commits it at either
    # later encounter consumes it exactly once.
    droppable: false

  - id: saved_brace_stake
    name: "saved brace-stake"
    aliases: [brace-stake, brace stake, hardwood stake, crossbrace, cross-brace]
    description: >
      This stake provides one guarded attack only while its grey-leader maneuver is offered.
      It can also BAR inner cattle-gate WITH saved brace-stake if offered or remain for
      daylight repair. Saving it made your flank-wolf attack weaker; completed fights stay complete.
    # Earned only by the flank-wolf follow-through and spent only at the leader.
    droppable: false

npcs:
  - id: houndsman
    name: "old Cade the houndsman"
    description: >
      TALK TO old Cade the houndsman to compare or review HUNT, LURE, DRIVE, FORTIFY, and HUNT tactics.
      Choices and preparation steps retire as the night advances. His hands are too stiff
      to fight. He waits with a lantern and stick.
    room: byre_yard
    # Every npc_text is PURE SPOKEN words (the bug_0071 convention): the engine renders
    # `old Cade the houndsman: "<npc_text>"`. The counsel topic retires once told (gated
    # not_flag heard_counsel) so the +2 attack is one-shot; the ungated `leave` keeps the
    # root TERMINATING (a gated-only node would trip DIALOGUE_NONTERMINATING, bug_0014).
    # bug_0258 — cade_byre signposts the optional wedge before the player reaches
    # the paling. The rail is now visible target-only scenery, so the signpost names
    # the natural one-step act (heft and wedge it) rather than a take/use inventory
    # ceremony. Success creates the guarded flank-wolf opening and can seed the optional
    # brace-stake line remembered at the ending; neither outcome gates victory.
    dialogue:
      root: cade_root
      nodes:
        - id: cade_root
          npc_text: >
            Reviews choose nothing. Choose LURE, DRIVE, or FORTIFY in review. Choose HUNT
            with GO north or RELEASE JUNE. One choice permanently closes the rest.
            PREPARE SUPPORT chooses nothing.
          append_variants:
            - when:
                - { has_flag: opening_condition_firm_frozen_rail }
                - { not_flag: june_hunt_released }
                - { not_flag: strategy_lure_committed }
                - { not_flag: strategy_drive_committed }
                - { not_flag: strategy_fortify_committed }
                - { not_visited: paling_gap }
              text: "FIELD CONDITION — firm frozen rail. At the opening, BRACE firm-seated paling-rail succeeds without a check. It does not change later fights."
            - when:
                - { has_flag: opening_condition_steady_scent_channel }
                - { not_flag: june_hunt_released }
                - { not_flag: strategy_lure_committed }
                - { not_flag: strategy_drive_committed }
                - { not_flag: strategy_fortify_committed }
                - { not_visited: paling_gap }
