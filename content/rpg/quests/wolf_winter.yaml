  # Cade owns one finite noncombat resource. Accepting his plan before entering the
  # breach commits the feed-and-hounds strategy; once the player has seen the first
  # wolf, Cade will not offer the steading's last feed as a retroactive accessory.
  # The same sack must survive through the loft and leader beats, so a fouled opening
  # cannot be reset by returning to the store for invisible replacement bait.
  - id: winter_feed_sack
    name: "Cade's winter-feed sack"
    aliases: [feed, feed sack, winter feed, oats, tallow, bait, lure]
    description: >
      This is the only feed sack. Its lure sequence is LAY downwind feed line WITH Cade's
      winter-feed sack, CAST Cade's winter-feed sack THROUGH low wolf-hatch, then CAST
      Cade's winter-feed sack THROUGH outer scent gate. Continue with only the next
      offered step; completed or failed steps cannot restart.
    visible_when:
      - { has_flag: strategy_lure_committed }
      - { not_visited: paling_gap }
    takeable: true
    droppable: false
    take_effects:
      - add_journal: "You take Cade's winter-feed sack. It must serve all three wolves; a failed feed action cannot be restocked or restarted."

  # The first noncombat execution beat. Everyone can attempt the public Cade-taught
  # route after committing the sack; an imported Fieldcraft rank makes the opening
  # more reliable without class-locking it. Failure permanently changes pressure
  # and legal recovery.
  - id: downwind_feed_line
    name: "downwind feed line"
    aliases: [feed line, scent line, trail, downwind trail, breach trail]
    description: >
      LAY downwind feed line WITH Cade's winter-feed sack to redirect the yearling wolf alive.
      Failure raises cattle alarm by 2 and cannot be retried. The same sack must still
      serve the flank-wolf and grey leader.
    visible_when: [{ has_flag: strategy_lure_committed }]
    variants:
      - when:
          - { has_flag: flank_redirected }
          - { has_item: winter_feed_sack }
          - { not_flag: leader_redirected }
        text: >
          The yearling stage is resolved, and the second feed cast redirected the flank-wolf.
          Carry the remaining feed north through the empty wolf positions to Deep in the
          Byre. CAST Cade's winter-feed sack THROUGH outer scent gate if that final action is
          offered. Finished feed stages stay closed.
      - when:
          - { has_flag: opening_condition_steady_scent_channel }
          - { not_flag: lure_trail_fouled }
          - { not_flag: yearling_down }
          - { not_flag: yearling_redirected }
        text: >
          LAY downwind feed line WITH Cade's winter-feed sack without a check. The steady
          scent channel guarantees
          success. The normal cattle-alarm cost remains unless exposed-ridge relief fodder
          absorbs it. The same sack must still serve the other two wolves.
      - when: [{ has_flag: yearling_redirected }]
        text: "The yearling wolf followed the downwind feed line into the high wood alive. Continue LURE through the Store-Shed and Fodder-Loft."
      - when: [{ has_flag: yearling_down }]
        text: "The first feed action failed, and the yearling wolf is dead. Carry the remaining feed through the Store-Shed and Fodder-Loft for the other two wolves."
      - when:
          - { has_flag: lure_hybrid_combat_entered }
          - { not_flag: yearling_down }
        text: "Your spear attack chose LURE's combat route. ATTACK yearling wolf, then carry the remaining feed through the Store-Shed and Fodder-Loft. All nonlethal yearling recoveries are closed."
      - when:
          - { has_flag: lure_trail_fouled }
          - { not_flag: lure_hybrid_combat_entered }
          - { not_flag: yearling_down }
        text: "The first feed action failed and cannot be retried. There is no second sack. If you carry the bound split-rail guard, PEN downwind feed line WITH bound split-rail guard. Otherwise use any rail or route recovery currently offered; if none is offered, MAKE a guarded strike and abandon the living recovery."
    interactions:
      # The steady scent channel changes only the first cast's uncertainty. Four
      # mutually exclusive rows preserve the authored approach/fodder alarm costs.
      - verb: USE
        item: winter_feed_sack
        target: downwind_feed_line
        command_verb: lay
        command_template: "lay {target} with {item}"
        conditions:
          - { has_item: winter_feed_sack }
          - { has_flag: strategy_lure_committed }
          - { has_flag: opening_condition_steady_scent_channel }
          - { has_flag: approach_exposed_ridge }
          - { not_flag: approach_sheltered_stockway }
          - { has_flag: relief_cade_fodder_allocated }
          - { not_flag: relief_resident_shelter_allocated }
          - { not_flag: relief_mobile_reserve_allocated }
          - { not_flag: lure_trail_fouled }
          - { not_flag: yearling_down }
          - { not_flag: yearling_redirected }
        effects:
          - set_flag: yearling_redirected
          - inc_var: { name: score, by: 10 }
          - set_quest_stage: { quest: the_watch, stage: breach_redirected }
          - add_journal: "The steady scent channel redirects the yearling wolf alive without a check. Exposed-ridge relief fodder prevents the normal cattle-alarm increase. The same sack continues."
          - narrate: >
              The yearling wolf follows the feed into the high wood alive. The steady scent
              channel guaranteed success, and exposed-ridge relief fodder prevents cattle
              alarm from rising. The same sack must still serve the other two wolves.

      - verb: USE
        item: winter_feed_sack
        target: downwind_feed_line
        command_verb: lay
        command_template: "lay {target} with {item}"
        conditions:
          - { has_item: winter_feed_sack }
          - { has_flag: strategy_lure_committed }
          - { has_flag: opening_condition_steady_scent_channel }
          - { has_flag: approach_exposed_ridge }
          - { not_flag: approach_sheltered_stockway }
          - { not_flag: relief_cade_fodder_allocated }
          - { not_flag: lure_trail_fouled }
          - { not_flag: yearling_down }
          - { not_flag: yearling_redirected }
        effects:
          - inc_var: { name: cattle_alarm, by: 1 }
          - set_flag: yearling_redirected
          - inc_var: { name: score, by: 10 }
          - set_quest_stage: { quest: the_watch, stage: breach_redirected }
          - add_journal: "The steady scent channel redirects the yearling wolf alive without a check. This feed action raises cattle alarm by 1, adding to the exposed approach's 1. The same sack continues."
          - narrate: >
              The yearling wolf follows the feed into the high wood alive. The steady scent
              channel guaranteed success. This action raises cattle alarm by 1, bringing it
              to 2 after the exposed approach. The same sack must serve the other two wolves.

      - verb: USE
        item: winter_feed_sack
        target: downwind_feed_line
        command_verb: lay
        command_template: "lay {target} with {item}"
        conditions:
          - { has_item: winter_feed_sack }
          - { has_flag: strategy_lure_committed }
          - { has_flag: opening_condition_steady_scent_channel }
          - { has_flag: approach_sheltered_stockway }
          - { not_flag: approach_exposed_ridge }
          - { not_flag: lure_trail_fouled }
          - { not_flag: yearling_down }
          - { not_flag: yearling_redirected }
        effects:
          - inc_var: { name: cattle_alarm, by: 1 }
          - set_flag: yearling_redirected
          - inc_var: { name: score, by: 10 }
          - set_quest_stage: { quest: the_watch, stage: breach_redirected }
          - add_journal: "The steady scent channel redirects the yearling wolf alive without a check. Cattle alarm rises by 1, and the same sack continues."
          - narrate: >
              The yearling wolf follows the feed into the high wood alive. The steady scent
              channel guaranteed success, cattle alarm rises by 1, and the same sack must
              serve the other two wolves.

      - verb: USE
        item: winter_feed_sack
        target: downwind_feed_line
        command_verb: lay
        command_template: "lay {target} with {item}"
        conditions:
          - { has_item: winter_feed_sack }
          - { has_flag: strategy_lure_committed }
          - { has_flag: opening_condition_steady_scent_channel }
          - { not_flag: approach_exposed_ridge }
          - { not_flag: approach_sheltered_stockway }
          - { not_flag: lure_trail_fouled }
          - { not_flag: yearling_down }
          - { not_flag: yearling_redirected }
        effects:
          - inc_var: { name: cattle_alarm, by: 1 }
          - set_flag: yearling_redirected
          - inc_var: { name: score, by: 10 }
          - set_quest_stage: { quest: the_watch, stage: breach_redirected }
          - add_journal: "The steady scent channel redirects the yearling wolf alive without a check. Cattle alarm rises by 1, and the same sack continues."
          - narrate: >
              The yearling wolf follows the feed into the high wood alive. The steady scent
              channel guaranteed success, cattle alarm rises by 1, and the same sack must
              serve the other two wolves.

      # Emery's northbound fodder is a route-specific cattle buffer, not a retry or
      # a check bonus. On the exposed ridge only, a clean cast consumes the buffer
