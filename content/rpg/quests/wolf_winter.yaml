  - id: mobile_relief_failure_crew
    name: "mobile relief failure crew"
    aliases: [mobile crew, failure crew, relief wagon crew, hill-turn crew]
    description: >
      DEPLOY mobile relief failure crew after recovering a failed outer seal and before setting the byre
      threshold seal. It reduces fortification pressure by 1. It does not change the failed
      check, recover spent materials, replace Cade's help, or change your chosen materials.
    visible_when:
      - { has_flag: relief_mobile_reserve_allocated }
      - { not_flag: relief_cade_fodder_allocated }
      - { not_flag: relief_resident_shelter_allocated }
      - { has_flag: fortify_outer_seal_failed }
      - { has_flag: fortify_outer_sealed }
      - { not_flag: fortify_threshold_sealed }
      - { not_flag: fortify_mobile_crew_stabilized }
