  # June has one stable identity. Conditional presentation variants move her between
  # the commitment boundary and the three cattle-first intervention beats without
  # duplicating an NPC merely to change room, description, or dialogue root.
  - id: june_pike
    name: "Road Warden June Pike"
    description: >
      TALK TO Road Warden June Pike before choosing HUNT. Her cattle-first authority can support LURE,
      DRIVE, or FORTIFY, but she will not fight wolves.
    room: byre_yard
    conditions:
      - { has_flag: june_pike_present }
      - { not_flag: june_blood_condition_broken }
      - any_of:
          - all_of:
              - { not_flag: june_combat_line_acknowledged }
              - { not_flag: strategy_lure_committed }
              - { not_flag: strategy_drive_committed }
              - { not_flag: strategy_fortify_committed }
              - { not_visited: paling_gap }
          - all_of:
              - { has_flag: strategy_lure_committed }
              - { has_flag: lure_trail_fouled }
              - { has_flag: yearling_redirected }
              - { has_flag: flank_redirected }
              - { not_flag: june_cattle_line_taken }
          - all_of:
              - { has_flag: strategy_drive_committed }
              - { has_flag: drive_flank_turned }
              - none_of:
                  - { has_flag: drive_courier_wounded }
                  - { has_flag: drive_cattle_lost }
                  - { has_flag: drive_reserve_spent }
              - { not_flag: june_drive_cattle_line_taken }
          - all_of:
              - { has_flag: strategy_fortify_committed }
              - { has_flag: fortify_threshold_sealed }
              - { not_flag: fortify_dawn_held }
              - { not_flag: june_fortify_cattle_line_taken }
    variants:
      # Each intervention root records its cattle line as soon as June speaks.
      # Keep the matching room/root stable through the active acknowledgement;
      # the NPC's outer conditions still retire a new TALK once that flag is set.
      - when:
          - { has_flag: strategy_lure_committed }
          - { has_flag: lure_trail_fouled }
          - { has_flag: yearling_redirected }
          - { has_flag: flank_redirected }
        room: byre_mouth
        description: >
          TALK TO Road Warden June Pike before the final LURE action. She can lower cattle alarm by 1 after
          the failed first LAY action was recovered. She will not fight the grey leader.
        dialogue_root: june_cattle_first
      - when:
          - { has_flag: strategy_drive_committed }
          - { has_flag: drive_flank_turned }
          - none_of:
              - { has_flag: drive_courier_wounded }
              - { has_flag: drive_cattle_lost }
              - { has_flag: drive_reserve_spent }
        room: byre_mouth
        description: >
          TALK TO Road Warden June Pike before choosing the DRIVE crisis priority. If the first drive shutter
          signal failed, she prevents the 2 HP Overrun cost and sets pack drive to Crisis.
          A successful signal gains no benefit. She does not FIRE or CAST either signal.
        dialogue_root: june_drive_cattle_first
      - when:
          - { has_flag: strategy_fortify_committed }
          - { has_flag: fortify_threshold_sealed }
          - { not_flag: fortify_dawn_held }
        room: byre_mouth
        description: >
          TALK TO Road Warden June Pike before the sealed-byre dawn watch. At Strained or higher after an
          unstabilized failed outer seal, she prevents the 2 HP dawn cost. A seal stabilized
          by the mobile relief crew, or a watch at Hammering, already costs no HP and gains
          no benefit from her. She does not lower fortification pressure or change materials.
        dialogue_root: june_fortify_cattle_first
    dialogue:
      root: june_wolf_line_boundary
      nodes:
        - id: june_wolf_line_boundary
          npc_text: >-
            Choose by outcome. Cade's reviews and support do not choose a plan. Choose LURE,
            DRIVE, or FORTIFY with Cade before going north. For HUNT, choose now: RELEASE JUNE.
            This preserves our agreement but loses all my help. Or keep me with the cattle
            and go north; the first wolf death will then end our agreement.
          topics:
            - id: release_june_for_hunt
              aliases: [release_june, preserve_june_agreement, choose_hunt_without_june]
              prompt: "CHOOSE HUNT / RELEASE JUNE — Preserve June's agreement, lose all her help, and permanently close LURE, DRIVE, and FORTIFY."
              goto: june_released_before_hunt
            - id: commit_hunt_and_hold
              aliases: [accept_wolf_line, choose_hunt_and_hold, acknowledge_combat_line]
              prompt: "KEEP JUNE — Keep her cattle-first help. Going north chooses HUNT and closes other plans; the first wolf death ends her agreement."
              goto: june_combat_line_disclosed
            - id: keep_cattle_terms
              aliases: [choose_living_plan, ask_cade]
              prompt: "BACK — Return to Cade's LURE, DRIVE, and FORTIFY reviews without choosing a plan."
              goto: june_cattle_terms_confirmed
        - id: june_combat_line_disclosed
          npc_text: >-
            During HUNT, go north and use the exact rail action shown at the Broken Paling.
            If a split-rail recovery appears, use its exact listed action. The rail only helps
            combat. I protect the cattle until a wolf dies;
            then our agreement ends and I return alone. Going north closes LURE, DRIVE, and FORTIFY.
          effects:
            - set_flag: june_combat_line_acknowledged
            - add_journal: "June confirms that the fallen paling-rail only helps combat during HUNT. Going north chooses HUNT and closes other plans; the first wolf death ends her agreement."
          topics:
            - id: leave_june_boundary
              aliases: [cross_to_paling, leave_june]
              prompt: "LEAVE — Do not choose HUNT yet. Going north permanently chooses HUNT; Cade's other plans stay open until then."
              end: true
        - id: june_cattle_terms_confirmed
          npc_text: >-
            My cattle-first terms already apply. This chooses nothing. Select BACK to return
            to Cade and review LURE, DRIVE, or FORTIFY. North remains blocked until you
            choose a plan or select my displayed HUNT option.
          topics:
            - id: return_to_cade
              aliases: [leave_june_boundary, ask_cade]
              prompt: "BACK — Return to Cade; no plan is chosen and north remains closed."
              end: true
        - id: june_released_before_hunt
          npc_text: >-
            HUNT is chosen, and our agreement remains intact. I return to Albany now, so you
            lose all my field, cattle, and combat help. LURE, DRIVE, and FORTIFY are closed.
            North is open; you may still use yard preparation and Cade's HUNT tactics.
          effects:
            - set_flag: june_hunt_released
            - set_flag: june_combat_line_acknowledged
            - clear_flag: june_pike_present
            - add_journal: "HUNT is chosen and June returns to Albany with the agreement intact. LURE, DRIVE, and FORTIFY are closed; June provides no field, cattle, or combat help."
          topics:
            - id: leave_after_june_release
              aliases: [cross_to_paling, leave_june]
              prompt: "LEAVE — HUNT is chosen and north is open. Yard preparation remains; June and the other plans do not return."
              end: true

        # LURE: June independently takes the cattle line after the living recovery.
        - id: june_cattle_first
          npc_text: >
            I will not fight the grey leader. I will use my cattle-first authority to calm
            the herd after the failed feed action. Complete LURE yourself.
          effects:
            - set_flag: june_cattle_line_taken
            - dec_var: { name: cattle_alarm, by: 1 }
            - add_journal: "June uses her cattle-first authority and lowers cattle alarm by 1. She will not fight the grey leader."
          topics:
            - id: acknowledge
              aliases: [leave_june, take_cattle_line]
              prompt: "Acknowledge June's decision and face the grey leader."
              end: true

        # DRIVE: the lower swing-gate absorbs only the failed opening's extra beat.
        - id: june_drive_cattle_first
          npc_text: >
            I will brace the lower swing-gate. If the first DRIVE signal failed, I prevent
            the 2 HP Overrun cost and return pack drive to Crisis. If it succeeded, I add
            no benefit. You still must choose 6 HP, two cattle, or the rig.
          effects:
            - set_flag: june_drive_cattle_line_taken
            - set_var: { name: pack_drive, value: 2 }
            - add_journal: "June braces the lower swing-gate. She prevents the 2 HP Overrun cost after a failed DRIVE signal and sets pack drive to Crisis. A successful signal gains no benefit; the crisis priority remains."
          topics:
            - id: acknowledge
              aliases: [leave_june, take_cattle_line]
              prompt: "Acknowledge June's help and choose the DRIVE crisis priority."
              end: true

        # FORTIFY: the lower cattle brace preserves the authored pressure track.
        - id: june_fortify_cattle_first
          npc_text: >
            I will brace the cattle during the sealed-byre dawn watch. After an unstabilized
            failed outer seal at Strained (3) or higher, I prevent the 2 HP cost. I do not
            lower fortification pressure or change your chosen materials.
          variants:
            - when:
                - { has_flag: fortify_cade_terms_accepted }
                - { has_flag: fortify_mobile_crew_stabilized }
              text: >
                The mobile relief crew already stabilized Cade's recovered shutter seam, so
                the dawn watch costs no HP even at Strained (3). My cattle brace adds no HP
                benefit and does not lower fortification pressure. Cade's property remains
                exposed, and Albany's relief seals remain unused.
            - when:
                - { has_flag: fortify_albany_authority_invoked }
                - { has_flag: fortify_mobile_crew_stabilized }
              text: >
                The mobile relief crew already stabilized the recovered Albany seal, so the
                dawn watch costs no HP even at Strained (3). My cattle brace adds no HP benefit
                and does not lower fortification pressure. Cade's property remains protected,
                the public seals are spent, and his refusal stands.
            - when:
                - { has_flag: fortify_cade_terms_accepted }
                - { not_flag: fortify_mobile_crew_stabilized }
                - { has_flag: fortify_outer_seal_failed }
                - { var_gte: { name: fortification_pressure, value: 3 } }
              text: >
                Cade's household shutters are Strained after the unstabilized failed outer seal.
                My cattle brace prevents the 2 HP dawn cost but does not lower fortification
                pressure. Cade's property remains exposed, and Albany's relief seals remain unused.
            - when:
                - { has_flag: fortify_albany_authority_invoked }
                - { not_flag: fortify_mobile_crew_stabilized }
                - { has_flag: fortify_outer_seal_failed }
                - { var_gte: { name: fortification_pressure, value: 3 } }
              text: >
                Albany's relief seals are Strained after the unstabilized failed outer seal.
                My cattle brace prevents the 2 HP dawn cost but does not lower fortification
                pressure. Cade's property remains protected, the public seals are spent, and
                his refusal stands.
            - when:
                - { has_flag: fortify_cade_terms_accepted }
                - { not_flag: fortify_mobile_crew_stabilized }
                - { var_lte: { name: fortification_pressure, value: 2 } }
              text: >
                Cade's household shutters are at Hammering (2), so the dawn watch already
                costs no HP. My cattle brace adds no HP benefit and does not lower fortification
                pressure. Cade's property remains exposed, and Albany's relief seals remain unused.
            - when:
                - { has_flag: fortify_albany_authority_invoked }
                - { not_flag: fortify_mobile_crew_stabilized }
                - { var_lte: { name: fortification_pressure, value: 2 } }
              text: >
                Albany's relief seals are at Hammering (2), so the dawn watch already costs
                no HP. My cattle brace adds no HP benefit and does not lower fortification
                pressure. Cade's property remains protected, the public seals are spent, and
                his refusal stands.
          effects:
            - set_flag: june_fortify_cattle_line_taken
            - add_journal: "June braces the cattle. At Strained (3) or higher after an unstabilized failed outer seal, she prevents 2 HP loss. A stabilized seal or Hammering (2) already costs no HP. Fortification pressure does not change."
          topics:
            - id: acknowledge
              aliases: [leave_june, take_cattle_line]
              prompt: "Acknowledge June's help and begin the sealed-byre dawn watch."
              end: true

enemies:
  # The fair three-fight gauntlet (combat_guaranteed). Each available opening
  # MANEUVER replaces ordinary ATTACK; if its target survives, its authored shallow
  # `after` child is the required next beat. Only after that full line (or when no
  # opening was earned) can ATTACK be the fallback. Every beat is a real combat round:
  # the player deals d6 + effective attack -
  # wolf.defense (min 1), and the wolf, if it survives, deals d6 + wolf.attack -
  # effective player defense (min 1). Maneuver bonuses last for that round only;
  # the player always strikes first.
  #
  # Tuned so the fully-prepared hunter (best reachable stats: atk 7 from Cade's counsel,
  # def 5 from the byre-jerkin, hp 30) survives the WHOLE three-fight gauntlet on the
  # WORST rolls — the property combat_guaranteed promises. Complete authored lines are:
  #   - yearling (hp11/atk4/def2): set + drive costs 5.
  #   - flank-wolf (hp12/atk5/def2): funnel + pin 3; funnel + saved stake 7;
  #     off-side + return 9; recovered splinter guard + hook 4; loft drop + finish 5.
  #   - grey leader (hp13/atk6/def2): wait + true rush 4; close + drive 10;
  #     earned stake crossbrace + turn 2; saved split guard + finish 6.
  # The generic validator intentionally does not infer that the flags granting these
  # tactics correlate with the best stat ceilings. Its abstract no-lesson assignment
  # retains the standard leader cost, so the conservative static sum remains
  # 5 + 9 + 14 = 28 < 30. The concrete fully-prepared proof keeps the original six
  # flank/leader route costs at 12/18/18/24/13/19, leaving 18/12/12/6/17/11 HP.
  # The linked saved-stake route costs 5 + 7 + 2 = 14 on all-worst rolls and leaves
  # 16 HP. Saving a split guard through the loft costs 5 + 5 + 6 = 16 and leaves 14;
  # the maximum across every route therefore remains 24 damage.
  # BOTH persistent prep buffs remain load-bearing in concrete worst-roll play:
  # without Cade's attack, the riskiest full line costs 39; without the jerkin,
  # the riskiest costs exactly 30. The tactics therefore preserve Cade's honest
  # "both" promise instead of smuggling safety into a partially prepared route.
  # Skipping the prep makes it a real gamble: under base stats (atk5/def3) and worst
  # rolls the pack pulls the hunter down, so the death ending stays genuinely reachable
  # for the under-armed and unlucky — the guarantee covers only the BEST-prepared hunter
  # (bug_0114). All three wolves are telegraphed in the room prose (never an ambush,
  # bug_0123); a fall is save-recoverable (§8.7).
  - id: yearling_wolf
    name: "yearling wolf"
    description: "The yearling wolf blocks the Broken Paling. It attacks low and directly."
    room: paling_gap
    conditions:
      - { not_flag: yearling_redirected }
      - { not_flag: drive_yearling_turned }
      - any_of:
          - { not_flag: strategy_lure_committed }
          - { has_flag: lure_trail_fouled }
      - { not_flag: strategy_combat_withheld }
    hp: 11
    attack: 4
    defense: 2
    defeat_flag: yearling_down
    death_ending: ending_pulled_down
    # The first fight teaches the two-beat surface with a readable, forgiving set
    # and drive. Neither temporary bonus enters persistent stats or the score economy.
    maneuvers:
      - id: commit_hybrid_strike
        command: "make a guarded strike and abandon the living recovery"
        conditions:
          - { has_item: relief_spear }
          - { has_flag: strategy_lure_committed }
          - { has_flag: lure_trail_fouled }
          - { not_flag: lure_hybrid_combat_entered }
        result_flag: lure_hybrid_combat_entered
        attack_bonus: 0
        defense_bonus: 1
        narration: >
          You attack the yearling wolf and choose LURE's combat route. Every nonlethal
          yearling recovery is now closed. If it survives, ATTACK yearling wolf until it is
          dead. Once it is dead, carry the remaining feed deeper.
      - id: set_spear
        command: "set the Albany relief spear against the yearling's rush"
        conditions: [{ has_item: relief_spear }, { not_flag: strategy_lure_committed }]
        result_flag: yearling_spear_set
        attack_bonus: 2
        defense_bonus: 0
        narration: >
          You set the Albany relief spear against the yearling wolf's attack. While wearing
          the padded byre-jerkin, the shown follow-up is DRIVE the set spear through the
          yearling's committed rush; without it, the shown follow-up is DRIVE the set spear
          behind the ash shaft. Use that follow-up only if the yearling survives; an opening
          kill keeps both DRIVE actions closed.
      - id: drive_set_spear
        command: "drive the set spear through the yearling's committed rush"
        after: set_spear
        conditions:
          - { has_item: relief_spear }
          - { not_flag: strategy_lure_committed }
          - { has_flag: jerkin_donned }
        result_flag: yearling_spear_driven
        attack_bonus: 0
        defense_bonus: 1
        narration: >
          You drive the set Albany relief spear through the yearling wolf. The padded
          byre-jerkin protects you during the attack.
      - id: drive_set_spear_unarmored
        command: "drive the set spear behind the ash shaft"
        after: set_spear
        conditions:
          - { has_item: relief_spear }
          - { not_flag: strategy_lure_committed }
          - { none_of: [{ has_flag: jerkin_donned }] }
        result_flag: yearling_spear_driven_unarmored
        attack_bonus: 0
        defense_bonus: 1
        narration: >
          You drive the set Albany relief spear through the yearling wolf. You are not
          wearing the padded byre-jerkin, so no armor protects you during the attack.
    on_defeat:
      - add_journal: "The yearling wolf is dead at the Broken Paling."
      - set_flag: june_blood_condition_broken
      - inc_var: { name: score, by: 10 }
      # Milestone: the breach is held (quest the_watch). Progress-tracking only — the way
      # north still gates on the yearling_down FLAG, not on this stage; nothing changes.
      - set_quest_stage: { quest: the_watch, stage: breach_held }
  - id: flank_wolf
    name: "flank-wolf"
    description: "The flank-wolf blocks the Byre Door and circles toward your unguarded side."
    room: byre_door
    conditions:
      - { not_flag: flank_redirected }
      - { not_flag: drive_flank_turned }
      - { not_flag: strategy_lure_committed }
      - { not_flag: strategy_combat_withheld }
    hp: 12
    attack: 5
    defense: 2
    defeat_flag: flank_wolf_down
    death_ending: ending_pulled_down
    # The second fight cashes in environmental preparation, recovered failure, Cade's
    # attack lesson, Hayden's certified frost report, or an approach physically earned
    # through the fodder-loft. Each root retires the other roots; the funnel offers
    # reliable pin or riskier stake salvage. The split guard can be spent here, or a
    # loft/off-side line can carry it past this fight for the grey leader. Hayden's
    # high-variance brace line instead requires deliberately leaving that guard unbound.
    maneuvers:
      - id: funnel_thrust
        command: "hold the flank-wolf in the braced breach's funnel"
        conditions:
          - { has_item: relief_spear }
          - { not_flag: strategy_lure_committed }
          - { has_flag: breach_braced }
          - { none_of: [{ visited: fodder_loft }] }
        result_flag: flank_funneled
        attack_bonus: -1
        defense_bonus: 3
        narration: >
          You hold the flank-wolf in the braced fallen paling-rail's funnel. PIN the
          flank-wolf against the braced rail for the stronger attack, or WRENCH the paling's
          brace-stake free behind the spear guard for a weaker attack that saves the stake.
      - id: pin_at_rail
        command: "pin the flank-wolf against the braced rail"
        after: funnel_thrust
        conditions: [{ has_item: relief_spear }, { not_flag: strategy_lure_committed }]
        result_flag: flank_pinned_at_rail
        attack_bonus: 1
        defense_bonus: 0
        narration: >
          You pin the flank-wolf against the braced fallen paling-rail and attack with the
          Albany relief spear.
      - id: wrench_brace_stake
        command: "wrench the paling's brace-stake free behind the spear guard"
        after: funnel_thrust
        conditions:
          - { has_item: relief_spear }
          - { not_flag: strategy_lure_committed }
          - { not_item: saved_brace_stake }
        result_flag: flank_brace_stake_saved
        attack_bonus: 0
        defense_bonus: 2
        resource_effects:
          - add_item: saved_brace_stake
        narration: >
          You save the brace-stake for the grey leader and make a weaker attack against the
          flank-wolf. If it survives, ATTACK flank-wolf.
      - id: offside_cut
        command: "wheel into the flank-wolf's off-side cut"
        conditions:
          - { has_item: relief_spear }
          - { not_flag: strategy_lure_committed }
          - { has_flag: heard_counsel }
          - { none_of: [{ visited: fodder_loft }] }
        result_flag: flank_offside_cut
        attack_bonus: 3
        defense_bonus: -3
        narration: >
          You wheel into the flank-wolf's off-side attack. This fast attack leaves your
          guard open. If it survives, TURN through the flank-wolf's returning stroke.
      - id: turn_through_return
        command: "turn through the flank-wolf's returning stroke"
        after: offside_cut
        conditions: [{ has_item: relief_spear }, { not_flag: strategy_lure_committed }]
        result_flag: flank_turned_through_return
        attack_bonus: 0
        defense_bonus: 1
        narration: >
          You turn the Albany relief spear through the flank-wolf's return attack and
          recover your guard.
      - id: frost_brace_trip
        command: "trip Hayden's frost-jammed brace across the flank-wolf's turn"
        conditions:
          - { has_item: relief_spear }
          - { not_flag: strategy_lure_committed }
          - { has_flag: hayden_frost_report_certified }
          - { has_flag: rail_split }
          - { not_flag: split_rail_guard_made }
          - { not_item: split_rail_guard }
          - { none_of: [{ visited: fodder_loft }] }
        result_flag: flank_frost_brace_tripped
        attack_bonus: 4
        defense_bonus: -2
        narration: >
          You trip Hayden's frost-jammed door-brace with the bare Albany relief spear. The
          brace pins the flank-wolf, but your guard is open. If it survives, DRIVE Hayden's
          fallen brace through the checked flank-wolf.
      - id: fallen_brace_drive
        command: "drive Hayden's fallen brace through the checked flank-wolf"
        after: frost_brace_trip
        conditions:
          - { has_item: relief_spear }
          - { not_flag: strategy_lure_committed }
          - { has_flag: hayden_frost_report_certified }
          - { has_flag: rail_split }
          - { not_flag: split_rail_guard_made }
          - { not_item: split_rail_guard }
          - { none_of: [{ visited: fodder_loft }] }
        result_flag: flank_fallen_brace_driven
        attack_bonus: -1
        defense_bonus: 2
        narration: >
          You drive Hayden's fallen door-brace through the flank-wolf with the bare Albany
          relief spear.
      - id: drop_from_loft
        command: "drive from the fodder-loft drop behind the flank-wolf"
        conditions:
          - { has_item: relief_spear }
          - { not_flag: strategy_lure_committed }
          - { visited: fodder_loft }
        result_flag: flank_dropped_from_loft
        attack_bonus: 2
        defense_bonus: 1
        narration: >
          You drop from the Fodder-Loft behind the flank-wolf and attack with the Albany
          relief spear. Your guard is open after the drop.
      - id: splinter_guard
        command: "catch the flank-wolf's turn on the bound splinter guard"
        conditions:
          - { has_item: relief_spear }
          - { not_flag: strategy_lure_committed }
          - { has_item: split_rail_guard }
          - { none_of: [{ visited: fodder_loft }] }
        result_flag: flank_splinter_guarded
        attack_bonus: 0
        defense_bonus: 2
        narration: >
          The split-rail guard blocks the flank-wolf's attack. Next, HOOK the spear over
          the breaking splinter guard; the guard will break.
      - id: hook_over_guard
        command: "hook the spear over the breaking splinter guard"
        after: splinter_guard
        conditions:
          - { has_item: relief_spear }
          - { not_flag: strategy_lure_committed }
          - { has_item: split_rail_guard }
        result_flag: flank_hooked_over_guard
        attack_bonus: 0
        defense_bonus: 1
        resource_effects:
          - remove_item: split_rail_guard
        narration: >
          You hook the Albany relief spear over the split-rail guard and attack the
          flank-wolf. The guard breaks and is spent.
    on_defeat:
      - add_journal: "The flank-wolf is dead at the Byre Door."
      - set_flag: june_blood_condition_broken
      - inc_var: { name: score, by: 10 }
      # Milestone: the threshold is held (quest the_watch). Progress-tracking only — the
      # way north still gates on the flank_wolf_down FLAG, not on this stage.
      - set_quest_stage: { quest: the_watch, stage: threshold_held }
  - id: grey_leader
    name: "grey leader"
    description: "The grey leader blocks the cattle. It uses a feint before its real attack."
    room: byre_mouth
    conditions:
      - { not_flag: leader_redirected }
      - { not_flag: drive_flank_turned }
      - { not_flag: strategy_lure_committed }
      - { not_flag: strategy_combat_withheld }
    hp: 13
    attack: 6
    defense: 2
    defeat_flag: leader_down
    death_ending: ending_pulled_down
    # The leader cashes out Cade's two answers, the brace-stake earned at the door, or
    # a split guard deliberately carried past the flank-wolf by taking the loft/off-side
    # risk. Every carried guard is consumed on commitment, including an opening kill.
    # Only after an authored child can plain ATTACK return for an underpowered survivor.
    maneuvers:
      - id: crossbrace_saved_stake
        command: "set the saved brace-stake across the spear against the grey leader"
        conditions:
          - { has_item: relief_spear }
          - { not_flag: strategy_lure_committed }
          - { has_item: saved_brace_stake }
        result_flag: leader_stake_crossbraced
        attack_bonus: 0
        defense_bonus: 5
        narration: >
          The saved brace-stake blocks the grey leader's attack. Next, TURN the grey leader
          over the committed crossbrace; the stake will break.
      - id: turn_over_crossbrace
        command: "turn the grey leader over the committed crossbrace"
        after: crossbrace_saved_stake
        conditions:
          - { has_item: relief_spear }
          - { not_flag: strategy_lure_committed }
          - { has_item: saved_brace_stake }
        result_flag: leader_turned_over_crossbrace
        attack_bonus: 1
        defense_bonus: 0
        resource_effects:
          - remove_item: saved_brace_stake
        narration: >
          You turn the grey leader over the saved brace-stake and attack with the Albany
          relief spear. The stake breaks and is spent.
      - id: set_split_guard
        command: "set the saved split-rail guard across the grey leader's rush"
        conditions:
          - { has_item: relief_spear }
          - { not_flag: strategy_lure_committed }
          - { has_item: split_rail_guard }
        result_flag: leader_split_guard_set
        attack_bonus: 2
        defense_bonus: 1
        resource_effects:
          - remove_item: split_rail_guard
        narration: >
          The split-rail guard blocks the grey leader's attack while the Albany relief
          spear strikes. The guard breaks and is spent.
      - id: wait_out_feint
        command: "hold the spear point and wait out the grey leader's feint"
        conditions:
          - { has_item: relief_spear }
          - { not_flag: strategy_lure_committed }
          - { has_flag: heard_plan }
        result_flag: leader_waited_out
        attack_bonus: 0
        defense_bonus: 3
        narration: >
          You wait through the grey leader's feint. Next, TAKE the grey leader's true rush
          on the held spear.
      - id: take_true_rush
        command: "take the grey leader's true rush on the held spear"
        after: wait_out_feint
        conditions: [{ has_item: relief_spear }, { not_flag: strategy_lure_committed }]
        result_flag: leader_true_rush_taken
        attack_bonus: 1
        defense_bonus: 0
        narration: >
          You take the grey leader's real attack on the held Albany relief spear and strike back.
      - id: close_on_feint
        command: "close before the grey leader can finish her feint"
        conditions:
          - { has_item: relief_spear }
          - { not_flag: strategy_lure_committed }
          - { has_flag: heard_counsel }
        result_flag: leader_closed_on
        attack_bonus: 4
        defense_bonus: -3
        narration: >
          You close during the grey leader's feint and attack with the Albany relief spear.
          This fast attack leaves your guard open. If it survives, DRIVE again before the
          grey leader can recover.
      - id: drive_before_recovery
        command: "drive again before the grey leader can recover"
        after: close_on_feint
        conditions: [{ has_item: relief_spear }, { not_flag: strategy_lure_committed }]
        result_flag: leader_driven_before_recovery
        attack_bonus: 0
        defense_bonus: 1
        narration: >
          You drive the Albany relief spear again before the grey leader recovers, then
          recover your guard.
    on_defeat:
      - add_journal: "The grey leader is dead. The cattle beyond it are unhurt."
      - set_flag: june_blood_condition_broken
      - inc_var: { name: score, by: 10 }
      # Milestone: the byre is held (quest the_watch) — the last of the three down. Progress
      # tracking only; the cattle-stand win still gates on the leader_down FLAG, not on this.
      - set_quest_stage: { quest: the_watch, stage: byre_held }

win_conditions:
  # Locomotion win, like the Beacon (visited: beacon_crown) and cold_forge (ember_chamber):
  # reaching the cattle — only possible once all three wolves are down (the chained exit
  # gates) — fires the win via the engine's post-action checkWin. SCORE_PEAKS_BEFORE_WIN
  # does not fire on a navigation win (bug_0116), and the +15 capstone is the accepted
  # denouement-step (sealed_crypt seed 29 / dawn_beacon).
  # Specific terminal consequences precede the generic mission result. All award the
  # same score and remain nondeath; their ids/titles let the overworld completion journal
  # remember whether saved wood barred the herd now or was carried into dawn for repair.
  - id: bloodied_byre_evacuated
    conditions:
      - { has_flag: bloodied_byre_evacuated }
      - { has_flag: yearling_down }
      - { has_flag: flank_wolf_down }
      - { not_flag: leader_down }
      - { not_flag: leader_redirected }
    ending: ending_bloodied_byre_evacuated
    ending_overrides:
      - conditions: [{ has_flag: june_hunt_released }]
        ending: ending_bloodied_byre_evacuated_june_released
  - id: fortify_outlast_cade_terms
    conditions:
