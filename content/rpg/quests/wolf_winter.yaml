        text: >
          Victory: The whole herd survives, and all three wolves are dead. You used the
          Fodder-Loft drop against the flank-wolf, WAITED through the grey leader's feint,
          and used the split-rail guard to BAR the inner cattle-gate. June had already
          returned to Albany after you released her from HUNT; your agreement remains intact, but
          she provided no field aid. *** You have won. ***
      - when:
