  # Beat one: one Repair check, with Reese's prepared Works marks lowering DC 14 to 12.
  # Both roll outcomes retire behind `fortify_outer_seal_attempted`; each failed stance
  # exposes exactly one deterministic recovery instead of another check.
  - id: fortify_outer_seal
    name: "outer fortification frame"
    aliases: [outer seal, paling seal, seal frame, outer frame]
    description: >
      Complete the exact item-on-frame SEAT action shown. It makes one Repair check. After
      failure, ACCEPT Cade's offered bracing hand, or BIND authority emergency binding
      WITH Albany relief seal roll, depending on the chosen materials.
    variants:
      - when:
          - { has_flag: fortify_outer_seal_failed }
          - { has_flag: fortify_cade_terms_accepted }
          - { not_flag: fortify_outer_sealed }
        text: >
          The Repair attempt failed and cannot be retried. ACCEPT Cade's offered bracing
          hand to finish the outer seal. The failed result and added pressure remain.
      - when:
          - { has_flag: fortify_outer_seal_failed }
          - { has_flag: fortify_albany_authority_invoked }
          - { not_flag: fortify_outer_sealed }
        text: >
          The Repair attempt failed and cannot be retried. BIND authority emergency
          binding WITH Albany relief seal roll to finish the outer seal. Cade will not
          help. The failed result and added pressure remain; the emergency strip will be spent.
      - when:
          - { has_flag: opening_condition_sound_lower_frame }
          - { not_flag: fortify_outer_seal_attempted }
        text: >
          Complete the shown item-on-frame SEAT action without a Repair check. The sound
          lower frame guarantees success. Your chosen materials still determine property
          damage, public stock use, and Cade's help. The threshold seal and dawn watch remain.
      - when:
          - { has_flag: relief_oath_full_duty }
          - { has_flag: fortify_albany_authority_invoked }
          - { has_flag: works_fortification_prepared }
          - { not_flag: fortify_outer_seal_attempted }
        text: >
          SEAT Albany relief seal roll ON outer fortification frame. This makes a Repair
          check (DC 10 instead of 12). Rowan's
          full-duty annex and Reese's Works marks lower the difficulty. Failure raises
          pressure and requires the authority emergency binding; Cade will not help.
      - when:
          - { has_flag: relief_oath_full_duty }
          - { has_flag: fortify_albany_authority_invoked }
          - { not_flag: works_fortification_prepared }
          - { not_flag: fortify_outer_seal_attempted }
