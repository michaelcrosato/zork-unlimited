      emergency strip and completes the seal without another Repair check. Cade will not
      help, and the failed check's added fortification pressure remains.
    visible_when:
      - { has_flag: fortify_albany_authority_invoked }
      - { has_flag: fortify_outer_seal_failed }
      - { not_flag: fortify_outer_sealed }
