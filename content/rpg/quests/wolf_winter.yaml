# The Wolf-Winter — a Stage 4 (Hero's-Quest) pack (spec §13, §14 gate).
#
# The game's FOURTH RPG pack, and the SECOND to set `meta.combat_guaranteed: true`
# (after The Dawn Beacon, bug_0187). Where the Beacon is a TWO-fight guaranteed
# gauntlet, this is a THREE-fight one — the first curated pack to stress the
# cumulative-HP gauntlet bound (`COMBAT_GAUNTLET_NOT_GUARANTEED`, bug_0172) across
# three sequential fights. The cumulative bound is the distinctive RPG guarantee
# surface: each fight can clear the per-fight upper bound alone yet the sequence
# still fell a prepared player on worst cumulative rolls, and a third fight makes
# that surface strictly harder to satisfy. Here BOTH prep buffs are load-bearing on
# the cumulative bound specifically — drop either and the gauntlet stops being
# jointly survivable while every single fight still passes in isolation (see the
# enemies block and tests/regression/wolf_winter_three_fight_gauntlet.test.ts).
#
# The fiction earns the mechanic the same way the Beacon does: not luck but skill
# and preparation decide the fights, so the promise can be honest. A killing winter
# has driven a wolf-pack down out of the high wood onto a lone steading, and three of
# them have come over the broken paling at the byre where the last of the cattle —
# the family's whole winter — are penned. You arrive as Albany's relief rider with the
# relief packet's ash spear already in hand; the old houndsman by the byre door can no
# longer hold a weapon himself. He has run wolves off this steading for forty winters and there is nothing
# about how a wolf comes in that he does not know; heed him (where the rush leaves the throat open,
# +2 attack) AND pull on the padded byre-jerkin from the store (a wolf's teeth ring off
# the layered hide, +2 defense) and he can make a true promise: "speared right and
# padded, lad, no wolf in that pack will pull you down." That promise is the
# combat_guaranteed flag spoken aloud, honest because the validator proves it — atk7,
# def5, hp30, the player's WORST rolls, and the three of them still cannot bring you
# down across the whole night. Skip the prep and it is a real gamble again: under-armed
# and unlucky the pack pulls you under the byre door (the death ending stays reachable),
# the guarantee covering only the BEST-prepared hunter, exactly as bug_0114 defines it.
#
#   steading_yard ─N─ byre_yard (houndsman; day-book +5)
#   (start)            │ W: store (padded byre-jerkin, +2 defense)
#                      │      │ U: fodder_loft ── one-way tactical drop ───────┐
#                      │ N: paling_gap (the yearling wolf — FIGHT 1)           │
#                           │ N*: byre_door (the flank-wolf — FIGHT 2) ◀──────┘
#                                │ N*: byre_mouth (the grey leader — FIGHT 3)
#                                     │ N*: cattle_stand (the pack breaks at dawn — WIN, +15)
#   (* each gated on the prior wolf being put down)
#
# Score (max 60): read the day-book the houndsman keeps (+5, the §17 clue that names the
# pack and points at the jerkin and his counsel), HEED old Cade's counsel (+5) and DON the
# byre-jerkin (+5) — the two load-bearing prep acts the day-book and Cade both press —, put
# down each of the three wolves (+10 each), and reach the cattle with the pack broken
# (+15 — the locomotion win, like cold_forge's ember chamber and the Beacon's crown). The
# perfect 60 coincides with reaching the safe cattle, never before; SCORE_PEAKS_BEFORE_WIN
# does not fire on a navigation win (bug_0116).
#
# bug_0239 — the prep acts now SCORE (+5 each), deliberately breaking from the 50-point
# milestone economy the other curated RPG packs share. A 2026-06-04 blind playtest found
# the prepared and reckless lines scored almost the same (50 vs 45 — only the day-book's
# +5 apart): preparation bought an HP cushion but almost no SCORE, so the diligence old
# Cade's promise sells, and the whole fiction of heeding-and-arming, carried no score
# signal. Tying +5 to each of the two prep flags (heard_counsel, jerkin_donned) aligns the
# score economy with the "do both" advice: the prepared hunter scores the full 60, the
# reckless rush still wins but tops out at 45 (a real 15-point diligence gap), and the
# bug_0114 fairness guarantee, the cumulative-gauntlet combat tuning, and the death ending
# are all BYTE-UNCHANGED (the awards add score only, never a stat or combat consequence).

meta:
  id: wolf_winter_v1
  title: "The Wolf-Winter"
  start_room: steading_yard
  vars_init: { hp: 30, attack: 5, defense: 3, fieldcraft: 0, repair: 0, streetwise: 0, mediation: 0, cattle_alarm: 0, pack_drive: 0, drive_kit_charges: 0, fortification_pressure: 0 }
  flags_init: []
  seeded_opening_flags:
    - opening_condition_firm_frozen_rail
    - opening_condition_steady_scent_channel
    - opening_condition_open_ash_lane
    - opening_condition_sound_lower_frame
  # The opt-in fairness promise (bug_0114). With this set the validator proves the
  # per-fight UPPER bound for every wolf AND the cumulative-HP bound across the whole
  # three-fight gauntlet (bug_0172): with the hunter's BEST reachable stats (init + the
  # houndsman's +2 attack + the byre-jerkin's +2 defense = atk7/def5/hp30) but the
  # WORST rolls, total damage across all three fights must stay below reachable HP.
  # The conservative validator still admits an abstract best-stat state with neither
  # lesson flag and therefore a standard leader line: 5 + 9 + 14 = 28 < 30. The
  # concrete runtime proof drives the six original fully-prepared sequence pairs, the
  # earned brace-stake route, and the loft/saved-guard route on worst rolls; maximum
  # live damage remains 24.
  # See the enemies block.
  # Base-stat play (no counsel, no jerkin) can still die.
  combat_guaranteed: true
  # The economy: 5 + 5 + 5 + 10 + 10 + 10 + 15 = 60 (bug_0239 — the two prep acts now
  # score +5 each; see the header). Each award rides a beat that fires ONCE (the read
  # retires on read_tally; the counsel on heard_counsel; the don on jerkin_donned; each
  # wolf dies once; the cattle is the game-ending win), so the score cannot be farmed and
  # the fully-prepared path reaches exactly 60 (rpg_score_economy_sound proves it).
  max_score: 60

# The same public pressure grammar can be reused by any RPG pack. Wolf-Winter's
# lure route raises cattle alarm only at authored commitments; it is not an
# invisible turn clock. A clean three-beat diversion ends at 3 (restless), while
# a fouled opening reaches 4 (breaking) and carries a visible cattle loss into
# the ending and Albany campaign state.
pressure_tracks:
  - id: cattle_alarm
    title: "Cattle alarm"
    var: cattle_alarm
    bands:
      - min: 0
        label: "Steady"
        description: "The whole herd is together. No cattle are missing."
      - min: 2
        label: "Restless"
        description: "The herd is restless, but no cattle are missing."
      - min: 4
        label: "Breaking: cattle missing"
        description: "The herd has scattered. Cattle are missing."
  - id: pack_drive
    title: "Pack drive"
    var: pack_drive
    bands:
      - min: 0
        label: "Unraised"
        description: "No DRIVE signal has moved the wolves."
      - min: 1
        label: "Moving"
        description: "The first DRIVE signal moved the wolves outside. Next, CAST byre rope-and-bell line WITH Cade's two-charge signal-and-rope rig."
      - min: 2
        label: "Crisis"
        description: "Follow the currently displayed DRIVE action. It shows either the open crisis choice or the evacuation already chosen."
      - min: 3
        label: "Overrun"
        description: "The failed drive shutter signal caused Overrun. If June is still helping, hear her decision. Otherwise, BRACE overrun swing-gate brace and lose 2 HP before choosing a crisis priority."
      - min: 6
        label: "Cleared"
        description: "Evacuation is complete. The wolves are separated from the people and herd. Its wound, cattle loss, or spent rig cannot be undone."
  - id: winter_siege
    title: "Winter siege"
    var: fortification_pressure
    bands:
      - min: 0
        label: "Unsealed"
        description: "No FORTIFY seal was raised around the byre. This band does not describe the wolves' current state."
      - min: 1
        label: "Testing"
        description: "The outer seal is holding. The byre threshold seal is the next task."
      - min: 2
        label: "Hammering"
        description: "The wolves are striking the seals. Follow the currently shown FORTIFY action; completed seals and recoveries stay complete. Once the threshold is sealed, begin the shown sealed-byre dawn watch."
      - min: 3
        label: "Strained"
        description: "A failed outer seal increased the strain. The dawn watch costs 2 HP unless an uninjured June braces the cattle. A mobile relief failure crew prevents that HP loss but gives June no injury benefit."
      - min: 6
        label: "Outlasted"
        description: "Dawn ends the siege. The living wolves leave the people and whole herd."

rooms:
  - id: steading_yard
    name: "The Steading Yard"
    description: >
      Go north to the byre-yard and protect the cattle until dawn. You arrive with the
      Albany relief spear. Wolves howl in the high wood, and cattle bawl behind the broken
      paling.
    # The yard re-describes itself once visit history proves the player reached the byre.
    # This is reactive prose only — no synthetic watch flag or repeated on-enter event is
    # needed. The pack-diverted case protects historical or injected states already south
    # of the new one-way completion boundary; the locomotion win still waits at cattle_stand.
    variants:
      - when: [{ has_flag: pack_diverted }]
        text: >
          The cattle count is unfinished. Go north through the gate and continue north until you
          stand among the cattle. Cade's final feed cast already drew the living wolves
          into the high wood.
      - when: [{ visited: byre_yard }]
        text: >
          Go north through the gate to the byre-yard and continue the watch. You still
          carry the Albany route tag and relief spear.
      - when:
          - { has_flag: approach_exposed_ridge }
          - { not_flag: approach_sheltered_stockway }
          - { has_flag: june_pike_present }
          - { not_visited: byre_yard }
        text: >
          DESCEND exposed ridge last mile to reach Cade's yard with June Pike. This route makes
          the smoke, wolf breath, and crosswind visible, which can help the first LURE LAY check
          unless Cade identifies a stronger field condition. The cattle saw you and June
          and are pressing the slats.
      - when:
          - { has_flag: approach_exposed_ridge }
          - { not_flag: approach_sheltered_stockway }
          - { not_flag: june_pike_present }
          - { not_visited: byre_yard }
        text: >
          DESCEND exposed ridge last mile to reach Cade's yard. This route makes the smoke,
          wolf breath, and crosswind visible, which can help the first LURE LAY check unless
          Cade identifies a stronger field condition. The cattle saw you and are pressing
          the slats.
      - when:
          - { has_flag: approach_sheltered_stockway }
          - { not_flag: approach_exposed_ridge }
          - { has_flag: june_pike_present }
          - { not_visited: byre_yard }
        text: >
          FOLLOW sheltered stockway last mile to reach Cade's yard unseen with June Pike. The
          hedges keep the herd calm but hide the smoke and crosswind that can help the first
          LURE LAY check. Cade may identify a stronger field condition.
      - when:
          - { has_flag: approach_sheltered_stockway }
          - { not_flag: approach_exposed_ridge }
          - { not_flag: june_pike_present }
          - { not_visited: byre_yard }
        text: >
          FOLLOW sheltered stockway last mile to reach Cade's yard unseen. The hedges keep the
          herd calm but hide the smoke and crosswind that can help the first LURE LAY check.
          Cade may identify a stronger field condition.
      - when: [{ has_flag: june_pike_present }, { not_visited: byre_yard }]
        text: >
          Go north to the byre-yard and protect the cattle until dawn. Road Warden June
          Pike takes the lower stock path under cattle-first authority. She will not fight
          wolves, and her agreement ends after any wolf dies.
    objects: [steading_field_condition, exposed_ridge_last_mile, sheltered_stockway_last_mile]
    exits:
      - direction: north
        to: byre_yard
        conditions:
          - any_of:
              - { visited: byre_yard }
              - all_of:
                  - { not_flag: approach_exposed_ridge }
                  - { not_flag: approach_sheltered_stockway }
        locked_msg: "Choose the single approach named by Hayden's dispatch. You cannot descend while both approach routes are selected."

  - id: byre_yard
    name: "The Byre-Yard"
    description: >
      Before going north, READ day-book and TALK TO old Cade the houndsman to compare
      HUNT, LURE, DRIVE, and FORTIFY. A yearling wolf waits at the broken paling north.
      The Store-Shed is west, and the Steading Yard is south.
    objects:
      [
        day_book,
        relief_protocol_docket,
        drive_signal_rope_kit,
        cade_household_shutters,
        albany_relief_seals,
        byre_field_condition,
      ]
    # Progress variants are ordered from the deepest completed fight back to the opening
    # clue state. Re-entering this hub must describe the wolves actually left alive; visit
    # history alone handles the steading-yard watch prose without emitting repeat state.
    variants:
      - when: [{ has_flag: pack_diverted }]
        text: >
          The cattle count is unfinished. Go north through the broken paling, byre door, and byre
          mouth until you stand among the cattle. South and west are closed. Cade's feed
          drew the living wolves into the high wood.
      - when:
          - { has_flag: june_hunt_released }
          - { not_visited: paling_gap }
        text: >
          Go north alone to begin HUNT. June returned to Albany under your agreement, so
          she gives no field, combat, or cattle bonus. LURE, DRIVE, and FORTIFY are closed.
          You may still use Cade's lessons, store gear, and yard preparation.
      - when:
          - { has_flag: strategy_drive_committed }
          - { not_item: drive_signal_rope_kit }
          - { not_visited: paling_gap }
        text: >
          TAKE Cade's two-charge signal-and-rope rig, then go north. DRIVE is final: HUNT,
          LURE, and FORTIFY are closed. Reading, preparation, and store gear are also
          closed. Moving the herd removes outer defense and retreat.
      - when:
          - { has_flag: strategy_drive_committed }
          - { has_item: drive_signal_rope_kit }
          - { not_visited: paling_gap }
        text: >
          Go north, then FIRE drive shutter signal WITH Cade's two-charge signal-and-rope
          rig. DRIVE is final: HUNT, LURE, and FORTIFY are closed. Reading, preparation,
          store gear, outer defense, and retreat are also closed.
      - when:
          - { has_flag: strategy_lure_committed }
          - { not_item: winter_feed_sack }
          - { not_visited: paling_gap }
        text: >
          Go west and TAKE Cade's winter-feed sack. Go east, then go north and LAY downwind
          feed line WITH Cade's winter-feed sack. The sack became available only after you
          chose LURE.
      - when:
          - { has_flag: relief_protocol_prepared }
          - { has_flag: yearling_redirected_with_split_guard }
          - { not_flag: relief_protocol_attempted }
          - { not_flag: yearling_down }
          - { not_flag: flank_redirected }
        text: >
          CALL Jamie's sealed relief protocol. It can be used once here. Then carry the
          feed west through the Store-Shed and up to the Fodder-Loft. The yearling is alive
          in the high wood, but the cattle are still pressing the slats.
      - when:
          - { has_flag: strategy_lure_committed }
          - any_of:
              - { has_flag: yearling_down }
              - { has_flag: yearling_redirected }
          - { not_flag: flank_redirected }
        text: >
          Go west through the Store-Shed and up to the Fodder-Loft for the second feed
          cast. The north exit does not lead to that cast.
      - when: [{ has_flag: leader_down }]
        text: >
          Go north to the cattle. All three wolves are dead, and the herd is whole. Old
          Cade waits beside the day-book. The Store-Shed is west; the Steading Yard is south.
      - when:
          - { has_flag: strategy_lure_committed }
          - { has_item: winter_feed_sack }
        text: >
          Go north to continue LURE or its shown recovery. HUNT, DRIVE, and FORTIFY are closed.
      - when: [{ has_flag: flank_wolf_down }]
        text: >
          Go north to face the grey leader. The yearling wolf and flank-wolf are dead.
          Old Cade waits beside the day-book. The Store-Shed is west; the Steading Yard is south.
      - when: [{ has_flag: yearling_down }]
        text: >
          Go north to face the flank-wolf at the Byre Door. The yearling wolf is dead,
          and the grey leader waits deeper inside. Old Cade and the day-book are here.
          The Store-Shed is west; the Steading Yard is south.
      - when:
          - { has_flag: opening_condition_firm_frozen_rail }
          - { has_flag: hayden_frost_report_certified }
          - { not_flag: strategy_lure_committed }
          - { not_flag: strategy_drive_committed }
          - { not_flag: strategy_fortify_committed }
          - { not_visited: paling_gap }
        text: >
          Go north to choose HUNT, or first TALK TO old Cade the houndsman. His displayed
          topics compare all four plans. The firm frozen rail lets you BRACE firm-seated paling-rail without a check. It cannot split,
          so Hayden's later frost-jammed door-brace option will not be available. Reese's
          Works packet does not change this. The Store-Shed is west; the gate is south.
      - when:
          - { has_flag: hayden_frost_report_certified }
          - { has_flag: works_fortification_prepared }
          - { not_flag: june_pike_present }
          - { not_flag: strategy_lure_committed }
          - { not_flag: strategy_drive_committed }
          - { not_flag: strategy_fortify_committed }
          - { not_visited: paling_gap }
        text: >
          Going north chooses HUNT and permanently closes LURE, DRIVE, and FORTIFY. First,
          TALK TO old Cade the houndsman to compare all four plans. Reese's Works packet replaces the fallen
          paling-rail check, so Hayden's frost-jammed door-brace option will not be available.
          The yearling wolf is north, the Store-Shed west, and the gate south.
      - when:
          - { has_flag: hayden_frost_report_certified }
          - { not_flag: works_fortification_prepared }
          - { not_flag: june_pike_present }
          - { not_flag: strategy_lure_committed }
          - { not_flag: strategy_drive_committed }
          - { not_flag: strategy_fortify_committed }
          - { not_visited: paling_gap }
        text: >
          Go north to choose HUNT; this permanently closes LURE, DRIVE, and FORTIFY. For
          Hayden's frost-jammed door-brace option, first attempt to BRACE fallen
          paling-rail. If it splits, leave it unbound, ATTACK yearling wolf, and go north
          with the bare Albany relief spear. Skipping the brace or binding a split-rail guard
          closes that option. TALK TO old Cade the houndsman to compare all four plans. The Store-Shed is west.
      - when:
          - { has_flag: june_pike_present }
          - { not_flag: june_blood_condition_broken }
          - { not_flag: june_combat_line_acknowledged }
          - { has_flag: hayden_frost_report_certified }
          - { has_flag: works_fortification_prepared }
          - { not_flag: strategy_lure_committed }
          - { not_flag: strategy_drive_committed }
          - { not_flag: strategy_fortify_committed }
          - { not_visited: paling_gap }
        text: >
          TALK TO Road Warden June Pike, then TALK TO old Cade the houndsman before going north. Going north without Cade's feed sack,
          drive rig, or seals chooses HUNT; any wolf death ends June's agreement. During HUNT,
          the fallen paling-rail can only funnel the yearling for combat. During LURE, it can
          redirect the yearling alive after a failed first LAY action. Reese's Works packet
          closes Hayden's frost-jammed door-brace option. The Store-Shed is west.
      - when:
          - { has_flag: june_pike_present }
          - { not_flag: june_blood_condition_broken }
          - { not_flag: june_combat_line_acknowledged }
          - { has_flag: hayden_frost_report_certified }
          - { not_flag: works_fortification_prepared }
          - { not_flag: strategy_lure_committed }
          - { not_flag: strategy_drive_committed }
          - { not_flag: strategy_fortify_committed }
          - { not_visited: paling_gap }
        text: >
          TALK TO Road Warden June Pike, then TALK TO old Cade the houndsman before going north. Going north without Cade's feed sack,
          drive rig, or seals chooses HUNT; any wolf death ends June's agreement. For Hayden's
          frost-jammed door-brace option, attempt to BRACE fallen paling-rail during HUNT.
          If it splits, leave it unbound, ATTACK yearling wolf, and go north with the bare
          Albany relief spear. The Store-Shed is west.
      - when:
          - { has_flag: june_pike_present }
          - { not_flag: june_blood_condition_broken }
          - { not_flag: june_combat_line_acknowledged }
          - { not_flag: strategy_lure_committed }
          - { not_flag: strategy_drive_committed }
          - { not_flag: strategy_fortify_committed }
          - { not_visited: paling_gap }
        text: >
          TALK TO Road Warden June Pike, then TALK TO old Cade the houndsman before going north. Going north without Cade's feed sack,
          drive rig, or seals chooses HUNT; any wolf death ends June's agreement. During HUNT,
          the fallen paling-rail can only funnel the yearling for combat. During LURE, it can
          redirect the yearling alive after a failed first LAY action. The Store-Shed is west.
      # The ordinary no-June entry must name the same irreversible choice the optional
      # June gate speaks aloud. A first visit to the paling retires all three Cade topics,
      # so this warning is deliberately before both the north exit and the generic tally prose.
      - when:
          - { not_flag: june_pike_present }
          - { not_flag: strategy_lure_committed }
          - { not_flag: strategy_drive_committed }
          - { not_flag: strategy_fortify_committed }
          - { not_flag: read_tally }
          - { not_visited: paling_gap }
        text: >
          READ day-book and TALK TO old Cade the houndsman before going north. Going north now chooses
          HUNT and permanently closes LURE, DRIVE, and FORTIFY. The yearling wolf is north,
          the Store-Shed west, and the gate south.
      - when:
          - { not_flag: june_pike_present }
          - { not_flag: strategy_lure_committed }
          - { not_flag: strategy_drive_committed }
          - { not_flag: strategy_fortify_committed }
          - { has_flag: read_tally }
          - { not_visited: paling_gap }
        text: >
          You read the wolf count. TALK TO old Cade the houndsman to compare HUNT, LURE, DRIVE, and FORTIFY,
          or go north to choose HUNT and permanently close the other three plans. The
          yearling wolf is north, the Store-Shed west, and the gate south.
      - when: [{ has_flag: read_tally }, { not_flag: strategy_fortify_committed }]
        text: >
          The yearling wolf waits at the broken paling north, with two wolves deeper by
          the cattle. You already read the day-book. Old Cade is here, the Store-Shed is
          west, and the gate is south.
      - when: [{ has_flag: fortify_cade_terms_accepted }]
        text: >
          Carry Cade's two household shutters north; TAKE Cade's two household shutters only if still offered.
          Then SEAT Cade's two household shutters ON outer fortification frame, SET
          Cade's two household shutters ON byre threshold seal, and HOLD sealed-byre
          dawn watch. Cade's property is exposed, but Albany's relief seals are preserved.
          Retreat, preparation, HUNT, LURE, and DRIVE are closed.
      - when: [{ has_flag: fortify_albany_authority_invoked }]
        text: >
          Carry the Albany relief seal roll north; TAKE Albany relief seal roll only if still offered.
          Then SEAT Albany relief seal roll ON outer fortification frame, SET
          Albany relief seal roll ON byre threshold seal, and HOLD sealed-byre dawn
          watch. Cade's property stays protected, but both public seals will be spent and
          Cade will not help after a failed seal check.
          Retreat, preparation, HUNT, LURE, and DRIVE are closed.
    exits:
      - direction: south
        to: steading_yard
        conditions:
          - { not_flag: strategy_drive_committed }
          - { not_flag: strategy_fortify_committed }
          - { not_flag: pack_diverted }
        locked_msg: "South is closed. After LURE, go north for the cattle count. During DRIVE or FORTIFY, complete the currently displayed gear action, then go north."
      - direction: west
        to: store
        conditions:
          - { not_flag: strategy_drive_committed }
          - { not_flag: strategy_fortify_committed }
          - { not_flag: pack_diverted }
        locked_msg: "West is closed. After LURE, go north for the cattle count. During DRIVE or FORTIFY, complete the currently displayed gear action, then go north."
      - direction: north
        to: paling_gap
        conditions:
          - any_of:
              - all_of:
                  - { not_flag: strategy_lure_committed }
                  - { not_flag: strategy_drive_committed }
                  - { not_flag: strategy_fortify_committed }
              - all_of:
                  - { has_flag: strategy_drive_committed }
                  - any_of:
                      - { has_item: drive_signal_rope_kit }
                      - { has_flag: drive_reserve_spent }
              - all_of:
                  - { has_flag: strategy_fortify_committed }
                  - any_of:
                      - { has_item: cade_household_shutters }
                      - { has_item: albany_relief_seals }
              - all_of:
                  - { has_item: winter_feed_sack }
                  - { not_flag: yearling_down }
                  - { not_flag: yearling_redirected }
              - { has_flag: flank_redirected }
          - any_of:
              - { not_flag: june_pike_present }
              - { has_flag: june_combat_line_acknowledged }
              - { has_flag: june_blood_condition_broken }
              - { has_flag: strategy_lure_committed }
              - { has_flag: strategy_drive_committed }
              - { has_flag: strategy_fortify_committed }
        locked_msg: "North is blocked. Before HUNT, TALK TO Road Warden June Pike. During LURE, follow the shown CALL or feed action; feed is west, and the hatch is west then up. During DRIVE or FORTIFY, complete the shown gear action."

  - id: store
    name: "The Store-Shed"
    description: >
      The padded byre-jerkin's first DON, while offered, grants lasting +2 defense
      against any fights still ahead. A ladder leads toward broken loft boards that
      a bound split-rail guard or approved route can cross. The Byre-Yard is east.
    variants:
      - when: [{ has_flag: pack_diverted }]
        text: >
          Go east to the Byre-Yard, then continue north until you stand among the cattle.
          Store actions cannot finish the watch. Cade's feed sack is spent, and the living
          wolves are in the high wood.
      - when:
          - { has_flag: flank_redirected }
          - { has_item: winter_feed_sack }
          - { not_flag: leader_redirected }
        text: >
          The first feed stage is resolved, and the second feed cast redirected the
          flank-wolf. Go east to the Byre-Yard, then continue north to Deep in the Byre.
          CAST Cade's winter-feed sack THROUGH outer scent gate if that final action is
          offered. Finished feed stages stay closed.
      - when: [{ has_item: winter_feed_sack }]
        text: >
          You carry Cade's winter-feed sack. It provides one LURE attempt past all three
          wolves, with no restart after a failed action. For the second action, go up the
          ladder, cross the feed-hauler's crawlboard, then CAST Cade's winter-feed sack
          THROUGH low wolf-hatch. The Byre-Yard is east.
      - when:
          - { has_flag: strategy_lure_committed }
          - { not_item: byre_jerkin }
          - { not_item: winter_feed_sack }
          - { not_flag: pack_diverted }
        text: >
          TAKE Cade's winter-feed sack before going to the Broken Paling. It is the only
          feed sack for LURE. The second action uses the feed-hauler's crawlboard above this
          ladder. The padded byre-jerkin also hangs here. The Byre-Yard is east.
      - when:
          - { has_flag: strategy_lure_committed }
          - { has_item: byre_jerkin }
          - { none_of: [{ has_flag: jerkin_donned }] }
          - { not_item: winter_feed_sack }
          - { not_flag: pack_diverted }
        text: >
          DON padded byre-jerkin before going to the Broken Paling. Then TAKE Cade's
          winter-feed sack; it is the only sack for LURE. The second action uses the
          feed-hauler's crawlboard above this ladder. The Byre-Yard is east.
      - when:
          - { has_flag: strategy_lure_committed }
          - { has_item: byre_jerkin }
          - { has_flag: jerkin_donned }
          - { not_item: winter_feed_sack }
          - { not_flag: pack_diverted }
        text: >
          TAKE Cade's winter-feed sack before going to the Broken Paling. It is the only
          sack for LURE. You are wearing the padded byre-jerkin. The second action uses the
          feed-hauler's crawlboard above this ladder. The Byre-Yard is east.
      - when: [{ has_item: byre_jerkin }, { none_of: [{ has_flag: jerkin_donned }] }]
        text: >
          DON padded byre-jerkin only while that action is offered; its lasting
          +2 defense helps only in fights still ahead. Carrying it gives no bonus.
          The Fodder-Loft is up, and the Byre-Yard is east.
      - when:
          - { has_flag: jamie_market_testimony_certified }
          - { not_item: split_rail_guard }
          - { not_flag: flank_wolf_down }
        text: >
          After the yearling wolf dies, go up and cross the feed-hauler's crawlboard named
          in Jamie's certified testimony. It needs no split-rail guard and drops you behind
          the flank-wolf, but it prevents retreat and closes every ground attack. The Byre-Yard is east.
      - when: [{ has_flag: byre_jerkin_taken }]
        text: >
          You already took the padded byre-jerkin from its empty peg. The Fodder-Loft is
          up, and the Byre-Yard is east. Harness and winter gear hang from the low walls.
    objects: [byre_jerkin, winter_feed_sack]
    exits:
      - { direction: east, to: byre_yard }
      - direction: up
        to: fodder_loft
        conditions:
          - any_of:
              - { has_flag: yearling_down }
              - { has_flag: yearling_redirected }
          - any_of:
              - { has_item: split_rail_guard }
              - { has_flag: jamie_market_testimony_certified }
              - { has_flag: strategy_lure_committed }
          - { not_flag: flank_wolf_down }
          - { not_flag: flank_redirected }
        locked_msg: "Up is blocked. Complete the currently listed yearling action. Then cross with a split-rail guard, Jamie's certified crawlboard route, or Cade's LURE route. A sound braced rail cannot be carried."

  - id: fodder_loft
    name: "The Fodder-Loft"
    description: >
      Go east through the low wolf-hatch and drop behind the flank-wolf. Retreat is closed
      because you hauled up the ladder. Your split-rail guard has been recovered and can
      be used once. Broken boards cross the byre eaves.
    variants:
      - when:
          - { has_flag: strategy_lure_committed }
          - { has_flag: flank_redirected }
        text: >
          Go east through the low wolf-hatch. The flank-wolf followed the second feed cast
          alive into the high wood. Retreat remains closed because you hauled up the ladder.
      - when:
          - { has_flag: strategy_lure_committed }
          - { has_item: winter_feed_sack }
          - { not_flag: flank_redirected }
        text: >
          CAST Cade's winter-feed sack THROUGH low wolf-hatch before going east. The
          flank-wolf circles below. You crossed the feed-hauler's crawlboard with Cade's
          winter-feed sack.
      - when:
          - { has_flag: jamie_market_testimony_certified }
          - { not_item: split_rail_guard }
        text: >
          Go east through the low wolf-hatch and make the fast drop behind the flank-wolf.
          You have no split-rail guard. Retreat and every ground attack are closed because
          you crossed Jamie's feed-hauler's crawlboard and hauled up the ladder.
    objects: [loft_hatch]
    exits:
      - direction: east
        to: byre_door
        conditions:
          - any_of:
              - { not_flag: strategy_lure_committed }
              - { has_flag: flank_redirected }
        locked_msg: "East is blocked, and the hauled ladder prevents retreat. First, CAST Cade's winter-feed sack THROUGH low wolf-hatch."

  - id: paling_gap
    name: "The Broken Paling"
    description: >
      SET the Albany relief spear against the yearling's rush. Then use the exact follow-up
      shown: DRIVE the set spear through the yearling's committed rush while wearing the
      padded byre-jerkin, or DRIVE the set spear behind the ash shaft without it. After
      that, ATTACK yearling wolf until it is dead. The Byre-Yard is south.
    objects:
      [
        paling_rail,
        downwind_feed_line,
        drover_route_marks,
        drive_drover_route_marks,
        drive_breach_signal,
        drive_hurdle_recovery,
        fortify_outer_seal,
        cade_failed_seal_help,
        authority_emergency_bind,
        mobile_relief_failure_crew,
      ]
    # Reactive prose keeps the lure recovery plus every combat rail state legible.
    # A committed feed line returns through the yard and loft for its second cast;
    # ordinary combat states retain the ground road north after the yearling falls.
    variants:
      - when: [{ has_flag: pack_diverted }]
        text: >
          Continue north through the empty Byre Door and byre mouth until you stand among
          the cattle. South is closed. Cade's final feed cast drew the living wolves into
          the high wood.
      - when:
          - { has_flag: opening_condition_firm_frozen_rail }
          - { not_flag: rail_attempted }
          - { not_flag: strategy_lure_committed }
          - { not_flag: strategy_drive_committed }
          - { not_flag: strategy_fortify_committed }
        text: >
          If BRACE is offered, BRACE firm-seated paling-rail without a check. It creates a
          combat funnel for any wolf fight still ahead but cannot redirect a living wolf.
          Completed preparation and fights stay complete. Follow the current listed action;
          the Byre-Yard is south.
      - when:
          - { has_flag: strategy_drive_committed }
          - { has_flag: drive_yearling_turned }
          - { has_flag: drive_opening_fouled }
        text: >
          Go north and CAST byre rope-and-bell line WITH Cade's two-charge
          signal-and-rope rig. The drive shutter signal failed and cannot be repeated,
          but the loose drive hurdle redirected the yearling wolf alive. The Byre-Yard is south.
      - when:
          - { has_flag: strategy_drive_committed }
          - { has_flag: drive_yearling_turned }
        text: >
          Go north and CAST byre rope-and-bell line WITH Cade's two-charge
          signal-and-rope rig to redirect the flank-wolf. The yearling wolf runs alive
          outside, and one of the rig's two charges remains. The Byre-Yard is south.
      - when:
          - { has_flag: strategy_drive_committed }
          - { has_flag: drive_opening_fouled }
          - { not_flag: drive_yearling_turned }
          - { not_flag: yearling_down }
          - { has_flag: drover_route_prepared }
          - { not_flag: drover_route_attempted }
        text: >
          RUN Emery's shutter-recovery marks for one Streetwise check (DC 12). Success
          prevents the failed signal's extra pack drive; failure consumes this recovery.
          Either result still requires the loose drive hurdle. HUNT and spear attacks are closed.
      - when:
          - { has_flag: strategy_drive_committed }
          - { has_flag: drive_opening_fouled }
          - { not_flag: drive_yearling_turned }
          - { not_flag: yearling_down }
        text: >
          RELEASE loose drive hurdle to redirect the yearling wolf alive. The drive shutter
          signal failed and cannot be repeated. HUNT and spear attacks are closed. One rig
          charge remains; the Byre-Yard is south.
      - when:
          - { has_flag: strategy_drive_committed }
          - { not_flag: drive_opening_fouled }
          - { not_flag: drive_yearling_turned }
        text: >
          FIRE drive shutter signal WITH Cade's two-charge signal-and-rope rig. It can
          be tried once. If it fails, RELEASE loose drive hurdle to redirect the yearling
          alive. HUNT and combat are closed, and you cannot go south.
      - when:
          - { has_flag: strategy_lure_committed }
          - { not_flag: lure_trail_fouled }
          - { not_flag: lure_hybrid_combat_entered }
          - { not_flag: yearling_down }
          - { not_flag: yearling_redirected }
        text: >
          LAY downwind feed line WITH Cade's winter-feed sack. Before a failed LAY
          action, the fallen paling-rail only supports combat. After failure, a braced or
          bound rail can redirect the yearling alive. To choose combat after a failure,
          MAKE a guarded strike and abandon the living recovery. The Byre-Yard is south.
      - when:
          - { has_flag: relief_protocol_prepared }
          - { has_flag: yearling_redirected_with_braced_rail }
          - { not_flag: flank_redirected }
        text: >
          Go south, west, and up to the Fodder-Loft for the second feed cast. The braced
          fallen paling-rail redirected the yearling alive. Jamie's sealed relief protocol
          is still available because it required a split-rail guard, not this braced recovery.
      - when:
          - { has_flag: strategy_lure_committed }
          - { has_flag: yearling_redirected_with_braced_rail }
          - { not_flag: flank_redirected }
        text: >
          Go south, west, and up to the Fodder-Loft for the second feed cast. The braced
          fallen paling-rail redirected the yearling alive after the failed LAY action. No wolf
          was harmed. North is not available for this LURE route.
      - when:
          - { has_flag: strategy_lure_committed }
          - { has_flag: yearling_redirected }
          - { not_flag: flank_redirected }
        text: >
          Go south to the Byre-Yard, west into the Store-Shed, then up to the Fodder-Loft
          for the second feed cast. North is blocked until then. The yearling wolf followed
          Cade's feed into the high wood alive.
      - when:
          - { has_flag: strategy_lure_committed }
          - { has_flag: yearling_down }
          - { not_flag: flank_redirected }
        text: >
          Go south to the Byre-Yard, west into the Store-Shed, then up to the Fodder-Loft
          to cast the remaining feed at the flank-wolf from above. North is blocked for
          this LURE plan. The yearling wolf died after the failed LAY action.
      - when: [{ has_flag: yearling_redirected }]
        text: >
          North is clear. The yearling wolf followed Cade's feed into the high wood alive.
          The fallen paling-rail remains here, and the Byre-Yard is south.
      - when:
          - { has_flag: drover_route_prepared }
          - { has_flag: lure_trail_fouled }
          - { not_flag: lure_hybrid_combat_entered }
          - { not_flag: drover_route_attempted }
          - { not_flag: yearling_down }
          - { not_flag: yearling_redirected }
        text: >
          RUN Emery's drover-route marks for one attempt to redirect the yearling wolf
          alive. The first LAY action failed. You may instead use the fallen paling-rail
          recovery. To choose combat, MAKE a guarded strike and abandon the living recovery.
      - when:
          - { has_flag: strategy_lure_committed }
          - { has_flag: lure_hybrid_combat_entered }
          - { not_flag: yearling_down }
        text: >
          ATTACK yearling wolf until it is dead, then carry the remaining feed deeper into
          the byre. Your guarded strike chose LURE's combat route, so the braced rail,
          split-rail guard, and drover-route recoveries are closed. The Byre-Yard is south.
      - when:
          - { has_flag: strategy_lure_committed }
          - { has_flag: lure_trail_fouled }
          - { has_flag: breach_braced }
          - { not_flag: lure_hybrid_combat_entered }
          - { not_flag: strategy_drive_committed }
          - { not_flag: strategy_fortify_committed }
          - { not_flag: yearling_down }
          - { not_flag: yearling_redirected }
        text: >
          TURN braced scent-pen to redirect the yearling wolf alive on the
          remaining feed. Attacking instead chooses LURE's combat outcome. The first LAY action
          cannot be retried, and there is no second sack.
      - when:
          - { has_flag: lure_trail_fouled }
          - { not_flag: lure_hybrid_combat_entered }
          - { not_flag: yearling_down }
        text: >
          The first LAY action failed and cannot be retried. There is no second sack, and
          cattle alarm increased. If you carry the bound split-rail guard, PEN downwind
          feed line WITH bound split-rail guard. Otherwise use any rail or route recovery
          currently offered. If none is offered, MAKE a guarded strike and abandon the
          living recovery.
      - when:
          - { has_flag: yearling_down }
          - { has_flag: leader_turned_over_crossbrace }
        text: >
          Go north through the byre. The yearling wolf is dead. You removed the fallen
          paling-rail's brace-stake at the Byre Door and spent it against the grey leader.
          The Byre-Yard is south.
      - when:
          - { has_flag: yearling_down }
          - { has_item: saved_brace_stake }
        text: >
          Go north with the saved brace-stake. The yearling wolf is dead, and the fallen
          paling-rail is canted where you removed its stake. The Byre-Yard is south.
      - when:
          - { has_flag: yearling_down }
          - { has_flag: leader_split_guard_set }
        text: >
          Go north through the byre. The yearling wolf is dead, and the split-rail guard
          was spent against the grey leader. The Byre-Yard is south.
      - when: [{ has_flag: yearling_down }, { has_flag: breach_braced }]
        text: >
          Go north. The yearling wolf is dead, and the fallen paling-rail remains braced.
          It affects the flank-wolf only if that fight still stands and its matching
          maneuver is offered; completed fights stay complete. The Byre-Yard is south.
      - when:
          - { has_flag: yearling_down }
          - { has_flag: flank_hooked_over_guard }
        text: >
          Go north. The yearling wolf is dead, and the split-rail guard broke against the
          flank-wolf. No guard remains. The Byre-Yard is south.
      - when:
          - { has_flag: yearling_down }
          - { has_item: split_rail_guard }
        text: >
          Go north with the unspent split-rail guard. Use it against a wolf only while that
          wolf still stands and its matching maneuver is offered. Otherwise, BAR inner
          cattle-gate WITH bound split-rail guard if offered, or keep the wood for daylight
          repair. Completed fights stay complete.
      - when:
          - { has_flag: strategy_lure_committed }
          - { has_flag: lure_hybrid_combat_entered }
          - { has_flag: flank_redirected }
          - { has_flag: rail_split }
        text: >
          Go north. The yearling wolf is dead, and the remaining feed redirected the
          flank-wolf. Your earlier spear attack closed all fallen paling-rail recoveries.
      - when:
          - { has_flag: yearling_down }
          - { has_flag: hayden_frost_report_certified }
          - { not_flag: strategy_lure_committed }
          - { has_flag: rail_split }
          - { not_flag: split_rail_guard_made }
          - { not_item: split_rail_guard }
        text: >
          The yearling wolf is dead. Leave the split fallen paling-rail unbound for Hayden's
          door-brace only if the flank-wolf still stands and TRIP Hayden's frost-jammed brace
          across the flank-wolf's turn is offered. Otherwise, BIND split paling-rail if
          offered. Completed fights stay complete.
      - when:
          - { has_flag: yearling_down }
          - { has_flag: rail_split }
          - { not_flag: split_rail_guard_made }
        text: >
          BIND split paling-rail to make a split-rail guard before going
          north. The split rail cannot funnel the flank-wolf. The yearling wolf is dead.
      - when: [{ has_flag: yearling_down }]
        text: >
          Go north to the Byre Door. The yearling wolf is dead, and the Byre-Yard is south.
      - when:
          - any_of:
              - { has_flag: yearling_spear_driven }
              - { has_flag: yearling_spear_driven_unarmored }
        text: >
          ATTACK yearling wolf until it is dead. Your two authored spear maneuvers stopped
          its rush and exposed its shoulder.
      - when: [{ has_flag: yearling_spear_set }, { has_flag: breach_braced }]
        text: >
          Use the offered follow-up now: while wearing the padded byre-jerkin, DRIVE the
          set spear through the yearling's committed rush; without it, DRIVE the set spear
          behind the ash shaft. The braced fallen paling-rail prevents the wolf from turning aside.
      - when:
          - { has_flag: yearling_spear_set }
          - { has_item: split_rail_guard }
        text: >
          Use the offered follow-up: while wearing the padded byre-jerkin, DRIVE the set
          spear through the yearling's committed rush; without it, DRIVE the set spear
          behind the ash shaft. Then carry the split-rail guard north to the Byre Door.
      - when:
          - { has_flag: yearling_spear_set }
          - { has_flag: hayden_frost_report_certified }
          - { not_flag: strategy_lure_committed }
          - { has_flag: rail_split }
          - { not_flag: split_rail_guard_made }
          - { not_item: split_rail_guard }
        text: >
          Use the offered follow-up: while wearing the padded byre-jerkin, DRIVE the set
          spear through the yearling's committed rush; without it, DRIVE the set spear
          behind the ash shaft. After the wolf dies, leave the split fallen paling-rail
          here for Hayden's frost-jammed door-brace or bind it into a guard and close that option.
      - when:
          - { has_flag: yearling_spear_set }
          - { has_flag: rail_split }
          - { not_flag: split_rail_guard_made }
        text: >
          Use the offered follow-up: while wearing the padded byre-jerkin, DRIVE the set
          spear through the yearling's committed rush; without it, DRIVE the set spear
          behind the ash shaft. You may also BIND split paling-rail to make a guard.
      - when: [{ has_flag: yearling_spear_set }]
        text: >
          Use the offered follow-up before the wolf attacks again: while wearing the padded
          byre-jerkin, DRIVE the set spear through the yearling's committed rush; without
          it, DRIVE the set spear behind the ash shaft. The Byre-Yard is south.
      - when: [{ has_flag: breach_braced }]
        text: >
          SET the Albany relief spear against the yearling's rush. The braced fallen
          paling-rail slows its attack but cannot redirect it alive except after a failed
          LURE cast. The Byre-Yard is south.
      - when: [{ has_item: split_rail_guard }]
        text: >
          SET the Albany relief spear against the yearling's rush. You carry the split-rail
          guard for later use at the Byre Door, but it does not slow this attack.
      - when:
          - { has_flag: hayden_frost_report_certified }
          - { not_flag: strategy_lure_committed }
          - { has_flag: rail_split }
          - { not_flag: split_rail_guard_made }
          - { not_item: split_rail_guard }
        text: >
          SET the Albany relief spear against the yearling's rush. Keeping the split fallen
          paling-rail unbound preserves Hayden's frost-jammed door-brace for later. Or BIND
          split paling-rail to make a split-rail guard and close that option.
      - when: [{ has_flag: rail_split }, { not_flag: split_rail_guard_made }]
        text: >
          BIND split paling-rail to make a split-rail guard for the Byre
          Door. It cannot funnel the yearling wolf, which still blocks the broken paling.
      - when:
          - { has_flag: fortify_cade_terms_accepted }
          - { has_flag: fortify_outer_seal_failed }
          - { not_flag: fortify_outer_sealed }
        text: >
          ACCEPT Cade's offered bracing hand to finish the outer seal. The failed Repair check
          cannot be retried. Cade's second household shutter remains for the Byre Door north.
      - when:
          - { has_flag: fortify_albany_authority_invoked }
          - { has_flag: fortify_outer_seal_failed }
          - { not_flag: fortify_outer_sealed }
        text: >
          BIND authority emergency binding WITH Albany relief seal roll to finish
          the outer seal. The failed Repair check cannot be retried, and Cade will not help.
          One Albany relief seal remains for the Byre Door north.
      - when:
          - { has_flag: fortify_cade_terms_accepted }
          - { has_flag: fortify_outer_sealed }
        text: >
          Go north and SET Cade's two household shutters ON byre threshold seal.
          The first shutter holds all three wolves outside. Retreat is closed.
      - when:
          - { has_flag: fortify_albany_authority_invoked }
          - { has_flag: fortify_outer_sealed }
        text: >
          Go north and SET Albany relief seal roll ON byre threshold seal.
          The first seal holds all three wolves outside. Retreat is closed.
      - when:
          - { has_flag: opening_condition_sound_lower_frame }
          - { has_flag: fortify_cade_terms_accepted }
          - { not_flag: fortify_outer_seal_attempted }
        text: >
          SEAT Cade's two household shutters ON outer fortification frame without a Repair check.
          The sound lower frame guarantees success. Cade's property remains exposed, while
          Albany's seals are preserved. The threshold seal and dawn watch still cost resources.
      - when:
          - { has_flag: opening_condition_sound_lower_frame }
          - { has_flag: fortify_albany_authority_invoked }
          - { not_flag: fortify_outer_seal_attempted }
        text: >
          SEAT Albany relief seal roll ON outer fortification frame without a Repair check. The
          sound lower frame guarantees success. Cade's property remains protected, but
          public seals are spent. The threshold seal and dawn watch still cost resources.
      - when:
          - { has_flag: fortify_cade_terms_accepted }
          - { not_flag: fortify_outer_seal_attempted }
          - { not_flag: opening_condition_sound_lower_frame }
        text: >
          SEAT Cade's two household shutters ON outer fortification frame. This Repair check can be
          attempted once. Reese's Works marks reduce the displayed difficulty if prepared.
          On failure, Cade's offered bracing hand completes the seal.
      - when:
          - { has_flag: fortify_albany_authority_invoked }
          - { not_flag: fortify_outer_seal_attempted }
          - { not_flag: opening_condition_sound_lower_frame }
        text: >
          SEAT Albany relief seal roll ON outer fortification frame. This Repair check can be
          attempted once. Reese's Works marks reduce the displayed difficulty if prepared.
          On failure, BIND authority emergency binding WITH Albany relief seal roll;
          Cade will not help.
    exits:
      - direction: south
        to: byre_yard
        conditions:
          - { not_flag: strategy_drive_committed }
          - { not_flag: strategy_fortify_committed }
          - { not_flag: pack_diverted }
        locked_msg: "South is closed. After LURE, go north for the cattle count. During DRIVE or FORTIFY, complete the shown Broken Paling action to open north."
      - direction: north
        to: byre_door
        conditions:
          - any_of:
              - { has_flag: yearling_down }
              - { has_flag: yearling_redirected }
              - { has_flag: drive_yearling_turned }
              - { has_flag: fortify_outer_sealed }
          - any_of:
              - { not_flag: strategy_lure_committed }
              - { has_flag: flank_redirected }
        locked_msg: "North is blocked. Complete the currently listed yearling or outer-seal action. During LURE, go south, west, and up, then CAST Cade's winter-feed sack THROUGH low wolf-hatch."

  - id: byre_door
    name: "The Byre Door"
    description: >
      Use one exact action shown. A braced rail offers HOLD the flank-wolf in the braced
      breach's funnel. A split-rail guard offers CATCH the flank-wolf's turn on the bound
      splinter guard. Cade's lesson offers WHEEL into the flank-wolf's off-side cut.
      Otherwise, ATTACK flank-wolf. The cattle are north; the Broken Paling is south.
    objects: [drive_threshold_line, fortify_threshold_seal]
    variants:
      - when: [{ has_flag: pack_diverted }]
        text: >
          Go north through the byre mouth and stand among the cattle to finish the count.
          The Byre Door is empty because Cade's final feed cast drew the living wolves
          into the high wood.
      - when:
          - { has_flag: strategy_drive_committed }
          - { has_flag: drive_flank_turned }
        text: >
          Go north and choose a crisis priority. The byre rope-and-bell line redirected
          the flank-wolf alive. Both rig charges are spent, but the rig can still be
          recovered. The Broken Paling is south.
      - when:
          - { has_flag: strategy_drive_committed }
          - { has_flag: drive_yearling_turned }
          - { not_flag: drive_flank_turned }
          - { not_flag: flank_wolf_down }
        text: >
          CAST byre rope-and-bell line WITH Cade's two-charge signal-and-rope rig. It
