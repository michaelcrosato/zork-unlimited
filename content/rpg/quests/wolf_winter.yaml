  # A failed first shutter adds one extra pack-drive beat. Emery's route can remove it at
  # the paling; June's intact cattle-first line can catch it at the lower gate. Otherwise
  # this authored complication takes a small persistent strain and returns pressure to
  # Crisis before the unchanged three-way priority becomes legal.
  - id: drive_overrun_recovery
    name: "overrun swing-gate brace"
    aliases: [overrun brace, swing gate, brace gate, rope burn, overrun recovery]
    description: >
      BRACE overrun swing-gate brace to reduce pack drive from Overrun to Crisis at a cost of 2 HP. If
      June is present and still helping, first TALK TO Road Warden June Pike; she can prevent the HP loss.
      Then choose cattle first, people first, or relief reserve.
    visible_when:
      - { has_flag: strategy_drive_committed }
      - { has_flag: drive_flank_turned }
      - { var_gte: { name: pack_drive, value: 3 } }
      - none_of:
          - { has_flag: drive_courier_wounded }
          - { has_flag: drive_cattle_lost }
          - { has_flag: drive_reserve_spent }
    interactions:
      - verb: USE
        target: drive_overrun_recovery
        command_verb: brace
        conditions:
          - { has_flag: strategy_drive_committed }
          - { has_flag: drive_flank_turned }
          - { var_gte: { name: pack_drive, value: 3 } }
          - none_of:
              - { has_flag: drive_courier_wounded }
              - { has_flag: drive_cattle_lost }
              - { has_flag: drive_reserve_spent }
          - any_of:
              - { not_flag: june_pike_present }
              - { has_flag: june_blood_condition_broken }
              - { has_flag: june_drive_cattle_line_taken }
        blocked_hint:
          visible_when:
            - { has_flag: june_pike_present }
            - { not_flag: june_blood_condition_broken }
            - { not_flag: june_drive_cattle_line_taken }
          reason: "First, TALK TO Road Warden June Pike. Her cattle-first help can absorb Overrun and prevent this 2 HP cost."
        effects:
          - dec_var: { name: hp, by: 2 }
          - dec_var: { name: pack_drive, by: 1 }
          - add_journal: "You brace the swing-gate and lose 2 HP. Pack drive returns to Crisis; choose cattle first, people first, or relief reserve."
          - narrate: >
              You brace the swing-gate and lose 2 HP to rope burns. Pack drive returns to
              Crisis. Choose cattle first, people first, or relief reserve.

  # Three simultaneous crisis targets need distinct object ids so the legal action list
  # exposes three genuine choices, not one overloaded USE id. June, when imported, must
  # first exercise her cattle authority; solo play reaches the same menu directly.
  - id: cattle_crisis_priority
    name: "cattle-first crisis priority"
    aliases: [protect cattle, cattle first, hold herd, take iron]
    description: >
      CHOOSE cattle-first crisis priority to save the whole herd and return the rig. The swinging gate
      wounds you for 6 HP. This choice closes the other priorities and requires the
      cattle-first lower-lane evacuation.
    visible_when:
      - { has_flag: strategy_drive_committed }
      - { has_flag: drive_flank_turned }
      - { var_lte: { name: pack_drive, value: 2 } }
      - none_of:
          - { has_flag: drive_courier_wounded }
          - { has_flag: drive_cattle_lost }
          - { has_flag: drive_reserve_spent }
    interactions:
      - verb: USE
        target: cattle_crisis_priority
        command_verb: choose
        conditions:
          - { has_flag: strategy_drive_committed }
          - { has_flag: drive_flank_turned }
          - { var_gte: { name: pack_drive, value: 2 } }
          - { var_lte: { name: pack_drive, value: 2 } }
          - none_of:
