      - { has_flag: fortify_cade_terms_accepted }
      - { has_flag: fortify_outer_seal_failed }
      - { not_flag: fortify_outer_sealed }
    interactions:
      - verb: USE
        target: cade_failed_seal_help
        command_verb: accept
        conditions:
          - { has_flag: fortify_cade_terms_accepted }
          - { has_flag: fortify_outer_seal_failed }
          - { not_flag: fortify_outer_sealed }
        effects:
          - set_flag: fortify_outer_sealed
          - set_flag: fortify_cade_recovery_helped
          - set_quest_stage: { quest: the_watch, stage: outer_sealed }
          - add_journal: "Cade completes the failed household outer seal without another Repair check. Fortification pressure stays at Hammering."
          - narrate: >
              Cade helps seat the household shutter. The outer seal now holds, but the
              Repair check remains failed and fortification pressure stays at Hammering.

  - id: authority_emergency_bind
    name: "authority emergency binding"
    aliases: [emergency bind, emergency strip, public recovery]
    description: >
