# The Advocate's Case — a Stage 4 (Hero's-Quest) pack (spec §13).
#
# The game's TENTH RPG pack — and the FIRST to introduce `rhetoric`, a formal
# argumentative stat measuring the ability to construct a legal argument from
# documentary evidence, cite precedent in the correct sequence, and speak before
# a tribunal in a way that compels a decision. No prior RPG pack uses a
# formal-argumentation stat: the nine predecessors use physical or craft vars
# (might, craft, nerve, tracking, lore) or social command (authority, cunning)
# or clinical observation (physick). Rhetoric is distinct from authority (which
# carries weight because of who you ARE — formal institutional rank) and from
# cunning (which dismantles a deception from the inside by turning the deceiver's
# method against him): rhetoric makes the ARGUMENT itself irresistible — its force
# comes from precedent, sequence, and the weight of a correct legal position stated
# plainly in front of someone who must rule on it.
#
# A cloth-weaver named Marta Holm is having her year's best bolts impounded by Oswin,
# the Weavers' Guild warden, who claims she is selling without a guild license. But
# Marta holds a Royal Charter exemption granted to her late husband Walter for Crown
# service in 1671 — valid, inheritable, registered at the town's charter office, and
# legally binding. Oswin knows the exemption exists; he is betting that no one can
# produce the documentation and argue it coherently before the alderman's deputy
# leaves at noon. The player is a travelling scrivener who arrived at the stall as
# the impound notice was placed and has the training to help.
#
# TWO RESOLUTION PATHS (fourth in the RPG corpus after factors_mark, falconers_ransom,
# tanners_fever):
#   RHETORIC (primary, full score): read charter_roll (+5, the exemption confirmed),
#   take and read town_register (+10, +3 rhetoric: a certified extract confirms the
#   registration is heritable and requires no guild license), take and read
#   prior_convictions (+10, +3 rhetoric: a certified precedent packet shows that the
#   guild lost three similar cases in this district, two signed by Oswin himself).
#   Then USE prior_convictions ON case_record at aldermans_antechamber
#   — rhetoric DC 12. Success: case dismissed, Oswin overruled; Craf steps aside.
#   If a fully prepared player fails the roll, the failure text teaches the sequence
#   and unlocks a deterministic recovery presentation using the certified extract.
#   COMBAT (fallback, partial score): skip the evidence or fail the check — Craf must
#   be fought in the antechamber to force passage. Combat path caps at 40/50.
#
#   market_stall (start; Oswin NPC; charter_roll +5 read, takeable)
#   │  E → charter_office (town_register: +10 read, +3 rhetoric)
#   │  W → guild_records  (prior_convictions: +10 read, +3 rhetoric)
#   │  N → aldermans_antechamber (Craf enemy; case_record skill_check; N gated on
#   │         oswin_overruled OR craf_defeated)
#   └─────── aldermans_antechamber: N → market_square (WIN +15)
#
# Score (max 50, the 5+10+10+10+15 shape):
#   +5  READ charter_roll        — exemption confirmed (retires after first READ or legal dismissal)
#   +10 READ town_register       — official registration (+3 rhetoric; held, unread, unresolved only)
#   +10 READ prior_convictions   — guild precedent (+3 rhetoric; held, unread, unresolved only)
#   +10 rhetoric check success   — USE prior_convictions ON case_record, DC 12
#                                  OR post-failure recovery presentation
#                                  (one-shot: not_flag oswin_overruled)
#   +15 market_square on_enter   — WIN (locomotion win)
#
# Rhetoric stat calibration (skill checks use d20, combat uses d6):
#   Base rhetoric 3: d20+3 >= 12 → d20 >= 9 → 12/20 = 60% (significant gamble).
#   After register (+3): rhetoric 6, d20 >= 6 → 15/20 = 75%.
#   After priors (+3): rhetoric 9, d20 >= 3 → 18/20 = 90% (near-certain).
#   The pack's honest answer: gather both documents before you argue.
#
# Combat death check (no combat_guaranteed):
#   Player base hp 20 / atk 4 / def 2. Craf: hp 12 / atk 5 / def 2.
#   Worst player dmg per round (d6 min=1): 1+4-2 = 3. Rounds to kill Craf: ceil(12/3) = 4.
#   Worst Craf dmg per round (d6 max=6): 6+5-2 = 9. Over 3 rounds (before kill): 27.
#   27 > 20 HP — Craf CAN kill on worst dice. ending_expelled (death) is reachable.
#   No combat_guaranteed. The pack's answer to the combat threat is the rhetoric path.

meta:
  id: advocates_case_v1
  title: "The Advocate's Case"
  start_room: market_stall
  # `rhetoric` (3 base): formal argumentative ability — constructing a legal position
  # from documentary evidence, citing precedent in order, and speaking before a tribunal
  # with enough clarity and sequence to compel a ruling. New to the corpus — no prior RPG
  # pack uses a formal-argumentation stat. Used in the confrontation skill_check
  # (USE prior_convictions ON case_record, DC 12): base 3 → d20>=9 (60% gamble); with
  # register (+3) → rhetoric 6, d20>=6 (75%); with both preps → rhetoric 9, d20>=3
  # (~90% near-certain). Rhetoric does not boost combat stats.
  vars_init: { hp: 20, attack: 4, defense: 2, rhetoric: 3 }
  flags_init: []
  max_score: 50

rooms:
  - id: market_stall
    name: "Marta's Stall"
    description: >
      Marta's broadcloth is roped under Warden Oswin's impound notice. The charter
      roll is on the near table. Go east to the Charter Office, west to the Guild
      Records Room, or north to the Alderman's Antechamber. Marta and Oswin wait
      beside the stall.
    # Reactive: once the appeal is upheld, the stall reads as resolved.
    variants:
      - when: [{ has_flag: oswin_overruled }]
        text: >
          The impound notice is gone, and Marta is stacking her broadcloth. Oswin
          has left. Go east to the Charter Office, west to the Guild Records Room,
          or north to the Alderman's Antechamber.
      - when: [{ has_flag: charter_roll_taken }]
        text: >
          Marta's broadcloth remains roped under the impound notice. You took the
          charter roll. Marta and Oswin wait here. Go east to the Charter Office,
          west to the Guild Records Room, or north to the Alderman's Antechamber.
    objects: [charter_roll]
    exits:
      - { direction: east, to: charter_office }
      - { direction: west, to: guild_records }
      - { direction: north, to: aldermans_antechamber }

  - id: charter_office
    name: "The Charter Office"
    description: >
      A certified register extract of Walter Holm's 1671 entry is beside the open
      master charter register. The extract can be taken; the master register stays
      here. Go west to Marta's Stall.
    # Reactive: the portable extract can leave; the master register never does.
    variants:
      - when: [{ has_flag: register_read }]
        text: >
          You have read Walter Holm's certified register extract. The master 1671
          register remains on the counter. Go west to Marta's Stall.
      - when: [{ has_flag: town_register_taken }]
        text: >
          You took the certified register extract. The master charter register
          remains on the counter. Go west to Marta's Stall.
    objects: [town_register]
    exits:
      - { direction: west, to: market_stall }

  - id: guild_records
    name: "The Guild Records Room"
    description: >
      A certified precedent packet was kept here. TAKE certified precedent packet if it
      is here, or retrieve that packet if needed. READ certified precedent packet only
      while that evidence remains unfinished. The master
      conviction ledger stays on its shelf. Go east to Marta's Stall.
    # Reactive: reading the portable packet does not relocate the master ledger.
    variants:
      - when: [{ has_flag: priors_read }]
        text: >
          You have read the certified precedent packet: three discharged impounds,
          including two signed by Oswin. The master conviction ledger remains here.
          Go east to Marta's Stall.
    objects: [prior_convictions]
    exits:
      - { direction: east, to: market_stall }

  - id: aldermans_antechamber
    name: "The Alderman's Antechamber"
    description: >
      The case record for Marta's impound is on the clerk's table. Craf blocks the
      north door to the hearing hall. Go south to Marta's Stall.
    # Two variants: rhetoric path (oswin_overruled) and combat path (craf_defeated).
    variants:
      - when: [{ has_flag: oswin_overruled }]
        text: >
          The case record says, 'Exemption confirmed. Impound discharged. Warden's
          notice void.' Craf no longer blocks north. Go north to the hearing hall or south to
          Marta's Stall.
      - when: [{ has_flag: craf_defeated }]
        text: >
          Craf is down, and the north door is open. Go north to the hearing hall or
          south to Marta's Stall.
      - when: [{ not_flag: priors_read }]
        text: >
          Craf blocks the north door. In the Guild Records Room west of Marta's Stall,
          TAKE certified precedent packet and READ certified precedent packet. It proves
          that Oswin lost two matching cases. Without it,
          you can still ATTACK Craf, but that route risks defeat and loses evidence score.
    objects: [case_record]
    exits:
      - { direction: south, to: market_stall }
      - direction: north
        to: market_square
        conditions: [{ any_of: [{ has_flag: oswin_overruled }, { has_flag: craf_defeated }] }]
        locked_msg: >
          Craf blocks north. PRESENT certified precedent packet WITH case record to
          settle the appeal, or ATTACK Craf and risk being expelled.

  - id: market_square
    name: "The Market Square"
    description: >
      Marta's impound is void, and her broadcloth is back on the tables. The hearing
      hall is south. The market continues around you.
    # Locomotion win (+15 capstone): reaches the full 50 on first entry and fires
    # end_game simultaneously. SCORE_PEAKS_BEFORE_WIN does not fire on a navigation win
    # (bug_0116): the +15 is the last award and the win fires in the same step.
    on_enter:
      - set_quest_stage: { quest: weavers_appeal, stage: market_clear }
      - add_journal: >
          Marta's exemption stands. Her goods were released, and Oswin's impound
          is void.
      - inc_var: { name: score, by: 15 }
    exits:
      - { direction: south, to: aldermans_antechamber }

objects:
  - id: charter_roll
    name: "charter roll"
    aliases: [charter, roll, exemption, exemption roll, royal charter, warrant, document, papers, marta's charter, exemption document, cloth exemption, charter document, rolled charter, charter paper]
    description: >
      Marta's Royal Charter exemption is rolled in an oiled-cloth sleeve. The Crown
      seal is intact.
    # Reactive: once read, the roll shows as already examined.
    variants:
      - when: [{ has_flag: charter_read }]
        text: >
          You have read the charter roll: Walter Holm's 1671 exemption passes to
          his heirs, and the Crown seal is genuine. The certified register extract
          is the supporting record. If that evidence is unfinished, go to the Charter Office,
          TAKE certified register extract, and READ certified register extract.
    takeable: true
    take_effects:
      - set_flag: charter_roll_taken
    read_text: >
      The charter grants Walter Holm and his lawful heirs a permanent exemption
      from guild licensing for woollen-cloth trade. It was registered at the town
      charter office in 1671. The Crown seal is genuine, and Marta is Walter's heir.
      The certified register extract supplies the supporting record. If that
      evidence is unfinished, TAKE certified register extract and READ certified
      register extract before the hearing at noon.
    interactions:
      # First read: +5 score (the foundation — the exemption confirmed in your own hands).
      # One-shot: retired after its first READ or a legal dismissal.
      - verb: READ
        target: charter_roll
        conditions: [{ not_flag: charter_read }, { not_flag: oswin_overruled }]
        effects:
          - set_flag: charter_read
          - set_quest_stage: { quest: weavers_appeal, stage: charter_read }
          - inc_var: { name: score, by: 5 }
          - add_journal: >
              The charter roll proves that Walter Holm's 1671 guild exemption passes
              to Marta. The Crown seal is genuine. The certified register extract is
              the supporting record; complete it only if unfinished. (+5)
          - narrate: >
              You confirm Walter Holm's 1671 exemption, its inheritance clause, and
              the genuine Crown seal. Marta is the lawful heir. A charter alone will
              not settle the case. If its supporting evidence is unfinished, go to the Charter
              Office before noon, TAKE certified register extract, and READ certified register extract.

  - id: town_register
    name: "certified register extract"
    aliases: [register, charter register, town record, charter record, charter book, registration, registry, official record, official register, registered copy, town charter book, clerk's register]
    description: >
      Two portable sheets copy Walter Holm's entry from the master 1671 charter
      register. The clerk's signature and office seal certify the copy.
    # Reactive: once read, the extract shows as already studied without claiming possession.
    variants:
      - when: [{ has_flag: register_read }]
        text: >
          You have read the certified register extract. It confirms that Walter
          Holm's 1671 exemption passes to his heirs without a guild license.
    takeable: true
    take_effects:
      - set_flag: town_register_taken
    read_text: >
      The certified register extract confirms Walter Holm's Royal Warrant for lawful
      woollen trade. It passes to lawful heirs without another application, and the
      exempt household needs no guild license. The clerk's signature and office seal
      match the master register. Bring the extract to the hearing before noon.
    interactions:
      # Close study of the extract: +10 score and +3 rhetoric (you now have the
      # registered phrasing to cite precisely under pressure). One-shot: requires
      # the held extract; retired after its first scored READ or a legal dismissal.
      - verb: READ
        target: town_register
        conditions:
          - all_of:
              - { has_item: town_register }
              - { not_flag: register_read }
              - { not_flag: oswin_overruled }
        effects:
          - set_flag: register_read
          - inc_var: { name: rhetoric, by: 3 }
          - inc_var: { name: score, by: 10 }
          - set_quest_stage: { quest: weavers_appeal, stage: register_confirmed }
          - add_journal: >
              The certified register extract confirms that the 1671 exemption passes
              to lawful heirs without another application or guild license. Its seal
              makes it valid hearing evidence. (+3 rhetoric, +10)
          - narrate: >
              You confirm the registered terms: the exemption passes to Marta, and
              she needs no guild license. The certified register extract is valid
              hearing evidence. Its place in the required order is after the charter
              terms and before the certified precedent packet.

  - id: prior_convictions
    name: "certified precedent packet"
    aliases: [convictions, priors, prior cases, guild records, conviction ledger, guild ledger, precedents, case records, prior convictions, warden records, guild cases, case book, conviction book, guild conviction book, guild precedent records]
    description: >
      Three portable, certified extracts record impounds discharged under charter
      exemptions. Two carry Oswin's filing signature. If you are not holding the
      packet, TAKE certified precedent packet if needed. READ certified precedent
      packet only while that evidence remains unfinished.
    # Reactive: once read, the packet shows as already studied without claiming possession.
    variants:
      - when: [{ has_flag: priors_read }]
        text: >
          You have read the certified precedent packet. It records three discharged
          impounds under charter exemptions, including two filed by Oswin.
    takeable: true
    read_text: >
      The packet records three district rulings from 1683, 1689, and 1691. Each
      ruling discharged an impound because a registered charter exemption was
      sufficient. Oswin signed the 1689 and 1691 filings. The required evidence order
      is charter terms, certified register extract, then certified precedent packet.
    interactions:
      # Close study of the precedent packet: +10 score and +3 rhetoric (you now
      # have the specific precedent cases to name, including Oswin's own signatures).
      # One-shot: requires the held packet; retired after its first READ or a legal dismissal.
      - verb: READ
        target: prior_convictions
        conditions:
          - all_of:
              - { has_item: prior_convictions }
              - { not_flag: priors_read }
              - { not_flag: oswin_overruled }
        effects:
          - set_flag: priors_read
          - inc_var: { name: rhetoric, by: 3 }
          - inc_var: { name: score, by: 10 }
          - set_quest_stage: { quest: weavers_appeal, stage: precedents_found }
          - add_journal: >
              The certified precedent packet records three discharged impounds under
              charter exemptions. Oswin signed the 1689 and 1691 filings. Its place in
              the required order is after the charter terms and certified register
              extract. (+3 rhetoric, +10)
          - narrate: >
              You confirm three matching rulings, including two filings signed by
              Oswin. The required order is now clear: charter terms, certified
              register extract, then certified precedent packet. In the Alderman's
              Antechamber, PRESENT certified precedent packet WITH case record.

  - id: case_record
    name: "case record"
    aliases: [record, case, hearing, case slate, slate, hearing record, impound record, alderman's record, case notes, formal record, disposition record, alderman record, case disposition, holm case, marta's case]
    description: >
      The case record says Warden Oswin impounded Marta Holm's twelve broadcloth
      bolts under Guild Schedule, Article Fourteen. The deputy is ready to hear
      the case before noon.
    variants:
      - when: [{ has_flag: oswin_overruled }]
        text: >
          The case record now says, 'Discharged. Charter exemption confirmed.' The
          deputy struck through the pending impound.
      - when:
          - all_of:
              - { has_flag: appeal_attempted }
              - { not_flag: oswin_overruled }
        text: >
          The first appeal was adjourned, so Marta's impound remains pending and
          Craf still blocks north. If you read all three documents, PRESENT certified
          register extract with the charter citation and certified precedent packet
          on case record to retry in the required order.
    takeable: false
    read_text: >
      The original case entry says, 'Marta Holm. Warden Oswin. Schedule Fourteen:
      unlicensed sale. Twelve broadcloth bolts held.' If the appeal remains pending,
      PRESENT certified precedent packet WITH case record. A completed ruling stays complete.
    interactions:
      # The confrontation: USE prior_convictions ON case_record — present the full
      # argument to the case record (and the deputy beyond the door): the exemption's
      # text, the certified registration extract, and the guild's certified precedent
      # packet. Rhetoric DC 12.
      # One-shot (appeal_attempted set on BOTH branches).
      # The player should have read all three documents first to raise rhetoric to 9
      # (near-certain) — base 3 is a 60% gamble.
      - verb: USE
        item: prior_convictions
        target: case_record
        command_verb: present
        command_template: "present {item} with {target}"
        conditions: [{ not_flag: appeal_attempted }]
        skill_check:
          skill: rhetoric
          difficulty: 12
          on_success:
            - set_flag: appeal_attempted
            - set_flag: oswin_overruled
            - inc_var: { name: score, by: 10 }
            - set_quest_stage: { quest: weavers_appeal, stage: case_dismissed }
            - add_journal: >
                The deputy accepted your presentation, verified Marta's exemption,
                and voided the impound. Craf no longer blocks the north door. (+10)
            - narrate: >
                You present the certified precedent packet with the case record. The
                deputy verifies the official records and writes, 'Discharged. Charter
                exemption confirmed.' Craf no longer blocks the north door.
          on_failure:
            - set_flag: appeal_attempted
            - add_journal: >
                The deputy adjourned the first appeal because the evidence was out of
                order. Marta's impound remains pending. The first presentation is spent;
                use the prepared recovery, or ATTACK Craf only if he still blocks north.
            - narrate: >
                The deputy adjourns without ruling because you present the evidence out
                of order. To retry, complete any unfinished document reading. Then PRESENT
                certified register extract WITH the charter citation and certified precedent
                packet ON case record. ATTACK Craf only if he still blocks north; combat risks
                expulsion and forfeits the full evidence score.
      # Recovery after a failed rhetoric roll: the failure text explicitly teaches
      # the required sequence, so a prepared player can now present the same three
      # documents in order instead of being forced into combat by a bad die.
      - verb: USE
        item: town_register
        target: case_record
        command_verb: present
        command_template: "present {item} with the charter citation and certified precedent packet on {target}"
        conditions:
          - all_of:
              - { has_flag: appeal_attempted }
              - { not_flag: oswin_overruled }
              - { has_flag: charter_read }
              - { has_flag: register_read }
              - { has_flag: priors_read }
              - { has_item: prior_convictions }
        effects:
          - set_flag: oswin_overruled
          - inc_var: { name: score, by: 10 }
          - set_quest_stage: { quest: weavers_appeal, stage: case_dismissed }
          - add_journal: >
              The corrected appeal succeeded: charter terms first, certified register
              extract second, and certified precedent packet third. The deputy voided
              the impound, and Craf no longer blocks north. (+10)
          - narrate: >
              You cite Walter Holm's inherited charter exemption, confirm it with the
              certified register extract, and finish with Oswin's prior losses. The
              deputy writes, 'Discharged. Charter exemption confirmed.' Craf no longer
              blocks the north door.

npcs:
  - id: oswin
    name: "Warden Oswin"
    description: >
      The district's Weavers' Guild warden wears a formal guild coat. He filed
      Marta's impound and expects it to stand.
    room: market_stall
    conditions: [{ not_flag: oswin_overruled }]
    dialogue:
      root: oswin_root
      nodes:
        - id: oswin_root
          npc_text: >
            I impounded the bolts under Guild Schedule, Article Fourteen: unlicensed
            sale at a licensed market. Contest the notice at the alderman's office
            before noon. Until the deputy rules, the bolts stay roped.
          # Return variants (bug_0322/0325 pattern): short acknowledgment on re-entry
          # so the full opening speech does not re-fire on every visit.
          variants:
            - when: [{ has_flag: oswin_overruled }]
              text: >
                Oswin left after the deputy voided the impound.
            - when: [{ has_flag: appeal_attempted }]
              text: >
                The deputy has the case. I have nothing more to add.
            - when: [{ any_of: [{ has_flag: asked_charter }, { has_flag: asked_article }] }]
              text: >
                I have explained the rule. Supporting documents are in the Charter
                Office east of this stall.
          topics:
            - id: ask_charter
              prompt: "State that Marta holds a Royal Charter exemption."
              conditions: [{ not_flag: asked_charter }]
              goto: oswin_charter
            - id: ask_article
              prompt: "Ask what Article Fourteen covers and which exemptions apply."
              conditions: [{ not_flag: asked_article }]
              goto: oswin_article
            - id: leave_oswin
              prompt: "Step away."
              end: true
        - id: oswin_charter
          npc_text: >
            The alderman's office must verify a charter exemption before it can
            cancel a guild action. Bring Marta's documents to the hearing before
            noon. The impound stands until the deputy rules.
          effects:
            - set_flag: asked_charter
            - add_journal: >
                Oswin says the alderman's office must verify Marta's charter before
                it can void the impound. Gather the evidence. In the Alderman's
                Antechamber, use the current displayed PRESENT action before noon.
          topics:
            - id: charter_back
              prompt: "Walk away."
              goto: oswin_root
        - id: oswin_article
          npc_text: >
            Article Fourteen covers sales without current guild membership or an
            alderman-verified exemption. The Charter Office records exemptions.
            Check it before noon.
          effects:
            - set_flag: asked_article
            - add_journal: >
                Article Fourteen requires guild membership or an alderman-verified
                exemption. Go east to the Charter Office for proof, then north to
                the Alderman's Antechamber for the hearing.
          topics:
            - id: article_back
              prompt: "Say nothing more."
              goto: oswin_root

enemies:
  - id: craf
    name: "Craf"
    description: >
      Oswin's hired guard blocks the north door. Only a successful appeal or combat
      will move him. Fighting him risks expulsion.
    room: aldermans_antechamber
    conditions: [{ not_flag: oswin_overruled }]
    hp: 12
    attack: 5
    defense: 2
    defeat_flag: craf_defeated
    death_ending: ending_expelled
    on_defeat:
      - set_quest_stage: { quest: weavers_appeal, stage: craf_down }
      - add_journal: >
          You defeated Craf. The north door to the Market Square is open, but the
          fight is now part of the hearing record.

win_conditions:
  # Locomotion win: reaching market_square — accessible via the rhetoric path
  # (oswin_overruled unlocks the aldermans_antechamber north exit) OR the combat path
  # (craf_defeated unlocks it). The +15 capstone fires on market_square's on_enter
  # in the same step as the win. SCORE_PEAKS_BEFORE_WIN does not fire on a navigation
  # win (bug_0116).
  - id: square_reached
    conditions: [{ visited: market_square }]
    ending: ending_exempted

endings:
  - id: ending_exempted
    title: "The Charter Upheld"
    # Reactive: rhetoric-path epilogue names the deputy's ruling and Oswin's position.
    # Base text covers the combat path. The test reaches this ending via Craf combat;
    # base text must be variant-free on that route (oswin_overruled not set => no variant fires).
    variants:
      - when: [{ has_flag: oswin_overruled }]
        text: >
          The deputy confirmed Marta's charter exemption and voided the impound.
          Her broadcloth is released, Craf no longer blocks north, and Oswin's action failed.
          *** You have won. ***
    text: >
      You forced your way past Craf and reached the Market Square. Marta keeps her
      broadcloth, but the fight remains on the hearing record and you missed the
      full evidence reward. *** You have won. ***

  - id: ending_expelled
    title: "Killed in the Market"
    text: >
      Craf kills you in the market. The deputy records the disturbance, Marta's
      broadcloth remains impounded, and Oswin's notice stands.
      *** You have fallen. ***
    death: true
