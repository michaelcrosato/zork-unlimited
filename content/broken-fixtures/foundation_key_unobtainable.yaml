# MUST FAIL: KEY_UNOBTAINABLE
# The key a locked object names exists but sits in a room no route reaches.
meta: { id: bad_key_unobtainable, title: "Bad Key Unobtainable", start_room: a, vars_init: { hp: 10, attack: 2, defense: 1 } }
rooms:
  - id: a
    name: "A"
    description: "Room A."
    objects: [chest]
    exits: [{ direction: north, to: b }]
  - id: b
    name: "B"
    description: "Room B."
    exits: [{ direction: south, to: a }]
  - id: vault
    name: "Vault"
    description: "A sealed vault nothing leads to."
    objects: [brass_key]
    exits: [{ direction: south, to: a }]
objects:
  - id: chest
    name: "chest"
    description: "A locked chest."
    container: true
    openable: true
    locked: true
    key_id: brass_key
  - id: brass_key
    name: "brass key"
    aliases: [key]
    description: "A brass key."
    takeable: true
win_conditions: [{ id: w, conditions: [{ visited: b }], ending: e }]
endings: [{ id: e, title: "End", text: "Done." }]
