# MUST FAIL: IMPOSSIBLE_QUEST_STAGE
# An exit is gated on a quest stage no effect ever sets.
meta: { id: bad_quest_stage, title: "Bad Quest Stage", start_room: a, vars_init: { hp: 10, attack: 2, defense: 1 } }
rooms:
  - id: a
    name: "A"
    description: "Room A."
    exits:
      - { direction: north, to: b }
      - direction: down
        to: c
        conditions: [{ quest_stage: { quest: errand, stage: begun } }]
  - id: b
    name: "B"
    description: "Room B."
    exits: [{ direction: south, to: a }]
  - id: c
    name: "C"
    description: "Room C."
    exits: [{ direction: up, to: a }]
win_conditions: [{ id: w, conditions: [{ visited: b }], ending: e }]
endings: [{ id: e, title: "End", text: "Done." }]
