# MUST FAIL: DIALOGUE_ROOT_MISSING
# An NPC dialogue names a root node the tree does not contain.
meta: { id: bad_dialogue_root, title: "Bad Dialogue Root", start_room: a, vars_init: { hp: 10, attack: 2, defense: 1 } }
rooms:
  - id: a
    name: "A"
    description: "Room A."
    exits: [{ direction: north, to: b }]
  - id: b
    name: "B"
    description: "Room B."
    exits: [{ direction: south, to: a }]
npcs:
  - id: warden
    name: "Warden"
    description: "A warden."
    room: a
    dialogue:
      root: no_such_node
      nodes:
        - id: greet
          npc_text: "The warden nods."
          topics: [{ id: leave, prompt: "Leave", end: true }]
win_conditions: [{ id: w, conditions: [{ visited: b }], ending: e }]
endings: [{ id: e, title: "End", text: "Done." }]
