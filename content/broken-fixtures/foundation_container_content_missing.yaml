# MUST FAIL: CONTAINER_CONTENT_MISSING
# A container declares contents that no object declares.
meta: { id: bad_container_content, title: "Bad Container Content", start_room: a, vars_init: { hp: 10, attack: 2, defense: 1 } }
rooms:
  - id: a
    name: "A"
    description: "Room A."
    objects: [chest]
    exits: [{ direction: north, to: b }]
  - id: b
    name: "B"
    description: "Room B."
    exits: [{ direction: south, to: a }]
objects:
  - id: chest
    name: "chest"
    description: "An open chest."
    container: true
    openable: true
    contents: [ghost_gem]
win_conditions: [{ id: w, conditions: [{ visited: b }], ending: e }]
endings: [{ id: e, title: "End", text: "Done." }]
