# MUST FAIL: PHANTOM_VAR
# The exit gate reads `reslove` — a typo for the declared `resolve`. The gate is
# satisfiable (an unwritten var reads as 0, and 0 <= 5), so no feasibility check
# fires; the exit is simply always open regardless of the real counter. The
# engine never errors on this because `evalCondition` reads `state.vars[name] ?? 0`.
meta:
  {
    id: phantom_var,
    title: "Phantom Var",
    start_room: a,
    vars_init: { hp: 10, attack: 2, defense: 1, resolve: 0 },
  }
rooms:
  - id: a
    name: "A"
    description: "Room A."
    exits:
      - direction: north
        to: b
        conditions: [{ var_lte: { name: reslove, value: 5 } }]
  - id: b
    name: "B"
    description: "Room B."
    exits: [{ direction: south, to: a }]
win_conditions: [{ id: w, conditions: [{ visited: b }], ending: e }]
endings: [{ id: e, title: "End", text: "Done." }]
