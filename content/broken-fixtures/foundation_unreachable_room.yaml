# MUST WARN: UNREACHABLE_ROOM
# A declared room has no inbound exit, so no play ever enters it.
meta: { id: bad_unreachable_room, title: "Bad Unreachable Room", start_room: a, vars_init: { hp: 10, attack: 2, defense: 1 } }
rooms:
  - id: a
    name: "A"
    description: "Room A."
    exits: [{ direction: north, to: b }]
  - id: b
    name: "B"
    description: "Room B."
    exits: [{ direction: south, to: a }]
  - id: attic
    name: "Attic"
    description: "An attic nothing leads to."
    exits: [{ direction: down, to: a }]
win_conditions: [{ id: w, conditions: [{ visited: b }], ending: e }]
endings: [{ id: e, title: "End", text: "Done." }]
